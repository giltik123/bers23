<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"/><title>Tiny-SD D6 WebGPU device capture</title>
<script type="module">
import * as ort from 'onnxruntime-web/webgpu';

const ORT_WEBGPU_VERSION = '1.27.0';
const REQUIRED_FEATURES = ['shader-f16'];
const SESSION_TIMEOUT_MS = 180_000;
const INFERENCE_TIMEOUT_MS = 300_000;
const CAPTURE_AUTHORITY = 'UNATTESTED_DEVICE_CAPTURE_NOT_ADMISSION';
const COMPONENTS = ['text_encoder', 'unet', 'vae_decoder'];

const requireCondition = (condition, message) => { if (!condition) throw new Error(message); };
const withTimeout = async (promise, timeoutMs, code) => {
  let timer;
  try {
    return await Promise.race([
      promise,
      new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(code)), timeoutMs); }),
    ]);
  } finally {
    clearTimeout(timer);
  }
};
const fetchBytes = async url => {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error(`local fixture fetch failed ${response.status}: ${url}`);
  return new Uint8Array(await response.arrayBuffer());
};
const numericLimit = (limits, name) => {
  const value = limits?.[name];
  return typeof value === 'number' || typeof value === 'bigint' ? Number(value) : null;
};
const adapterEvidence = adapter => {
  const info = adapter?.info ?? {};
  const record = {
    vendor: String(info.vendor ?? ''),
    architecture: String(info.architecture ?? ''),
    device: String(info.device ?? ''),
    description: String(info.description ?? ''),
    isFallbackAdapter: typeof adapter?.isFallbackAdapter === 'boolean' ? adapter.isFallbackAdapter : null,
    features: Array.from(adapter?.features ?? []).map(String).sort(),
    limits: {
      maxBufferSize: numericLimit(adapter?.limits, 'maxBufferSize'),
      maxStorageBufferBindingSize: numericLimit(adapter?.limits, 'maxStorageBufferBindingSize'),
      maxComputeWorkgroupStorageSize: numericLimit(adapter?.limits, 'maxComputeWorkgroupStorageSize'),
      maxComputeInvocationsPerWorkgroup: numericLimit(adapter?.limits, 'maxComputeInvocationsPerWorkgroup'),
    },
  };
  const combined = [record.vendor, record.architecture, record.device, record.description].join(' ').toLowerCase();
  record.softwareAdapterLikely = record.isFallbackAdapter === true || /swiftshader|software|llvmpipe|lavapipe/.test(combined);
  return record;
};
const heapEvidence = () => {
  const memory = performance?.memory;
  if (!memory) return { available: false, kind: 'JS_HEAP_ONLY', gpuPeakMemoryApi: 'UNAVAILABLE_STANDARD_BROWSER_API' };
  return {
    available: true,
    kind: 'JS_HEAP_ONLY',
    usedJSHeapSize: Number(memory.usedJSHeapSize),
    totalJSHeapSize: Number(memory.totalJSHeapSize),
    jsHeapSizeLimit: Number(memory.jsHeapSizeLimit),
    gpuPeakMemoryApi: 'UNAVAILABLE_STANDARD_BROWSER_API',
  };
};
const tensorFromBytes = ({ dtype, dims }, bytes) => {
  const elements = dims.reduce((value, item) => value * item, 1);
  if (dtype === 'float32') {
    requireCondition(bytes.byteLength === elements * 4, 'float32 fixture byte-size mismatch');
    return new ort.Tensor('float32', new Float32Array(bytes.buffer, bytes.byteOffset, elements), dims);
  }
  if (dtype === 'int64') {
    requireCondition(bytes.byteLength === elements * 8, 'int64 fixture byte-size mismatch');
    return new ort.Tensor('int64', new BigInt64Array(bytes.buffer, bytes.byteOffset, elements), dims);
  }
  throw new Error(`unsupported fixture dtype: ${dtype}`);
};
const parityMetrics = (reference, actual) => {
  requireCondition(reference.length === actual.length, 'reference/output length mismatch');
  let maxAbs = 0;
  let sumSquared = 0;
  for (let index = 0; index < reference.length; index++) {
    const expected = Number(reference[index]);
    const observed = Number(actual[index]);
    requireCondition(Number.isFinite(expected) && Number.isFinite(observed), `non-finite output at ${index}`);
    const delta = observed - expected;
    maxAbs = Math.max(maxAbs, Math.abs(delta));
    sumSquared += delta * delta;
  }
  return { maxAbs, rmse: Math.sqrt(sumSquared / reference.length) };
};
const shaFloat32 = async values => {
  const view = values instanceof Float32Array ? values : Float32Array.from(values, Number);
  const bytes = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  return Array.from(digest, value => value.toString(16).padStart(2, '0')).join('');
};
const latencySummary = values => {
  requireCondition(Array.isArray(values) && values.length > 0 && values.every(Number.isFinite), 'invalid latency samples');
  const sorted = [...values].sort((a, b) => a - b);
  const median = sorted.length % 2
    ? sorted[(sorted.length - 1) / 2]
    : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
  const p95 = sorted[Math.max(0, Math.ceil(sorted.length * 0.95) - 1)];
  return { min: sorted[0], median, p95, max: sorted[sorted.length - 1] };
};
const baseReport = extras => ({
  schemaVersion: 1,
  status: 'CANDIDATE',
  stage: 'D6_WEBGPU_UNATTESTED_DEVICE_CAPTURE',
  authority: CAPTURE_AUTHORITY,
  evidenceKind: 'UNATTESTED_DEVICE_CAPTURE',
  provider: 'webgpu',
  executionProviders: ['webgpu'],
  providerFallbackAllowed: false,
  precisionTier: 'FP16_INTERNAL_FP32_INT64_IO',
  onnxruntimeWebVersion: ORT_WEBGPU_VERSION,
  requiredFeatures: REQUIRED_FEATURES,
  realDeviceEvidence: false,
  realDeviceAdmission: false,
  productionApproval: false,
  editorAuthorityGranted: false,
  releaseAuthorityGranted: false,
  cloudFallbackAllowed: false,
  billingAuthorityGranted: false,
  gpuPeakMemoryApi: 'UNAVAILABLE_STANDARD_BROWSER_API',
  ...extras,
});

const runComponent = async (adapter, config, benchmark) => {
  let session;
  try {
    const sessionStarted = performance.now();
    session = await withTimeout(
      ort.InferenceSession.create(config.modelUrl, { executionProviders: ['webgpu'] }),
      SESSION_TIMEOUT_MS,
      `${config.component}_WEBGPU_SESSION_TIMEOUT`,
    );
    const sessionCreateMs = performance.now() - sessionStarted;
    const [referenceBytes, ...inputBytes] = await Promise.all([
      fetchBytes(config.referenceUrl),
      ...config.inputs.map(input => fetchBytes(input.url)),
    ]);
    const referenceElements = config.outputDims.reduce((value, item) => value * item, 1);
    requireCondition(referenceBytes.byteLength === referenceElements * 4, `${config.component} reference byte-size mismatch`);
    const reference = new Float32Array(referenceBytes.buffer, referenceBytes.byteOffset, referenceElements);
    const feeds = {};
    for (let index = 0; index < config.inputs.length; index++) {
      feeds[config.inputs[index].name] = tensorFromBytes(config.inputs[index], inputBytes[index]);
    }

    for (let index = 0; index < benchmark.warmupCount; index++) {
      await withTimeout(session.run(feeds, [config.outputName]), INFERENCE_TIMEOUT_MS, `${config.component}_WEBGPU_WARMUP_TIMEOUT`);
    }

    const latencyMs = [];
    const paritySamples = [];
    const outputHashes = [];
    let outputContract = null;
    for (let index = 0; index < benchmark.sampleCount; index++) {
      const started = performance.now();
      const outputs = await withTimeout(session.run(feeds, [config.outputName]), INFERENCE_TIMEOUT_MS, `${config.component}_WEBGPU_INFERENCE_TIMEOUT`);
      latencyMs.push(performance.now() - started);
      const output = outputs[config.outputName];
      requireCondition(output, `${config.component} output missing`);
      const dims = Array.from(output.dims);
      requireCondition(dims.join(',') === config.outputDims.join(','), `${config.component} output shape mismatch`);
      const values = Float32Array.from(output.data, Number);
      const metrics = parityMetrics(reference, values);
      const passed = metrics.maxAbs <= config.thresholds.maxAbs && metrics.rmse <= config.thresholds.rmse;
      paritySamples.push({ sample: index + 1, ...metrics, passed });
      outputHashes.push(await shaFloat32(values));
      outputContract = { name: config.outputName, dtype: 'float32', dims };
    }

    return {
      component: config.component,
      result: paritySamples.every(sample => sample.passed) ? 'CAPTURE_COMPONENT_PASS' : 'CAPTURE_COMPONENT_PARITY_FAILED',
      provider: 'webgpu',
      executionProviders: ['webgpu'],
      providerFallbackAllowed: false,
      modelBytes: config.modelBytes,
      modelSha256: config.modelSha256,
      sessionCreateMs,
      benchmark: {
        warmupCount: benchmark.warmupCount,
        sampleCount: benchmark.sampleCount,
        successfulSamples: latencyMs.length,
        latencyMs: latencySummary(latencyMs),
      },
      thresholds: config.thresholds,
      paritySamples,
      allParitySamplesPassed: paritySamples.every(sample => sample.passed),
      outputHashes,
      bitExactAcrossMeasuredRuns: new Set(outputHashes).size === 1,
      outputContract,
      heapAfterComponent: heapEvidence(),
      realDeviceEvidence: false,
      productionApproval: false,
    };
  } catch (error) {
    return {
      component: config.component,
      result: 'CAPTURE_COMPONENT_BLOCKED',
      provider: 'webgpu',
      executionProviders: ['webgpu'],
      providerFallbackAllowed: false,
      modelBytes: config.modelBytes,
      modelSha256: config.modelSha256,
      error: String(error),
      realDeviceEvidence: false,
      productionApproval: false,
    };
  } finally {
    await session?.release();
  }
};

globalThis.runTinySdD6WebGpuDeviceCapture = async ({ components, benchmark }) => {
  requireCondition(Object.keys(components).sort().join(',') === [...COMPONENTS].sort().join(','), 'D6 component set drift');
  requireCondition(Number.isInteger(benchmark?.warmupCount) && benchmark.warmupCount >= 1, 'D6 warmup count invalid');
  requireCondition(Number.isInteger(benchmark?.sampleCount) && benchmark.sampleCount >= 5, 'D6 sample count invalid');

  if (!navigator.gpu) return baseReport({ result: 'WEBGPU_API_UNAVAILABLE', components: {} });
  let adapter;
  try {
    adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  } catch (error) {
    return baseReport({ result: 'WEBGPU_ADAPTER_REQUEST_FAILED', components: {}, error: String(error) });
  }
  if (!adapter) return baseReport({ result: 'WEBGPU_ADAPTER_UNAVAILABLE', components: {} });

  const adapterInfo = adapterEvidence(adapter);
  const missingRequiredFeatures = REQUIRED_FEATURES.filter(feature => !adapter.features.has(feature));
  if (adapterInfo.softwareAdapterLikely || missingRequiredFeatures.length > 0) {
    return baseReport({
      result: adapterInfo.softwareAdapterLikely ? 'SOFTWARE_ADAPTER_REJECTED' : 'REQUIRED_FEATURE_UNAVAILABLE',
      adapter: adapterInfo,
      missingRequiredFeatures,
      sessionAttempted: false,
      components: {},
      heap: { beforeCapabilityDecision: heapEvidence() },
    });
  }

  ort.env.webgpu.adapter = adapter;
  const reports = {};
  for (const component of COMPONENTS) reports[component] = await runComponent(adapter, components[component], benchmark);
  const passCount = Object.values(reports).filter(value => value.result === 'CAPTURE_COMPONENT_PASS').length;
  return baseReport({
    result: passCount === COMPONENTS.length ? 'UNATTESTED_ACCELERATED_COMPONENT_CAPTURE_COMPLETE' : 'UNATTESTED_ACCELERATED_COMPONENT_CAPTURE_BLOCKED',
    adapter: adapterInfo,
    missingRequiredFeatures: [],
    sessionAttempted: true,
    components: reports,
    passCount,
    browserUserAgent: navigator.userAgent,
    heap: { afterCapture: heapEvidence() },
  });
};
</script>
