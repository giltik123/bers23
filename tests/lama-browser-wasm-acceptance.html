<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"/><title>LaMa browser WASM acceptance</title>
<script type="module">
import { BrowserOnnxSessionFactory, ONNX_RUNTIME_WEB_VERSION } from '/src/platform/creative/local-ai/browser/BrowserOnnxSessionFactory.ts';

const metrics = (reference, actual) => {
  let maxAbs = 0, sumAbs = 0, sumSquared = 0;
  for (let index = 0; index < reference.length; index++) {
    const delta = Number(actual[index]) - Number(reference[index]);
    const absolute = Math.abs(delta);
    if (absolute > maxAbs) maxAbs = absolute;
    sumAbs += absolute;
    sumSquared += delta * delta;
  }
  return { maxAbs, meanAbs: sumAbs / reference.length, rmse: Math.sqrt(sumSquared / reference.length) };
};

const fetchBytes = async url => {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error(`local fixture fetch failed ${response.status}: ${url}`);
  return new Uint8Array(await response.arrayBuffer());
};

globalThis.runLamaBrowserWasmAcceptance = async ({ modelUrl, inputUrl, referenceUrl, height, width }) => {
  const [modelBytes, inputBytes, referenceBytes] = await Promise.all([
    fetchBytes(modelUrl), fetchBytes(inputUrl), fetchBytes(referenceUrl),
  ]);
  if (inputBytes.byteLength !== 1 * 4 * height * width * 4) throw new Error('browser input byte size mismatch');
  if (referenceBytes.byteLength !== 1 * 3 * height * width * 4) throw new Error('browser reference byte size mismatch');

  const input = new Float32Array(inputBytes.buffer, inputBytes.byteOffset, inputBytes.byteLength / 4);
  const reference = new Float32Array(referenceBytes.buffer, referenceBytes.byteOffset, referenceBytes.byteLength / 4);
  const factory = new BrowserOnnxSessionFactory();
  let session;
  try {
    session = await factory.create(modelBytes, { executionProviders: ['wasm'] });
  } catch (error) {
    return {
      status: 'CANDIDATE', result: 'BLOCKED_SESSION_CREATE', provider: 'wasm',
      onnxruntimeWebVersion: ONNX_RUNTIME_WEB_VERSION, shape: [height, width],
      modelBytes: modelBytes.byteLength, runtimeAuthorityGranted: false,
      productionDeviceApproval: false, error: String(error),
    };
  }

  try {
    const started = performance.now();
    let outputs;
    try {
      outputs = await session.run({
        generator_input: { data: input, dims: [1, 4, height, width], type: 'float32' },
      }, ['generated_rgb']);
    } catch (error) {
      return {
        status: 'CANDIDATE', result: 'BLOCKED_INFERENCE', provider: 'wasm',
        onnxruntimeWebVersion: ONNX_RUNTIME_WEB_VERSION, shape: [height, width],
        modelBytes: modelBytes.byteLength, runtimeAuthorityGranted: false,
        productionDeviceApproval: false, error: String(error),
      };
    }
    const latencyMs = performance.now() - started;
    const output = outputs.generated_rgb;
    if (!output) throw new Error('generated_rgb output missing');
    const dims = Array.from(output.dims);
    const actual = output.data;
    if (dims.join(',') !== `1,3,${height},${width}`) throw new Error(`browser output shape mismatch: ${dims.join(',')}`);
    if (actual.length !== reference.length) throw new Error('browser output/reference element count mismatch');

    const parity = metrics(reference, actual);
    let min = Infinity, max = -Infinity;
    for (const value of actual) { if (value < min) min = value; if (value > max) max = value; }
    const rangeOk = min >= -1e-6 && max <= 1 + 1e-6;
    const parityOk = parity.maxAbs <= 2e-4 && parity.rmse <= 5e-5;
    return {
      status: 'CANDIDATE',
      result: rangeOk && parityOk ? 'PASS' : 'PARITY_FAILED',
      provider: 'wasm',
      onnxruntimeWebVersion: ONNX_RUNTIME_WEB_VERSION,
      shape: [height, width],
      inputTensorShape: [1, 4, height, width],
      outputTensorShape: dims,
      referenceKind: 'PINNED_PYTORCH_GENERATOR_FLOAT32',
      outputRange: [min, max],
      metrics: parity,
      thresholds: { maxAbs: 2e-4, rmse: 5e-5 },
      latencyMs,
      modelBytes: modelBytes.byteLength,
      runtimeAuthorityGranted: false,
      productionDeviceApproval: false,
      userAgent: navigator.userAgent,
    };
  } finally {
    session.release();
  }
};
</script>
