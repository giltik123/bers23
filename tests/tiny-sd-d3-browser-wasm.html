<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"/><title>Tiny-SD D3 WASM compact feasibility</title>
<script type="module">
import {
  BrowserOnnxSessionFactory,
  BROWSER_WASM_NUM_THREADS,
  BROWSER_WASM_PROXY,
  BROWSER_WASM_WORKER_POLICY,
  ONNX_RUNTIME_WEB_VERSION,
} from '../src/platform/creative/local-ai/browser/BrowserOnnxSessionFactory.ts';

const SESSION_TIMEOUT_MS = 180_000;
const INFERENCE_TIMEOUT_MS = 300_000;

const withTimeout = async (promise, timeoutMs, code) => {
  let timer;
  try {
    return await Promise.race([
      promise,
      new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(code)), timeoutMs); }),
    ]);
  } finally {
    clearTimeout(timer);
  }
};

const fetchBytes = async url => {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error(`local fixture fetch failed ${response.status}: ${url}`);
  return new Uint8Array(await response.arrayBuffer());
};

const heapEvidence = () => {
  const memory = performance?.memory;
  if (!memory) return { available: false, kind: 'JS_HEAP_ONLY' };
  return {
    available: true,
    kind: 'JS_HEAP_ONLY',
    usedJSHeapSize: Number(memory.usedJSHeapSize),
    totalJSHeapSize: Number(memory.totalJSHeapSize),
    jsHeapSizeLimit: Number(memory.jsHeapSizeLimit),
  };
};

const metrics = (reference, actual) => {
  if (reference.length !== actual.length) throw new Error('output/reference element count mismatch');
  let maxAbs = 0;
  let sumSquared = 0;
  let referenceSquared = 0;
  let referenceMaxAbs = 0;
  for (let index = 0; index < reference.length; index++) {
    const expected = Number(reference[index]);
    const observed = Number(actual[index]);
    if (!Number.isFinite(expected) || !Number.isFinite(observed)) throw new Error(`non-finite parity value at ${index}`);
    const delta = observed - expected;
    const absolute = Math.abs(delta);
    if (absolute > maxAbs) maxAbs = absolute;
    const expectedAbs = Math.abs(expected);
    if (expectedAbs > referenceMaxAbs) referenceMaxAbs = expectedAbs;
    sumSquared += delta * delta;
    referenceSquared += expected * expected;
  }
  const rmse = Math.sqrt(sumSquared / reference.length);
  const referenceRms = Math.sqrt(referenceSquared / reference.length);
  return {
    maxAbs,
    rmse,
    referenceMaxAbs,
    referenceRms,
    normalized: {
      maxAbsOverReferenceMaxAbs: maxAbs / Math.max(referenceMaxAbs, 1e-12),
      rmseOverReferenceRms: rmse / Math.max(referenceRms, 1e-12),
    },
  };
};

const tensorValueFromBytes = ({ dtype, dims }, bytes) => {
  const elements = dims.reduce((value, item) => value * item, 1);
  if (dtype === 'float32') {
    if (bytes.byteLength !== elements * 4) throw new Error(`float32 byte-size mismatch: ${bytes.byteLength}`);
    return { data: new Float32Array(bytes.buffer, bytes.byteOffset, elements), dims, type: 'float32' };
  }
  if (dtype === 'int64') {
    if (bytes.byteLength !== elements * 8) throw new Error(`int64 byte-size mismatch: ${bytes.byteLength}`);
    return { data: new BigInt64Array(bytes.buffer, bytes.byteOffset, elements), dims, type: 'int64' };
  }
  throw new Error(`unsupported D3 WASM fixture dtype: ${dtype}`);
};

const base = (component, result, extras = {}) => ({
  schemaVersion: 1,
  status: 'CANDIDATE',
  stage: 'D3_BROWSER_WASM_COMPACT',
  component,
  result,
  provider: 'wasm',
  productionFactory: 'BrowserOnnxSessionFactory',
  onnxruntimeWebVersion: ONNX_RUNTIME_WEB_VERSION,
  executionProviders: ['wasm'],
  providerFallbackAllowed: false,
  wasmRuntime: {
    numThreads: BROWSER_WASM_NUM_THREADS,
    proxy: BROWSER_WASM_PROXY,
    workerFree: BROWSER_WASM_NUM_THREADS === 1 && BROWSER_WASM_PROXY === false,
    workerPolicy: BROWSER_WASM_WORKER_POLICY,
  },
  crossOriginIsolated: globalThis.crossOriginIsolated === true,
  hardwareConcurrency: Number(navigator.hardwareConcurrency ?? 0),
  runtimeAuthorityGranted: false,
  productionDeviceApproval: false,
  productionPromotionAllowed: false,
  timeoutsMs: { session: SESSION_TIMEOUT_MS, inference: INFERENCE_TIMEOUT_MS },
  ...extras,
});

globalThis.runTinySdD3WasmFeasibility = async ({
  component,
  modelUrl,
  expectedModelBytes,
  inputs,
  outputName,
  outputDims,
  referenceUrl,
  thresholds,
  quantizationScheme,
}) => {
  const beforeModelFetch = heapEvidence();
  let modelBytes;
  try {
    modelBytes = await fetchBytes(modelUrl);
  } catch (error) {
    return base(component, 'WASM_MODEL_FETCH_BLOCKED', { expectedModelBytes, quantizationScheme, error: String(error) });
  }
  if (modelBytes.byteLength !== expectedModelBytes) {
    return base(component, 'WASM_MODEL_SIZE_MISMATCH', {
      expectedModelBytes,
      actualModelBytes: modelBytes.byteLength,
      quantizationScheme,
    });
  }
  const afterModelFetch = heapEvidence();

  const factory = new BrowserOnnxSessionFactory();
  let session;
  let sessionCreateMs;
  try {
    const started = performance.now();
    session = await withTimeout(
      factory.create(modelBytes, { executionProviders: ['wasm'] }),
      SESSION_TIMEOUT_MS,
      'WASM_SESSION_TIMEOUT',
    );
    sessionCreateMs = performance.now() - started;
  } catch (error) {
    const message = String(error);
    return base(component, 'WASM_SESSION_BLOCKED', {
      modelBytes: modelBytes.byteLength,
      quantizationScheme,
      timeoutStage: message.includes('WASM_SESSION_TIMEOUT') ? 'SESSION' : null,
      heap: { beforeModelFetch, afterModelFetch, afterFailure: heapEvidence() },
      error: message,
    });
  }

  try {
    const [referenceBytes, ...inputBytes] = await Promise.all([
      fetchBytes(referenceUrl),
      ...inputs.map(value => fetchBytes(value.url)),
    ]);
    const referenceElements = outputDims.reduce((value, item) => value * item, 1);
    if (referenceBytes.byteLength !== referenceElements * 4) throw new Error(`${component} reference byte-size mismatch`);
    const reference = new Float32Array(referenceBytes.buffer, referenceBytes.byteOffset, referenceElements);
    const feeds = {};
    for (let index = 0; index < inputs.length; index++) {
      feeds[inputs[index].name] = tensorValueFromBytes(inputs[index], inputBytes[index]);
    }
    const beforeInference = heapEvidence();
    let outputs;
    const inferenceStarted = performance.now();
    try {
      outputs = await withTimeout(
        session.run(feeds, [outputName]),
        INFERENCE_TIMEOUT_MS,
        'WASM_INFERENCE_TIMEOUT',
      );
    } catch (error) {
      const message = String(error);
      return base(component, 'WASM_INFERENCE_BLOCKED', {
        modelBytes: modelBytes.byteLength,
        quantizationScheme,
        sessionCreateMs,
        timeoutStage: message.includes('WASM_INFERENCE_TIMEOUT') ? 'INFERENCE' : null,
        heap: { beforeModelFetch, afterModelFetch, beforeInference, afterFailure: heapEvidence() },
        error: message,
      });
    }
    const inferenceMs = performance.now() - inferenceStarted;
    const output = outputs[outputName];
    if (!output) throw new Error(`${component} output missing: ${outputName}`);
    const dims = Array.from(output.dims);
    if (dims.join(',') !== outputDims.join(',')) throw new Error(`${component} output shape mismatch: ${dims.join(',')}`);
    const parity = metrics(reference, output.data);
    const parityPassed =
      parity.normalized.maxAbsOverReferenceMaxAbs <= thresholds.maxAbsOverReferenceMaxAbs &&
      parity.normalized.rmseOverReferenceRms <= thresholds.rmseOverReferenceRms;
    return base(component, parityPassed ? 'PASS' : 'WASM_PARITY_FAILED', {
      modelBytes: modelBytes.byteLength,
      quantizationScheme,
      referenceKind: 'D2_ACCEPTED_FP32_CPU_ORT_OUTPUT',
      parity,
      thresholds,
      parityPassed,
      sessionCreateMs,
      inferenceMs,
      inputContracts: inputs.map(({ name, dtype, dims: inputDims }) => ({ name, dtype, dims: inputDims })),
      outputContract: { name: outputName, dtype: 'float32', dims },
      heap: { beforeModelFetch, afterModelFetch, beforeInference, afterInference: heapEvidence() },
      userAgent: navigator.userAgent,
    });
  } catch (error) {
    return base(component, 'WASM_BROWSER_EVALUATION_BLOCKED', {
      modelBytes: modelBytes.byteLength,
      quantizationScheme,
      sessionCreateMs,
      heap: { beforeModelFetch, afterModelFetch, afterFailure: heapEvidence() },
      error: String(error),
    });
  } finally {
    await session?.release?.();
  }
};
</script>
