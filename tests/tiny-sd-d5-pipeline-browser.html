<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"/><title>Tiny-SD D5 pipeline composition</title>
<script type="module">
import { AutoTokenizer, env } from '@huggingface/transformers';
import {
  BrowserOnnxSessionFactory,
  BROWSER_WASM_NUM_THREADS,
  BROWSER_WASM_PROXY,
  BROWSER_WASM_WORKER_POLICY,
  ONNX_RUNTIME_WEB_VERSION,
} from '../src/platform/creative/local-ai/browser/BrowserOnnxSessionFactory.ts';
import {
  D5_PIPELINE_AUTHORITY,
  D5_PIPELINE_COMPOSED_PARITY_POLICY,
  D5_PIPELINE_GUIDANCE_SCALE,
  D5_PIPELINE_PROMPT_CASE,
  D5_PIPELINE_SEED,
  D5_PIPELINE_SELECTED_SCHEME,
  D5_PIPELINE_STEP_COUNT,
  D5_PIPELINE_TRANSFORMERS_JS_VERSION,
} from '../scripts/tiny-sd-d5-pipeline-constants.mjs';
import { TinySdDpmSolverMultistep } from '../scripts/tiny-sd-d5-dpm-solver.mjs';

env.allowRemoteModels = false;
env.allowLocalModels = true;
env.localModelPath = '/__tiny_sd_d5/models/';
env.useBrowserCache = false;

const LATENT_SHAPE = [1, 4, 64, 64];
const TEXT_SHAPE = [1, 77, 768];
const DECODED_SHAPE = [1, 3, 512, 512];
const f32 = Math.fround;
const SESSION_TIMEOUT_MS = 180_000;
const INFERENCE_TIMEOUT_MS = 300_000;
const requireCondition = (condition, message) => { if (!condition) throw new Error(message); };
const arraysEqual = (a, b) => a.length === b.length && a.every((value, index) => value === b[index]);
const numbers = value => Array.from(value?.data ?? value ?? [], item => Number(item));
const normalizeConfig = raw => ({
  ...raw,
  lambda_min_clipped: raw.lambda_min_clipped === '-Infinity' ? Number.NEGATIVE_INFINITY : raw.lambda_min_clipped,
});
const heapEvidence = () => {
  const memory = performance?.memory;
  if (!memory) return { available: false, kind: 'JS_HEAP_ONLY' };
  return { available: true, kind: 'JS_HEAP_ONLY', usedJSHeapSize: Number(memory.usedJSHeapSize), totalJSHeapSize: Number(memory.totalJSHeapSize), jsHeapSizeLimit: Number(memory.jsHeapSizeLimit) };
};
const withTimeout = async (promise, timeoutMs, code) => {
  let timer;
  try {
    return await Promise.race([promise, new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(code)), timeoutMs); })]);
  } finally {
    clearTimeout(timer);
  }
};
const fetchBytes = async url => {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error(`local fetch failed ${response.status}: ${url}`);
  return new Uint8Array(await response.arrayBuffer());
};
const float32FromBytes = (bytes, expectedElements, label) => {
  requireCondition(bytes.byteLength === expectedElements * 4, `${label} byte-size mismatch`);
  const copy = bytes.slice();
  return new Float32Array(copy.buffer);
};
const metrics = (reference, actual) => {
  requireCondition(reference.length === actual.length, 'parity element-count mismatch');
  let maxAbs = 0;
  let sumSquared = 0;
  let referenceSquared = 0;
  let referenceMaxAbs = 0;
  for (let index = 0; index < reference.length; index++) {
    const expected = Number(reference[index]);
    const observed = Number(actual[index]);
    requireCondition(Number.isFinite(expected) && Number.isFinite(observed), `non-finite parity value at ${index}`);
    const delta = observed - expected;
    maxAbs = Math.max(maxAbs, Math.abs(delta));
    sumSquared += delta * delta;
    referenceSquared += expected * expected;
    referenceMaxAbs = Math.max(referenceMaxAbs, Math.abs(expected));
  }
  const rmse = Math.sqrt(sumSquared / reference.length);
  const referenceRms = Math.sqrt(referenceSquared / reference.length);
  return {
    maxAbs,
    rmse,
    referenceMaxAbs,
    referenceRms,
    normalized: {
      maxAbsOverReferenceMaxAbs: maxAbs / Math.max(referenceMaxAbs, 1e-12),
      rmseOverReferenceRms: rmse / Math.max(referenceRms, 1e-12),
    },
  };
};
const withinD3ScaleEnvelope = (parity, thresholds) =>
  parity.normalized.maxAbsOverReferenceMaxAbs <= thresholds.maxAbsOverReferenceMaxAbs &&
  parity.normalized.rmseOverReferenceRms <= thresholds.rmseOverReferenceRms;
const shaFloat32 = async values => {
  const bytes = new Uint8Array(values.buffer, values.byteOffset, values.byteLength);
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  return Array.from(digest, value => value.toString(16).padStart(2, '0')).join('');
};
const tensorValue = (data, dims, type = 'float32') => ({ data, dims, type });
const int64Value = values => ({ data: BigInt64Array.from(values, value => BigInt(value)), dims: [1, values.length], type: 'int64' });
const timestepValue = timestep => ({ data: BigInt64Array.of(BigInt(timestep)), dims: [1], type: 'int64' });
const finiteTensor = (data, label) => {
  for (let index = 0; index < data.length; index++) requireCondition(Number.isFinite(Number(data[index])), `${label} non-finite at ${index}`);
};
const cfg = (unconditional, conditional) => {
  requireCondition(unconditional.length === conditional.length, 'CFG length mismatch');
  const out = new Float32Array(unconditional.length);
  for (let index = 0; index < out.length; index++) out[index] = f32(unconditional[index] + f32(D5_PIPELINE_GUIDANCE_SCALE * f32(conditional[index] - unconditional[index])));
  return out;
};
const runInference = (session, feeds, outputs) => withTimeout(session.run(feeds, outputs), INFERENCE_TIMEOUT_MS, 'D5_WASM_INFERENCE_TIMEOUT');
const readReference = async (stageUrls, name, shape) => {
  const elements = shape.reduce((a, b) => a * b, 1);
  return float32FromBytes(await fetchBytes(stageUrls[name]), elements, name);
};
const encodeHistoricalClip = async (tokenizer, expected, policy) => {
  requireCondition(policy.policy === 'BOS_PLUS_FIRST_75_CONTENT_PLUS_EOS_THEN_RIGHT_PAD', 'historical CLIP post-processing drift');
  requireCondition(policy.contentLimit === 75 && policy.specialTokenSlots === 2, 'historical CLIP token budget drift');
  const raw = await tokenizer(expected.prompt, { add_special_tokens: false, padding: false, truncation: false, return_tensor: false });
  const rawIds = numbers(raw.input_ids);
  requireCondition(arraysEqual(rawIds, expected.rawContentIds), 'browser composition raw BPE drift');
  const retained = rawIds.slice(0, policy.contentLimit);
  const core = [expected.bosTokenId, ...retained, expected.eosTokenId];
  return {
    inputIds: [...core, ...new Array(77 - core.length).fill(expected.padTokenId)],
    attentionMask: [...new Array(core.length).fill(1), ...new Array(77 - core.length).fill(0)],
  };
};
const runSession = async (factory, modelUrl, expectedBytes, run) => {
  let modelBytes = await fetchBytes(modelUrl);
  requireCondition(modelBytes.byteLength === expectedBytes, `model byte-size mismatch: ${modelUrl}`);
  const beforeSession = heapEvidence();
  const started = performance.now();
  const session = await withTimeout(factory.create(modelBytes, { executionProviders: ['wasm'] }), SESSION_TIMEOUT_MS, 'D5_WASM_SESSION_TIMEOUT');
  const sessionCreateMs = performance.now() - started;
  modelBytes = null;
  try {
    return await run(session, { sessionCreateMs, beforeSession, afterSession: heapEvidence() });
  } finally {
    await session.release();
  }
};

globalThis.runTinySdD5Pipeline = async ({ controlReference, nativeReference, modelConfig, stageUrls }) => {
  requireCondition(controlReference.authority === D5_PIPELINE_AUTHORITY, 'D5 control authority drift');
  requireCondition(nativeReference.authority === D5_PIPELINE_AUTHORITY, 'D5 native authority drift');
  requireCondition(nativeReference.composedParityPolicy === D5_PIPELINE_COMPOSED_PARITY_POLICY, 'D5 composed parity policy drift');
  requireCondition(nativeReference.stepCount === D5_PIPELINE_STEP_COUNT, 'D5 step count drift');
  requireCondition(nativeReference.guidanceScale === D5_PIPELINE_GUIDANCE_SCALE, 'D5 guidance drift');
  requireCondition(nativeReference.seed === D5_PIPELINE_SEED, 'D5 seed drift');
  requireCondition(nativeReference.promptCase === D5_PIPELINE_PROMPT_CASE, 'D5 prompt case drift');
  requireCondition(nativeReference.deterministicRerunExact === true, 'native deterministic rerun not proven');
  requireCondition(String(env.version) === D5_PIPELINE_TRANSFORMERS_JS_VERSION, `Transformers.js drift: ${env.version}`);
  requireCondition(env.allowRemoteModels === false && env.allowLocalModels === true, 'browser tokenizer locality policy drift');
  requireCondition(BROWSER_WASM_NUM_THREADS === 1 && BROWSER_WASM_PROXY === false, 'browser worker-free WASM baseline drift');

  const promptCase = controlReference.tokenizer.cases[D5_PIPELINE_PROMPT_CASE];
  const emptyCase = controlReference.tokenizer.cases.empty;
  const tokenizer = await AutoTokenizer.from_pretrained('tiny-sd-tokenizer', { local_files_only: true });
  const promptTokens = await encodeHistoricalClip(tokenizer, promptCase, controlReference.tokenizer.historicalPostProcessing);
  const emptyTokens = await encodeHistoricalClip(tokenizer, emptyCase, controlReference.tokenizer.historicalPostProcessing);
  requireCondition(arraysEqual(promptTokens.inputIds, promptCase.inputIds) && arraysEqual(promptTokens.attentionMask, promptCase.attentionMask), 'browser composition prompt tokenization mismatch');
  requireCondition(arraysEqual(emptyTokens.inputIds, emptyCase.inputIds) && arraysEqual(emptyTokens.attentionMask, emptyCase.attentionMask), 'browser composition unconditional tokenization mismatch');

  const factory = new BrowserOnnxSessionFactory();
  const compositionStageParity = { textEmbeddings: {}, unetOutputs: [], guidedNoise: [], latentSteps: [], finalDecoded: null, finalImage01: null };
  const browserStageHashes = {};
  const latency = { sessionCreateMs: {}, textEncoderMs: 0, unetMs: [], vaeMs: 0 };
  const heap = { start: heapEvidence() };

  let conditional;
  let unconditional;
  await runSession(factory, modelConfig.text_encoder.url, modelConfig.text_encoder.bytes, async (session, sessionEvidence) => {
    latency.sessionCreateMs.text_encoder = sessionEvidence.sessionCreateMs;
    const condStarted = performance.now();
    const condOut = await runInference(session, { input_ids: int64Value(promptTokens.inputIds), attention_mask: int64Value(promptTokens.attentionMask) }, ['last_hidden_state']);
    const uncondOut = await runInference(session, { input_ids: int64Value(emptyTokens.inputIds), attention_mask: int64Value(emptyTokens.attentionMask) }, ['last_hidden_state']);
    latency.textEncoderMs = performance.now() - condStarted;
    requireCondition(arraysEqual(Array.from(condOut.last_hidden_state.dims), TEXT_SHAPE), 'conditional embedding shape drift');
    requireCondition(arraysEqual(Array.from(uncondOut.last_hidden_state.dims), TEXT_SHAPE), 'unconditional embedding shape drift');
    conditional = Float32Array.from(condOut.last_hidden_state.data, Number);
    unconditional = Float32Array.from(uncondOut.last_hidden_state.data, Number);
    finiteTensor(conditional, 'conditional embedding');
    finiteTensor(unconditional, 'unconditional embedding');
    const condRef = await readReference(stageUrls, 'conditional_embedding', TEXT_SHAPE);
    const uncondRef = await readReference(stageUrls, 'unconditional_embedding', TEXT_SHAPE);
    const condParity = metrics(condRef, conditional);
    const uncondParity = metrics(uncondRef, unconditional);
    compositionStageParity.textEmbeddings = {
      conditional: condParity,
      unconditional: uncondParity,
      acceptedD3ScaleEnvelope: modelConfig.text_encoder.thresholds,
      conditionalWithinEnvelope: withinD3ScaleEnvelope(condParity, modelConfig.text_encoder.thresholds),
      unconditionalWithinEnvelope: withinD3ScaleEnvelope(uncondParity, modelConfig.text_encoder.thresholds),
      isolationNote: 'TOKEN_INPUTS_ARE_EXACT;_RECORDED_FOR_COMPOSITION_DIAGNOSTICS',
    };
    browserStageHashes.conditional_embedding = await shaFloat32(conditional);
    browserStageHashes.unconditional_embedding = await shaFloat32(unconditional);
  });
  heap.afterText = heapEvidence();

  let latent = await readReference(stageUrls, 'initial_latent', LATENT_SHAPE);
  const scheduler = new TinySdDpmSolverMultistep(normalizeConfig(controlReference.schedulerConfig));
  const timesteps = scheduler.setTimesteps(D5_PIPELINE_STEP_COUNT);
  requireCondition(arraysEqual(timesteps, nativeReference.timesteps), 'browser pipeline timesteps differ from native reference');
  const schedulerOrders = [];
  await runSession(factory, modelConfig.unet.url, modelConfig.unet.bytes, async (session, sessionEvidence) => {
    latency.sessionCreateMs.unet = sessionEvidence.sessionCreateMs;
    for (let index = 0; index < timesteps.length; index++) {
      const timestep = timesteps[index];
      const scaled = scheduler.scaleModelInput(latent);
      const started = performance.now();
      const uncondOut = await runInference(session, { sample: tensorValue(scaled, LATENT_SHAPE), timestep: timestepValue(timestep), encoder_hidden_states: tensorValue(unconditional, TEXT_SHAPE) }, ['noise_prediction']);
      const condOut = await runInference(session, { sample: tensorValue(scaled, LATENT_SHAPE), timestep: timestepValue(timestep), encoder_hidden_states: tensorValue(conditional, TEXT_SHAPE) }, ['noise_prediction']);
      latency.unetMs.push(performance.now() - started);
      requireCondition(arraysEqual(Array.from(uncondOut.noise_prediction.dims), LATENT_SHAPE), `UNet unconditional ${index} shape drift`);
      requireCondition(arraysEqual(Array.from(condOut.noise_prediction.dims), LATENT_SHAPE), `UNet conditional ${index} shape drift`);
      const noiseUncond = Float32Array.from(uncondOut.noise_prediction.data, Number);
      const noiseCond = Float32Array.from(condOut.noise_prediction.data, Number);
      finiteTensor(noiseUncond, `UNet unconditional ${index}`);
      finiteTensor(noiseCond, `UNet conditional ${index}`);
      const refUncond = await readReference(stageUrls, `noise_unconditional_${index}`, LATENT_SHAPE);
      const refCond = await readReference(stageUrls, `noise_conditional_${index}`, LATENT_SHAPE);
      const uncondParity = metrics(refUncond, noiseUncond);
      const condParity = metrics(refCond, noiseCond);
      compositionStageParity.unetOutputs.push({
        index,
        timestep,
        unconditional: uncondParity,
        conditional: condParity,
        acceptedD3ScaleEnvelope: modelConfig.unet.thresholds,
        unconditionalWithinEnvelope: withinD3ScaleEnvelope(uncondParity, modelConfig.unet.thresholds),
        conditionalWithinEnvelope: withinD3ScaleEnvelope(condParity, modelConfig.unet.thresholds),
        isolationNote: 'NOT_A_COMPONENT_ISOLATION_GATE_INPUTS_INCLUDE_PRIOR_BROWSER_COMPOSITION_STATE',
      });
      browserStageHashes[`noise_unconditional_${index}`] = await shaFloat32(noiseUncond);
      browserStageHashes[`noise_conditional_${index}`] = await shaFloat32(noiseCond);
      const guided = cfg(noiseUncond, noiseCond);
      const guidedRef = await readReference(stageUrls, `guided_noise_${index}`, LATENT_SHAPE);
      compositionStageParity.guidedNoise.push({ index, timestep, ...metrics(guidedRef, guided) });
      browserStageHashes[`guided_noise_${index}`] = await shaFloat32(guided);
      const step = scheduler.step(guided, timestep, latent);
      schedulerOrders.push(step.orderUsed);
      latent = step.prevSample;
      const latentRef = await readReference(stageUrls, `latent_${index}`, LATENT_SHAPE);
      compositionStageParity.latentSteps.push({ index, timestep, orderUsed: step.orderUsed, ...metrics(latentRef, latent) });
      browserStageHashes[`latent_${index}`] = await shaFloat32(latent);
    }
  });
  requireCondition(arraysEqual(schedulerOrders, nativeReference.schedulerOrders), 'browser pipeline scheduler-order drift');
  requireCondition(schedulerOrders.includes(1) && schedulerOrders.includes(2), 'browser pipeline did not exercise first+second order');
  heap.afterUnet = heapEvidence();

  let decoded;
  await runSession(factory, modelConfig.vae_decoder.url, modelConfig.vae_decoder.bytes, async (session, sessionEvidence) => {
    latency.sessionCreateMs.vae_decoder = sessionEvidence.sessionCreateMs;
    const started = performance.now();
    const out = await runInference(session, { stable_diffusion_latent: tensorValue(latent, LATENT_SHAPE) }, ['decoded_rgb']);
    latency.vaeMs = performance.now() - started;
    requireCondition(arraysEqual(Array.from(out.decoded_rgb.dims), DECODED_SHAPE), 'VAE decoded shape drift');
    decoded = Float32Array.from(out.decoded_rgb.data, Number);
    finiteTensor(decoded, 'decoded RGB');
    const decodedRef = await readReference(stageUrls, 'decoded_rgb', DECODED_SHAPE);
    const parity = metrics(decodedRef, decoded);
    compositionStageParity.finalDecoded = {
      ...parity,
      acceptedD3ScaleEnvelope: modelConfig.vae_decoder.thresholds,
      withinEnvelope: withinD3ScaleEnvelope(parity, modelConfig.vae_decoder.thresholds),
      isolationNote: 'NOT_A_COMPONENT_ISOLATION_GATE_INPUT_LATENT_INCLUDES_ACCUMULATED_BROWSER_COMPOSITION_STATE',
    };
    browserStageHashes.decoded_rgb = await shaFloat32(decoded);
  });
  heap.afterVae = heapEvidence();

  const image01 = new Float32Array(decoded.length);
  for (let index = 0; index < decoded.length; index++) image01[index] = f32(Math.min(1, Math.max(0, f32(f32(decoded[index] / 2) + 0.5))));
  const imageRef = await readReference(stageUrls, 'image_rgb_0_1', DECODED_SHAPE);
  compositionStageParity.finalImage01 = metrics(imageRef, image01);
  finiteTensor(image01, 'postprocessed image tensor');
  browserStageHashes.image_rgb_0_1 = await shaFloat32(image01);

  return {
    schemaVersion: 1,
    status: 'CANDIDATE',
    stage: 'D5_BROWSER_SELECTED_PIPELINE_MEASUREMENT',
    result: 'COMPOSED_PARITY_MEASURED_NOT_ADMITTED',
    authority: D5_PIPELINE_AUTHORITY,
    composedParityPolicy: D5_PIPELINE_COMPOSED_PARITY_POLICY,
    provider: 'wasm',
    productionFactory: 'BrowserOnnxSessionFactory',
    onnxruntimeWebVersion: ONNX_RUNTIME_WEB_VERSION,
    executionProviders: ['wasm'],
    providerFallbackAllowed: false,
    wasmRuntime: { numThreads: BROWSER_WASM_NUM_THREADS, proxy: BROWSER_WASM_PROXY, workerPolicy: BROWSER_WASM_WORKER_POLICY, workerFree: true },
    crossOriginIsolated: globalThis.crossOriginIsolated === true,
    timeoutsMs: { session: SESSION_TIMEOUT_MS, inference: INFERENCE_TIMEOUT_MS },
    selectedScheme: D5_PIPELINE_SELECTED_SCHEME,
    tokenizer: { runtime: '@huggingface/transformers', version: String(env.version), remoteModelsAllowed: env.allowRemoteModels, localModelsAllowed: env.allowLocalModels, promptTextConsumed: true, exactPromptTokens: true, exactUnconditionalTokens: true },
    seed: D5_PIPELINE_SEED,
    guidanceScale: D5_PIPELINE_GUIDANCE_SCALE,
    stepCount: D5_PIPELINE_STEP_COUNT,
    timesteps,
    schedulerOrders,
    componentIsolationAuthority: 'EXACT_HEAD_D3_WORKFLOW_SEPARATE_FROM_D5_COMPOSITION',
    compositionStageParity,
    browserStageHashes,
    composedParityAdmission: false,
    latency,
    heap,
    runtimeAuthorityGranted: false,
    productionApproval: false,
    editorAuthorityGranted: false,
    cloudFallbackAllowed: false,
    realDeviceApproval: false,
    imageQualityAdmission: false,
    userAgent: navigator.userAgent,
  };
};
</script>
