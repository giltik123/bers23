<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"/><title>Tiny-SD D3 WebGPU feasibility</title>
<script type="module">
import * as ort from 'onnxruntime-web/webgpu';

const ORT_WEBGPU_VERSION = '1.27.0';
const SESSION_TIMEOUT_MS = 120_000;
const INFERENCE_TIMEOUT_MS = 180_000;

const withTimeout = async (promise, timeoutMs, code) => {
  let timer;
  try {
    return await Promise.race([
      promise,
      new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(code)), timeoutMs); }),
    ]);
  } finally {
    clearTimeout(timer);
  }
};

const fetchBytes = async url => {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error(`local fixture fetch failed ${response.status}: ${url}`);
  return new Uint8Array(await response.arrayBuffer());
};

const adapterEvidence = adapter => {
  const info = adapter?.info ?? {};
  const record = {
    vendor: String(info.vendor ?? ''),
    architecture: String(info.architecture ?? ''),
    device: String(info.device ?? ''),
    description: String(info.description ?? ''),
    isFallbackAdapter: typeof adapter?.isFallbackAdapter === 'boolean' ? adapter.isFallbackAdapter : null,
  };
  const combined = Object.values(record).join(' ').toLowerCase();
  record.softwareAdapterLikely = record.isFallbackAdapter === true || /swiftshader|software|llvmpipe/.test(combined);
  return record;
};

const heapEvidence = () => {
  const memory = performance?.memory;
  if (!memory) return { available: false, kind: 'JS_HEAP_ONLY', gpuPeakMemoryApi: 'UNAVAILABLE_STANDARD_BROWSER_API' };
  return {
    available: true,
    kind: 'JS_HEAP_ONLY',
    usedJSHeapSize: Number(memory.usedJSHeapSize),
    totalJSHeapSize: Number(memory.totalJSHeapSize),
    jsHeapSizeLimit: Number(memory.jsHeapSizeLimit),
    gpuPeakMemoryApi: 'UNAVAILABLE_STANDARD_BROWSER_API',
  };
};

const metrics = (reference, actual) => {
  if (reference.length !== actual.length) throw new Error('output/reference element count mismatch');
  let maxAbs = 0;
  let sumAbs = 0;
  let sumSquared = 0;
  let maxReferenceAbs = 0;
  for (let index = 0; index < reference.length; index++) {
    const expected = Number(reference[index]);
    const observed = Number(actual[index]);
    if (!Number.isFinite(expected) || !Number.isFinite(observed)) throw new Error(`non-finite parity value at ${index}`);
    const delta = observed - expected;
    const absolute = Math.abs(delta);
    if (absolute > maxAbs) maxAbs = absolute;
    const refAbs = Math.abs(expected);
    if (refAbs > maxReferenceAbs) maxReferenceAbs = refAbs;
    sumAbs += absolute;
    sumSquared += delta * delta;
  }
  return {
    maxAbs,
    meanAbs: sumAbs / reference.length,
    rmse: Math.sqrt(sumSquared / reference.length),
    maxReferenceAbs,
  };
};

const tensorFromBytes = ({ dtype, dims }, bytes) => {
  const expectedElements = dims.reduce((value, item) => value * item, 1);
  if (dtype === 'float32') {
    if (bytes.byteLength !== expectedElements * 4) throw new Error(`float32 byte-size mismatch: ${bytes.byteLength}`);
    return new ort.Tensor('float32', new Float32Array(bytes.buffer, bytes.byteOffset, expectedElements), dims);
  }
  if (dtype === 'int64') {
    if (bytes.byteLength !== expectedElements * 8) throw new Error(`int64 byte-size mismatch: ${bytes.byteLength}`);
    return new ort.Tensor('int64', new BigInt64Array(bytes.buffer, bytes.byteOffset, expectedElements), dims);
  }
  throw new Error(`unsupported D3 fixture dtype: ${dtype}`);
};

const base = (component, result, extras = {}) => ({
  schemaVersion: 1,
  status: 'CANDIDATE',
  stage: 'D3_BROWSER_WEBGPU_FP16',
  component,
  result,
  provider: 'webgpu',
  precisionTier: 'FP16_INTERNAL_FP32_INT64_IO',
  onnxruntimeWebVersion: ORT_WEBGPU_VERSION,
  providerFallbackAllowed: false,
  executionProviders: ['webgpu'],
  hostedSoftwareFeasibilityOnly: true,
  realDeviceEvidence: false,
  runtimeAuthorityGranted: false,
  productionDeviceApproval: false,
  browserExecutionIsProductionApproval: false,
  productionPromotionAllowed: false,
  timeoutsMs: { session: SESSION_TIMEOUT_MS, inference: INFERENCE_TIMEOUT_MS },
  gpuPeakMemoryApi: 'UNAVAILABLE_STANDARD_BROWSER_API',
  ...extras,
});

globalThis.runTinySdD3WebGpuFeasibility = async ({
  component,
  modelUrl,
  inputs,
  outputName,
  outputDims,
  referenceUrl,
  thresholds,
}) => {
  const [modelBytes, referenceBytes, ...inputBytes] = await Promise.all([
    fetchBytes(modelUrl),
    fetchBytes(referenceUrl),
    ...inputs.map(value => fetchBytes(value.url)),
  ]);
  const referenceElements = outputDims.reduce((value, item) => value * item, 1);
  if (referenceBytes.byteLength !== referenceElements * 4) {
    throw new Error(`${component} reference byte-size mismatch`);
  }
  const reference = new Float32Array(referenceBytes.buffer, referenceBytes.byteOffset, referenceElements);

  if (!('gpu' in navigator) || !navigator.gpu) {
    return base(component, 'WEBGPU_API_UNAVAILABLE', { modelBytes: modelBytes.byteLength });
  }

  let adapter;
  try {
    adapter = await navigator.gpu.requestAdapter();
  } catch (error) {
    return base(component, 'WEBGPU_ADAPTER_REQUEST_FAILED', { modelBytes: modelBytes.byteLength, error: String(error) });
  }
  if (!adapter) return base(component, 'WEBGPU_ADAPTER_UNAVAILABLE', { modelBytes: modelBytes.byteLength });
  const adapterInfo = adapterEvidence(adapter);
  ort.env.webgpu.adapter = adapter;

  const beforeSessionHeap = heapEvidence();
  let session;
  try {
    const started = performance.now();
    session = await withTimeout(
      ort.InferenceSession.create(modelBytes, { executionProviders: ['webgpu'] }),
      SESSION_TIMEOUT_MS,
      'WEBGPU_SESSION_TIMEOUT',
    );
    const sessionCreateMs = performance.now() - started;
    const feeds = {};
    for (let index = 0; index < inputs.length; index++) {
      feeds[inputs[index].name] = tensorFromBytes(inputs[index], inputBytes[index]);
    }
    const beforeInferenceHeap = heapEvidence();
    const inferenceStarted = performance.now();
    let outputs;
    try {
      outputs = await withTimeout(
        session.run(feeds, [outputName]),
        INFERENCE_TIMEOUT_MS,
        'WEBGPU_INFERENCE_TIMEOUT',
      );
    } catch (error) {
      const message = String(error);
      return base(component, 'WEBGPU_INFERENCE_BLOCKED', {
        modelBytes: modelBytes.byteLength,
        adapter: adapterInfo,
        sessionCreateMs,
        timeoutStage: message.includes('WEBGPU_INFERENCE_TIMEOUT') ? 'INFERENCE' : null,
        heap: { beforeSession: beforeSessionHeap, beforeInference: beforeInferenceHeap, afterFailure: heapEvidence() },
        error: message,
      });
    }
    const inferenceMs = performance.now() - inferenceStarted;
    const output = outputs[outputName];
    if (!output) throw new Error(`${component} output missing: ${outputName}`);
    const dims = Array.from(output.dims);
    if (dims.join(',') !== outputDims.join(',')) throw new Error(`${component} output shape mismatch: ${dims.join(',')}`);
    const actual = output.data;
    const parity = metrics(reference, actual);
    const parityPassed = parity.maxAbs <= thresholds.maxAbs && parity.rmse <= thresholds.rmse;
    return base(component, parityPassed ? 'PASS' : 'WEBGPU_PARITY_FAILED', {
      modelBytes: modelBytes.byteLength,
      adapter: adapterInfo,
      inputContracts: inputs.map(({ name, dtype, dims }) => ({ name, dtype, dims })),
      outputContract: { name: outputName, dtype: 'float32', dims },
      referenceKind: 'D2_ACCEPTED_FP32_CPU_ORT_OUTPUT',
      metrics: parity,
      thresholds,
      parityPassed,
      sessionCreateMs,
      inferenceMs,
      heap: {
        beforeSession: beforeSessionHeap,
        beforeInference: beforeInferenceHeap,
        afterInference: heapEvidence(),
      },
      userAgent: navigator.userAgent,
    });
  } catch (error) {
    const message = String(error);
    return base(component, 'WEBGPU_SESSION_BLOCKED', {
      modelBytes: modelBytes.byteLength,
      adapter: adapterInfo,
      timeoutStage: message.includes('WEBGPU_SESSION_TIMEOUT') ? 'SESSION' : null,
      heap: { beforeSession: beforeSessionHeap, afterFailure: heapEvidence() },
      error: message,
    });
  } finally {
    await session?.release();
  }
};
</script>
