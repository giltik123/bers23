<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"/><title>LaMa browser WebGPU feasibility</title>
<script type="module">
import * as ort from 'onnxruntime-web/webgpu';

const ORT_WEBGPU_VERSION = '1.27.0';
const SESSION_TIMEOUT_MS = 60_000;
const INFERENCE_TIMEOUT_MS = 120_000;
const withTimeout = async (promise, timeoutMs, code) => {
  let timer;
  try {
    return await Promise.race([
      promise,
      new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(code)), timeoutMs); }),
    ]);
  } finally {
    clearTimeout(timer);
  }
};
const metrics = (reference, actual) => {
  let maxAbs = 0, sumAbs = 0, sumSquared = 0;
  for (let index = 0; index < reference.length; index++) {
    const delta = Number(actual[index]) - Number(reference[index]);
    const absolute = Math.abs(delta);
    if (absolute > maxAbs) maxAbs = absolute;
    sumAbs += absolute;
    sumSquared += delta * delta;
  }
  return { maxAbs, meanAbs: sumAbs / reference.length, rmse: Math.sqrt(sumSquared / reference.length) };
};
const fetchBytes = async url => {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error(`local fixture fetch failed ${response.status}: ${url}`);
  return new Uint8Array(await response.arrayBuffer());
};
const adapterEvidence = adapter => {
  const info = adapter?.info ?? {};
  const record = {
    vendor: String(info.vendor ?? ''), architecture: String(info.architecture ?? ''),
    device: String(info.device ?? ''), description: String(info.description ?? ''),
    isFallbackAdapter: typeof adapter?.isFallbackAdapter === 'boolean' ? adapter.isFallbackAdapter : null,
  };
  const combined = Object.values(record).join(' ').toLowerCase();
  record.softwareAdapterLikely = record.isFallbackAdapter === true || /swiftshader|software|llvmpipe/.test(combined);
  return record;
};
const base = (result, extras = {}) => ({
  schemaVersion: 1, status: 'CANDIDATE', result, provider: 'webgpu',
  onnxruntimeWebVersion: ORT_WEBGPU_VERSION, runtimeAuthorityGranted: false,
  productionDeviceApproval: false, browserExecutionIsProductionApproval: false,
  productionPromotionAllowed: false, hostedSoftwareFeasibilityOnly: true,
  providerFallbackAllowed: false, executionProviders: ['webgpu'],
  timeoutsMs: { session: SESSION_TIMEOUT_MS, inference: INFERENCE_TIMEOUT_MS }, ...extras,
});

globalThis.runLamaBrowserWebGpuFeasibility = async ({ modelUrl, inputUrl, referenceUrl, height, width }) => {
  const [modelBytes, inputBytes, referenceBytes] = await Promise.all([
    fetchBytes(modelUrl), fetchBytes(inputUrl), fetchBytes(referenceUrl),
  ]);
  if (inputBytes.byteLength !== 1 * 4 * height * width * 4) throw new Error('WebGPU input byte size mismatch');
  if (referenceBytes.byteLength !== 1 * 3 * height * width * 4) throw new Error('WebGPU reference byte size mismatch');
  if (!('gpu' in navigator) || !navigator.gpu) return base('WEBGPU_API_UNAVAILABLE', { shape: [height, width], modelBytes: modelBytes.byteLength });

  let adapter;
  try { adapter = await navigator.gpu.requestAdapter(); }
  catch (error) { return base('WEBGPU_ADAPTER_REQUEST_FAILED', { shape: [height, width], modelBytes: modelBytes.byteLength, error: String(error) }); }
  if (!adapter) return base('WEBGPU_ADAPTER_UNAVAILABLE', { shape: [height, width], modelBytes: modelBytes.byteLength });
  const adapterInfo = adapterEvidence(adapter);
  ort.env.webgpu.adapter = adapter;

  const input = new Float32Array(inputBytes.buffer, inputBytes.byteOffset, inputBytes.byteLength / 4);
  const reference = new Float32Array(referenceBytes.buffer, referenceBytes.byteOffset, referenceBytes.byteLength / 4);
  let session;
  try {
    session = await withTimeout(
      ort.InferenceSession.create(modelBytes, { executionProviders: ['webgpu'] }),
      SESSION_TIMEOUT_MS,
      'WEBGPU_SESSION_TIMEOUT',
    );
  } catch (error) {
    const message = String(error);
    const result = message.includes('WEBGPU_SESSION_TIMEOUT') ? 'WEBGPU_SESSION_TIMEOUT' : 'WEBGPU_SESSION_BLOCKED';
    return base(result, { shape: [height, width], modelBytes: modelBytes.byteLength, adapter: adapterInfo, error: message });
  }

  try {
    const started = performance.now();
    let outputs;
    try {
      outputs = await withTimeout(
        session.run({ generator_input: new ort.Tensor('float32', input, [1, 4, height, width]) }, ['generated_rgb']),
        INFERENCE_TIMEOUT_MS,
        'WEBGPU_INFERENCE_TIMEOUT',
      );
    } catch (error) {
      const message = String(error);
      const result = message.includes('WEBGPU_INFERENCE_TIMEOUT') ? 'WEBGPU_INFERENCE_TIMEOUT' : 'WEBGPU_INFERENCE_BLOCKED';
      return base(result, { shape: [height, width], modelBytes: modelBytes.byteLength, adapter: adapterInfo, error: message });
    }
    const latencyMs = performance.now() - started;
    const output = outputs.generated_rgb;
    if (!output) throw new Error('WebGPU generated_rgb output missing');
    const dims = Array.from(output.dims);
    const actual = output.data;
    if (dims.join(',') !== `1,3,${height},${width}`) throw new Error(`WebGPU output shape mismatch: ${dims.join(',')}`);
    if (actual.length !== reference.length) throw new Error('WebGPU output/reference element count mismatch');
    const parity = metrics(reference, actual);
    let min = Infinity, max = -Infinity;
    for (const value of actual) { if (value < min) min = value; if (value > max) max = value; }
    const rangeOk = min >= -1e-6 && max <= 1 + 1e-6;
    const parityOk = parity.maxAbs <= 2e-4 && parity.rmse <= 5e-5;
    return base(rangeOk && parityOk ? 'PASS' : 'WEBGPU_PARITY_FAILED', {
      shape: [height, width], inputTensorShape: [1, 4, height, width], outputTensorShape: dims,
      referenceKind: 'PINNED_PYTORCH_GENERATOR_FLOAT32', outputRange: [min, max], metrics: parity,
      thresholds: { maxAbs: 2e-4, rmse: 5e-5 }, latencyMs, modelBytes: modelBytes.byteLength,
      adapter: adapterInfo, userAgent: navigator.userAgent,
    });
  } finally {
    await session.release();
  }
};
</script>
