name: Security production dependency remediation staging

on:
  push:
    branches: [ "security-production-dependency-remediation-staging" ]
    paths:
      - '.github/workflows/security-production-dependency-remediation-staging.yml'

permissions:
  contents: write

jobs:
  generate-audited-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Assert staging branch
        run: test "${GITHUB_REF_NAME}" = "security-production-dependency-remediation-staging"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Record current production advisory graph
        run: npm audit --omit=dev --json > "$RUNNER_TEMP/audit-before.json" || true
      - name: Apply npm-compatible production advisory remediation to lock only
        run: npm audit fix --package-lock-only --omit=dev
      - name: Prove top-level manifest is unchanged
        run: git diff --exit-code -- package.json
      - name: Prove clean install from generated lock
        run: npm ci
      - name: Prove production audit is clear at enforced threshold
        run: npm audit --omit=dev --audit-level=moderate
      - name: Prove known blocking transitive identities left vulnerable ranges
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const fflate = lock.packages?.['node_modules/fflate']?.version;
          const selector = lock.packages?.['node_modules/postcss-selector-parser']?.version;
          if (!fflate || /^0\.8\.[0-2]$/.test(fflate)) throw new Error(`fflate remains vulnerable: ${fflate}`);
          if (selector && /^6\.1\.[0-2]$/.test(selector)) throw new Error(`postcss-selector-parser remains vulnerable: ${selector}`);
          console.log(JSON.stringify({ fflate, postcssSelectorParser: selector }));
          NODE
      - name: Commit generated lock only
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- package.json)"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Expected package-lock.json remediation did not occur' >&2
            exit 1
          fi
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "security: remediate audited transitive dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
