name: LaMa inpainting durable candidate release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lama-big-places-inpainting-v1.0.0-candidate.1-release
  cancel-in-progress: false

env:
  MODEL_ID: lama-big-places-inpainting
  VERSION: 1.0.0-candidate.1
  RELEASE_TAG: lama-big-places-inpainting-v1.0.0-candidate.1
  UPSTREAM_REVISION: 786f5936b27fb3dacd2b1ad799e4de968ea697e7
  LAMA_MIRROR_COMMIT: 05cb2be7f8dbe6ca7c6e78f4fc827a4b2baaa4a9
  LAMA_MIRROR_ARCHIVE_SIZE: '381428720'
  LAMA_MIRROR_ARCHIVE_SHA256: f1b358ca24093b93a106183b98a3dea6e8ed09f3b43ea7251eb2c81e7b4575f6
  CHECKPOINT_SIZE: '410046389'
  CHECKPOINT_SHA256: fccb7adffd53ec0974ee5503c3731c2c2f1e7e07856fd9228cdcc0b46fd5d423
  CONFIG_SIZE: '3947'
  CONFIG_SHA256: 4fdeed49926e13b101c4dd9e193acec9e58677dfdb4ba49dd6a3a8927964e2a7
  ONNX_SIZE: '208593659'
  ONNX_SHA256: 8bf7891efa16ea07de31fc98c5f0c017b399956cba0182813ddf23d9072792c7
  VERIFICATION_KEY_ID: bers-lama-inpainting-release-2026-08
  PACK_DIR: ${{ github.workspace }}/.release-pack

jobs:
  reproduce-sign-publish:
    name: Reproduce, sign and publish LaMa CANDIDATE pack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact application source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact main and dedicated signing secret
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.LAMA_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = branch
          test "${GITHUB_REF_NAME}" = main
          test -n "${RELEASE_PRIVATE_KEY}"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Acquire exact upstream source and authoritative checkpoint members
        run: |
          set -euo pipefail
          git clone https://github.com/advimman/lama "${RUNNER_TEMP}/lama"
          git -C "${RUNNER_TEMP}/lama" checkout --detach "${UPSTREAM_REVISION}"
          test "$(git -C "${RUNNER_TEMP}/lama" rev-parse HEAD)" = "${UPSTREAM_REVISION}"
          grep -F 'torch.fft.rfftn' "${RUNNER_TEMP}/lama/saicinpainting/training/modules/ffc.py"
          grep -F 'torch.fft.irfftn' "${RUNNER_TEMP}/lama/saicinpainting/training/modules/ffc.py"
          mkdir -p "${RUNNER_TEMP}/lama-release" "${PACK_DIR}"
          archive="${RUNNER_TEMP}/lama-release/big-lama.zip"
          curl -fL --retry 3 --retry-all-errors \
            "https://huggingface.co/smartywu/big-lama/resolve/${LAMA_MIRROR_COMMIT}/big-lama.zip" \
            -o "${archive}"
          test "$(stat -c%s "${archive}")" = "${LAMA_MIRROR_ARCHIVE_SIZE}"
          test "$(sha256sum "${archive}" | cut -d' ' -f1)" = "${LAMA_MIRROR_ARCHIVE_SHA256}"
          python - "${archive}" "${RUNNER_TEMP}/lama-release" <<'PY'
          import hashlib, os, pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          expected = {
              'big-lama/config.yaml': (int(os.environ['CONFIG_SIZE']), os.environ['CONFIG_SHA256']),
              'big-lama/models/best.ckpt': (int(os.environ['CHECKPOINT_SIZE']), os.environ['CHECKPOINT_SHA256']),
          }
          with zipfile.ZipFile(archive, 'r') as bundle:
              names = [item.filename for item in bundle.infolist() if not item.is_dir()]
              if set(names) != set(expected) or len(names) != 2:
                  raise RuntimeError(f'unexpected Big-LaMa transport members: {names!r}')
              for name, (expected_size, expected_sha) in expected.items():
                  info = bundle.getinfo(name)
                  if info.file_size != expected_size:
                      raise RuntimeError(f'{name} size mismatch')
                  digest = hashlib.sha256()
                  target = out / pathlib.PurePosixPath(name).name
                  with bundle.open(info, 'r') as source, target.open('wb') as sink:
                      for chunk in iter(lambda: source.read(1024 * 1024), b''):
                          digest.update(chunk)
                          sink.write(chunk)
                  if digest.hexdigest() != expected_sha:
                      target.unlink(missing_ok=True)
                      raise RuntimeError(f'{name} SHA-256 mismatch against authoritative identity')
          print('LAMA RELEASE AUTHORITATIVE MEMBER IDENTITIES: PASS')
          PY

      - name: Install pinned restricted bridge environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check kornia==0.5.0 safetensors==0.8.0

      - name: Bridge legacy checkpoint to tensor-only safetensors and remove pickle source
        run: |
          set -euo pipefail
          python scripts/bridge-lama-generator-safetensors.py \
            --source "${RUNNER_TEMP}/lama" \
            --checkpoint "${RUNNER_TEMP}/lama-release/best.ckpt" \
            --state-out "${RUNNER_TEMP}/lama-release/generator.safetensors" \
            --report "${PACK_DIR}/generator-bridge.json"
          python - <<'PY'
          import json, os
          evidence = json.load(open(os.path.join(os.environ['PACK_DIR'], 'generator-bridge.json'), encoding='utf-8'))
          assert evidence['status'] == 'CANDIDATE'
          assert evidence['sourceCheckpoint']['sha256'] == os.environ['CHECKPOINT_SHA256']
          assert evidence['sourceCheckpoint']['verifiedBeforeDeserialization'] is True
          assert evidence['sourceCheckpoint']['weightsOnly'] is True
          assert evidence['bridge']['format'] == 'SAFETENSORS'
          assert evidence['bridge']['pickleFree'] is True
          assert evidence['bridge']['keyCount'] == 989
          assert evidence['bridge']['tensorElements'] == 51057179
          assert evidence['bridge']['published'] is False
          assert evidence['runtimeAuthorityGranted'] is False
          assert evidence['productionDeviceApproval'] is False
          PY
          rm -f "${RUNNER_TEMP}/lama-release/best.ckpt" "${RUNNER_TEMP}/lama-release/big-lama.zip"
          test ! -e "${RUNNER_TEMP}/lama-release/best.ckpt"
          test ! -e "${RUNNER_TEMP}/lama-release/big-lama.zip"
          test -s "${RUNNER_TEMP}/lama-release/generator.safetensors"

      - name: Install exact pinned modern export environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            numpy==2.4.6 \
            kornia==0.5.0 \
            safetensors==0.8.0 \
            onnx==1.22.0 \
            onnxscript==0.7.1 \
            onnxruntime==1.27.0
          python - <<'PY'
          import inspect, numpy, onnx, onnxruntime, onnxscript, safetensors, torch
          assert torch.__version__.startswith('2.13.0')
          assert numpy.__version__ == '2.4.6'
          assert safetensors.__version__ == '0.8.0'
          assert onnx.__version__ == '1.22.0'
          assert onnxscript.__version__ == '0.7.1'
          assert onnxruntime.__version__ == '1.27.0'
          assert 'fallback' not in inspect.signature(torch.onnx.export).parameters
          assert 'dynamic_shapes' in inspect.signature(torch.onnx.export).parameters
          PY

      - name: Reproduce exact pinned BERS ONNX across independent processes
        run: |
          set -euo pipefail
          test ! -e "${RUNNER_TEMP}/lama-release/best.ckpt"
          python scripts/probe-lama-cross-process-reproducibility.py \
            --source "${RUNNER_TEMP}/lama" \
            --state "${RUNNER_TEMP}/lama-release/generator.safetensors" \
            --bridge-report "${PACK_DIR}/generator-bridge.json" \
            --model-out "${PACK_DIR}/lama-big-places-inpainting.onnx" \
            --report "${PACK_DIR}/reproducibility.json"
          test "$(stat -c%s "${PACK_DIR}/lama-big-places-inpainting.onnx")" = "${ONNX_SIZE}"
          test "$(sha256sum "${PACK_DIR}/lama-big-places-inpainting.onnx" | cut -d' ' -f1)" = "${ONNX_SHA256}"
          python - <<'PY'
          import json, os
          evidence = json.load(open(os.path.join(os.environ['PACK_DIR'], 'reproducibility.json'), encoding='utf-8'))
          proof = evidence['reproducibility']
          assert proof['result'] == 'PASS'
          assert proof['independentPythonProcesses'] == 2
          assert proof['pythonHashSeed'] == '0'
          assert proof['byteIdentical'] is True
          assert proof['matchesPinnedReleaseIdentity'] is True
          assert proof['size'] == int(os.environ['ONNX_SIZE'])
          assert proof['sha256'] == os.environ['ONNX_SHA256']
          assert evidence['runtimeAuthorityGranted'] is False
          assert evidence['productionDeviceApproval'] is False
          PY
          rm -f "${RUNNER_TEMP}/lama-release/generator.safetensors"
          test ! -e "${RUNNER_TEMP}/lama-release/generator.safetensors"

      - name: Derive public key, sign artifact and reject one-byte tamper
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.LAMA_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/lama-release-private-key.pem"
          public_key="${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem"
          install -m 600 /dev/null "${key_file}"
          printf '%s\n' "${RELEASE_PRIVATE_KEY}" > "${key_file}"
          unset RELEASE_PRIVATE_KEY
          trap 'rm -f "${key_file}" "${RUNNER_TEMP}/tampered-lama.onnx"' EXIT
          openssl pkey -in "${key_file}" -pubout -out "${public_key}"
          openssl pkeyutl -sign -rawin -inkey "${key_file}" \
            -in "${PACK_DIR}/lama-big-places-inpainting.onnx" \
            -out "${PACK_DIR}/lama-big-places-inpainting.onnx.sig"
          openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
            -in "${PACK_DIR}/lama-big-places-inpainting.onnx" \
            -sigfile "${PACK_DIR}/lama-big-places-inpainting.onnx.sig"
          cp "${PACK_DIR}/lama-big-places-inpainting.onnx" "${RUNNER_TEMP}/tampered-lama.onnx"
          printf '\001' | dd of="${RUNNER_TEMP}/tampered-lama.onnx" bs=1 seek=0 count=1 conv=notrunc status=none
          if openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
            -in "${RUNNER_TEMP}/tampered-lama.onnx" \
            -sigfile "${PACK_DIR}/lama-big-places-inpainting.onnx.sig"; then
            echo 'Tampered LaMa artifact signature was accepted' >&2
            exit 1
          fi

      - name: Generate and sign staged CANDIDATE manifest
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.LAMA_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          staged_manifest="${RUNNER_TEMP}/lama-inpainting.manifest.json"
          python - src/platform/creative/local-ai/models/lama-inpainting.manifest.json "${staged_manifest}" <<'PY'
          import json, os, sys
          manifest = json.load(open(sys.argv[1], encoding='utf-8'))
          assert manifest['status'] == 'CANDIDATE'
          assert manifest['artifactState'] in ('EXPORT_PINNED_RELEASE_REQUIRED', 'SIGNED_RELEASE')
          assert manifest['upstream']['checkpoint']['checkpointSha256'] == os.environ['CHECKPOINT_SHA256']
          assert manifest['bersArtifact']['state'] == 'PINNED'
          assert manifest['bersArtifact']['format'] == 'ONNX'
          assert manifest['bersArtifact']['size'] == int(os.environ['ONNX_SIZE'])
          assert manifest['bersArtifact']['sha256'] == os.environ['ONNX_SHA256']
          assert manifest['bersArtifact']['opset'] == 18
          assert manifest['runtimeFeasibility']['realDeviceWebGpu'] == 'UNPROVEN'
          assert manifest['runtimeFeasibility']['modernDynamoOnnxEvidence']['productionDeviceApproval'] is False
          base = f"https://github.com/giltik123/bers23/releases/download/{os.environ['RELEASE_TAG']}"
          manifest['artifactState'] = 'SIGNED_RELEASE'
          manifest['artifacts']['model'] = {
              'url': f"{base}/lama-big-places-inpainting.onnx",
              'size': int(os.environ['ONNX_SIZE']),
              'sha256': os.environ['ONNX_SHA256'],
              'signatureUrl': f"{base}/lama-big-places-inpainting.onnx.sig",
          }
          manifest['verificationKeyId'] = os.environ['VERIFICATION_KEY_ID']
          manifest['productionApprovalEvidence'] = None
          with open(sys.argv[2], 'w', encoding='utf-8', newline='\n') as stream:
              json.dump(manifest, stream, indent=2)
              stream.write('\n')
          PY
          key_file="${RUNNER_TEMP}/lama-release-private-key.pem"
          binary_signature="${RUNNER_TEMP}/lama-inpainting.manifest.bin.sig"
          install -m 600 /dev/null "${key_file}"
          printf '%s\n' "${RELEASE_PRIVATE_KEY}" > "${key_file}"
          unset RELEASE_PRIVATE_KEY
          openssl pkeyutl -sign -rawin -inkey "${key_file}" -in "${staged_manifest}" -out "${binary_signature}"
          base64 -w 0 "${binary_signature}" > "${RUNNER_TEMP}/lama-inpainting.manifest.sig"
          printf '\n' >> "${RUNNER_TEMP}/lama-inpainting.manifest.sig"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" \
            -in "${staged_manifest}" -sigfile "${binary_signature}"
          rm -f "${key_file}" "${binary_signature}"

      - name: Run repository trust and bundle gates
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run server:typecheck
          npm run lint
          node --test tests/lama-release-reproducibility.test.mjs tests/lama-dynamo-onnx-security.test.mjs tests/lama-webgpu-feasibility.test.mjs tests/lama-release-workflow.test.mjs
          npm run check:model-weight-tracking
          npm run check:browser-bundle
          test "$(git ls-files '*.ckpt' '*.pth' '*.pt' '*.safetensors' '*.onnx' '*.ort' | wc -l)" -eq 0
          if git grep -n -I -E -- '^-----BEGIN (ED25519 |EC |RSA |OPENSSH )?PRIVATE KEY-----$'; then
            echo 'Private key material is tracked by Git' >&2
            exit 1
          fi

      - name: Publish candidate release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1
          gh release create "${RELEASE_TAG}" \
            --title 'LaMa Inpainting CANDIDATE Pack' \
            --target "${GITHUB_SHA}" \
            --notes 'Signed reproducible LaMa inpainting CANDIDATE pack. This is not production approval; real-device WebGPU and real-image quality approval remain required.'
          touch "${RUNNER_TEMP}/lama-release-created-by-this-run"
          gh release upload "${RELEASE_TAG}" \
            "${PACK_DIR}/lama-big-places-inpainting.onnx" \
            "${PACK_DIR}/lama-big-places-inpainting.onnx.sig" \
            "${PACK_DIR}/reproducibility.json" \
            "${PACK_DIR}/generator-bridge.json"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | length')" -eq 4

      - name: Re-download and verify published model bytes/signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="${RUNNER_TEMP}/published-lama"
          mkdir -p "${published}"
          gh release download "${RELEASE_TAG}" --dir "${published}"
          test "$(stat -c%s "${published}/lama-big-places-inpainting.onnx")" = "${ONNX_SIZE}"
          test "$(sha256sum "${published}/lama-big-places-inpainting.onnx" | cut -d' ' -f1)" = "${ONNX_SHA256}"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" \
            -in "${published}/lama-big-places-inpainting.onnx" \
            -sigfile "${published}/lama-big-places-inpainting.onnx.sig"

      - name: Atomically activate signed CANDIDATE metadata on main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          model_dir=src/platform/creative/local-ai/models
          key_dir="${model_dir}/release-keys"
          mkdir -p "${key_dir}"
          cp "${RUNNER_TEMP}/lama-inpainting.manifest.json" "${model_dir}/lama-inpainting.manifest.json"
          cp "${RUNNER_TEMP}/lama-inpainting.manifest.sig" "${model_dir}/lama-inpainting.manifest.sig"
          cp "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" "${key_dir}/${VERIFICATION_KEY_ID}.public-key.pem"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${model_dir}/lama-inpainting.manifest.json" \
            "${model_dir}/lama-inpainting.manifest.sig" \
            "${key_dir}/${VERIFICATION_KEY_ID}.public-key.pem"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'chore: publish signed LaMa inpainting CANDIDATE manifest'
          git push origin HEAD:main

      - name: Cleanup orphan release created by this run on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f "${RUNNER_TEMP}/lama-release-created-by-this-run"; then
            gh release delete "${RELEASE_TAG}" --yes --cleanup-tag >/dev/null 2>&1 || true
          fi

      - name: Publish release summary
        run: |
          {
            echo '## LaMa inpainting CANDIDATE release'
            echo
            echo '- Status: CANDIDATE (not production approved)'
            echo "- Upstream revision: \`${UPSTREAM_REVISION}\`"
            echo "- Checkpoint SHA-256: \`${CHECKPOINT_SHA256}\`"
            echo "- Reproduced ONNX size: \`${ONNX_SIZE}\`"
            echo "- Reproduced ONNX SHA-256: \`${ONNX_SHA256}\`"
            echo '- Independent-process reproducibility + CPU ORT multi-shape parity: PASS'
            echo '- Detached model/manifest signatures: PASS; one-byte tamper rejected'
            echo '- Published asset re-download verification: PASS'
            echo '- Failure cleanup is ownership-gated to releases created by this run'
            echo '- Hosted WASM evidence remains feasibility evidence; real-device WebGPU approval remains UNPROVEN'
            echo '- Real-image quality/performance production approval: NOT GRANTED by this workflow'
          } >> "${GITHUB_STEP_SUMMARY}"
