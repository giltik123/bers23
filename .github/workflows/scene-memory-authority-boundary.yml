name: Scene Memory Authority Boundary

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/lib/scene/sceneMemory.js'
      - 'src/components/editor/scene/SceneMemoryPanel.jsx'
      - 'src/pages/Editor.jsx'
      - 'tests/scene-memory-authority-boundary.test.mjs'
      - '.github/workflows/scene-memory-authority-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scene-memory-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Prove Scene Memory authority boundary
        run: node --test tests/scene-memory-authority-boundary.test.mjs
      - name: Preserve existing Editor Scene Memory release contract
        run: node --test tests/release-r3a-browser-boundaries.test.mjs
      - name: Typecheck and build browser
        run: |
          npm run typecheck
          npm run build
      - name: Preserve fail-closed scope
        run: |
          set -euo pipefail
          ! grep -q "InvokeLLM" src/lib/scene/sceneMemory.js
          ! grep -q "projectService.update" src/lib/scene/sceneMemory.js
          ! grep -q "sceneMemory.refresh" src/components/editor/scene/SceneMemoryPanel.jsx
          grep -q "SCENE_MEMORY_ANALYSIS_NOT_WIRED" src/lib/scene/sceneMemory.js
          test -n "$BASE_SHA"
          git diff --check "$BASE_SHA"..HEAD
