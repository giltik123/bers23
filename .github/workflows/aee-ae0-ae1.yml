name: AEE AE-0 AE-1 AgentIntentV1

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'server/core/agentic/**'
      - 'src/lib/agent/**'
      - 'src/platform/agent/**'
      - 'server/core/workflow/**'
      - 'server/core/execution/**'
      - 'server/core/composition/**'
      - '.github/workflows/aee-ae0-ae1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  aee-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core contracts
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Prove AE-0 and AgentIntentV1 fail-closed contract
        run: node --experimental-strip-types --test server/core/agentic/*.test.mjs
      - name: Preserve accepted Agent execution authority
        run: |
          node --experimental-strip-types --test \
            server/core/workflow/BoundedAgentDeterministicWorkflowService.test.mjs \
            server/core/execution/internalWorkflowAuthorityProducerBoundary.test.mjs \
            server/core/composition/boundedAgentProductionComposition.test.mjs \
            server/core/composition/automationProductionComposition.test.mjs
      - name: Build immutable Core
        run: npm run server:build
      - name: Boundary hygiene
        run: |
          set -euo pipefail
          grep -q 'AGENT_EXECUTION_NOT_WIRED' src/lib/agent/executionQueue.js
          grep -q 'WorkflowContinuation + ExecutionRun' server/core/agentic/ARCHITECTURE.md
          ! grep -E -q 'providerSelector|billing|creditsWallet|artifactAuthority|projectService' server/core/agentic/AgentIntentV1.ts
          git diff --check
