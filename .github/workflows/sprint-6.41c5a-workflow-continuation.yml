name: Sprint 6.41C5A workflow continuation acceptance

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "server/index.ts"
      - "server/core/workflow/**"
      - "server/core/localExecution/**"
      - "server/core/http/boundedAgentHttpAdapter.ts"
      - "server/core/http/boundedAgentHttpAdapter.test.mjs"
      - "server/core/composition/createProductionCore.ts"
      - "server/core/composition/boundedAgentProductionComposition.test.mjs"
      - "server/core/artifacts/canonicalArtifactHydrator.ts"
      - "server/core/artifacts/canonicalArtifactHydrator.role.test.mjs"
      - "server/core/artifacts/durableArtifactLineageResolver.ts"
      - "server/core/artifacts/migrations/012_local_execution_uploads.sql"
      - "server/core/artifacts/migrations/013_local_execution_ticket_ledger.sql"
      - "server/core/artifacts/migrations/015_workflow_continuations.sql"
      - "server/core/artifacts/migrations/016_local_execution_result_replay_binding.sql"
      - "server/core/artifacts/migrations/039_workflow_continuation_plan_parameters.sql"
      - "src/api/coreClient.js"
      - "src/application/agent/**"
      - "src/application/local-execution/CoreAuthorizedOrthogonalTransform.ts"
      - "src/application/local-execution/CoreAuthorizedResize.ts"
      - "src/components/editor/agent/**"
      - "src/pages/Editor.jsx"
      - "src/platform/creative/canonical/planning/**"
      - "server/core/providers/productionExecutionCapabilities.ts"
      - "server/core/providers/productionOnDeviceRoute.test.mjs"
      - "tests/bounded-agent-browser-runner.test.ts"
      - "tests/bounded-agent-prepared-local-execution.test.ts"
      - "tests/editor-canonical-boundary.test.mjs"
      - "tests/editor-zero-object-navigation.test.mjs"
      - ".github/workflows/sprint-6.41c5a-workflow-continuation.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  continuation-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: continuation_test
          POSTGRES_USER: continuation_test
          POSTGRES_PASSWORD: continuation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuation_test -d continuation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://continuation_test:continuation_test@127.0.0.1:5432/continuation_test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck continuation authority
        run: npm run server:typecheck
      - name: Build bounded Agent browser surface
        run: npm run build
      - name: Prove production workflow-bound v2 issuer and bounded Agent composition
        run: node --test server/core/composition/boundedAgentProductionComposition.test.mjs
      - name: Prove bounded Agent HTTP authority and principal boundary
        run: node --experimental-strip-types --test server/core/http/boundedAgentHttpAdapter.test.mjs
      - name: Prove stored FINAL role, prepared local execution, browser sequencing and Editor boundary
        run: |
          mkdir -p .test-cache/c5a
          npx esbuild server/core/artifacts/canonicalArtifactHydrator.role.test.mjs --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/c5a/artifact-hydrator-role.test.mjs --external:node:* --external:pg --external:sharp
          node --test .test-cache/c5a/artifact-hydrator-role.test.mjs
          npx esbuild tests/bounded-agent-prepared-local-execution.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/c5a/prepared-local-execution.test.mjs --external:node:*
          node --test .test-cache/c5a/prepared-local-execution.test.mjs
          npx esbuild tests/bounded-agent-browser-runner.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/c5a/browser-runner.test.mjs --external:node:*
          node --test .test-cache/c5a/browser-runner.test.mjs
          node --test tests/editor-canonical-boundary.test.mjs
          node --test tests/editor-zero-object-navigation.test.mjs
      - name: Run fail-closed continuation, workflow-ticket, bounded Agent and deterministic recovery unit tests
        run: |
          node --experimental-strip-types --test server/core/workflow/WorkflowContinuationPlanParameters.test.mjs
          node --experimental-strip-types --test server/core/workflow/PostgresWorkflowContinuationStore.test.mjs
          node --experimental-strip-types --test server/core/workflow/PostgresWorkflowContinuationLogicalStep.test.mjs
          node --experimental-strip-types --test server/core/workflow/WorkflowBoundLocalExecutionTicketV2Issuer.test.mjs
          node --experimental-strip-types --test server/core/workflow/WorkflowLocalExecutionAttemptRunProjection.test.mjs
          node --experimental-strip-types --test server/core/workflow/BoundedAgentDeterministicWorkflowService.test.mjs
          node --experimental-strip-types --test server/core/localExecution/DeterministicWorkflowStepFinalRecoveryAuthority.test.mjs
      - name: Apply exact prerequisite and C5A schemas
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { Pool } from 'pg';
          const pool = new Pool({ connectionString: process.env.DATABASE_URL, application_name: 'bers-c5a-schema' });
          try {
            for (const path of [
              'server/core/artifacts/migrations/002_canonical_mask_artifacts.sql',
              'server/core/artifacts/migrations/012_local_execution_uploads.sql',
              'server/core/artifacts/migrations/013_local_execution_ticket_ledger.sql',
              'server/core/artifacts/migrations/016_local_execution_result_replay_binding.sql',
              'server/core/artifacts/migrations/015_workflow_continuations.sql',
              'server/core/artifacts/migrations/039_workflow_continuation_plan_parameters.sql',
            ]) await pool.query(await readFile(path, 'utf8'));
          } finally { await pool.end(); }
          NODE
      - name: Prove PostgreSQL restart, immutable plan parameters, concurrency and replay semantics
        run: |
          node --experimental-strip-types --test server/core/workflow/PostgresWorkflowContinuationStore.integration.test.mjs
          node --experimental-strip-types --test server/core/workflow/PostgresWorkflowContinuationPlanParameters.integration.test.mjs
      - name: Preserve composite and capability fail-closed boundaries
        run: |
          npm run test:creative-planning-v2
          node --experimental-strip-types --test server/core/providers/productionOnDeviceRoute.test.mjs
          grep -F "compositeExecutionEnabled: options.compositeExecutionEnabled ?? false" src/platform/creative/canonical/planning/CanonicalPlanningService.ts
          grep -F "COMPOSITE_EXECUTION_NOT_WIRED" src/platform/creative/canonical/planning/CanonicalPlanningService.ts
          if grep -R -n -E "falWorkflowRuntime|fashnProvider|editingEngine|creditsEngine" server/core/workflow; then
            echo "Workflow continuation authority must not execute providers or browser financial paths" >&2
            exit 1
          fi
