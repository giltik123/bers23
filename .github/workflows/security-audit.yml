name: Production dependency security audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  npm-production-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Fail on moderate or higher production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
