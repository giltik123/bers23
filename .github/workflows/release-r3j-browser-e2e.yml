name: R3j canonical Try-On release E2E

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/api/coreResourceUrl.js'
      - 'src/application/fashion/**'
      - 'src/components/editor/outfits/**'
      - 'src/components/editor/ResultCompare.jsx'
      - 'src/pages/Editor.jsx'
      - 'src/api/coreClient.js'
      - 'src/lib/projectService.js'
      - 'server/core/fashion/**'
      - 'server/core/http/**'
      - 'server/core/localExecution/**'
      - 'server/core/artifacts/**'
      - 'scripts/test-release-r3j-browser-e2e.mjs'
      - 'tests/core-resource-url.test.mjs'
      - 'tests/fashion-tryon-editor-final-handoff.test.mjs'
      - 'tests/fashion-tryon-product-controls.test.mjs'
      - 'tests/fashion-tryon-manual-prerequisite-application.test.mjs'
      - 'tests/fashion-tryon-manual-remediation-policy.test.mjs'
      - 'tests/fashion-tryon-manual-contour-draft.test.mjs'
      - 'tests/fashion-tryon-manual-body-anchor-draft.test.mjs'
      - 'tests/release-r3j-browser-boundaries.test.mjs'
      - '.github/workflows/release-r3j-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-r3j-browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-tryon-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: release_r3j_test
          POSTGRES_USER: release_r3j_test
          POSTGRES_PASSWORD: release_r3j_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_r3j_test -d release_r3j_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://release_r3j_test:release_r3j_test@127.0.0.1:5432/release_r3j_test
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      VITE_CORE_API_URL: http://127.0.0.1:4188/api/core
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Preserve financial redesign freeze
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          git diff --exit-code "$BASE_SHA"..HEAD -- \
            server/transactions/application/financialAccountPorts.ts \
            server/transactions/infrastructure/postgres/postgresFinancialAccountStore.ts \
            server/transactions/infrastructure/postgres/postgresFinancialAccountPolicy.ts \
            server/transactions/infrastructure/postgres/postgresFinancialTrialPolicy.ts \
            server/transactions/infrastructure/postgres/migrations/038_financial_account_foundation.sql \
            server/core/http/financialAccountHttpAdapter.ts \
            server/core/http/financialAccountPolicyHttpAdapter.ts \
            server/core/http/financialTrialHttpAdapter.ts \
            src/lib/credits \
            src/lib/subscriptions \
            src/pages/Billing.jsx \
            src/pages/Subscription.jsx
      - name: Typecheck browser and Core release surfaces
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Prove R3j unit and authority boundaries
        run: |
          node --test tests/core-resource-url.test.mjs
          node --test tests/fashion-tryon-editor-final-handoff.test.mjs
          node --test tests/fashion-tryon-product-controls.test.mjs
          node --test tests/fashion-tryon-manual-prerequisite-application.test.mjs
          node --test tests/fashion-tryon-manual-remediation-policy.test.mjs
          node --test tests/fashion-tryon-manual-contour-draft.test.mjs
          node --test tests/fashion-tryon-manual-body-anchor-draft.test.mjs
          node --test tests/release-r3j-browser-boundaries.test.mjs
      - name: Build immutable Core and apply packaged production migrations
        run: |
          npm run server:build
          test -f dist-server/server.mjs
          node dist-server/migrate.mjs migrate
          node dist-server/migrate.mjs check
      - name: Generate and mask ephemeral R3j runtime secrets
        run: |
          set -euo pipefail
          for name in FAL_KEY JWT_SECRET AUTH_CHALLENGE_SECRET RESEND_API_KEY GOOGLE_OAUTH_CLIENT_SECRET ARTIFACT_SIGNING_SECRET; do
            value="$(openssl rand -hex 32)"
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
      - name: Build real SPA against built Core origin
        run: |
          npm run build
          test -f dist/index.html
      - name: Bundle R3j browser journey without replacing production stores
        run: |
          mkdir -p .test-cache/release-r3j
          npx esbuild scripts/test-release-r3j-browser-e2e.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/release-r3j/test-release-r3j-browser-e2e.mjs \
            --external:node:* --external:pg --external:sharp --external:playwright
      - name: Prove canonical Try-On uncertainty Recover Retry and Editor Accept
        run: |
          set -euo pipefail
          node .test-cache/release-r3j/test-release-r3j-browser-e2e.mjs | tee .test-cache/release-r3j/runtime.log
          grep -q 'R3J_BROWSER_CANONICAL_TRYON_ACCEPTED' .test-cache/release-r3j/runtime.log
      - name: Prove R3j harness has no fake transport or forbidden fallback
        run: |
          set -euo pipefail
          script=scripts/test-release-r3j-browser-e2e.mjs
          grep -q "browserContext.addInitScript" "$script"
          grep -q "response.clone().arrayBuffer()" "$script"
          grep -q "/api/core/fashion/try-on/preview" "$script"
          grep -q ":garment-warp:v1" "$script"
          grep -q ":texture-composite:v1" "$script"
          grep -q "local_execution_tickets" "$script"
          grep -q "canonical_project_body_anchor_sets" "$script"
          grep -q "canonical_image_artifacts" "$script"
          grep -q "ACCEPTED_FINAL" "$script"
          grep -q "providerCalls, 0" "$script"
          ! grep -E -q 'page\.route\(|browserContext\.route\(|context\.route\(|route\.(fulfill|abort|continue|fallback)\(' "$script"
          ! grep -E -q 'financialAccount|financialTrial|credit_grants|credit_wallets' "$script"
      - name: Check committed diff whitespace
        run: git diff --check "$BASE_SHA"..HEAD
