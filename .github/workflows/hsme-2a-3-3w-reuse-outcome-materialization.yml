name: HSME-2a.3.3w reuse outcome materialization

on:
  pull_request:
    paths:
      - 'scripts/materialize-hsme-reuse-outcome-evidence.mjs'
      - 'tests/hsme-reuse-outcome-materialization.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationReuseDecisionFinalizationV1.ts'
      - 'src/platform/creative/local-ai/hsme/HsmeReuseOutcomeHandoffV1.ts'
      - '.github/workflows/hsme-2a-3-3w-reuse-outcome-materialization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialization-contract:
    name: trusted JSON-only reuse outcome materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Bundle and run materialization regressions
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3w
          npx esbuild tests/hsme-reuse-outcome-materialization.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3w/materialization.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3w/materialization.test.mjs

      - name: Prove materializer uses canonical finalizer and handoff only
        run: |
          set -euo pipefail
          SCRIPT=scripts/materialize-hsme-reuse-outcome-evidence.mjs
          grep -F 'finalizeHsmeFoundationReuseDecisionV1(' "$SCRIPT"
          grep -F 'proveHsmeReuseOutcomeHandoffV1(' "$SCRIPT"
          grep -F 'expectedOriginIndexSha256' "$SCRIPT"
          grep -F 'candidate===frontier.value' "$SCRIPT"
          grep -F 'candidate===pareto.value' "$SCRIPT"
          grep -F 'candidate===finalization' "$SCRIPT"
          grep -F 'trainingRunStartAllowed:false' "$SCRIPT"
          grep -F 'modelInstallAllowed:false' "$SCRIPT"
          grep -F 'modelFleetPromotionAllowed:false' "$SCRIPT"
          grep -F 'productionAuthorityGranted:false' "$SCRIPT"
          grep -F 'providerAuthorityGranted:false' "$SCRIPT"
          grep -F 'billingAuthorityGranted:false' "$SCRIPT"
          grep -F 'projectArtifactMutationAllowed:false' "$SCRIPT"
          grep -F 'aeeExecutionAuthorityGranted:false' "$SCRIPT"
          grep -F 'durableModelFleetPromotionAllowed:false' "$SCRIPT"
          grep -F 'winnerSelectionAllowed:false' "$SCRIPT"
          ! grep -nE 'startTraining|runTraining|from_pretrained|torch\.load|pickle\.load|safe_open|ModelFleet(Service|Client)|promoteModel|installModel|downloadModel|reserveCredits|spendCredits|fetch\(|https?://' "$SCRIPT"

      - name: Prove no binary artifacts are part of the contract
        run: |
          set -euo pipefail
          SCRIPT=scripts/materialize-hsme-reuse-outcome-evidence.mjs
          grep -F 'reuse-decision-finalization.json' "$SCRIPT"
          grep -F 'reuse-outcome-handoff.json' "$SCRIPT"
          grep -F 'reuse-outcome-materialization-evidence.json' "$SCRIPT"
          ! grep -nE '\\.(safetensors|bin|onnx|gguf|pt|pth|ckpt)' "$SCRIPT"
