name: Fashion F4b.6c.2a body-anchor sequence and exact-source guard

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  body-anchor-sequence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fashion_f4b6c2a_anchor_test
          POSTGRES_USER: fashion_f4b6c2a_anchor_test
          POSTGRES_PASSWORD: fashion_f4b6c2a_anchor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fashion_f4b6c2a_anchor_test -d fashion_f4b6c2a_anchor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fashion_f4b6c2a_anchor_test:fashion_f4b6c2a_anchor_test@127.0.0.1:5432/fashion_f4b6c2a_anchor_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core persistence authority
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Build production Core and package migrations 028 and 031
        run: |
          npm run server:build
          test -f dist-server/migrations/028_project_body_anchor_sets.sql
          test -f dist-server/migrations/031_project_body_anchor_acquisition_sequence.sql
      - name: Prove aggregate production migration and readiness order
        run: |
          npm run db:migrate:transactions
          npm run db:check:transactions
      - name: Bundle body-anchor schema and sequence PostgreSQL acceptance
        run: |
          mkdir -p .test-cache/fashion-body-anchor-f4b6c2a
          npx esbuild tests/fashion-body-anchor-schema-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-body-anchor-f4b6c2a/body-anchor-schema.test.mjs \
            --external:node:* --external:pg
          npx esbuild tests/fashion-body-anchor-acquisition-sequence-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-body-anchor-f4b6c2a/body-anchor-sequence.test.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/fashion-body-anchor-destination-mesh-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-body-anchor-f4b6c2a/body-anchor-existing-vertical.test.mjs \
            --external:node:* --external:pg --external:sharp
      - name: Prove schema drift exact-source pre-insert guard concurrency and existing F4b.3 compatibility
        run: node --test --test-concurrency=1 .test-cache/fashion-body-anchor-f4b6c2a/*.test.mjs
      - name: Prove sequence is DB-owned and no execution provider Billing or cloud authority opened
        run: |
          grep -q "GENERATED ALWAYS AS IDENTITY" server/core/fashion/migrations/031_project_body_anchor_acquisition_sequence.sql
          grep -q "createForExpectedImage" server/core/fashion/postgresProjectBodyAnchorStore.ts
          ! grep -R -E 'FAL_KEY|creditsUsed|Billing|provider|tryonEngine' \
            server/core/fashion/migrations/031_project_body_anchor_acquisition_sequence.sql \
            server/core/fashion/bodyAnchorSchema.ts \
            server/core/fashion/postgresProjectBodyAnchorStore.ts
          grep -q "TRYON_EXECUTION_NOT_WIRED" src/lib/tryon/tryonEngine.js
