name: EfficientSAM-Ti durable candidate release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: efficient-sam-ti-v1.0.0-candidate.1-release
  cancel-in-progress: false

env:
  MODEL_ID: efficient-sam-ti
  VERSION: 1.0.0-candidate.1
  RELEASE_TAG: efficient-sam-ti-v1.0.0-candidate.1
  UPSTREAM_REVISION: d525f622e6f640acf5a0fc37c7ca1f243da5bde0
  VERIFICATION_KEY_ID: bers-interactive-segmentation-release-2026-08
  PACK_DIR: ${{ github.workspace }}/.release-pack

jobs:
  verify-sign-publish:
    name: Verify, sign and publish official ONNX CANDIDATE pack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact main and dedicated signing secret
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.EFFICIENTSAM_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = branch
          test "${GITHUB_REF_NAME}" = main
          test -n "${RELEASE_PRIVATE_KEY}"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned ONNX validator
        run: python -m pip install --disable-pip-version-check onnx==1.15.0

      - name: Fetch exact upstream official ONNX artifacts
        run: |
          set -euo pipefail
          git clone https://github.com/yformer/EfficientSAM "${RUNNER_TEMP}/EfficientSAM"
          git -C "${RUNNER_TEMP}/EfficientSAM" checkout --detach "${UPSTREAM_REVISION}"
          test "$(git -C "${RUNNER_TEMP}/EfficientSAM" rev-parse HEAD)" = "${UPSTREAM_REVISION}"
          mkdir -p "${PACK_DIR}"
          python scripts/inspect-efficientsam-ti-release.py \
            --source "${RUNNER_TEMP}/EfficientSAM" \
            --metadata "${PACK_DIR}/acquisition-metadata.json"
          cp "${RUNNER_TEMP}/EfficientSAM/weights/efficient_sam_vitt_encoder.onnx" "${PACK_DIR}/efficient-sam-ti-encoder.onnx"
          cp "${RUNNER_TEMP}/EfficientSAM/weights/efficient_sam_vitt_decoder.onnx" "${PACK_DIR}/efficient-sam-ti-decoder.onnx"

      - name: Derive release public key, sign artifacts and reject tamper
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.EFFICIENTSAM_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/efficientsam-release-private-key.pem"
          public_key="${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem"
          install -m 600 /dev/null "${key_file}"
          printf '%s\n' "${RELEASE_PRIVATE_KEY}" > "${key_file}"
          unset RELEASE_PRIVATE_KEY
          trap 'rm -f "${key_file}" "${RUNNER_TEMP}/tampered.onnx"' EXIT
          openssl pkey -in "${key_file}" -pubout -out "${public_key}"
          for artifact in efficient-sam-ti-encoder.onnx efficient-sam-ti-decoder.onnx; do
            openssl pkeyutl -sign -rawin -inkey "${key_file}" \
              -in "${PACK_DIR}/${artifact}" -out "${PACK_DIR}/${artifact}.sig"
            openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
              -in "${PACK_DIR}/${artifact}" -sigfile "${PACK_DIR}/${artifact}.sig"
          done
          cp "${PACK_DIR}/efficient-sam-ti-encoder.onnx" "${RUNNER_TEMP}/tampered.onnx"
          printf '\001' | dd of="${RUNNER_TEMP}/tampered.onnx" bs=1 seek=0 count=1 conv=notrunc status=none
          if openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
            -in "${RUNNER_TEMP}/tampered.onnx" \
            -sigfile "${PACK_DIR}/efficient-sam-ti-encoder.onnx.sig"; then
            echo 'Tampered EfficientSAM artifact signature was accepted' >&2
            exit 1
          fi

      - name: Generate and sign staged CANDIDATE manifest
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.EFFICIENTSAM_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          staged_manifest="${RUNNER_TEMP}/efficient-sam-ti.manifest.json"
          python - "${PACK_DIR}/acquisition-metadata.json" "src/platform/creative/local-ai/models/efficient-sam-ti.manifest.json" "${staged_manifest}" <<'PY'
          import json, sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          manifest = json.load(open(sys.argv[2], encoding='utf-8'))
          tag = 'efficient-sam-ti-v1.0.0-candidate.1'
          base = f'https://github.com/giltik123/bers23/releases/download/{tag}'
          assert manifest['status'] == 'CANDIDATE'
          manifest['artifactState'] = 'SIGNED_RELEASE'
          for name in ('encoder', 'decoder'):
              artifact = metadata['artifacts'][name]
              filename = f'efficient-sam-ti-{name}.onnx'
              manifest['artifacts'][name] = {
                  'url': f'{base}/{filename}',
                  'size': artifact['size'],
                  'sha256': artifact['sha256'],
                  'signatureUrl': f'{base}/{filename}.sig',
              }
          manifest['verificationKeyId'] = 'bers-interactive-segmentation-release-2026-08'
          manifest['productionApprovalEvidence'] = None
          manifest['acquisition'] = {
              'validatedRevision': metadata['upstream']['revision'],
              'productionDeviceApproval': False,
              'graphs': {name: metadata['artifacts'][name]['graph'] for name in ('encoder', 'decoder')},
          }
          with open(sys.argv[3], 'w', encoding='utf-8', newline='\n') as stream:
              json.dump(manifest, stream, indent=2)
              stream.write('\n')
          PY
          key_file="${RUNNER_TEMP}/efficientsam-release-private-key.pem"
          binary_signature="${RUNNER_TEMP}/efficient-sam-ti.manifest.bin.sig"
          install -m 600 /dev/null "${key_file}"
          printf '%s\n' "${RELEASE_PRIVATE_KEY}" > "${key_file}"
          unset RELEASE_PRIVATE_KEY
          openssl pkeyutl -sign -rawin -inkey "${key_file}" -in "${staged_manifest}" -out "${binary_signature}"
          base64 -w 0 "${binary_signature}" > "${RUNNER_TEMP}/efficient-sam-ti.manifest.sig"
          printf '\n' >> "${RUNNER_TEMP}/efficient-sam-ti.manifest.sig"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" \
            -in "${staged_manifest}" -sigfile "${binary_signature}"
          rm -f "${key_file}" "${binary_signature}"

      - name: Run repository trust and security gates
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run server:typecheck
          npm run lint
          npm run check:model-weight-tracking
          npm run check:browser-bundle
          test "$(git ls-files '*.onnx' | wc -l)" -eq 0
          test "$(git log --all --format= --name-only -- '*.onnx' | sed '/^$/d' | sort -u | wc -l)" -eq 0
          if git grep -n -I -E -- '^-----BEGIN (ED25519 |EC |RSA |OPENSSH )?PRIVATE KEY-----$'; then
            echo 'Private key material is tracked by Git' >&2
            exit 1
          fi

      - name: Create GitHub Release and upload exactly five assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1
          gh release create "${RELEASE_TAG}" --title 'EfficientSAM-Ti CANDIDATE Model Pack' \
            --target "${GITHUB_SHA}" \
            --notes 'Signed CANDIDATE EfficientSAM-Ti split ONNX pack. This is not production approval.'
          gh release upload "${RELEASE_TAG}" \
            "${PACK_DIR}/efficient-sam-ti-encoder.onnx" \
            "${PACK_DIR}/efficient-sam-ti-encoder.onnx.sig" \
            "${PACK_DIR}/efficient-sam-ti-decoder.onnx" \
            "${PACK_DIR}/efficient-sam-ti-decoder.onnx.sig" \
            "${PACK_DIR}/acquisition-metadata.json"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | length')" -eq 5

      - name: Re-download and verify published assets
        run: |
          set -euo pipefail
          published="${RUNNER_TEMP}/published-release"
          mkdir "${published}"
          base="https://github.com/giltik123/bers23/releases/download/${RELEASE_TAG}"
          for asset in efficient-sam-ti-encoder.onnx efficient-sam-ti-encoder.onnx.sig efficient-sam-ti-decoder.onnx efficient-sam-ti-decoder.onnx.sig acquisition-metadata.json; do
            curl --fail --location --retry 6 --output "${published}/${asset}" "${base}/${asset}"
          done
          python - "${PACK_DIR}/acquisition-metadata.json" "${published}" <<'PY'
          import hashlib, json, pathlib, sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          root = pathlib.Path(sys.argv[2])
          for name in ('encoder', 'decoder'):
              path = root / f'efficient-sam-ti-{name}.onnx'
              expected = metadata['artifacts'][name]
              assert path.stat().st_size == expected['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected['sha256']
          PY
          for name in encoder decoder; do
            openssl pkeyutl -verify -rawin -pubin \
              -inkey "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" \
              -in "${published}/efficient-sam-ti-${name}.onnx" \
              -sigfile "${published}/efficient-sam-ti-${name}.onnx.sig"
          done

      - name: Atomically activate signed CANDIDATE metadata on main
        run: |
          set -euo pipefail
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "${GITHUB_SHA}"; then
            echo 'main moved after release started; refusing manifest activation' >&2
            exit 1
          fi
          model_dir=src/platform/creative/local-ai/models
          key_dir="${model_dir}/release-keys"
          mkdir -p "${key_dir}"
          cp "${RUNNER_TEMP}/efficient-sam-ti.manifest.json" "${model_dir}/efficient-sam-ti.manifest.json"
          cp "${RUNNER_TEMP}/efficient-sam-ti.manifest.sig" "${model_dir}/efficient-sam-ti.manifest.sig"
          cp "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" "${key_dir}/${VERIFICATION_KEY_ID}.public-key.pem"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${model_dir}/efficient-sam-ti.manifest.json" \
            "${model_dir}/efficient-sam-ti.manifest.sig" \
            "${key_dir}/${VERIFICATION_KEY_ID}.public-key.pem"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'chore: publish signed EfficientSAM-Ti CANDIDATE manifest'
          git push origin HEAD:main

      - name: Publish release summary
        run: |
          {
            echo '## EfficientSAM-Ti CANDIDATE release'
            echo
            echo '- Status: CANDIDATE (not production approved)'
            echo "- Upstream revision: \`${UPSTREAM_REVISION}\`"
            echo '- Upstream Git blob + exact size + SHA-256 + ONNX graph contract: PASS'
            echo '- Detached encoder/decoder signatures: PASS; one-byte tamper rejected'
            echo '- Published asset re-download verification: PASS'
            echo '- Real browser/device quality/performance approval: NOT GRANTED by this workflow'
          } >> "${GITHUB_STEP_SUMMARY}"
