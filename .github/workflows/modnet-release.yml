name: MODNet portrait-matting durable candidate release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modnet-photographic-portrait-matting-v1.0.0-candidate.1-release
  cancel-in-progress: false

env:
  MODEL_ID: modnet-photographic-portrait-matting
  VERSION: 1.0.0-candidate.1
  RELEASE_TAG: modnet-photographic-portrait-matting-v1.0.0-candidate.1
  UPSTREAM_REVISION: 28165a451e4610c9d77cfdf925a94610bb2810fb
  CHECKPOINT_SHA256: 7c22235f0925deba15d4d63e53afcb654c47055bbcd98f56e393ab2584007ed8
  CHECKPOINT_SIZE: '26255603'
  ONNX_SHA256: 18d30ce06d8344549e09b02d14e7c1a8d5136c6ecd4c181d05bcd04abb884919
  ONNX_SIZE: '25961178'
  VERIFICATION_KEY_ID: bers-portrait-matting-release-2026-08
  PACK_DIR: ${{ github.workspace }}/.release-pack

jobs:
  reproduce-sign-publish:
    name: Reproduce, sign and publish MODNet CANDIDATE pack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact application source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact main and dedicated signing secret
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.MODNET_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = branch
          test "${GITHUB_REF_NAME}" = main
          test -n "${RELEASE_PRIVATE_KEY}"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned CPU export environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check gdown==5.2.0
          python -m pip install --disable-pip-version-check torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==1.26.4 onnx==1.15.0 onnxruntime==1.16.3

      - name: Acquire exact upstream source and checkpoint
        run: |
          set -euo pipefail
          git clone https://github.com/ZHKKKe/MODNet "${RUNNER_TEMP}/MODNet"
          git -C "${RUNNER_TEMP}/MODNet" checkout --detach "${UPSTREAM_REVISION}"
          test "$(git -C "${RUNNER_TEMP}/MODNet" rev-parse HEAD)" = "${UPSTREAM_REVISION}"
          mkdir -p "${RUNNER_TEMP}/modnet-checkpoints" "${PACK_DIR}"
          gdown --folder 'https://drive.google.com/drive/folders/1umYmlCulvIFNaqPjwod1SayFmSRHziyR?usp=sharing' \
            -O "${RUNNER_TEMP}/modnet-checkpoints"
          mapfile -t matches < <(find "${RUNNER_TEMP}/modnet-checkpoints" -type f -name 'modnet_photographic_portrait_matting.ckpt' -print)
          test "${#matches[@]}" -eq 1
          checkpoint="${matches[0]}"
          test "$(stat -c%s "${checkpoint}")" = "${CHECKPOINT_SIZE}"
          printf '%s\n' "${checkpoint}" > "${RUNNER_TEMP}/modnet-checkpoint-path"
          python scripts/inspect-modnet-checkpoint.py \
            --source "${RUNNER_TEMP}/MODNet" \
            --checkpoint "${checkpoint}" \
            --expected-sha256 "${CHECKPOINT_SHA256}" \
            --metadata "${PACK_DIR}/checkpoint-acquisition.json" \
            --inspect-state-dict

      - name: Reproduce exact pinned BERS ONNX
        run: |
          set -euo pipefail
          checkpoint="$(cat "${RUNNER_TEMP}/modnet-checkpoint-path")"
          python scripts/build-modnet-portrait-matting-release.py \
            --source "${RUNNER_TEMP}/MODNet" \
            --checkpoint "${checkpoint}" \
            --manifest src/platform/creative/local-ai/models/portrait-matting.manifest.json \
            --output "${PACK_DIR}/modnet-photographic-portrait-matting.onnx" \
            --report "${PACK_DIR}/build-report.json"
          test "$(stat -c%s "${PACK_DIR}/modnet-photographic-portrait-matting.onnx")" = "${ONNX_SIZE}"
          test "$(sha256sum "${PACK_DIR}/modnet-photographic-portrait-matting.onnx" | cut -d' ' -f1)" = "${ONNX_SHA256}"

      - name: Derive public key, sign artifact and reject one-byte tamper
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.MODNET_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/modnet-release-private-key.pem"
          public_key="${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem"
          install -m 600 /dev/null "${key_file}"
          printf '%s\n' "${RELEASE_PRIVATE_KEY}" > "${key_file}"
          unset RELEASE_PRIVATE_KEY
          trap 'rm -f "${key_file}" "${RUNNER_TEMP}/tampered.onnx"' EXIT
          openssl pkey -in "${key_file}" -pubout -out "${public_key}"
          openssl pkeyutl -sign -rawin -inkey "${key_file}" \
            -in "${PACK_DIR}/modnet-photographic-portrait-matting.onnx" \
            -out "${PACK_DIR}/modnet-photographic-portrait-matting.onnx.sig"
          openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
            -in "${PACK_DIR}/modnet-photographic-portrait-matting.onnx" \
            -sigfile "${PACK_DIR}/modnet-photographic-portrait-matting.onnx.sig"
          cp "${PACK_DIR}/modnet-photographic-portrait-matting.onnx" "${RUNNER_TEMP}/tampered.onnx"
          printf '\001' | dd of="${RUNNER_TEMP}/tampered.onnx" bs=1 seek=0 count=1 conv=notrunc status=none
          if openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
            -in "${RUNNER_TEMP}/tampered.onnx" \
            -sigfile "${PACK_DIR}/modnet-photographic-portrait-matting.onnx.sig"; then
            echo 'Tampered MODNet artifact signature was accepted' >&2
            exit 1
          fi

      - name: Generate and sign staged CANDIDATE manifest
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.MODNET_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          staged_manifest="${RUNNER_TEMP}/portrait-matting.manifest.json"
          python - src/platform/creative/local-ai/models/portrait-matting.manifest.json "${staged_manifest}" <<'PY'
          import json, os, sys
          manifest = json.load(open(sys.argv[1], encoding='utf-8'))
          assert manifest['status'] == 'CANDIDATE'
          assert manifest['upstream']['checkpoint']['sha256'] == os.environ['CHECKPOINT_SHA256']
          assert manifest['bersExport']['onnxSha256'] == os.environ['ONNX_SHA256']
          base = f"https://github.com/giltik123/bers23/releases/download/{os.environ['RELEASE_TAG']}"
          manifest['artifactState'] = 'SIGNED_RELEASE'
          manifest['artifacts']['model'] = {
              'url': f"{base}/modnet-photographic-portrait-matting.onnx",
              'size': int(os.environ['ONNX_SIZE']),
              'sha256': os.environ['ONNX_SHA256'],
              'signatureUrl': f"{base}/modnet-photographic-portrait-matting.onnx.sig",
          }
          manifest['verificationKeyId'] = os.environ['VERIFICATION_KEY_ID']
          manifest['productionApprovalEvidence'] = None
          with open(sys.argv[2], 'w', encoding='utf-8', newline='\n') as stream:
              json.dump(manifest, stream, indent=2)
              stream.write('\n')
          PY
          key_file="${RUNNER_TEMP}/modnet-release-private-key.pem"
          binary_signature="${RUNNER_TEMP}/portrait-matting.manifest.bin.sig"
          install -m 600 /dev/null "${key_file}"
          printf '%s\n' "${RELEASE_PRIVATE_KEY}" > "${key_file}"
          unset RELEASE_PRIVATE_KEY
          openssl pkeyutl -sign -rawin -inkey "${key_file}" -in "${staged_manifest}" -out "${binary_signature}"
          base64 -w 0 "${binary_signature}" > "${RUNNER_TEMP}/portrait-matting.manifest.sig"
          printf '\n' >> "${RUNNER_TEMP}/portrait-matting.manifest.sig"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" \
            -in "${staged_manifest}" -sigfile "${binary_signature}"
          rm -f "${key_file}" "${binary_signature}"

      - name: Run repository trust and bundle gates
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run server:typecheck
          npm run lint
          npm run check:model-weight-tracking
          npm run check:browser-bundle
          test "$(git ls-files '*.ckpt' '*.onnx' | wc -l)" -eq 0
          if git grep -n -I -E -- '^-----BEGIN (ED25519 |EC |RSA |OPENSSH )?PRIVATE KEY-----$'; then
            echo 'Private key material is tracked by Git' >&2
            exit 1
          fi

      - name: Publish candidate release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1
          gh release create "${RELEASE_TAG}" \
            --title 'MODNet Portrait Matting CANDIDATE Pack' \
            --target "${GITHUB_SHA}" \
            --notes 'Signed reproducible MODNet portrait-matting CANDIDATE pack. This is not production approval.'
          gh release upload "${RELEASE_TAG}" \
            "${PACK_DIR}/modnet-photographic-portrait-matting.onnx" \
            "${PACK_DIR}/modnet-photographic-portrait-matting.onnx.sig" \
            "${PACK_DIR}/build-report.json" \
            "${PACK_DIR}/checkpoint-acquisition.json"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | length')" -eq 4

      - name: Re-download and verify published model bytes/signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="${RUNNER_TEMP}/published-modnet"
          mkdir -p "${published}"
          gh release download "${RELEASE_TAG}" --dir "${published}"
          test "$(stat -c%s "${published}/modnet-photographic-portrait-matting.onnx")" = "${ONNX_SIZE}"
          test "$(sha256sum "${published}/modnet-photographic-portrait-matting.onnx" | cut -d' ' -f1)" = "${ONNX_SHA256}"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" \
            -in "${published}/modnet-photographic-portrait-matting.onnx" \
            -sigfile "${published}/modnet-photographic-portrait-matting.onnx.sig"

      - name: Atomically activate signed CANDIDATE metadata on main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          model_dir=src/platform/creative/local-ai/models
          key_dir="${model_dir}/release-keys"
          mkdir -p "${key_dir}"
          cp "${RUNNER_TEMP}/portrait-matting.manifest.json" "${model_dir}/portrait-matting.manifest.json"
          cp "${RUNNER_TEMP}/portrait-matting.manifest.sig" "${model_dir}/portrait-matting.manifest.sig"
          cp "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" "${key_dir}/${VERIFICATION_KEY_ID}.public-key.pem"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${model_dir}/portrait-matting.manifest.json" \
            "${model_dir}/portrait-matting.manifest.sig" \
            "${key_dir}/${VERIFICATION_KEY_ID}.public-key.pem"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'chore: publish signed MODNet portrait-matting CANDIDATE manifest'
          git push origin HEAD:main

      - name: Cleanup orphan release on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag >/dev/null 2>&1 || true

      - name: Publish release summary
        run: |
          {
            echo '## MODNet portrait-matting CANDIDATE release'
            echo
            echo '- Status: CANDIDATE (not production approved)'
            echo "- Upstream revision: \`${UPSTREAM_REVISION}\`"
            echo "- Checkpoint SHA-256: \`${CHECKPOINT_SHA256}\`"
            echo "- Reproduced ONNX SHA-256: \`${ONNX_SHA256}\`"
            echo '- Checkpoint verified before deserialization: PASS'
            echo '- Reproducible ONNX + PyTorch/ORT parity: PASS'
            echo '- Detached model/manifest signatures: PASS; one-byte tamper rejected'
            echo '- Published asset re-download verification: PASS'
            echo '- Real browser/device quality/performance approval: NOT GRANTED by this workflow'
          } >> "${GITHUB_STEP_SUMMARY}"
