name: Real-ESRGAN x4v3 durable candidate release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realesr-general-x4v3-v1.0.0-candidate.1-release
  cancel-in-progress: false

env:
  MODEL_ID: realesr-general-x4v3
  VERSION: 1.0.0-candidate.1
  RELEASE_TAG: realesr-general-x4v3-v1.0.0-candidate.1
  UPSTREAM_REVISION: fa4c8a03ae3dbc9ea6ed471a6ab5da94ac15c2ea
  CHECKPOINT_URL: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
  CHECKPOINT_SIZE: '4885111'
  CHECKPOINT_SHA256: 8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292
  VERIFICATION_KEY_ID: bers-super-resolution-release-2026-08
  PACK_DIR: ${{ github.workspace }}/.release-pack

jobs:
  build-sign-publish-verify:
    name: Build, sign, publish and verify CANDIDATE pack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch and dedicated signing secret
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.REALESRGAN_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = branch
          test "${GITHUB_REF_NAME}" = main
          test -n "${RELEASE_PRIVATE_KEY}"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned export environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.1.2 torchvision==0.16.2
          python -m pip install --disable-pip-version-check \
            basicsr==1.4.2 numpy==1.26.4 onnx==1.15.0 onnxruntime==1.16.3
          python - <<'PY'
          import basicsr, numpy, onnx, onnxruntime, platform, torch, torchvision
          assert platform.python_version().startswith('3.11.')
          assert torch.__version__.split('+')[0] == '2.1.2'
          assert torchvision.__version__.split('+')[0] == '0.16.2'
          assert basicsr.__version__ == '1.4.2'
          assert numpy.__version__ == '1.26.4'
          assert onnx.__version__ == '1.15.0'
          assert onnxruntime.__version__ == '1.16.3'
          PY

      - name: Fetch pinned upstream source and official checkpoint
        run: |
          set -euo pipefail
          git clone https://github.com/xinntao/Real-ESRGAN "${RUNNER_TEMP}/Real-ESRGAN"
          git -C "${RUNNER_TEMP}/Real-ESRGAN" checkout --detach "${UPSTREAM_REVISION}"
          test "$(git -C "${RUNNER_TEMP}/Real-ESRGAN" rev-parse HEAD)" = "${UPSTREAM_REVISION}"
          checkpoint="${RUNNER_TEMP}/realesr-general-x4v3.pth"
          curl --fail --location --retry 3 --output "${checkpoint}" "${CHECKPOINT_URL}"
          test "$(stat -c '%s' "${checkpoint}")" = "${CHECKPOINT_SIZE}"
          echo "${CHECKPOINT_SHA256}  ${checkpoint}" | sha256sum --check --strict

      - name: Reproducibly export and validate ONNX
        run: |
          set -euo pipefail
          mkdir -p "${PACK_DIR}"
          python scripts/build-realesrgan-x4v3-release.py \
            --source "${RUNNER_TEMP}/Real-ESRGAN" \
            --checkpoint "${RUNNER_TEMP}/realesr-general-x4v3.pth" \
            --output "${PACK_DIR}/realesr-general-x4v3.onnx" \
            --metadata "${PACK_DIR}/build-metadata.json"
          test "$(python -c 'import json; print(json.load(open(".release-pack/build-metadata.json"))["status"])')" = CANDIDATE

      - name: Derive release public key and sign model artifact
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.REALESRGAN_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/realesrgan-release-private-key.pem"
          public_key="${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem"
          install -m 600 /dev/null "${key_file}"
          printf '%s\n' "${RELEASE_PRIVATE_KEY}" > "${key_file}"
          unset RELEASE_PRIVATE_KEY
          trap 'rm -f "${key_file}" "${RUNNER_TEMP}/tampered.onnx"' EXIT
          openssl pkey -in "${key_file}" -pubout -out "${public_key}"
          openssl pkeyutl -sign -rawin -inkey "${key_file}" \
            -in "${PACK_DIR}/realesr-general-x4v3.onnx" \
            -out "${PACK_DIR}/realesr-general-x4v3.onnx.sig"
          openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
            -in "${PACK_DIR}/realesr-general-x4v3.onnx" \
            -sigfile "${PACK_DIR}/realesr-general-x4v3.onnx.sig"
          cp "${PACK_DIR}/realesr-general-x4v3.onnx" "${RUNNER_TEMP}/tampered.onnx"
          printf '\001' | dd of="${RUNNER_TEMP}/tampered.onnx" bs=1 seek=0 count=1 conv=notrunc status=none
          if openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
            -in "${RUNNER_TEMP}/tampered.onnx" \
            -sigfile "${PACK_DIR}/realesr-general-x4v3.onnx.sig"; then
            echo 'Tampered Real-ESRGAN artifact signature was accepted' >&2
            exit 1
          fi

      - name: Generate and sign staged CANDIDATE manifest
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.REALESRGAN_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          staged_manifest="${RUNNER_TEMP}/super-resolution.manifest.json"
          python - "${PACK_DIR}/build-metadata.json" "src/platform/creative/local-ai/models/super-resolution.manifest.json" "${staged_manifest}" <<'PY'
          import json, sys
          metadata = json.load(open(sys.argv[1], encoding='utf-8'))
          manifest = json.load(open(sys.argv[2], encoding='utf-8'))
          tag = 'realesr-general-x4v3-v1.0.0-candidate.1'
          base = f'https://github.com/giltik123/bers23/releases/download/{tag}'
          assert manifest['status'] == 'CANDIDATE'
          manifest['artifactState'] = 'SIGNED_RELEASE'
          manifest['artifacts']['model'] = {
              'url': f'{base}/realesr-general-x4v3.onnx',
              'size': metadata['artifact']['size'],
              'sha256': metadata['artifact']['sha256'],
              'signatureUrl': f'{base}/realesr-general-x4v3.onnx.sig',
          }
          manifest['verificationKeyId'] = 'bers-super-resolution-release-2026-08'
          manifest['productionApprovalEvidence'] = None
          manifest['export']['parityTolerance'] = metadata['export']['parityTolerance']
          manifest['export']['parity'] = metadata['export']['parity']
          with open(sys.argv[3], 'w', encoding='utf-8', newline='\n') as stream:
              json.dump(manifest, stream, indent=2)
              stream.write('\n')
          PY
          key_file="${RUNNER_TEMP}/realesrgan-release-private-key.pem"
          install -m 600 /dev/null "${key_file}"
          printf '%s\n' "${RELEASE_PRIVATE_KEY}" > "${key_file}"
          unset RELEASE_PRIVATE_KEY
          binary_signature="${RUNNER_TEMP}/super-resolution.manifest.bin.sig"
          openssl pkeyutl -sign -rawin -inkey "${key_file}" -in "${staged_manifest}" -out "${binary_signature}"
          base64 -w 0 "${binary_signature}" > "${RUNNER_TEMP}/super-resolution.manifest.sig"
          printf '\n' >> "${RUNNER_TEMP}/super-resolution.manifest.sig"
          openssl pkeyutl -verify -rawin -pubin -inkey "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" \
            -in "${staged_manifest}" -sigfile "${binary_signature}"
          rm -f "${key_file}" "${binary_signature}"

      - name: Run repository security gates
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run server:typecheck
          npm run lint
          npm run check:model-weight-tracking
          npm run check:browser-bundle
          test "$(git ls-files '*.onnx' | wc -l)" -eq 0
          test "$(git log --all --format= --name-only -- '*.onnx' | sed '/^$/d' | sort -u | wc -l)" -eq 0
          if git grep -n -I -E -- '^-----BEGIN (ED25519 |EC |RSA |OPENSSH )?PRIVATE KEY-----$'; then
            echo 'Private key material is tracked by Git' >&2
            exit 1
          fi

      - name: Create GitHub Release and upload candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1
          gh release create "${RELEASE_TAG}" --title 'Real-ESRGAN general x4v3 CANDIDATE pack' \
            --target "${GITHUB_SHA}" \
            --notes 'Signed CANDIDATE local super-resolution pack. This is not production approval.'
          gh release upload "${RELEASE_TAG}" \
            "${PACK_DIR}/realesr-general-x4v3.onnx" \
            "${PACK_DIR}/realesr-general-x4v3.onnx.sig" \
            "${PACK_DIR}/build-metadata.json"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | length')" -eq 3

      - name: Re-download and verify published model bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="${RUNNER_TEMP}/published-release"
          mkdir "${published}"
          base="https://github.com/giltik123/bers23/releases/download/${RELEASE_TAG}"
          for asset in realesr-general-x4v3.onnx realesr-general-x4v3.onnx.sig build-metadata.json; do
            curl --fail --location --retry 6 --output "${published}/${asset}" "${base}/${asset}"
          done
          expected_size="$(python -c 'import json; print(json.load(open(".release-pack/build-metadata.json"))["artifact"]["size"])')"
          expected_sha="$(python -c 'import json; print(json.load(open(".release-pack/build-metadata.json"))["artifact"]["sha256"])')"
          test "$(stat -c '%s' "${published}/realesr-general-x4v3.onnx")" = "${expected_size}"
          echo "${expected_sha}  ${published}/realesr-general-x4v3.onnx" | sha256sum --check --strict
          openssl pkeyutl -verify -rawin -pubin -inkey "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" \
            -in "${published}/realesr-general-x4v3.onnx" \
            -sigfile "${published}/realesr-general-x4v3.onnx.sig"

      - name: Atomically activate signed CANDIDATE metadata on main
        run: |
          set -euo pipefail
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "${GITHUB_SHA}"; then
            echo 'main moved after release started; refusing manifest activation' >&2
            exit 1
          fi
          model_dir=src/platform/creative/local-ai/models
          key_dir="${model_dir}/release-keys"
          mkdir -p "${key_dir}"
          cp "${RUNNER_TEMP}/super-resolution.manifest.json" "${model_dir}/super-resolution.manifest.json"
          cp "${RUNNER_TEMP}/super-resolution.manifest.sig" "${model_dir}/super-resolution.manifest.sig"
          cp "${RUNNER_TEMP}/${VERIFICATION_KEY_ID}.public-key.pem" "${key_dir}/${VERIFICATION_KEY_ID}.public-key.pem"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${model_dir}/super-resolution.manifest.json" \
            "${model_dir}/super-resolution.manifest.sig" \
            "${key_dir}/${VERIFICATION_KEY_ID}.public-key.pem"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'chore: publish signed Real-ESRGAN CANDIDATE manifest'
          git push origin HEAD:main

      - name: Publish release summary
        run: |
          {
            echo '## Real-ESRGAN general-x4v3 CANDIDATE release'
            echo
            echo '- Status: CANDIDATE (not PRODUCTION_APPROVED)'
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo '- Official checkpoint size/SHA: PASS before deserialization'
            echo '- PyTorch↔ONNX CPU parity: PASS'
            echo '- Detached model signature: PASS; one-byte tamper rejected'
            echo '- Published model re-download SHA/signature: PASS'
            echo '- Real browser/device quality/performance approval: NOT GRANTED by this workflow'
          } >> "${GITHUB_STEP_SUMMARY}"
