name: Fashion F5a.2 canonical refinement FINAL lineage

on:
  pull_request:
    branches:
      - fashion-f5a1-refinement-support-contract-clean
      - main
  workflow_dispatch:

jobs:
  refinement-final-lineage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fashion_f5a2_refinement_lineage_test
          POSTGRES_USER: fashion_f5a2_refinement_lineage_test
          POSTGRES_PASSWORD: fashion_f5a2_refinement_lineage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fashion_f5a2_refinement_lineage_test -d fashion_f5a2_refinement_lineage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fashion_f5a2_refinement_lineage_test:fashion_f5a2_refinement_lineage_test@127.0.0.1:5432/fashion_f5a2_refinement_lineage_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck build and package F5 lineage migration
        run: |
          npm run typecheck
          npm run server:typecheck
          npm run server:build
          test -f dist-server/migrations/033_fashion_garment_refinement_final_lineage.sql
      - name: Prove aggregate production schema includes F5 lineage foundation
        run: |
          npm run db:migrate:transactions
          npm run db:check:transactions
      - name: Bundle F5a.2 and accepted F4 lineage PostgreSQL proofs
        run: |
          mkdir -p .test-cache/fashion-f5a2-refinement-lineage
          npx esbuild tests/fashion-garment-refinement-final-lineage-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f5a2-refinement-lineage/f5.test.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/fashion-garment-texture-final-lineage-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f5a2-refinement-lineage/f4-regression.test.mjs \
            --external:node:* --external:pg --external:sharp
      - name: Prove transitive F4 parent binding and F4 regression
        run: node --test --test-concurrency=1 .test-cache/fashion-f5a2-refinement-lineage/*.test.mjs
      - name: Prove lineage-only F5 boundary remains closed
        run: |
          grep -q "GARMENT_APPEARANCE_REFINEMENT" server/core/fashion/migrations/033_fashion_garment_refinement_final_lineage.sql
          grep -q "parent_image.producer_operation = 'GARMENT_TEXTURE_COMPOSITE'" server/core/fashion/migrations/033_fashion_garment_refinement_final_lineage.sql
          grep -q "p.current_image_storage_id = parent_image.source_image_storage_id" server/core/fashion/migrations/033_fashion_garment_refinement_final_lineage.sql
          grep -q "parent_image.garment_warp_layer_id = NEW.garment_warp_layer_id" server/core/fashion/migrations/033_fashion_garment_refinement_final_lineage.sql
          grep -q "migrateGarmentAppearanceRefinementFinalLineageSchema" server/transactions/infrastructure/postgres/transactionSchemaCli.ts
          if grep -E "from ['\"].*(providers|billing|fashn|tiny|onnx|diffusion|transformers)" \
            server/core/fashion/garmentAppearanceRefinementFinalLineageSchema.ts; then
            echo "F5a.2 lineage imported runtime/provider authority" >&2
            exit 1
          fi
          if grep -q "GARMENT_APPEARANCE_REFINEMENT" src/platform/creative/deterministic/DeterministicToolRegistry.ts; then
            echo "F5a.2 must not register execution authority" >&2
            exit 1
          fi
          if grep -q "GARMENT_APPEARANCE_REFINEMENT" src/platform/creative/canonical/planning/CanonicalPlanningService.ts; then
            echo "F5a.2 must not add planner admission" >&2
            exit 1
          fi
          grep -q "TRYON_EXECUTION_NOT_WIRED" src/lib/tryon/tryonEngine.js
