name: Stage C3b Automation manual execution binding

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/core/automation/**'
      - 'server/core/workflow/BoundedAgentDeterministicWorkflowService.ts'
      - 'server/core/composition/createProductionCore.ts'
      - 'server/core/http/**automation**'
      - 'server/transactions/infrastructure/postgres/transactionSchemaCli.ts'
      - 'server/index.ts'
      - 'tests/automation-invocation-postgres.test.ts'
      - 'tests/automation-manual-execution-service.test.ts'
      - 'scripts/production-migration-inventory.mjs'
      - '.github/workflows/automation-manual-execution-c3b.yml'
      - '.github/workflows/automation-definition-c3a.yml'
      - '.github/workflows/production-core-migration-image.yml'
      - '.github/workflows/financial-account-foundation-p0a.yml'
      - '.github/workflows/financial-account-free-bootstrap-p0b1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation-invocation-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: automation_c3b_test
          POSTGRES_USER: automation_c3b_test
          POSTGRES_PASSWORD: automation_c3b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation_c3b_test -d automation_c3b_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://automation_c3b_test:automation_c3b_test@127.0.0.1:5432/automation_c3b_test
      TEST_DATABASE_URL: postgresql://automation_c3b_test:automation_c3b_test@127.0.0.1:5432/automation_c3b_test
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Prove global migration sequence reaches immutable Automation invocation binding
        run: |
          node --input-type=module <<'NODE'
          import { loadProductionMigrationInventory } from './scripts/production-migration-inventory.mjs';
          const migrations = await loadProductionMigrationInventory();
          if (migrations.length !== 41) throw new Error(`Expected 41 contiguous migrations, got ${migrations.length}`);
          const expected = [[37,'038_financial_account_foundation.sql'],[38,'039_workflow_continuation_plan_parameters.sql'],[39,'040_automation_definitions.sql'],[40,'041_automation_invocation_bindings.sql']];
          for (const [index, name] of expected) if (migrations[index]?.name !== name) throw new Error(`${name} moved from global migration position ${index + 1}`);
          NODE
      - name: Typecheck Core C3b authority
        run: npm run server:typecheck
      - name: Build Core and package Automation migrations
        run: |
          npm run server:build
          test -f dist-server/migrations/040_automation_definitions.sql
          test -f dist-server/migrations/041_automation_invocation_bindings.sql
      - name: Apply and verify canonical schema CLI
        run: |
          set +e
          npm run db:migrate:transactions
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'C3B_SCHEMA_COLUMNS'
            psql "$DATABASE_URL" -X -P pager=off -c "SELECT column_name,udt_name,is_nullable,column_default,character_maximum_length FROM information_schema.columns WHERE table_schema=current_schema() AND table_name='canonical_automation_invocation_bindings' ORDER BY ordinal_position"
            echo 'C3B_SCHEMA_CONSTRAINTS'
            psql "$DATABASE_URL" -X -P pager=off -c "SELECT conname,contype,convalidated,pg_get_constraintdef(oid) AS definition FROM pg_constraint WHERE conrelid=to_regclass('canonical_automation_invocation_bindings') ORDER BY conname"
            echo 'C3B_SCHEMA_INDEXES'
            psql "$DATABASE_URL" -X -P pager=off -c "SELECT indexname,indexdef FROM pg_indexes WHERE schemaname=current_schema() AND tablename='canonical_automation_invocation_bindings' ORDER BY indexname"
            exit "$status"
          fi
          npm run db:check:transactions
      - name: Prove immutable binding PostgreSQL revision source replay and isolation semantics
        run: |
          mkdir -p .test-cache/automation-c3b
          npx esbuild tests/automation-invocation-postgres.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/automation-c3b/automation-invocation-postgres.test.mjs --external:pg --external:sharp --external:node:*
          node --test .test-cache/automation-c3b/automation-invocation-postgres.test.mjs
      - name: Prove Automation delegates immutable binding into existing bounded Agent only
        run: |
          mkdir -p .test-cache/automation-c3b
          npx esbuild tests/automation-manual-execution-service.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/automation-c3b/automation-manual-execution-service.test.mjs --external:node:*
          node --test .test-cache/automation-c3b/automation-manual-execution-service.test.mjs
      - name: Preserve C3 authority separation and preview-only Studio
        run: |
          set -euo pipefail
          grep -q 'AUTOMATION_EXECUTION_NOT_WIRED' src/lib/automation/AutomationRunner.js
          ! grep -q 'automationRunner.run' src/pages/AutomationStudio.jsx
          grep -q 'WorkflowContinuation + ExecutionRun remain the sole execution-state authorities' server/core/automation/AutomationManualExecutionService.ts
          ! grep -E -q 'provider|model|credits|billing|ticket_id|execution_id|run_status' server/core/automation/migrations/041_automation_invocation_bindings.sql
          ! grep -E -q 'providerSelector|billing|creditsWallet|ExecutionRunRegistry|PostgresWorkflowContinuationStore' server/core/automation/PostgresAutomationInvocationStore.ts server/core/automation/AutomationManualExecutionService.ts
          grep -q 'FOR UPDATE' server/core/automation/PostgresAutomationInvocationStore.ts
          grep -q 'FOR SHARE' server/core/automation/PostgresAutomationInvocationStore.ts
          grep -q 'automation-agent-v1-' server/core/automation/PostgresAutomationInvocationStore.ts
      - name: Check committed diff whitespace
        run: git diff --check "$BASE_SHA"..HEAD
