name: Fashion F4b.5b production texture-composite authority

on:
  push:
    branches: [ "fashion-production-texture-composite-f4b5b2" ]
  pull_request:
    branches: [ "main", "fashion-garment-texture-final-lineage-f4b5b1-clean" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texture-composite-authority-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core authority substrate
        run: |
          npm run typecheck
          npm run server:typecheck
          npm run server:build
      - name: Bundle evidence, delivery, browser, submission, production admission and HTTP acceptance
        run: |
          mkdir -p .test-cache/fashion-f4b5b-authority
          npx esbuild tests/garment-texture-composite-evidence-authority.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f4b5b-authority/evidence.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-texture-composite-input-delivery.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f4b5b-authority/delivery.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-texture-composite-browser-executor.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f4b5b-authority/browser.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-texture-composite-submission-authority.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f4b5b-authority/submission.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-texture-composite-production-admission.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f4b5b-authority/production-admission.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-texture-composite-http-adapter.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f4b5b-authority/http.mjs \
            --external:node:* --external:pg --external:sharp
      - name: Prove immutable F4b.4 evidence is transitively revalidated before continuation
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b5b-authority/evidence.mjs
      - name: Prove BERSGTC1 envelope and delivery fail closed on scope, expiry and lineage drift
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b5b-authority/delivery.mjs
      - name: Prove browser executes only Core ticket and purpose-bound envelope
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b5b-authority/browser.mjs
      - name: Prove Core recompute, verification-before-persist, claim release and replay
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b5b-authority/submission.mjs
      - name: Prove production prepare is registry-bound, LOCAL_ONLY, zero-cloud and lineage-exact
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b5b-authority/production-admission.mjs
      - name: Prove capability-specific HTTP transport is authority-minimal and fail-closed
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b5b-authority/http.mjs
      - name: Prove production admission is exact while provider and Try-On authority remain closed
        run: |
          grep -q "PRODUCTION_ADMISSION = 'ADMITTED'" src/platform/creative/deterministic/GarmentTextureCompositeIdentity.js
          grep -q "GARMENT_TEXTURE_COMPOSITE_TOOL_DEFINITION" src/platform/creative/deterministic/DeterministicToolRegistry.ts
          grep -q "GARMENT_TEXTURE_COMPOSITE_CAPABILITY" server/core/localExecution/productionLocalExecutorPolicy.ts
          grep -q "GARMENT_TEXTURE_COMPOSITE_CAPABILITY" server/core/providers/productionExecutionCapabilities.ts
          grep -q "GARMENT_TEXTURE_COMPOSITE_OPERATION" server/core/providers/productionExecutionRoute.ts
          grep -q "GARMENT_TEXTURE_COMPOSITE_OPERATION" server/core/providers/productionTargetSelection.ts
          grep -q "garmentTextureComposite: garmentMeshWarp.textureComposite.execution" server/core/composition/createProductionCore.ts
          grep -q "local-execution/garment-texture-composite" server/index.ts
          grep -q "prepareGarmentTextureComposite" src/api/coreClient.js
          ! grep -E 'garment-texture-composite|GARMENT_TEXTURE_COMPOSITE' server/core/providers/productionProviderSelection.ts
          ! grep -E 'garment-texture-composite|GARMENT_TEXTURE_COMPOSITE' server/core/providers/falWorkflowRuntime.ts
          grep -q "TRYON_EXECUTION_NOT_WIRED" src/lib/tryon/tryonEngine.js
          ! grep -E 'garment-texture-composite|GARMENT_TEXTURE_COMPOSITE' src/lib/tryon/tryonEngine.js
