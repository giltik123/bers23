name: Sprint 6.41C5B local composite acceptance

on:
  pull_request:
    paths:
      - 'src/api/coreClient.js'
      - 'src/platform/creative/canonical/**'
      - 'server/core/providers/**'
      - 'server/core/workflow/**'
      - 'server/core/localExecution/**'
      - 'server/core/http/**'
      - 'server/core/composition/**'
      - 'server/core/artifacts/**'
      - 'scripts/test-local-composite-browser-reconnect.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sprint-6.41c5b-local-composite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5b-local-composite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-replay-and-sequencing-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: c5b_test
          POSTGRES_USER: c5b_test
          POSTGRES_PASSWORD: c5b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c5b_test -d c5b_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://c5b_test:c5b_test@127.0.0.1:5432/c5b_test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Typecheck browser and shared canonical contracts
        run: npm run typecheck
      - name: Typecheck Core server
        run: npm run server:typecheck
      - name: Prove narrow C5B planner semantics and broad-composite isolation
        run: npm run test:creative-planning-v2
      - name: Prove exact purpose-bound production capability routing
        run: node --experimental-strip-types --test server/core/providers/productionOnDeviceRoute.test.mjs
      - name: Prove capability aliases preserve existing model and executor trust authority
        run: node --experimental-strip-types --test server/core/localExecution/localCompositeCapabilityPolicy.test.mjs server/core/localExecution/productionLocalModelPolicy.test.mjs
      - name: Prove ticket-first sequencing, output quarantine and authenticated HTTP authority
        run: node --experimental-strip-types --test server/core/workflow/LocalCompositeContinuationService.test.mjs server/core/workflow/LocalCompositeOutputUploadService.test.mjs server/core/http/localCompositeContinuationHttpAdapter.test.mjs
      - name: Prove in-memory and standalone segmentation obey exact replay identity
        run: |
          mkdir -p .test-cache/c5b-replay
          npx esbuild tests/local-segmentation-finalization-retry.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/c5b-replay/local-segmentation-finalization-retry.mjs --external:node:* --external:sharp
          node --test .test-cache/c5b-replay/local-segmentation-finalization-retry.mjs
      - name: Apply exact local-execution replay authority schemas
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { Pool } from 'pg';
          const pool = new Pool({ connectionString: process.env.DATABASE_URL, application_name: 'bers-c5b-schema' });
          try {
            for (const path of [
              'server/core/artifacts/migrations/002_canonical_mask_artifacts.sql',
              'server/core/artifacts/migrations/012_local_execution_uploads.sql',
              'server/core/artifacts/migrations/013_local_execution_ticket_ledger.sql',
              'server/core/artifacts/migrations/016_local_execution_result_replay_binding.sql',
            ]) await pool.query(await readFile(path, 'utf8'));
          } finally { await pool.end(); }
          NODE
      - name: Prove schema repair includes durable result fingerprint authority
        env:
          LOCAL_EXECUTION_SCHEMA_TEST: '1'
        run: node --experimental-strip-types --test server/core/localExecution/localExecutionLedgerSchema.integration.test.mjs
      - name: Prove v1 and v2 exact replay versus conflicting replay across Core restart
        run: node --experimental-strip-types --test server/core/localExecution/PostgresLocalExecutionLedger.integration.test.mjs server/core/localExecution/PostgresLocalExecutionLedgerV2.integration.test.mjs
      - name: Prove standalone and composite PostgreSQL local execution verticals
        run: |
          mkdir -p .test-cache/c5b-postgres/migrations .test-cache/artifacts/migrations
          npx esbuild tests/background-isolation-postgres-vertical.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/c5b-postgres/background-isolation-postgres-vertical.test.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/local-composite-postgres-vertical.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/c5b-postgres/local-composite-postgres-vertical.test.mjs \
            --external:node:* --external:pg --external:sharp
          cp server/transactions/infrastructure/postgres/migrations/001_transaction_store.sql .test-cache/c5b-postgres/migrations/
          cp server/core/artifacts/migrations/002_canonical_mask_artifacts.sql .test-cache/c5b-postgres/migrations/
          cp server/core/artifacts/migrations/003_canonical_final_image_artifacts.sql .test-cache/c5b-postgres/migrations/
          cp server/core/projects/migrations/004_canonical_projects_and_originals.sql .test-cache/c5b-postgres/migrations/
          cp server/core/projects/migrations/005_canonical_project_history_versions.sql .test-cache/c5b-postgres/migrations/
          cp server/core/projects/migrations/006_project_history_acceptance_hardening.sql .test-cache/c5b-postgres/migrations/
          cp server/core/projects/migrations/007_project_history_source_lineage.sql .test-cache/c5b-postgres/migrations/
          cp server/core/auth/migrations/008_canonical_auth_identity_sessions.sql .test-cache/c5b-postgres/migrations/
          cp server/core/auth/migrations/009_auth_lifecycle_oauth.sql .test-cache/c5b-postgres/migrations/
          cp server/core/auth/migrations/010_registration_attempt_binding.sql .test-cache/c5b-postgres/migrations/
          cp server/core/auth/migrations/011_auth_abuse_session_controls.sql .test-cache/c5b-postgres/migrations/
          cp server/core/artifacts/migrations/012_local_execution_uploads.sql .test-cache/c5b-postgres/migrations/
          cp server/core/artifacts/migrations/014_canonical_mask_lineage.sql .test-cache/c5b-postgres/migrations/
          cp server/core/artifacts/migrations/017_local_segmentation_mask_lineage.sql .test-cache/c5b-postgres/migrations/
          cp server/core/artifacts/migrations/018_canonical_final_image_lineage.sql .test-cache/c5b-postgres/migrations/
          cp server/core/artifacts/migrations/013_local_execution_ticket_ledger.sql .test-cache/artifacts/migrations/
          cp server/core/artifacts/migrations/015_workflow_continuations.sql .test-cache/artifacts/migrations/
          cp server/core/artifacts/migrations/016_local_execution_result_replay_binding.sql .test-cache/artifacts/migrations/
          node --test .test-cache/c5b-postgres/background-isolation-postgres-vertical.test.mjs
          node --test .test-cache/c5b-postgres/local-composite-postgres-vertical.test.mjs
      - name: Prove real Chrome refresh + Core restart continuation recovery
        run: |
          mkdir -p .test-cache/c5b-browser/migrations .test-cache/artifacts/migrations
          npx esbuild scripts/test-local-composite-browser-reconnect.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/c5b-browser/test-local-composite-browser-reconnect.mjs \
            --external:node:* --external:pg --external:sharp --external:playwright --external:vite
          cp server/transactions/infrastructure/postgres/migrations/001_transaction_store.sql .test-cache/c5b-browser/migrations/
          cp server/core/artifacts/migrations/002_canonical_mask_artifacts.sql .test-cache/c5b-browser/migrations/
          cp server/core/artifacts/migrations/003_canonical_final_image_artifacts.sql .test-cache/c5b-browser/migrations/
          cp server/core/projects/migrations/004_canonical_projects_and_originals.sql .test-cache/c5b-browser/migrations/
          cp server/core/projects/migrations/005_canonical_project_history_versions.sql .test-cache/c5b-browser/migrations/
          cp server/core/projects/migrations/006_project_history_acceptance_hardening.sql .test-cache/c5b-browser/migrations/
          cp server/core/projects/migrations/007_project_history_source_lineage.sql .test-cache/c5b-browser/migrations/
          cp server/core/auth/migrations/008_canonical_auth_identity_sessions.sql .test-cache/c5b-browser/migrations/
          cp server/core/auth/migrations/009_auth_lifecycle_oauth.sql .test-cache/c5b-browser/migrations/
          cp server/core/auth/migrations/010_registration_attempt_binding.sql .test-cache/c5b-browser/migrations/
          cp server/core/auth/migrations/011_auth_abuse_session_controls.sql .test-cache/c5b-browser/migrations/
          cp server/core/artifacts/migrations/012_local_execution_uploads.sql .test-cache/c5b-browser/migrations/
          cp server/core/artifacts/migrations/014_canonical_mask_lineage.sql .test-cache/c5b-browser/migrations/
          cp server/core/artifacts/migrations/017_local_segmentation_mask_lineage.sql .test-cache/c5b-browser/migrations/
          cp server/core/artifacts/migrations/018_canonical_final_image_lineage.sql .test-cache/c5b-browser/migrations/
          cp server/core/artifacts/migrations/013_local_execution_ticket_ledger.sql .test-cache/artifacts/migrations/
          cp server/core/artifacts/migrations/015_workflow_continuations.sql .test-cache/artifacts/migrations/
          cp server/core/artifacts/migrations/016_local_execution_result_replay_binding.sql .test-cache/artifacts/migrations/
          node .test-cache/c5b-browser/test-local-composite-browser-reconnect.mjs
      - name: Prove LOCAL_SEGMENTATION MASK lineage survives independent Core stores
        run: node --experimental-strip-types --test server/core/artifacts/postgresMaskArtifactStore.localExecution.integration.test.mjs
      - name: Prove BACKGROUND_ISOLATION FINAL lineage survives independent Core stores
        run: node --experimental-strip-types --test server/core/artifacts/postgresImageArtifactStore.backgroundIsolationLineage.integration.test.mjs
      - name: Prove durable Artifact resolver reconstructs exact lineage after Core restart
        run: node --experimental-strip-types --test server/core/artifacts/durableArtifactLineageResolver.integration.test.mjs
      - name: Preserve CANDIDATE MobileSAM while requiring authenticated composite server wiring
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('src/platform/creative/local-ai/models/interactive-segmentation.manifest.json', 'utf8'));
          const server = await readFile('server/index.ts', 'utf8');
          const productionCore = await readFile('server/core/composition/createProductionCore.ts', 'utf8');
          if (manifest.status !== 'CANDIDATE') throw new Error(`C5B must not change MobileSAM release state; found ${manifest.status}`);
          if (!server.includes("startsWith('/api/core/composite-continuations/')")) throw new Error('Accepted transport slice must wire the composite continuation route in the Core server');
          if (!server.includes('createLocalCompositeContinuationHttpAdapter') || !server.includes('LocalCompositeOutputUploadService')) throw new Error('Composite route must use the authenticated adapter and Core-selected output authority');
          if (productionCore.includes('localCompositeContinuationEnabled: true')) throw new Error('Composite HTTP transport must not globally enable local composite planning');
          console.log('C5B authenticated server transport wired without MobileSAM promotion: PASS');
          NODE
