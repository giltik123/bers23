name: Sprint 6.41C5B local composite acceptance

on:
  pull_request:
    paths:
      - 'src/platform/creative/canonical/**'
      - 'server/core/providers/**'
      - 'server/core/workflow/**'
      - 'server/core/localExecution/**'
      - 'server/core/http/**'
      - 'server/core/composition/**'
      - 'server/core/artifacts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sprint-6.41c5b-local-composite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5b-local-composite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-replay-and-sequencing-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: c5b_test
          POSTGRES_USER: c5b_test
          POSTGRES_PASSWORD: c5b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c5b_test -d c5b_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://c5b_test:c5b_test@127.0.0.1:5432/c5b_test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Typecheck browser and shared canonical contracts
        run: npm run typecheck
      - name: Typecheck Core server
        run: npm run server:typecheck
      - name: Prove narrow C5B planner semantics and broad-composite isolation
        run: npm run test:creative-planning-v2
      - name: Prove exact purpose-bound production capability routing
        run: node --experimental-strip-types --test server/core/providers/productionOnDeviceRoute.test.mjs
      - name: Prove capability aliases preserve existing model and executor trust authority
        run: node --experimental-strip-types --test server/core/localExecution/localCompositeCapabilityPolicy.test.mjs server/core/localExecution/productionLocalModelPolicy.test.mjs
      - name: Prove ticket-first crash recovery and server-owned step sequencing
        run: node --experimental-strip-types --test server/core/workflow/LocalCompositeContinuationService.test.mjs
      - name: Prove in-memory and standalone segmentation obey exact replay identity
        run: |
          mkdir -p .test-cache/c5b-replay
          npx esbuild tests/local-segmentation-finalization-retry.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/c5b-replay/local-segmentation-finalization-retry.mjs --external:node:* --external:sharp
          node --test .test-cache/c5b-replay/local-segmentation-finalization-retry.mjs
      - name: Apply exact local-execution replay authority schemas
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { Pool } from 'pg';
          const pool = new Pool({ connectionString: process.env.DATABASE_URL, application_name: 'bers-c5b-schema' });
          try {
            for (const path of [
              'server/core/artifacts/migrations/002_canonical_mask_artifacts.sql',
              'server/core/artifacts/migrations/012_local_execution_uploads.sql',
              'server/core/artifacts/migrations/013_local_execution_ticket_ledger.sql',
              'server/core/artifacts/migrations/016_local_execution_result_replay_binding.sql',
            ]) await pool.query(await readFile(path, 'utf8'));
          } finally { await pool.end(); }
          NODE
      - name: Prove schema repair includes durable result fingerprint authority
        env:
          LOCAL_EXECUTION_SCHEMA_TEST: '1'
        run: node --experimental-strip-types --test server/core/localExecution/localExecutionLedgerSchema.integration.test.mjs
      - name: Prove v1 and v2 exact replay versus conflicting replay across Core restart
        run: node --experimental-strip-types --test server/core/localExecution/PostgresLocalExecutionLedger.integration.test.mjs server/core/localExecution/PostgresLocalExecutionLedgerV2.integration.test.mjs
      - name: Prove standalone Background Isolation keeps PostgreSQL pixel, lineage, restart and zero-cloud authority
        run: node --experimental-strip-types --test tests/background-isolation-postgres-vertical.test.ts
      - name: Prove LOCAL_SEGMENTATION MASK lineage survives independent Core stores
        run: node --experimental-strip-types --test server/core/artifacts/postgresMaskArtifactStore.localExecution.integration.test.mjs
      - name: Preserve CANDIDATE MobileSAM and no-public-composite boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('src/platform/creative/local-ai/models/interactive-segmentation.manifest.json', 'utf8'));
          const server = await readFile('server/index.ts', 'utf8');
          const productionCore = await readFile('server/core/composition/createProductionCore.ts', 'utf8');
          if (manifest.status !== 'CANDIDATE') throw new Error(`C5B must not change MobileSAM release state; found ${manifest.status}`);
          if (server.includes('/api/core/composite-continuations/')) throw new Error('Sequencing slice must not expose a public composite HTTP route');
          if (productionCore.includes('localCompositeContinuationEnabled: true')) throw new Error('Sequencing slice must not globally enable local composite planning');
          console.log('C5B internal sequencing authority boundary: PASS');
          NODE
