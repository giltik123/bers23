name: Fashion F2c Wardrobe and Collection browser clients

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/fashion-wardrobe-collection-browser-clients-f2c.yml"
      - "src/api/coreClient.js"
      - "src/api/managedWardrobeClient.js"
      - "src/api/managedGarmentCollectionClient.js"
      - "server/core/fashion/postgresGarmentWardrobeStore.ts"
      - "server/core/http/managedWardrobeHttpAdapter.ts"
      - "server/core/http/managedGarmentCollectionHttpAdapter.ts"
      - "tests/managed-wardrobe-browser-client.test.mjs"
      - "tests/managed-garment-collection-browser-client.test.mjs"
      - "tests/managed-fashion-browser-server-contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-fashion-clients:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Syntax-check canonical browser adapters
        run: |
          node --check src/api/managedWardrobeClient.js
          node --check src/api/managedGarmentCollectionClient.js
      - name: Prove canonical Wardrobe, Collection and server contracts
        run: |
          node --test tests/managed-wardrobe-browser-client.test.mjs
          node --test tests/managed-garment-collection-browser-client.test.mjs
          node --test tests/managed-fashion-browser-server-contract.test.mjs
      - name: Reject legacy authority and prove Core integration
        run: |
          set -euo pipefail
          for file in src/api/managedWardrobeClient.js src/api/managedGarmentCollectionClient.js; do
            ! grep -q 'fetch(' "$file"
            ! grep -q 'coreClient.entities' "$file"
            ! grep -E -q 'FASHN|provider|Billing|cloud' "$file"
          done
          ! grep -q 'wardrobeManager' src/api/managedWardrobeClient.js
          ! grep -q 'garmentManager' src/api/managedWardrobeClient.js
          grep -q 'X-Expected-Garment-Revision' src/api/managedWardrobeClient.js
          grep -q 'X-Expected-Source-Collection-Revision' src/api/managedGarmentCollectionClient.js
          grep -q 'X-Expected-Target-Collection-Revision' src/api/managedGarmentCollectionClient.js
          grep -q "import { createManagedWardrobeClient } from './managedWardrobeClient.js';" src/api/coreClient.js
          grep -q "import { createManagedGarmentCollectionClient } from './managedGarmentCollectionClient.js';" src/api/coreClient.js
          grep -q 'wardrobe: createManagedWardrobeClient(request)' src/api/coreClient.js
          grep -q 'collections: createManagedGarmentCollectionClient(request)' src/api/coreClient.js
      - name: Check committed candidate whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ]; then
            git diff --check "${BASE_SHA}..HEAD"
          else
            git diff --check "HEAD^..HEAD"
          fi
