name: HSME-2b1.4 teacher roster refresh

on:
  pull_request:
    paths:
      - 'src/platform/creative/local-ai/hsme/HsmeTeacherDecisionRosterRefreshV1.ts'
      - 'src/platform/creative/local-ai/hsme/HsmeTeacherQualityBakeoffAssemblyV1.ts'
      - 'tests/creative-hsme-teacher-roster-refresh-v1.test.mjs'
      - '.github/workflows/hsme-2b1-4-teacher-roster-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roster-refresh-contract:
    name: evidence-bound unresolved teacher roster refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Compile and run roster-refresh vertical
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2b1-4-roster
          npx esbuild tests/creative-hsme-teacher-roster-refresh-v1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2b1-4-roster/roster-refresh.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2b1-4-roster/roster-refresh.test.mjs

      - name: Prove roster refresh cannot admit or select a teacher
        run: |
          set -euo pipefail
          CONTRACT=src/platform/creative/local-ai/hsme/HsmeTeacherDecisionRosterRefreshV1.ts
          grep -F "decisionStatus:'REDESIGN_REQUIRED'" "$CONTRACT"
          grep -F "licenseConclusion:'REVIEW_REQUIRED'" "$CONTRACT"
          grep -F "distillationOutputUse:'REVIEW_REQUIRED'" "$CONTRACT"
          grep -F "workingMemoryBytes:'UNKNOWN'" "$CONTRACT"
          grep -F "selectedCandidateIds:[]" "$CONTRACT"
          grep -F "teacherSelectionAllowed:false" "$CONTRACT"
          grep -F "teacherAdmissionAllowed:false" "$CONTRACT"
          grep -F "trainingStartAllowed:false" "$CONTRACT"
          grep -F "productionAuthorityGranted:false" "$CONTRACT"
          grep -F "providerAuthorityGranted:false" "$CONTRACT"
          grep -F "billingAuthorityGranted:false" "$CONTRACT"
          grep -F "projectArtifactMutationAllowed:false" "$CONTRACT"
          grep -F "aeeExecutionAuthorityGranted:false" "$CONTRACT"
          grep -F "durableModelFleetPromotionAllowed:false" "$CONTRACT"
          ! grep -nE "TEACHER_SET_ADMITTED|startTraining|runTraining|from_pretrained|torch\.load|pickle\.load|safe_open|ModelFleet(Service|Client)|promoteModel|installModel|downloadModel" "$CONTRACT"
