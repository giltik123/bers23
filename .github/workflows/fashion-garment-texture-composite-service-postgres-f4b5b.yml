name: Fashion F4b.5b PostgreSQL texture-composite vertical

on:
  push:
    branches: [ "fashion-production-texture-composite-f4b5b2" ]
  pull_request:
    branches: [ "main", "fashion-garment-texture-final-lineage-f4b5b1-clean" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_fashion_execution_relevance:
    name: classify-fashion-execution-relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Classify F4b.5b PostgreSQL relevance from trusted base
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            test "${EVENT_NAME}" = "push" -o "${EVENT_NAME}" = "workflow_dispatch"
            printf '%s\n' 'relevant=true' 'classification=RELEVANT_FASHION_EXECUTION_ACCEPTANCE_REQUIRED' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          TRUSTED_DIR="${RUNNER_TEMP}/fashion-execution-f4b5b-postgres-base"
          rm -rf "${TRUSTED_DIR}"
          mkdir -p "${TRUSTED_DIR}"
          trap 'rm -rf "${TRUSTED_DIR}"' EXIT
          git show "${BASE_SHA}:scripts/classify-fashion-execution-ci.mjs" > "${TRUSTED_DIR}/classify-fashion-execution-ci.mjs"
          git show "${BASE_SHA}:scripts/f4b5b-postgres-ci-closure.json" > "${TRUSTED_DIR}/f4b5b-postgres-ci-closure.json"
          test -s "${TRUSTED_DIR}/classify-fashion-execution-ci.mjs"
          test -s "${TRUSTED_DIR}/f4b5b-postgres-ci-closure.json"
          test "$(wc -c < "${TRUSTED_DIR}/classify-fashion-execution-ci.mjs")" -le 1048576
          test "$(wc -c < "${TRUSTED_DIR}/f4b5b-postgres-ci-closure.json")" -le 1048576
          git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" \
            | node "${TRUSTED_DIR}/classify-fashion-execution-ci.mjs" --profile F4B5B_TEXTURE_POSTGRES_VERTICAL --stdin0 --github-output "${GITHUB_OUTPUT}"
      - name: Prove Fashion execution workflow trust envelope
        run: node --test tests/fashion-execution-ci-workflow-trust.test.mjs
      - name: Install pinned PostgreSQL closure proof dependencies when relevant
        if: ${{ steps.classify.outputs.relevant == 'true' }}
        run: npm ci
      - name: Prove exact HEAD PostgreSQL bundle and migration closure when relevant
        if: ${{ steps.classify.outputs.relevant == 'true' }}
        run: node --test tests/fashion-f4b5b-postgres-ci-relevance.test.mjs

  heavy_texture_composite_postgres:
    name: texture-composite-postgres-heavy
    needs: classify_fashion_execution_relevance
    if: ${{ needs.classify_fashion_execution_relevance.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fashion_f4b5b_service_test
          POSTGRES_USER: fashion_f4b5b_service_test
          POSTGRES_PASSWORD: fashion_f4b5b_service_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashion_f4b5b_service_test -d fashion_f4b5b_service_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fashion_f4b5b_service_test:fashion_f4b5b_service_test@127.0.0.1:5432/fashion_f4b5b_service_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck F4b.5b source contracts without global build or migration packaging
        run: |
          npm run typecheck
          npm run server:typecheck
          test -f server/core/fashion/migrations/029_fashion_garment_warp_layers.sql
          test -f server/core/fashion/migrations/030_fashion_garment_texture_final_lineage.sql
      - name: Prove bundle-derived production migration closure tooling
        run: node --test tests/bundle-migration-pack.test.mjs
      - name: Bundle PostgreSQL F4b.5b submission vertical and stage only its migration closure
        run: |
          set -euo pipefail
          runtime=.test-cache/fashion-f4b5b-service-postgres
          artifact_runtime=.test-cache/artifacts/migrations
          mkdir -p "$runtime"
          npx esbuild tests/garment-texture-composite-service-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile="$runtime/service.mjs" \
            --metafile="$runtime/service.meta.json" \
            --external:node:* --external:pg --external:sharp
          node scripts/stage-bundle-migrations.mjs \
            --metafile "$runtime/service.meta.json" \
            --destination "$runtime/migrations" \
            --destination "$artifact_runtime" \
            --summary "$runtime/migration-pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const summary = JSON.parse(await readFile('.test-cache/fashion-f4b5b-service-postgres/migration-pack.json', 'utf8'));
          const names = new Set(summary.migrations.map(migration => migration.name));
          for (const required of [
            '003_canonical_final_image_artifacts.sql',
            '004_canonical_projects_and_originals.sql',
            '012_local_execution_uploads.sql',
            '013_local_execution_ticket_ledger.sql',
            '016_local_execution_result_replay_binding.sql',
            '022_managed_garments_and_initial_views.sql',
            '028_project_body_anchor_sets.sql',
            '029_fashion_garment_warp_layers.sql',
            '030_fashion_garment_texture_final_lineage.sql',
          ]) assert.ok(names.has(required), `missing required F4b.5b migration ${required}`);
          assert.equal(names.has('032_fashion_garment_refinement_final_lineage.sql'), false, 'F5 refinement migration escaped into F4b.5b pack');
          assert.equal(summary.destinations.length, 2);
          console.log(`F4B5B_POSTGRES_BUNDLE_INPUTS=${summary.inputCount}`);
          console.log(`F4B5B_POSTGRES_MIGRATIONS=${summary.migrationCount}`);
          console.log(`F4B5B_POSTGRES_MIGRATION_NAMES=${[...names].join(',')}`);
          NODE
      - name: Prove claim race, immutable rejected COMPOSITE, fresh-ticket correction, exact FINAL lineage and restart replay
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b5b-service-postgres/service.mjs
      - name: Assert admitted production path remains local-only and Try-On stays unwired
        run: |
          grep -q "PRODUCTION_ADMISSION = 'ADMITTED'" src/platform/creative/deterministic/GarmentTextureCompositeIdentity.js
          grep -q "GARMENT_TEXTURE_COMPOSITE_CAPABILITY" server/core/localExecution/productionLocalExecutorPolicy.ts
          grep -q "GARMENT_TEXTURE_COMPOSITE_CAPABILITY" server/core/providers/productionExecutionCapabilities.ts
          grep -q "GARMENT_TEXTURE_COMPOSITE_OPERATION" server/core/providers/productionExecutionRoute.ts
          grep -q "GARMENT_TEXTURE_COMPOSITE_OPERATION" server/core/providers/productionTargetSelection.ts
          ! grep -E 'garment-texture-composite|GARMENT_TEXTURE_COMPOSITE' server/core/providers/productionProviderSelection.ts
          grep -q "TRYON_EXECUTION_NOT_WIRED" src/lib/tryon/tryonEngine.js
          ! grep -E 'garment-texture-composite|GARMENT_TEXTURE_COMPOSITE' src/lib/tryon/tryonEngine.js

  texture-composite-postgres:
    name: texture-composite-postgres
    needs: [classify_fashion_execution_relevance, heavy_texture_composite_postgres]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require F4b.5b PostgreSQL acceptance exactly when the trusted closure is relevant
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_fashion_execution_relevance.result }}
          RELEVANT: ${{ needs.classify_fashion_execution_relevance.outputs.relevant }}
          CLASSIFICATION: ${{ needs.classify_fashion_execution_relevance.outputs.classification }}
          HEAVY_RESULT: ${{ needs.heavy_texture_composite_postgres.result }}
        run: |
          set -euo pipefail
          test "${CLASSIFIER_RESULT}" = "success"
          if [ "${RELEVANT}" = "true" ]; then
            test "${CLASSIFICATION}" = "RELEVANT_FASHION_EXECUTION_ACCEPTANCE_REQUIRED"
            test "${HEAVY_RESULT}" = "success"
            exit 0
          fi
          test "${RELEVANT}" = "false"
          test "${CLASSIFICATION}" = "NOT_APPLICABLE_NON_FASHION_EXECUTION_CHANGE"
          test "${HEAVY_RESULT}" = "skipped"
