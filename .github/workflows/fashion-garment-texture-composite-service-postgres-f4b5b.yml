name: Fashion F4b.5b PostgreSQL texture-composite vertical

on:
  push:
    branches: [ "fashion-production-texture-composite-f4b5b2" ]
  pull_request:
    branches: [ "main", "fashion-garment-texture-final-lineage-f4b5b1-clean" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texture-composite-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fashion_f4b5b_service_test
          POSTGRES_USER: fashion_f4b5b_service_test
          POSTGRES_PASSWORD: fashion_f4b5b_service_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashion_f4b5b_service_test -d fashion_f4b5b_service_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fashion_f4b5b_service_test:fashion_f4b5b_service_test@127.0.0.1:5432/fashion_f4b5b_service_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck F4b.5b source contracts without global build or migration packaging
        run: |
          npm run typecheck
          npm run server:typecheck
          test -f server/core/fashion/migrations/029_fashion_garment_warp_layers.sql
          test -f server/core/fashion/migrations/030_fashion_garment_texture_final_lineage.sql
      - name: Prove bundle-derived production migration closure tooling
        run: node --test tests/bundle-migration-pack.test.mjs
      - name: Bundle PostgreSQL F4b.5b submission vertical and stage only its migration closure
        run: |
          set -euo pipefail
          runtime=.test-cache/fashion-f4b5b-service-postgres
          artifact_runtime=.test-cache/artifacts/migrations
          mkdir -p "$runtime"
          npx esbuild tests/garment-texture-composite-service-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile="$runtime/service.mjs" \
            --metafile="$runtime/service.meta.json" \
            --external:node:* --external:pg --external:sharp
          node scripts/stage-bundle-migrations.mjs \
            --metafile "$runtime/service.meta.json" \
            --destination "$runtime/migrations" \
            --destination "$artifact_runtime" \
            --summary "$runtime/migration-pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const summary = JSON.parse(await readFile('.test-cache/fashion-f4b5b-service-postgres/migration-pack.json', 'utf8'));
          const names = new Set(summary.migrations.map(migration => migration.name));
          for (const required of [
            '003_canonical_final_image_artifacts.sql',
            '004_canonical_projects_and_originals.sql',
            '012_local_execution_uploads.sql',
            '013_local_execution_ticket_ledger.sql',
            '016_local_execution_result_replay_binding.sql',
            '022_managed_garments_and_initial_views.sql',
            '028_project_body_anchor_sets.sql',
            '029_fashion_garment_warp_layers.sql',
            '030_fashion_garment_texture_final_lineage.sql',
          ]) assert.ok(names.has(required), `missing required F4b.5b migration ${required}`);
          assert.equal(names.has('032_fashion_garment_refinement_final_lineage.sql'), false, 'F5 refinement migration escaped into F4b.5b pack');
          assert.equal(summary.destinations.length, 2);
          console.log(`F4B5B_POSTGRES_BUNDLE_INPUTS=${summary.inputCount}`);
          console.log(`F4B5B_POSTGRES_MIGRATIONS=${summary.migrationCount}`);
          console.log(`F4B5B_POSTGRES_MIGRATION_NAMES=${[...names].join(',')}`);
          NODE
      - name: Prove claim race, immutable rejected COMPOSITE, fresh-ticket correction, exact FINAL lineage and restart replay
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b5b-service-postgres/service.mjs
      - name: Assert admitted production path remains local-only and Try-On stays unwired
        run: |
          grep -q "PRODUCTION_ADMISSION = 'ADMITTED'" src/platform/creative/deterministic/GarmentTextureCompositeIdentity.js
          grep -q "GARMENT_TEXTURE_COMPOSITE_CAPABILITY" server/core/localExecution/productionLocalExecutorPolicy.ts
          grep -q "GARMENT_TEXTURE_COMPOSITE_CAPABILITY" server/core/providers/productionExecutionCapabilities.ts
          grep -q "GARMENT_TEXTURE_COMPOSITE_OPERATION" server/core/providers/productionExecutionRoute.ts
          grep -q "GARMENT_TEXTURE_COMPOSITE_OPERATION" server/core/providers/productionTargetSelection.ts
          ! grep -E 'garment-texture-composite|GARMENT_TEXTURE_COMPOSITE' server/core/providers/productionProviderSelection.ts
          grep -q "TRYON_EXECUTION_NOT_WIRED" src/lib/tryon/tryonEngine.js
          ! grep -E 'garment-texture-composite|GARMENT_TEXTURE_COMPOSITE' src/lib/tryon/tryonEngine.js
