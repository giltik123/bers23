name: BERS v1 Fashion quality evidence dispatch bridge

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch-fashion-evidence:
    if: >-
      github.event.issue.number == 230 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/bers-v1-dispatch-fashion-evidence'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate owner review and dispatch canonical Fashion evidence
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.repository.default_branch;
            const issue_number = context.payload.issue.number;
            const workflow_id = 'v1-fashion-real-image-quality-evidence.yml';
            const artifactPrefix = 'bers-v1-fashion-real-image-quality-';

            const branch = await github.rest.repos.getBranch({ owner, repo, branch: ref });
            const expectedSha = branch.data.commit.sha;
            const evidenceBranch = `release-evidence-fashion-${expectedSha}`;
            const evidencePrefix = `release-evidence/v1/fashion/${expectedSha}`;
            const fixturePath = `${evidencePrefix}/fixture-manifest.json`;
            const reviewPath = `${evidencePrefix}/review.json`;

            const loadJson = async path => {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: evidenceBranch,
              });
              if (Array.isArray(response.data) || response.data.type !== 'file' || !response.data.content) {
                throw new Error(`Expected one file at ${evidenceBranch}:${path}`);
              }
              return JSON.parse(Buffer.from(response.data.content, response.data.encoding || 'base64').toString('utf8'));
            };

            let fixture;
            let review;
            try {
              [fixture, review] = await Promise.all([loadJson(fixturePath), loadJson(reviewPath)]);
            } catch (error) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: [
                  'BERS v1 Fashion evidence dispatch refused: exact-main owner review is not ready.',
                  '',
                  `- expectedSha: \`${expectedSha}\``,
                  `- evidenceBranch: \`${evidenceBranch}\``,
                  `- requiredReviewPath: \`${reviewPath}\``,
                  '- conclusion: `OWNER_REVIEW_MISSING_OR_INVALID`',
                ].join('\n'),
              });
              throw error;
            }

            if (fixture.kind !== 'BERS_V1_FASHION_REAL_IMAGE_FIXTURE_SET' ||
                fixture.candidateSha !== expectedSha ||
                fixture.representativeSetConfirmed !== true) {
              throw new Error('Fashion fixture publication does not bind current exact main');
            }
            if (review.kind !== 'BERS_V1_FASHION_REAL_IMAGE_REVIEW' ||
                review.candidateSha !== expectedSha ||
                review.representativeSetConfirmed !== true ||
                review.decision !== 'ACCEPT_FOR_V1_DETERMINISTIC_TRYON') {
              throw new Error('Fashion owner review does not explicitly accept current exact main');
            }
            if (!Array.isArray(fixture.samples) || !Array.isArray(review.samples) ||
                fixture.samples.length < 1 || fixture.samples.length !== review.samples.length) {
              throw new Error('Fashion owner review and fixture samples must match');
            }
            const sampleIds = new Set();
            const reviewedIds = new Set();
            for (const sample of fixture.samples) {
              if (typeof sample.id !== 'string' || sampleIds.has(sample.id) ||
                  !/^[a-f0-9]{64}$/.test(sample.result?.sha256 ?? '')) {
                throw new Error('Fashion fixture sample identities are invalid');
              }
              sampleIds.add(sample.id);
            }
            const fixtureById = new Map(fixture.samples.map(sample => [sample.id, sample]));
            for (const sample of review.samples) {
              const fixtureSample = fixtureById.get(sample.id);
              if (!fixtureSample || reviewedIds.has(sample.id) ||
                  sample.reviewedOutputSha256 !== fixtureSample.result.sha256) {
                throw new Error('Fashion owner review must bind each exact output SHA-256 before dispatch');
              }
              reviewedIds.add(sample.id);
            }

            const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/${evidenceBranch}/${evidencePrefix}`;
            const fixture_manifest_url = `${rawBase}/fixture-manifest.json`;
            const review_artifact_url = `${rawBase}/review.json`;

            const before = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              event: 'workflow_dispatch',
              branch: ref,
              per_page: 30,
            });
            const knownRunIds = new Set(before.data.workflow_runs.map(run => run.id));

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref,
              inputs: { fixture_manifest_url, review_artifact_url },
            });
            core.notice(`Dispatched Fashion quality evidence on ${ref} at ${expectedSha}`);

            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            let run;
            let statusCommentId = null;

            for (let attempt = 0; attempt < 60; attempt += 1) {
              const listed = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                event: 'workflow_dispatch',
                branch: ref,
                per_page: 30,
              });
              run = listed.data.workflow_runs.find(candidate =>
                !knownRunIds.has(candidate.id) &&
                candidate.head_sha === expectedSha &&
                candidate.event === 'workflow_dispatch'
              );
              if (run) break;
              await sleep(3000);
            }

            if (!run) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: [
                  'BERS v1 Fashion quality evidence dispatch failed before run resolution.',
                  '',
                  `- candidateSha: \`${expectedSha}\``,
                  '- workflowRunUrl: unresolved',
                  '- conclusion: `RUN_RESOLUTION_FAILED`',
                ].join('\n'),
              });
              throw new Error(`Could not resolve newly dispatched Fashion evidence run for ${expectedSha}`);
            }

            const workflowRunUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}`;
            const statusComment = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                'BERS v1 Fashion quality evidence run resolved; completion pending.',
                '',
                `- candidateSha: \`${expectedSha}\``,
                `- workflowRunUrl: \`${workflowRunUrl}\``,
                `- runId: \`${run.id}\``,
                `- status: \`${run.status}\``,
              ].join('\n'),
            });
            statusCommentId = statusComment.data.id;

            for (let attempt = 0; attempt < 120; attempt += 1) {
              const current = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
              run = current.data;
              if (run.status === 'completed') break;
              await sleep(5000);
            }

            if (run.status !== 'completed') {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: statusCommentId,
                body: [
                  'BERS v1 Fashion quality evidence run did not complete within the bridge timeout.',
                  '',
                  `- candidateSha: \`${expectedSha}\``,
                  `- workflowRunUrl: \`${workflowRunUrl}\``,
                  `- runId: \`${run.id}\``,
                  `- status: \`${run.status}\``,
                  '- conclusion: `TIMEOUT`',
                ].join('\n'),
              });
              throw new Error(`Fashion evidence run ${run.id} did not complete within the bridge timeout`);
            }

            if (run.conclusion !== 'success' || run.head_sha !== expectedSha || run.event !== 'workflow_dispatch') {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: statusCommentId,
                body: [
                  'BERS v1 Fashion quality evidence failed or provenance mismatched.',
                  '',
                  `- expectedSha: \`${expectedSha}\``,
                  `- observedSha: \`${run.head_sha}\``,
                  `- workflowRunUrl: \`${workflowRunUrl}\``,
                  `- event: \`${run.event}\``,
                  `- conclusion: \`${run.conclusion}\``,
                ].join('\n'),
              });
              throw new Error(`Fashion evidence run ${run.id} was not successful exact-SHA evidence`);
            }

            const expectedArtifactName = `${artifactPrefix}${expectedSha}`;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const artifact = artifacts.data.artifacts.find(candidate =>
              candidate.name === expectedArtifactName &&
              candidate.expired === false
            );
            if (!artifact) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: statusCommentId,
                body: [
                  'BERS v1 Fashion quality evidence completed but the normalized artifact is missing.',
                  '',
                  `- candidateSha: \`${expectedSha}\``,
                  `- workflowRunUrl: \`${workflowRunUrl}\``,
                  `- expectedArtifactName: \`${expectedArtifactName}\``,
                  '- conclusion: `ARTIFACT_MISSING`',
                ].join('\n'),
              });
              throw new Error(`Fashion evidence run ${run.id} is missing ${expectedArtifactName}`);
            }

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: statusCommentId,
              body: [
                'BERS v1 Fashion quality evidence completed successfully.',
                '',
                `- candidateSha: \`${expectedSha}\``,
                `- evidenceBranch: \`${evidenceBranch}\``,
                `- workflowRunUrl: \`${workflowRunUrl}\``,
                `- artifactName: \`${expectedArtifactName}\``,
                `- artifactId: \`${artifact.id}\``,
                `- conclusion: \`${run.conclusion}\``,
              ].join('\n'),
            });

            core.notice(`Resolved Fashion quality evidence: ${workflowRunUrl} / ${expectedArtifactName}`);
