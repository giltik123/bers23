name: BERS v1 external release evidence tooling

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scripts/verify-frontend-security-headers.mjs'
      - 'scripts/verify-github-main-protection.mjs'
      - 'tests/frontend-security-deployment-contract.test.mjs'
      - 'tests/v1-external-release-evidence.test.mjs'
      - 'docs/v1-external-release-evidence.md'
      - 'package.json'
      - '.github/workflows/v1-external-release-evidence.yml'
  workflow_dispatch:
    inputs:
      frontend_url:
        description: Final canonical HTTPS frontend URL
        required: true
        type: string
      core_api_url:
        description: Canonical Core API URL or same-origin /api/core
        required: true
        default: /api/core
        type: string

permissions:
  contents: read

jobs:
  external-release-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Prove frontend deployment contract and evidence capture
        run: node --test tests/frontend-security-deployment-contract.test.mjs tests/v1-external-release-evidence.test.mjs
      - name: Prove exact required main-protection check set
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { REQUIRED_V1_MAIN_CHECKS } from './scripts/verify-github-main-protection.mjs';
          assert.deepEqual(REQUIRED_V1_MAIN_CHECKS, [
            'BERS Required Acceptance',
            'integrated-contract',
            'npm-production-audit',
            'fp16-webgpu-feasibility',
            'wasm-compact-feasibility',
            'ort-memory-latency-feasibility',
            'short-pipeline-measurement',
          ]);
          NODE
          grep -q 'release:evidence:frontend' package.json
          grep -q 'release:evidence:github' package.json
          ! grep -E -q '(ghp_|github_pat_|Bearer [A-Za-z0-9])' docs/v1-external-release-evidence.md
      - name: Check committed diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"

  live-frontend-release-evidence:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact dispatched SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Require canonical HTTPS frontend target
        env:
          FRONTEND_URL: ${{ inputs.frontend_url }}
        run: |
          set -euo pipefail
          case "$FRONTEND_URL" in
            https://*) ;;
            *) echo "Manual release evidence requires an HTTPS frontend URL" >&2; exit 1 ;;
          esac
      - name: Capture live frontend security evidence
        env:
          FRONTEND_URL: ${{ inputs.frontend_url }}
          CORE_API_URL: ${{ inputs.core_api_url }}
          EVIDENCE_OUT: release-evidence/v1/frontend-security.json
          VERIFIED_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: bers-v1-frontend-security-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence/v1
          npm run release:evidence:frontend | tee release-evidence/v1/frontend-security.log
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const evidence = JSON.parse(await readFile('release-evidence/v1/frontend-security.json', 'utf8'));
          assert.equal(evidence.kind, 'BERS_V1_FRONTEND_SECURITY_EVIDENCE');
          assert.ok(Number.isInteger(evidence.status) && evidence.status >= 200 && evidence.status < 300);
          assert.match(evidence.frontendUrl, /^https:\/\//u);
          assert.equal(evidence.htmlSha256.length, 64);
          assert.equal(evidence.verifiedSha, process.env.GITHUB_SHA);
          assert.equal(evidence.workflowRunUrl, `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`);
          assert.equal(evidence.artifactName, `bers-v1-frontend-security-${process.env.GITHUB_SHA}`);
          NODE
      - name: Upload exact-SHA frontend evidence
        uses: actions/upload-artifact@v4
        with:
          name: bers-v1-frontend-security-${{ github.sha }}
          path: |
            release-evidence/v1/frontend-security.json
            release-evidence/v1/frontend-security.log
          if-no-files-found: error
          retention-days: 90
      - name: Summarize release evidence
        env:
          FRONTEND_URL: ${{ inputs.frontend_url }}
        run: |
          {
            echo "### BERS v1 live frontend security evidence"
            echo
            echo "- Candidate SHA: \`${GITHUB_SHA}\`"
            echo "- Frontend: \`${FRONTEND_URL}\`"
            echo "- Artifact: \`bers-v1-frontend-security-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
