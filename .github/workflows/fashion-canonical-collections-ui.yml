name: Fashion canonical Collections UI

on:
  pull_request:
    paths:
      - 'src/application/fashion/canonicalCollectionViewModel.js'
      - 'src/components/editor/fashion/CanonicalCollectionsView.jsx'
      - 'src/components/editor/fashion/FashionPanel.jsx'
      - 'src/api/managedGarmentCollectionClient.js'
      - 'tests/canonical-collection-view-model.test.mjs'
      - 'tests/fashion-canonical-collections-ui.test.mjs'
      - 'tests/editor-zero-object-navigation.test.mjs'
      - '.github/workflows/fashion-canonical-collections-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-collections-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prove collection revision and atomic-move semantics
        run: node --test tests/canonical-collection-view-model.test.mjs
      - name: Prove canonical Collections UI authority boundary
        run: |
          node --test tests/fashion-canonical-collections-ui.test.mjs
          node --test tests/editor-zero-object-navigation.test.mjs
      - name: Build production frontend
        run: npm run build
      - name: Reject legacy collection authority
        run: |
          set -euo pipefail
          FILES=(
            src/application/fashion/canonicalCollectionViewModel.js
            src/components/editor/fashion/CanonicalCollectionsView.jsx
            src/components/editor/fashion/FashionPanel.jsx
          )
          ! grep -E -q 'garmentCollections|wardrobeManager|garmentManager|coreClient\.entities|Core\.UploadFile|original_image_url' "${FILES[@]}"
          grep -q 'coreClient.fashion.collections' src/components/editor/fashion/CanonicalCollectionsView.jsx
          grep -q 'collections.moveGarment' src/application/fashion/canonicalCollectionViewModel.js
      - name: Check committed diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --check "$BASE_SHA"..HEAD
          else
            git diff --check HEAD^..HEAD
          fi
