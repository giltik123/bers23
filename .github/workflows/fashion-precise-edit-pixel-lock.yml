name: Fashion precise edit R&D pixel lock
on:
  pull_request:
    paths:
      - 'src/platform/creative/deterministic/PreciseEditPixelLock.ts'
      - 'tests/precise-edit-pixel-lock.test.mjs'
      - 'docs/fashion-ideogram45-precise-edit-research.md'
      - 'scripts/compare-fashion-precise-edit-real-images.mjs'
      - 'tests/precise-edit-real-image-comparison.test.mjs'
      - '.github/workflows/fashion-precise-edit-pixel-lock.yml'
permissions:
  contents: read
jobs:
  precise-edit-pixel-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Byte-exact source preservation across multi-turn edits
        run: node --experimental-strip-types --test tests/precise-edit-pixel-lock.test.mjs

  real-image-comparison:
    needs: precise-edit-pixel-lock
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      CAPTURE_DIR: .test-cache/fashion-real-image-quality
      COMPARE_DIR: .test-cache/fashion-precise-edit-comparison
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Test independent torso leakage detection
        run: node --experimental-strip-types --test tests/precise-edit-real-image-comparison.test.mjs
      - name: Build trusted deterministic real-photo capture harness
        run: |
          mkdir -p .test-cache/fashion-real-image-build
          npx esbuild scripts/capture-fashion-real-image-quality.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-real-image-build/capture.mjs \
            --external:sharp --external:node:*
      - name: Generate six real-image F4 reference outputs
        run: |
          node .test-cache/fashion-real-image-build/capture.mjs \
            --manifest config/v1-fashion-real-image-fixtures.json \
            --out "$CAPTURE_DIR" --candidate "$EXPECTED_SHA"
      - name: Compare F4 reference with localized inward-feather quality candidate
        run: |
          node --experimental-strip-types scripts/compare-fashion-precise-edit-real-images.mjs \
            "$CAPTURE_DIR" config/v1-fashion-real-image-fixtures.json "$COMPARE_DIR"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const evidence=JSON.parse(readFileSync(process.env.COMPARE_DIR+'/comparison-manifest.json','utf8'));
          assert.equal(evidence.candidateSha,process.env.EXPECTED_SHA);
          assert.equal(evidence.sampleCount,6);
          assert.equal(evidence.reviewStatus,'PENDING_INDEPENDENT_VISUAL_REVIEW');
          assert.equal(evidence.productionAuthorityGranted,false);
          assert.ok(evidence.records.every(r=>r.changedProtectedPixelCount===0));
          assert.ok(evidence.records.every(r=>r.baselineChangedOutsideTorsoPixelCount===0));
          assert.ok(evidence.records.some(r=>r.refinedDifferentFromBaselinePixelCount>0));
          NODE
      - name: Upload real-photo side-by-side comparison (not quality acceptance)
        uses: actions/upload-artifact@v4
        with:
          name: bers-fashion-precise-edit-comparison-${{ github.event.pull_request.head.sha }}
          path: ${{ env.COMPARE_DIR }}
          if-no-files-found: error
          retention-days: 30
