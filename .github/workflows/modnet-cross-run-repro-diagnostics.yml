name: MODNet cross-run ONNX reproducibility diagnostics

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "scripts/fingerprint-onnx-repro.py"
      - "scripts/compare-onnx-repro-reports.py"
      - ".github/workflows/modnet-cross-run-repro-diagnostics.yml"
      - "scripts/build-modnet-portrait-matting-release.py"
      - "src/platform/creative/local-ai/models/portrait-matting.manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b, c]
    runs-on: ubuntu-24.04
    env:
      MODNET_CHECKPOINT_SHA256: 7c22235f0925deba15d4d63e53afcb654c47055bbcd98f56e393ab2584007ed8
      MODNET_CHECKPOINT_SIZE: 26255603
      MODNET_DIAGNOSTIC_REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact diagnostic candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned diagnostic environment
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0
          python -m pip install --disable-pip-version-check torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==1.26.4 onnx==1.15.0 onnxruntime==1.16.3
      - name: Acquire exact MODNet source and checkpoint
        run: |
          set -euo pipefail
          git clone https://github.com/ZHKKKe/MODNet "${RUNNER_TEMP}/MODNet"
          git -C "${RUNNER_TEMP}/MODNet" checkout --detach 28165a451e4610c9d77cfdf925a94610bb2810fb
          test "$(git -C "${RUNNER_TEMP}/MODNet" rev-parse HEAD)" = 28165a451e4610c9d77cfdf925a94610bb2810fb
          mkdir -p "${RUNNER_TEMP}/modnet-checkpoints"
          gdown --folder 'https://drive.google.com/drive/folders/1umYmlCulvIFNaqPjwod1SayFmSRHziyR?usp=sharing' -O "${RUNNER_TEMP}/modnet-checkpoints"
          mapfile -t checkpoints < <(find "${RUNNER_TEMP}/modnet-checkpoints" -type f -name 'modnet_photographic_portrait_matting.ckpt' -print)
          test "${#checkpoints[@]}" -eq 1
          checkpoint="${checkpoints[0]}"
          test "$(stat -c%s "${checkpoint}")" = "${MODNET_CHECKPOINT_SIZE}"
          test "$(sha256sum "${checkpoint}" | cut -d' ' -f1)" = "${MODNET_CHECKPOINT_SHA256}"
          printf '%s\n' "${checkpoint}" > "${RUNNER_TEMP}/modnet-checkpoint-path"
      - name: Capture hosted runner fingerprint
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          cpu_model="$(lscpu | awk -F: '/^Model name:/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          test -n "$cpu_model"
          printf 'MODNET_DIAGNOSTIC_CANDIDATE_SHA=%s\n' "$candidate_sha" >> "$GITHUB_ENV"
          printf 'MODNET_DIAGNOSTIC_CPU_MODEL=%s\n' "$cpu_model" >> "$GITHUB_ENV"
          echo "MODNET_DIAGNOSTIC_REPLICA=${MODNET_DIAGNOSTIC_REPLICA}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "MODNET_DIAGNOSTIC_CANDIDATE_SHA=${candidate_sha}"
          echo "MODNET_DIAGNOSTIC_CPU_MODEL=${cpu_model}"
          uname -a
          lscpu
          python - <<'PY'
          import platform, sys
          import numpy, onnx, onnxruntime, torch
          print({
            'python': sys.version,
            'platform': platform.platform(),
            'machine': platform.machine(),
            'processor': platform.processor(),
            'torch': torch.__version__,
            'numpy': numpy.__version__,
            'onnx': onnx.__version__,
            'onnxruntime': onnxruntime.__version__,
          })
          PY
      - name: Export two independent same-run samples
        run: |
          set -euo pipefail
          mkdir -p .test-cache/modnet-cross-run
          checkpoint="$(cat "${RUNNER_TEMP}/modnet-checkpoint-path")"
          for sample in first second; do
            PYTHONHASHSEED=0 python scripts/build-modnet-portrait-matting-release.py \
              --single-export \
              --source "${RUNNER_TEMP}/MODNet" \
              --checkpoint "${checkpoint}" \
              --manifest src/platform/creative/local-ai/models/portrait-matting.manifest.json \
              --output ".test-cache/modnet-cross-run/${sample}.onnx"
          done
      - name: Fingerprint graph and every initializer
        run: |
          set -euo pipefail
          python scripts/fingerprint-onnx-repro.py \
            .test-cache/modnet-cross-run/first.onnx \
            .test-cache/modnet-cross-run/second.onnx \
            --output .test-cache/modnet-cross-run/fingerprint.json > .test-cache/modnet-cross-run/fingerprint.log
          python - <<'PY'
          import json, os
          from pathlib import Path

          report=json.load(open('.test-cache/modnet-cross-run/fingerprint.json',encoding='utf-8'))
          classification=report['comparison']['classification']
          if classification != 'BYTE_IDENTICAL':
              raise SystemExit('within-run MODNet export lost byte reproducibility')
          sample=report['samples'][0]
          fields={
              'replica': os.environ['MODNET_DIAGNOSTIC_REPLICA'],
              'candidate': os.environ['MODNET_DIAGNOSTIC_CANDIDATE_SHA'],
              'arch': os.environ.get('RUNNER_ARCH','unknown'),
              'cpu': os.environ['MODNET_DIAGNOSTIC_CPU_MODEL'].replace('|','/'),
              'raw': sample['rawSha256'],
              'proto': sample['deterministicProtoSha256'],
              'graph': sample['graphSemanticSha256'],
              'initializers': sample['initializerSemanticSetSha256'],
              'initializerCount': str(sample['initializerCount']),
              'classification': classification,
          }
          line='MODNET_REPRO_FINGERPRINT|'+'|'.join(f'{key}={value}' for key,value in fields.items())
          print(line)
          Path('.test-cache/modnet-cross-run/fingerprint-summary.txt').write_text(line+'\n',encoding='utf-8')
          Path('.test-cache/modnet-cross-run/runner-metadata.json').write_text(json.dumps({
              'replica': fields['replica'],
              'candidate': fields['candidate'],
              'arch': fields['arch'],
              'cpu': fields['cpu'],
          }, sort_keys=True)+'\n', encoding='utf-8')
          PY
      - name: Upload fingerprint metadata only
        uses: actions/upload-artifact@v4
        with:
          name: modnet-repro-fingerprint-${{ matrix.replica }}
          path: |
            .test-cache/modnet-cross-run/fingerprint.json
            .test-cache/modnet-cross-run/fingerprint-summary.txt
            .test-cache/modnet-cross-run/runner-metadata.json
          if-no-files-found: error
          retention-days: 1
      - name: Publish runner diagnostic summary
        if: always()
        run: |
          {
            echo '## MODNet hosted-runner diagnostic'
            echo
            echo "- Replica: \`${MODNET_DIAGNOSTIC_REPLICA}\`"
            echo '- Authority: `DIAGNOSTIC_ONLY_NO_RELEASE_AUTHORITY`'
            echo '- No manifest/pin/release identity mutation is performed.'
            echo '- ONNX model bytes are never uploaded as a workflow artifact.'
            if test -f .test-cache/modnet-cross-run/fingerprint-summary.txt; then
              echo
              echo '```text'
              cat .test-cache/modnet-cross-run/fingerprint-summary.txt
              echo '```'
            else
              echo
              echo 'Fingerprint summary unavailable because an earlier diagnostic step failed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  compare-hosted-runners:
    needs: fingerprint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact diagnostic candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download fingerprint metadata
        uses: actions/download-artifact@v4
        with:
          pattern: modnet-repro-fingerprint-*
          path: .test-cache/modnet-cross-run/reports
      - name: Compare independent hosted runners
        run: |
          set -euo pipefail
          mapfile -t reports < <(find .test-cache/modnet-cross-run/reports -type f -name fingerprint.json -print | sort)
          test "${#reports[@]}" -eq 3
          python scripts/compare-onnx-repro-reports.py \
            "${reports[@]}" \
            --output .test-cache/modnet-cross-run/cross-run-comparison.json \
            > .test-cache/modnet-cross-run/cross-run-comparison.log
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.load(open('.test-cache/modnet-cross-run/cross-run-comparison.json',encoding='utf-8'))
          comparison=report['comparison']
          raws=','.join(sample['rawSha256'] for sample in report['samples'])
          line=(
              'MODNET_CROSS_RUN_CLASSIFICATION|'
              f"classification={comparison['classification']}|"
              f"raw={raws}|"
              f"initializerDriftCount={report['initializerDrift']['changedCount']}"
          )
          print(line)
          Path('.test-cache/modnet-cross-run/cross-run-summary.txt').write_text(line+'\n',encoding='utf-8')
          PY
      - name: Publish cross-run classification
        if: always()
        run: |
          {
            echo '## MODNet cross-run classification'
            echo
            echo '- Authority: `DIAGNOSTIC_ONLY_NO_RELEASE_AUTHORITY`'
            echo '- Three independent hosted jobs are compared after each proves two-export byte identity.'
            echo '- Only fingerprint metadata crosses job boundaries; ONNX model bytes are never uploaded.'
            echo '- Cross-run divergence is evidence, not permission to repin or promote.'
            if test -f .test-cache/modnet-cross-run/cross-run-summary.txt; then
              echo
              echo '```text'
              cat .test-cache/modnet-cross-run/cross-run-summary.txt
              echo '```'
              echo
              echo '<details><summary>Full metadata-only comparison</summary>'
              echo
              echo '```json'
              cat .test-cache/modnet-cross-run/cross-run-comparison.json
              echo '```'
              echo '</details>'
            else
              echo
              echo 'Cross-run comparison unavailable because an earlier diagnostic step failed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
