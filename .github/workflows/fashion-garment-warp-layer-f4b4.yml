name: Fashion F4b.4 immutable garment warp-layer authority

on:
  pull_request:
    branches: [ "main", "fashion-body-anchor-destination-mesh-f4b3" ]
  workflow_dispatch:

jobs:
  garment-warp-layer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fashion_f4b4_warp_test
          POSTGRES_USER: fashion_f4b4_warp_test
          POSTGRES_PASSWORD: fashion_f4b4_warp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashion_f4b4_warp_test -d fashion_f4b4_warp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fashion_f4b4_warp_test:fashion_f4b4_warp_test@127.0.0.1:5432/fashion_f4b4_warp_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck and build production Core
        run: |
          npm run typecheck
          npm run server:typecheck
          npm run server:build
          test -f dist-server/migrations/028_project_body_anchor_sets.sql
          test -f dist-server/migrations/029_fashion_garment_warp_layers.sql
      - name: Apply canonical predecessor schemas
        run: |
          npm run db:migrate:transactions
          npm run db:check:transactions
      - name: Bundle PostgreSQL intermediate-layer proof
        run: |
          mkdir -p .test-cache/fashion-f4b4-layer
          npx esbuild tests/fashion-garment-warp-layer-postgres.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-layer/test.mjs --external:node:* --external:pg --external:sharp
      - name: Prove exact evidence replay immutability and non-FINAL boundary
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-layer/test.mjs
      - name: Dump exact PostgreSQL catalog on proof failure
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            for (const [name, sql] of Object.entries({
              columns: `SELECT column_name,udt_name,is_nullable,character_maximum_length,column_default FROM information_schema.columns WHERE table_schema=current_schema() AND table_name='canonical_fashion_garment_warp_layers' ORDER BY ordinal_position`,
              constraints: `SELECT c.conname,c.contype,c.convalidated,pg_get_constraintdef(c.oid) AS definition FROM pg_constraint c WHERE c.conrelid IN (to_regclass('canonical_fashion_garment_warp_layers'),to_regclass('canonical_garment_representations'),to_regclass('canonical_project_body_anchor_sets')) ORDER BY c.conname`,
              indexes: `SELECT indexname,indexdef FROM pg_indexes WHERE schemaname=current_schema() AND tablename='canonical_fashion_garment_warp_layers' ORDER BY indexname`,
              triggers: `SELECT t.tgname,t.tgtype,t.tgenabled,p.proname,pg_get_triggerdef(t.oid) AS definition FROM pg_trigger t JOIN pg_proc p ON p.oid=t.tgfoid WHERE t.tgrelid=to_regclass('canonical_fashion_garment_warp_layers') AND NOT t.tgisinternal ORDER BY t.tgname`,
            })) {
              const result = await pool.query(sql);
              console.log(`F4B4_CATALOG_${name.toUpperCase()}=${JSON.stringify(result.rows)}`);
            }
          } finally {
            await pool.end();
          }
          NODE
      - name: Prove immutable layer authority stays separate from admitted pixel execution
        run: |
          npx esbuild tests/deterministic-garment-mesh-warp-admission-boundary.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f4b4-layer/admission-boundary.test.mjs \
            --external:node:*
          node --test .test-cache/fashion-f4b4-layer/admission-boundary.test.mjs
