name: P0b.2 server-policy one-time trial lifecycle

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/transactions/application/financialAccountPorts.ts'
      - 'server/transactions/infrastructure/postgres/postgresFinancialTrialPolicy.ts'
      - 'server/transactions/infrastructure/postgres/postgresFinancialTrialPolicy.integration.test.mjs'
      - 'server/transactions/infrastructure/postgres/postgresTransactionRuntime.ts'
      - 'server/core/http/financialTrialHttpAdapter.ts'
      - 'server/core/http/financialTrialHttpAdapter.test.mjs'
      - 'server/index.ts'
      - 'tests/financial-account-trial-http-postgres.test.ts'
      - '.github/workflows/financial-account-trial-p0b2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial-policy-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: financial_p0b2_test
          POSTGRES_USER: financial_p0b2_test
          POSTGRES_PASSWORD: financial_p0b2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial_p0b2_test -d financial_p0b2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://financial_p0b2_test:financial_p0b2_test@127.0.0.1:5432/financial_p0b2_test
      TEST_DATABASE_URL: postgresql://financial_p0b2_test:financial_p0b2_test@127.0.0.1:5432/financial_p0b2_test
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Preserve accepted transaction and financial schemas
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          git diff --exit-code "$BASE_SHA"..HEAD -- \
            server/transactions/infrastructure/postgres/migrations/001_transaction_store.sql \
            server/transactions/infrastructure/postgres/migrations/038_financial_account_foundation.sql
      - name: Prove production migration inventory remains exactly 001 through 038
        run: |
          node --input-type=module <<'NODE'
          import { loadProductionMigrationInventory } from './scripts/production-migration-inventory.mjs';
          const migrations = await loadProductionMigrationInventory();
          if (migrations.length !== 38) throw new Error(`Expected 38 contiguous production migrations, got ${migrations.length}`);
          if (migrations[0]?.name !== '001_transaction_store.sql') throw new Error('001 transaction root migration moved');
          if (migrations.at(-1)?.name !== '038_financial_account_foundation.sql') throw new Error('038 financial migration must remain the inventory tail');
          NODE
      - name: Typecheck and build Core
        run: |
          npm run server:typecheck
          npm run server:build
          test -f dist-server/migrations/001_transaction_store.sql
          test -f dist-server/migrations/038_financial_account_foundation.sql
      - name: Apply and verify accepted PostgreSQL schema
        run: |
          npm run db:migrate:transactions
          npm run db:check:transactions
      - name: Preserve P0a grant and replay authority
        run: node --experimental-strip-types --test server/transactions/infrastructure/postgres/postgresFinancialAccountStore.integration.test.mjs
      - name: Preserve P0b.1 FREE bootstrap authority
        run: node --experimental-strip-types --test server/transactions/infrastructure/postgres/postgresFinancialAccountPolicy.integration.test.mjs
      - name: Prove one-time trial policy, replay, drift and lock ordering
        run: node --experimental-strip-types --test server/transactions/infrastructure/postgres/postgresFinancialTrialPolicy.integration.test.mjs
      - name: Preserve financial GET and FREE initialize HTTP contracts
        run: |
          node --experimental-strip-types --test server/core/http/financialAccountHttpAdapter.test.mjs
          node --experimental-strip-types --test server/core/http/financialAccountPolicyHttpAdapter.test.mjs
      - name: Prove bounded trial HTTP capability contract
        run: node --experimental-strip-types --test server/core/http/financialTrialHttpAdapter.test.mjs
      - name: Preserve P0b.1 HTTP to PostgreSQL vertical
        run: node --experimental-strip-types --test tests/financial-account-initialize-http-postgres.test.ts
      - name: Prove HTTP to PostgreSQL trial vertical
        run: node --experimental-strip-types --test tests/financial-account-trial-http-postgres.test.ts
      - name: Preserve canonical reservation spend authority
        run: npm run test:transactions-postgres
      - name: Prove trial authority cannot mint money or open paid authority
        run: |
          set -euo pipefail
          trial=server/transactions/infrastructure/postgres/postgresFinancialTrialPolicy.ts
          http=server/core/http/financialTrialHttpAdapter.ts
          grep -q "FINANCIAL_TRIAL_START_PATH = '/api/core/financial/account/trial/start'" "$http"
          grep -q 'startTrial: production.transactions.financialTrials.startTrial.bind' server/index.ts
          grep -q 'path === FINANCIAL_TRIAL_START_PATH' server/index.ts
          grep -q 'plus: 7' "$trial"
          grep -q 'pro: 14' "$trial"
          grep -q 'studio: 14' "$trial"
          test "$(grep -c 'UPDATE financial_entitlement_accounts' "$trial")" = "1"
          ! grep -E -q 'INSERT[[:space:]]+INTO[[:space:]]+credit_grants|UPDATE[[:space:]]+credit_wallets|DELETE[[:space:]]+FROM[[:space:]]+credit_grants' "$trial"
          ! grep -E -q 'includedCredits|trialCredits|checkout|webhook|provider_event_id.*\$|grant\(' "$http"
          ! grep -E -q '\.(grant|reserve|commit|release)\(' "$http"
          git diff --exit-code "$BASE_SHA"..HEAD -- src/lib/credits src/lib/subscriptions src/pages/Subscription.jsx src/components/subscription
      - name: Check committed diff whitespace
        run: git diff --check "$BASE_SHA"..HEAD