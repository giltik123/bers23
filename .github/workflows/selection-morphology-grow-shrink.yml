name: Selection Morphology Grow Shrink

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/application/selection/**'
      - 'src/components/editor/SelectionToolbar.jsx'
      - 'src/pages/Editor.jsx'
      - 'src/platform/creative/pipeline/ControlledLocalEdit.ts'
      - 'tests/intelligent-selection.test.ts'
      - 'tests/mask-refinement-lineage.test.ts'
      - 'tests/editor-canonical-boundary.test.mjs'
      - '.github/workflows/selection-morphology-grow-shrink.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection-morphology:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Typecheck selection morphology surfaces
        run: npm run typecheck
      - name: Bundle deterministic selection regressions
        run: |
          set -euo pipefail
          mkdir -p .test-cache/p191
          for file in tests/intelligent-selection.test.ts tests/mask-refinement-lineage.test.ts; do
            out=".test-cache/p191/$(basename "${file%.ts}").mjs"
            npx esbuild "$file" --bundle --platform=node --format=esm --target=node24 --outfile="$out" --external:node:* --external:pg --external:sharp
          done
      - name: Prove grow shrink bytes bounds history and lineage
        run: |
          node --test             .test-cache/p191/intelligent-selection.test.mjs             .test-cache/p191/mask-refinement-lineage.test.mjs
      - name: Prove Editor morphology stays behind Selection service and Core MASK authority
        run: node --test tests/editor-canonical-boundary.test.mjs
      - name: Build production browser
        run: npm run build
      - name: Preserve deterministic morphology authority
        run: |
          set -euo pipefail
          service=src/application/selection/SelectionApplicationService.ts
          editor=src/pages/Editor.jsx
          toolbar=src/components/editor/SelectionToolbar.jsx
          grep -q "MAX_SELECTION_MORPHOLOGY_RADIUS = 32" "$service"
          grep -q "MAX_SELECTION_MORPHOLOGY_PIXELS = 16_777_216" "$service"
          grep -q "OPERATION_EXPANDED" "$service"
          grep -q "OPERATION_CONTRACTED" "$service"
          grep -q "service.grow(selectionMorphologyRadius)" "$editor"
          grep -q "service.shrink(selectionMorphologyRadius)" "$editor"
          grep -q 'aria-label="Grow selection"' "$toolbar"
          grep -q 'aria-label="Shrink selection"' "$toolbar"
          ! grep -E -q "fetch\(|coreClient|provider|billing|credits" "$service"
          test -n "$BASE_SHA"
          git diff --check "$BASE_SHA"..HEAD
