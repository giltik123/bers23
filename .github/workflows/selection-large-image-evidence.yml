name: Selection Large Image Evidence

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/application/selection/**'
      - 'tests/intelligent-selection.test.ts'
      - 'tests/mask-refinement-lineage.test.ts'
      - '.github/workflows/selection-large-image-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection-large-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Typecheck Selection surfaces
        run: npm run typecheck
      - name: Bundle Selection evidence
        run: |
          set -euo pipefail
          mkdir -p .test-cache/p191-large
          for file in tests/intelligent-selection.test.ts tests/mask-refinement-lineage.test.ts; do
            out=".test-cache/p191-large/$(basename "${file%.ts}").mjs"
            npx esbuild "$file" --bundle --platform=node --format=esm --target=node24 --outfile="$out" --external:node:* --external:pg --external:sharp
          done
      - name: Prove >2MP ORIGINAL-resolution alignment and MASK persistence
        run: |
          node --test             .test-cache/p191-large/intelligent-selection.test.mjs             .test-cache/p191-large/mask-refinement-lineage.test.mjs
      - name: Preserve large-image evidence semantics
        run: |
          set -euo pipefail
          testfile=tests/intelligent-selection.test.ts
          grep -F -q "assert.ok(pixels > 2_000_000)" "$testfile"
          grep -F -q "analysisMaxEdge: 512" "$testfile"
          grep -F -q "analysis must remain bounded below ORIGINAL resolution" "$testfile"
          grep -F -q "manual refinement must address ORIGINAL coordinates on >2MP masks" "$testfile"
          grep -F -q "alpha.length, pixels" "$testfile"
          grep -F -q "ALPHA_8_LOSSLESS" "$testfile"
          test -n "$BASE_SHA"
          git diff --check "$BASE_SHA"..HEAD
