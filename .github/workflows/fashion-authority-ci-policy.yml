name: Fashion authority CI classifier policy

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/fashion-authority-ci-policy.yml'
      - '.github/workflows/managed-garment-f1a.yml'
      - '.github/workflows/managed-garment-f1b.yml'
      - '.github/workflows/managed-wardrobe-f2a.yml'
      - '.github/workflows/managed-wardrobe-f2b.yml'
      - '.github/workflows/managed-outfits-f3a.yml'
      - '.github/workflows/managed-garment-representations-f4a.yml'
      - '.github/workflows/managed-garment-glb-f4a1.yml'
      - 'scripts/classify-fashion-authority-ci.mjs'
      - 'tests/fashion-authority-ci-relevance.test.mjs'
      - 'tests/fashion-authority-ci-workflow-trust.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classifier-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Syntax-check classifier
        run: node --check scripts/classify-fashion-authority-ci.mjs
      - name: Prove Fashion authority classifier and workflow trust contracts
        run: node --test tests/fashion-authority-ci-relevance.test.mjs tests/fashion-authority-ci-workflow-trust.test.mjs
      - name: Prove CLI NUL-delimited GitHub-output contract
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/fashion-classifier-output"
          printf '%s\0%s\0' \
            'src/platform/creative/local-ai/tinySdPipeline.ts' \
            'server/core/fashion/garmentSchema.ts' \
            | node scripts/classify-fashion-authority-ci.mjs --stdin0 --github-output "${output}" \
            | tee "${RUNNER_TEMP}/fashion-classifier-result.json"
          grep -qx 'relevant=true' "${output}"
          grep -qx 'classification=RELEVANT_FASHION_AUTHORITY_ACCEPTANCE_REQUIRED' "${output}"
          grep -qx 'matched_count=1' "${output}"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const result = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/fashion-classifier-result.json', 'utf8'));
          assert.equal(result.relevant, true);
          assert.deepEqual(result.matchedPaths, ['server/core/fashion/garmentSchema.ts']);
          NODE
      - name: Check committed diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ]; then
            git diff --check "${BASE_SHA}..HEAD"
          else
            git diff --check "HEAD^..HEAD"
          fi
