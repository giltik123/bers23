name: Fashion Try-On manual acquisition intent staging

on:
  push:
    branches:
      - fashion-tryon-manual-acquisition-intent-staging
    paths:
      - 'src/application/fashion/canonicalTryOnManualAcquisition.js'
      - 'tests/canonical-tryon-manual-acquisition.test.mjs'
      - 'tests/canonical-tryon-manual-acquisition-boundary.test.mjs'
      - '.github/workflows/fashion-tryon-manual-acquisition-intent-staging.yml'

permissions:
  contents: read

jobs:
  manual-acquisition-intent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact staging SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prove manual acquisition intent shaping
        run: node --test tests/canonical-tryon-manual-acquisition.test.mjs
      - name: Prove browser to Core acquisition contract parity
        run: node --test tests/canonical-tryon-manual-acquisition-boundary.test.mjs
      - name: Re-prove accepted manual acquisition browser transports
        run: |
          grep -Fq "BODY_KEYS = Object.freeze(['contour', 'expectedRevision']" server/core/http/manualParametricGarmentAdmissionHttpAdapter.ts
          grep -Fq "BODY_KEYS = Object.freeze(['payload', 'sourceArtifactId']" server/core/http/manualProjectBodyAnchorHttpAdapter.ts
          grep -Fq "MANUAL_PARAMETRIC_CONTOUR_MAX_POINTS = 256" server/core/fashion/manualParametricContour.ts
          grep -Fq "BODY_ANCHOR_SCHEMA_ID = 'BERS_BODY_ANCHORS_V1'" server/core/fashion/bodyAnchorGeometry.ts
      - name: Build production frontend
        run: npm run build
      - name: Reject browser evidence or execution authority
        run: |
          set -euo pipefail
          FILE=src/application/fashion/canonicalTryOnManualAcquisition.js
          ! grep -E -q 'representation(Id|ContentSha256)|anchorSetId|payloadSha256|projectImage(StorageId|Sha256)|destinationMesh|storageId|producerId|validatorId|admissionState|ticketId|executionId|fetch\(|coreClient\.entities|FASHN|billing|credits' "$FILE"
      - name: Check committed diff whitespace
        run: git diff --check HEAD^..HEAD
