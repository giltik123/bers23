name: BERS v1 browser release journey matrix

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'config/v1-release-journey-matrix.json'
      - 'docs/v1-release-journey-matrix.md'
      - 'tests/v1-release-journey-matrix.test.mjs'
      - 'scripts/test-release-r3*.mjs'
      - 'scripts/test-automation-c3b-retry-cancel-browser-e2e.mjs'
      - 'scripts/test-automation-c3c-studio-browser-e2e.mjs'
      - 'scripts/verify-frontend-security-headers.mjs'
      - '.github/workflows/release-r3*.yml'
      - '.github/workflows/automation-*-browser-e2e-*.yml'
      - '.github/workflows/security-frontend-deployment-contract.yml'
      - '.github/workflows/v1-release-journey-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  journey-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Prove #233 journey coverage and deployment-evidence state
        run: node --test tests/v1-release-journey-matrix.test.mjs
      - name: Emit truthful journey disposition
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const matrix=JSON.parse(readFileSync('config/v1-release-journey-matrix.json','utf8'));
          const security=matrix.entries.find(value=>value.id===22);
          const proven=matrix.entries.filter(value=>value.disposition==='PROVEN').length;
          const deferred=matrix.entries.filter(value=>value.disposition==='DEFERRED_OUT_OF_V1').length;
          const pending=matrix.entries.filter(value=>value.disposition==='DEPLOYMENT_TARGET_PENDING').length;
          if (deferred !== 1) throw new Error('expected one deferred v1 journey');
          if (security?.disposition === 'DEPLOYMENT_TARGET_PENDING') {
            if (proven !== 20 || pending !== 1) throw new Error('pending journey matrix count mismatch');
            console.log('BERS_V1_FRONTEND_DEPLOYMENT_PENDING');
          } else if (security?.disposition === 'PROVEN') {
            if (proven !== 21 || pending !== 0) throw new Error('proven journey matrix count mismatch');
            console.log('BERS_V1_FRONTEND_DEPLOYMENT_PROVEN');
          } else {
            throw new Error('unexpected journey 22 disposition');
          }
          NODE
      - name: Verify hosted frontend deployment evidence when PROVEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          disposition="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const matrix=JSON.parse(readFileSync('config/v1-release-journey-matrix.json','utf8'));
          process.stdout.write(String(matrix.entries.find(value=>value.id===22)?.disposition ?? ''));
          NODE
          )"
          if [ "$disposition" != PROVEN ]; then
            echo "Hosted frontend evidence verification is not required for $disposition."
            exit 0
          fi

          RUN_ID="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const matrix=JSON.parse(readFileSync('config/v1-release-journey-matrix.json','utf8'));
          const evidence=matrix.entries.find(value=>value.id===22)?.liveEvidence;
          const match=/^https:\/\/github\.com\/giltik123\/bers23\/actions\/runs\/(\d+)$/u.exec(evidence?.workflowRunUrl ?? '');
          if (!match) throw new Error('journey 22 workflowRunUrl is invalid');
          process.stdout.write(match[1]);
          NODE
          )"
          VERIFIED_SHA="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const matrix=JSON.parse(readFileSync('config/v1-release-journey-matrix.json','utf8'));
          process.stdout.write(String(matrix.entries.find(value=>value.id===22)?.liveEvidence?.verifiedSha ?? ''));
          NODE
          )"
          ARTIFACT_NAME="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const matrix=JSON.parse(readFileSync('config/v1-release-journey-matrix.json','utf8'));
          process.stdout.write(String(matrix.entries.find(value=>value.id===22)?.liveEvidence?.artifactName ?? ''));
          NODE
          )"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion')" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')" = "$VERIFIED_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.name')" = 'BERS v1 external release evidence tooling'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.event')" = workflow_dispatch

          evidence_dir=".test-cache-v1-frontend-evidence"
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$evidence_dir"

          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';

          function collectJson(dir) {
            const out=[];
            for (const name of readdirSync(dir)) {
              const path=join(dir,name);
              if (statSync(path).isDirectory()) out.push(...collectJson(path));
              else if (name === 'frontend-security.json') out.push(path);
            }
            return out;
          }

          const matrix=JSON.parse(readFileSync('config/v1-release-journey-matrix.json','utf8'));
          const committed=matrix.entries.find(value=>value.id===22)?.liveEvidence;
          const matches=collectJson('.test-cache-v1-frontend-evidence');
          assert.equal(matches.length,1,'expected exactly one hosted frontend-security.json');
          const artifact=JSON.parse(readFileSync(matches[0],'utf8'));
          assert.equal(artifact.schemaVersion,1);
          assert.equal(artifact.kind,'BERS_V1_FRONTEND_SECURITY_EVIDENCE');
          assert.ok(Number.isInteger(artifact.status) && artifact.status >= 200 && artifact.status < 300);
          const projection=Object.fromEntries(Object.keys(committed).map(key=>[key,artifact[key]]));
          assert.deepEqual(projection,committed,'hosted artifact does not match committed journey 22 evidence');
          NODE

      - name: Check committed diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
