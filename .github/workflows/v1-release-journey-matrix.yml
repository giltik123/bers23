name: BERS v1 browser release journey matrix

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'config/v1-release-journey-matrix.json'
      - 'docs/v1-release-journey-matrix.md'
      - 'tests/v1-release-journey-matrix.test.mjs'
      - 'scripts/test-release-r3*.mjs'
      - 'scripts/test-automation-c3b-retry-cancel-browser-e2e.mjs'
      - 'scripts/test-automation-c3c-studio-browser-e2e.mjs'
      - 'scripts/verify-frontend-security-headers.mjs'
      - '.github/workflows/release-r3*.yml'
      - '.github/workflows/automation-*-browser-e2e-*.yml'
      - '.github/workflows/security-frontend-deployment-contract.yml'
      - '.github/workflows/v1-release-journey-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Prove #233 journey coverage and deployment-evidence state
        run: node --test tests/v1-release-journey-matrix.test.mjs
      - name: Emit truthful journey disposition
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const matrix=JSON.parse(readFileSync('config/v1-release-journey-matrix.json','utf8'));
          const security=matrix.entries.find(value=>value.id===22);
          const proven=matrix.entries.filter(value=>value.disposition==='PROVEN').length;
          const deferred=matrix.entries.filter(value=>value.disposition==='DEFERRED_OUT_OF_V1').length;
          const pending=matrix.entries.filter(value=>value.disposition==='DEPLOYMENT_TARGET_PENDING').length;
          if (deferred !== 1) throw new Error('expected one deferred v1 journey');
          if (security?.disposition === 'DEPLOYMENT_TARGET_PENDING') {
            if (proven !== 20 || pending !== 1) throw new Error('pending journey matrix count mismatch');
            console.log('BERS_V1_FRONTEND_DEPLOYMENT_PENDING');
          } else if (security?.disposition === 'PROVEN') {
            if (proven !== 21 || pending !== 0) throw new Error('proven journey matrix count mismatch');
            console.log('BERS_V1_FRONTEND_DEPLOYMENT_PROVEN');
          } else {
            throw new Error('unexpected journey 22 disposition');
          }
          NODE
      - name: Check committed diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
