name: MobileSAM durable release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobilesam-vit-t-v1.0.2-release
  cancel-in-progress: false

env:
  MODEL_ID: mobilesam-vit-t
  VERSION: 1.0.2
  RELEASE_TAG: mobilesam-vit-t-v1.0.2
  UPSTREAM_REVISION: f706ad9c4eb7f219c00d9050e46328518ffb65d2
  CHECKPOINT_SHA256: 6dbb90523a35330fedd7f1d3dfc66f995213d81b29a5ca8108dbcdd4e37d6c2f
  VERIFICATION_KEY_ID: bers-selection-release-2026-03
  PACK_DIR: ${{ github.workspace }}/.release-pack
  STAGED_PUBLIC_KEY: src/platform/creative/local-ai/models/release-keys/bers-selection-release-2026-03.public-key.pem

jobs:
  build-sign-publish-verify:
    name: Build, sign, publish, and verify v1.0.2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a branch dispatch and signing secret
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.MOBILESAM_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = branch
          test "${GITHUB_REF_NAME}" = main
          test -n "${RELEASE_PRIVATE_KEY}"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Workflow started from main at $(git rev-parse HEAD)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned export environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.1.2 torchvision==0.16.2
          python -m pip install --disable-pip-version-check \
            timm==0.4.12
          python -m pip install --disable-pip-version-check \
            onnx==1.15.0 onnxruntime==1.16.3 numpy==1.26.4
          python - <<'PY'
          import numpy, onnx, onnxruntime, platform, timm, torch, torchvision
          from timm.models.layers import DropPath, to_2tuple, trunc_normal_
          from timm.models.registry import register_model

          assert platform.python_version().startswith("3.11.")
          assert torch.__version__.split("+")[0] == "2.1.2"
          assert torchvision.__version__.split("+")[0] == "0.16.2"
          assert timm.__version__ == "0.4.12"
          assert onnx.__version__ == "1.15.0"
          assert onnxruntime.__version__ == "1.16.3"
          assert numpy.__version__ == "1.26.4"
          print("Pinned export environment verified")
          PY

      - name: Check out pinned MobileSAM source and checkpoint
        run: |
          set -euo pipefail
          git clone https://github.com/ChaoningZhang/MobileSAM "${RUNNER_TEMP}/MobileSAM"
          git -C "${RUNNER_TEMP}/MobileSAM" checkout --detach "${UPSTREAM_REVISION}"
          test "$(git -C "${RUNNER_TEMP}/MobileSAM" rev-parse HEAD)" = "${UPSTREAM_REVISION}"
          echo "${CHECKPOINT_SHA256}  ${RUNNER_TEMP}/MobileSAM/weights/mobile_sam.pt" | sha256sum --check --strict

      - name: Export and check ONNX graphs
        run: |
          set -euo pipefail
          mkdir -p "${PACK_DIR}"
          python scripts/build-mobilesam-release.py \
            --source "${RUNNER_TEMP}/MobileSAM" \
            --output "${PACK_DIR}" \
            --metadata "${PACK_DIR}/metadata.json"

      - name: Create and verify detached artifact signatures
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.MOBILESAM_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/mobilesam-release-private-key.pem"
          install -m 600 /dev/null "${key_file}"
          printf '%s\n' "${RELEASE_PRIVATE_KEY}" > "${key_file}"
          unset RELEASE_PRIVATE_KEY
          trap 'rm -f "${key_file}" "${RUNNER_TEMP}/tampered.onnx"' EXIT
          public_key="${STAGED_PUBLIC_KEY}"
          for artifact in mobilesam-encoder.onnx mobilesam-decoder.onnx; do
            openssl pkeyutl -sign -rawin -inkey "${key_file}" \
              -in "${PACK_DIR}/${artifact}" -out "${PACK_DIR}/${artifact}.sig"
            openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
              -in "${PACK_DIR}/${artifact}" -sigfile "${PACK_DIR}/${artifact}.sig"
          done
          cp "${PACK_DIR}/mobilesam-encoder.onnx" "${RUNNER_TEMP}/tampered.onnx"
          printf '\001' | dd of="${RUNNER_TEMP}/tampered.onnx" bs=1 seek=0 count=1 conv=notrunc status=none
          if openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
            -in "${RUNNER_TEMP}/tampered.onnx" -sigfile "${PACK_DIR}/mobilesam-encoder.onnx.sig"; then
            echo 'Tampered artifact signature was accepted' >&2
            exit 1
          fi
          echo 'Artifact signatures PASS; one-byte tamper rejected'

      - name: Generate and sign staged production manifest
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.MOBILESAM_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/interactive-segmentation.manifest.json"
          signature="${RUNNER_TEMP}/interactive-segmentation.manifest.sig"
          python - "${PACK_DIR}/metadata.json" "${manifest}" <<'PY'
          import json, sys
          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          tag = "mobilesam-vit-t-v1.0.2"
          base = f"https://github.com/giltik123/bers23/releases/download/{tag}"
          manifest = {
            "schemaVersion": 1,
            "modelId": "mobilesam-vit-t",
            "version": "1.0.2",
            "status": "CANDIDATE",
            "upstream": {
              "repository": "https://github.com/ChaoningZhang/MobileSAM",
              "revision": "f706ad9c4eb7f219c00d9050e46328518ffb65d2",
              "checkpointSource": "https://github.com/ChaoningZhang/MobileSAM/blob/f706ad9c4eb7f219c00d9050e46328518ffb65d2/weights/mobile_sam.pt",
              "checkpointSha256": "6dbb90523a35330fedd7f1d3dfc66f995213d81b29a5ca8108dbcdd4e37d6c2f"
            },
            "export": {
              "implementation": "MobileSAM ONNX split export",
              "revision": "f706ad9c4eb7f219c00d9050e46328518ffb65d2",
              "modelType": "vit_t",
              "opset": 17,
              "environment": {
                "os": "Ubuntu 24.04",
                "python": "3.11",
                "pytorch": "2.1.2",
                "torchvision": "0.16.2",
                "timm": "0.4.12",
                "onnx": "1.15.0",
                "onnxRuntime": "1.16.3",
                "numpy": "1.26.4"
              },
              "quantized": False,
              "graphSimplified": False,
              "postExportOptimized": False
            },
            "license": "Apache-2.0",
            "artifacts": {
              name: {
                "url": f"{base}/mobilesam-{name}.onnx",
                **metadata[name],
                "signatureUrl": f"{base}/mobilesam-{name}.onnx.sig"
              } for name in ("encoder", "decoder")
            },
            "verificationKeyId": "bers-selection-release-2026-03"
          }
          with open(sys.argv[2], "w", encoding="utf-8", newline="\n") as stream:
            json.dump(manifest, stream, indent=2)
            stream.write("\n")
          PY
          key_file="${RUNNER_TEMP}/mobilesam-release-private-key.pem"
          binary_signature="${RUNNER_TEMP}/manifest.sig"
          install -m 600 /dev/null "${key_file}"
          printf '%s\n' "${RELEASE_PRIVATE_KEY}" > "${key_file}"
          unset RELEASE_PRIVATE_KEY
          trap 'rm -f "${key_file}" "${binary_signature}"' EXIT
          openssl pkeyutl -sign -rawin -inkey "${key_file}" -in "${manifest}" -out "${binary_signature}"
          base64 -w 0 "${binary_signature}" > "${signature}"
          printf '\n' >> "${signature}"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey "${STAGED_PUBLIC_KEY}" \
            -in "${manifest}" -sigfile "${binary_signature}"
          echo 'Staged v1.0.2 manifest signature PASS'

      - name: Run release and security gates
        run: |
          set -euo pipefail
          npm ci
          npm run verify:selection-model
          npm run check:model-weight-tracking
          npm run check:browser-bundle
          npm run typecheck
          npm run server:typecheck
          npm run lint
          npm run build
          npm run server:build
          test "$(git ls-files '*.onnx' | wc -l)" -eq 0
          test "$(git log --all --format= --name-only -- '*.onnx' | sed '/^$/d' | sort -u | wc -l)" -eq 0
          if git grep -n -I -E -- '^-----BEGIN (ED25519 |EC |RSA |OPENSSH )?PRIVATE KEY-----$'; then
            echo 'Private key material is tracked by Git' >&2
            exit 1
          fi
          test -z "$(git log --all --format=%H -G'^-----BEGIN (ED25519 |EC |RSA |OPENSSH )?PRIVATE KEY-----$' -- .)"
          if find dist -type f -print0 | xargs -0 grep -l -E -- '^-----BEGIN (ED25519 |EC |RSA |OPENSSH )?PRIVATE KEY-----$'; then
            echo 'Private key material is present in the browser bundle' >&2
            exit 1
          fi

      - name: Create GitHub Release and upload exactly four assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1
          gh release create "${RELEASE_TAG}" --title 'MobileSAM ViT-T Model Pack v1.0.2' \
            --target "${GITHUB_SHA}" --notes 'Signed CANDIDATE MobileSAM ViT-T external model pack.'
          gh release upload "${RELEASE_TAG}" \
            "${PACK_DIR}/mobilesam-encoder.onnx" \
            "${PACK_DIR}/mobilesam-encoder.onnx.sig" \
            "${PACK_DIR}/mobilesam-decoder.onnx" \
            "${PACK_DIR}/mobilesam-decoder.onnx.sig"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | length')" -eq 4

      - name: Verify downloaded published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="${RUNNER_TEMP}/published-release"
          mkdir "${published}"
          base="https://github.com/giltik123/bers23/releases/download/${RELEASE_TAG}"
          for asset in mobilesam-encoder.onnx mobilesam-encoder.onnx.sig mobilesam-decoder.onnx mobilesam-decoder.onnx.sig; do
            status=000
            for attempt in {1..12}; do
              status="$(curl --silent --show-error --location --output "${published}/${asset}" --write-out '%{http_code}' "${base}/${asset}")"
              test "${status}" = 200 && break
              sleep 5
            done
            test "${status}" = 200
            echo "${asset}: HTTP ${status}"
          done
          python - "${PACK_DIR}/metadata.json" "${published}" <<'PY'
          import hashlib, json, pathlib, sys
          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          root = pathlib.Path(sys.argv[2])
          for name in ("encoder", "decoder"):
              path = root / f"mobilesam-{name}.onnx"
              assert path.stat().st_size == metadata[name]["size"], f"{name} size mismatch"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == metadata[name]["sha256"], f"{name} SHA mismatch"
              print(f"{name}: size PASS; SHA PASS")
          PY
          public_key="${STAGED_PUBLIC_KEY}"
          for name in encoder decoder; do
            openssl pkeyutl -verify -rawin -pubin -inkey "${public_key}" \
              -in "${published}/mobilesam-${name}.onnx" \
              -sigfile "${published}/mobilesam-${name}.onnx.sig"
            echo "${name}: published signature PASS"
          done

      - name: Atomically activate verified v1.0.2 metadata on main
        id: release_commit
        run: |
          set -euo pipefail
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "${GITHUB_SHA}"; then
            echo "main moved after workflow start; refusing to publish metadata" >&2
            exit 1
          fi
          manifest_dir=src/platform/creative/local-ai/models
          cp "${RUNNER_TEMP}/interactive-segmentation.manifest.json" \
            "${manifest_dir}/interactive-segmentation.manifest.json"
          cp "${RUNNER_TEMP}/interactive-segmentation.manifest.sig" \
            "${manifest_dir}/interactive-segmentation.manifest.sig"
          cp "${STAGED_PUBLIC_KEY}" \
            "${manifest_dir}/interactive-segmentation.public-key.pem"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${manifest_dir}/interactive-segmentation.manifest.json" \
            "${manifest_dir}/interactive-segmentation.manifest.sig" \
            "${manifest_dir}/interactive-segmentation.public-key.pem"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'chore: publish MobileSAM v1.0.2 manifest'
          npm run verify:selection-model
          git push origin "HEAD:main"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish release summary
        run: |
          {
            echo '## MobileSAM ViT-T v1.0.2 release'
            echo
            echo '- Status: CANDIDATE'
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Commit: \`${{ steps.release_commit.outputs.sha }}\`"
            echo '- ONNX Runtime CPUExecutionProvider: graph sanity only (not browser-WASM acceptance)'
            echo '- Artifact and manifest signatures: PASS'
            echo '- One-byte tamper test: PASS (rejected)'
            echo '- Published HTTP/download verification: PASS'
            echo '```json'
            cat "${PACK_DIR}/metadata.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
