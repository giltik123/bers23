name: Asset Library RU/EN accessibility
on:
  pull_request:
    branches: ["main"]
    paths:
      - 'src/components/assets/AssetCard.jsx'
      - 'src/components/assets/AssetDetails.jsx'
      - 'src/components/assets/assetPresentation.js'
      - 'src/lib/i18n/locales/en/assets.js'
      - 'src/lib/i18n/locales/ru/index.js'
      - 'tests/asset-library-ru-a11y.test.mjs'
      - '.github/workflows/asset-library-ru-a11y.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-library-ru-a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Asset Library localization and accessibility regressions
        run: node --test tests/asset-library-ru-a11y.test.mjs
      - name: Frontend typecheck and production build
        run: |
          npm run typecheck
          npm run build
      - name: Verify diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}"..HEAD
