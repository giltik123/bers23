name: R3 browser release E2E

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'config/frontendSecurityPolicy.mjs'
      - 'src/App.jsx'
      - 'src/api/coreClient.js'
      - 'src/api/coreResourceUrl.js'
      - 'src/api/managedGarmentClient.js'
      - 'src/api/managedWardrobeClient.js'
      - 'src/api/managedGarmentCollectionClient.js'
      - 'src/application/createCrop.ts'
      - 'src/application/createResize.ts'
      - 'src/application/createOrthogonalTransform.ts'
      - 'src/application/createBackgroundIsolation.ts'
      - 'src/application/selection/**'
      - 'src/application/editor/orthogonalTransformStartPolicy.js'
      - 'src/application/editor/recoverFinalSourceConflict.js'
      - 'src/application/fashion/**'
      - 'src/components/ProtectedRoute.jsx'
      - 'src/components/editor/CropToolbar.jsx'
      - 'src/components/editor/ResizeToolbar.jsx'
      - 'src/components/editor/SelectionToolbar.jsx'
      - 'src/components/editor/ImageCanvas.jsx'
      - 'src/components/editor/HistoryControls.jsx'
      - 'src/components/editor/OrthogonalTransformToolbar.jsx'
      - 'src/components/editor/ResultCompare.jsx'
      - 'src/components/editor/VersionsPanel.jsx'
      - 'src/components/editor/fashion/**'
      - 'src/hooks/useProject.js'
      - 'src/lib/AuthContext.jsx'
      - 'src/lib/projectService.js'
      - 'src/lib/scene/**'
      - 'src/lib/notifications/**'
      - 'src/lib/jobs/jobAnalytics.js'
      - 'src/lib/recipes/recipeAnalytics.js'
      - 'src/lib/i18n/LocalizationAnalytics.js'
      - 'src/pages/Login.jsx'
      - 'src/pages/Projects.jsx'
      - 'src/pages/Editor.jsx'
      - 'src/platform/creative/deterministic/**'
      - 'src/platform/creative/local-ai/browser/BrowserOnnxSessionFactory.ts'
      - 'server/core/auth/**'
      - 'server/core/projects/**'
      - 'server/core/artifacts/**'
      - 'server/core/fashion/**'
      - 'server/core/http/**'
      - 'server/core/localExecution/**'
      - 'server/core/config.ts'
      - 'server/index.ts'
      - 'scripts/build-core-server.mjs'
      - 'scripts/classify-tiny-sd-d4-secure-threading.mjs'
      - 'scripts/production-migration-inventory.mjs'
      - 'scripts/test-release-r3a-browser-e2e.mjs'
      - 'scripts/test-release-r3b-browser-e2e.mjs'
      - 'scripts/test-release-r3c-browser-e2e.mjs'
      - 'scripts/test-release-r3d-browser-e2e.mjs'
      - 'scripts/test-release-r3e-browser-e2e.mjs'
      - 'scripts/test-release-r3f-browser-e2e.mjs'
      - 'scripts/test-release-r3g-browser-e2e.mjs'
      - 'scripts/test-release-r3h-browser-e2e.mjs'
      - 'tests/editor-zero-object-navigation.test.mjs'
      - 'tests/editor-orthogonal-transform-ui.test.mjs'
      - 'tests/editor-final-source-conflict-recovery.test.mjs'
      - 'tests/auth-client-contract.test.mjs'
      - 'tests/auth-public-route-routing.test.mjs'
      - 'tests/core-resource-url.test.mjs'
      - 'tests/core-image-csp.test.mjs'
      - 'tests/release-r3a-browser-boundaries.test.mjs'
      - 'tests/release-r3b-browser-boundaries.test.mjs'
      - 'tests/release-r3c-browser-boundaries.test.mjs'
      - 'tests/release-r3d-browser-boundaries.test.mjs'
      - 'tests/release-r3e-browser-boundaries.test.mjs'
      - 'tests/release-r3f-browser-boundaries.test.mjs'
      - 'tests/release-r3g-browser-boundaries.test.mjs'
      - 'tests/release-r3h-browser-boundaries.test.mjs'
      - 'tests/release-r3b-production-orthogonal-prepare.test.ts'
      - 'tests/frontend-security-deployment-contract.test.mjs'
      - '.github/workflows/release-r3a-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-r3-browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-project-editor-deterministic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: release_r3a_test
          POSTGRES_USER: release_r3a_test
          POSTGRES_PASSWORD: release_r3a_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_r3a_test -d release_r3a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://release_r3a_test:release_r3a_test@127.0.0.1:5432/release_r3a_test
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      VITE_CORE_API_URL: http://127.0.0.1:4188/api/core
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Preserve financial redesign freeze
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          git diff --exit-code "$BASE_SHA"..HEAD -- \
            server/transactions/application/financialAccountPorts.ts \
            server/transactions/infrastructure/postgres/postgresFinancialAccountStore.ts \
            server/transactions/infrastructure/postgres/postgresFinancialAccountPolicy.ts \
            server/transactions/infrastructure/postgres/postgresFinancialTrialPolicy.ts \
            server/transactions/infrastructure/postgres/migrations/038_financial_account_foundation.sql \
            server/core/http/financialAccountHttpAdapter.ts \
            server/core/http/financialAccountPolicyHttpAdapter.ts \
            server/core/http/financialTrialHttpAdapter.ts \
            src/lib/credits \
            src/lib/subscriptions \
            src/pages/Billing.jsx \
            src/pages/Subscription.jsx
      - name: Typecheck browser and Core release surfaces
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Preserve R3 baseline deterministic edit and Project lifecycle composition contracts
        run: |
          node --test tests/auth-public-route-routing.test.mjs
          node --test tests/editor-zero-object-navigation.test.mjs
          node --test tests/editor-orthogonal-transform-ui.test.mjs
          node --test tests/editor-final-source-conflict-recovery.test.mjs
          node --test tests/auth-client-contract.test.mjs
          node --test tests/core-resource-url.test.mjs
          node --test tests/core-image-csp.test.mjs
          node --test tests/release-r3a-browser-boundaries.test.mjs
          node --test tests/release-r3b-browser-boundaries.test.mjs
          node --test tests/release-r3c-browser-boundaries.test.mjs
          node --test tests/release-r3d-browser-boundaries.test.mjs
          node --test tests/release-r3e-browser-boundaries.test.mjs
          node --test tests/release-r3f-browser-boundaries.test.mjs
          node --test tests/release-r3g-browser-boundaries.test.mjs
          node --test tests/release-r3h-browser-boundaries.test.mjs
      - name: Prove runtime-compatible frontend security and preserve worker lockdown
        run: |
          mkdir -p .test-cache/release-r3
          node --test tests/frontend-security-deployment-contract.test.mjs
          node scripts/classify-tiny-sd-d4-secure-threading.mjs --report .test-cache/release-r3/d4-secure-threading.json
          grep -q '"result": "SECURE_THREADING_BLOCKED"' .test-cache/release-r3/d4-secure-threading.json
          grep -q '"requireTrustedTypesForScript": false' .test-cache/release-r3/d4-secure-threading.json
      - name: Build immutable Core and apply its packaged production migrations
        run: |
          npm run server:build
          test -f dist-server/server.mjs
          test -f dist-server/migrations/038_financial_account_foundation.sql
          node dist-server/migrate.mjs migrate
          node dist-server/migrate.mjs check
      - name: Generate and mask ephemeral R3 runtime secrets on the runner
        run: |
          set -euo pipefail
          for name in FAL_KEY JWT_SECRET AUTH_CHALLENGE_SECRET RESEND_API_KEY GOOGLE_OAUTH_CLIENT_SECRET ARTIFACT_SIGNING_SECRET; do
            value="$(openssl rand -hex 32)"
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
      - name: Prove production composition prepares browser-shaped orthogonal ticket
        run: |
          mkdir -p .test-cache/release-r3-production-probe
          npx esbuild tests/release-r3b-production-orthogonal-prepare.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/release-r3-production-probe/orthogonal-prepare.test.mjs \
            --external:node:* --external:pg --external:sharp
          node --test .test-cache/release-r3-production-probe/orthogonal-prepare.test.mjs
      - name: Build real SPA against the built Core origin
        run: |
          npm run build
          test -f dist/index.html
      - name: Bundle accepted R3b browser baseline without replacing production stores
        run: |
          mkdir -p .test-cache/release-r3
          npx esbuild scripts/test-release-r3b-browser-e2e.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/release-r3/test-release-r3b-browser-e2e.mjs \
            --external:node:* --external:pg --external:sharp --external:playwright
      - name: Prove accepted R3b Auth Project Rotate Accept Undo Redo baseline
        run: node .test-cache/release-r3/test-release-r3b-browser-e2e.mjs
      - name: Bundle external cumulative R3c Project lifecycle harness without replacing production stores
        run: |
          npx esbuild scripts/test-release-r3c-browser-e2e.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/release-r3/test-release-r3c-browser-e2e.mjs \
            --external:node:* --external:pg --external:sharp --external:playwright
      - name: Prove built SPA -> built Core -> PostgreSQL Discard Version Restore stale FINAL journey
        run: node .test-cache/release-r3/test-release-r3c-browser-e2e.mjs
      - name: Prove cumulative R3c harness uses production Project and local authorities with no forbidden fallback
        run: |
          set -euo pipefail
          script=scripts/test-release-r3c-browser-e2e.mjs
          grep -q "R3B_BROWSER_DETERMINISTIC_EDIT_ACCEPTED" scripts/test-release-r3b-browser-e2e.mjs
          grep -q "dist-server/server.mjs" "$script"
          grep -q "path.resolve('dist')" "$script"
          grep -q "NODE_ENV: 'production'" "$script"
          grep -q "PostgresAuthStore" "$script"
          grep -q "canonical_projects" "$script"
          grep -q "canonical_project_history" "$script"
          grep -q "canonical_project_versions" "$script"
          grep -q "Rotate 90° clockwise" "$script"
          grep -q "Save current as version" "$script"
          grep -q "RESTORE_VERSION" "$script"
          grep -q "final_source_conflict" "$script"
          grep -q "R3C_BROWSER_PROJECT_LIFECYCLE_ACCEPTED" "$script"
          grep -q "providerCalls, 0" "$script"
          grep -q "diagnostics.creativeRequests, \[\]" "$script"
          grep -q "diagnostics.legacyRequests, \[\]" "$script"
          grep -q "diagnostics.financialRequests, \[\]" "$script"
          grep -q "diagnostics.externalBrowserRequests, \[\]" "$script"
          grep -q "assertSignedCoreImage" "$script"
          ! grep -E -q 'financialAccount|financialTrial|credit_grants|credit_wallets' "$script"
      - name: Bundle focused R3d deterministic geometry harness without replacing production stores
        run: |
          npx esbuild scripts/test-release-r3d-browser-e2e.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/release-r3/test-release-r3d-browser-e2e.mjs \
            --external:node:* --external:pg --external:sharp --external:playwright
      - name: Prove R3d Crop Resize Preview Discard Accept Undo Redo journey
        run: node .test-cache/release-r3/test-release-r3d-browser-e2e.mjs
      - name: Prove R3d geometry harness remains LOCAL_ONLY and Core authoritative
        run: |
          set -euo pipefail
          script=scripts/test-release-r3d-browser-e2e.mjs
          grep -q "dist-server/server.mjs" "$script"
          grep -q "path.resolve('dist')" "$script"
          grep -q "NODE_ENV: 'production'" "$script"
          grep -q "PostgresAuthStore" "$script"
          grep -q "canonical_projects" "$script"
          grep -q "canonical_project_history" "$script"
          grep -q "canonical_image_artifacts" "$script"
          grep -q "Start crop" "$script"
          grep -q "Apply crop" "$script"
          grep -q "Start resize" "$script"
          grep -q "Apply resize" "$script"
          grep -q "R3D_BROWSER_DETERMINISTIC_GEOMETRY_ACCEPTED" "$script"
          grep -q "providerCalls, 0" "$script"
          grep -q "diagnostics.creativeRequests, \[\]" "$script"
          grep -q "diagnostics.financialRequests, \[\]" "$script"
          grep -q "diagnostics.externalBrowserRequests, \[\]" "$script"
          ! grep -E -q 'financialAccount|financialTrial|credit_grants|credit_wallets' "$script"
      - name: Bundle focused R3e Selection MASK harness without replacing production stores
        run: |
          npx esbuild scripts/test-release-r3e-browser-e2e.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/release-r3/test-release-r3e-browser-e2e.mjs \
            --external:node:* --external:pg --external:sharp --external:playwright
      - name: Prove R3e Selection canonical MASK Background Isolation journey
        run: node .test-cache/release-r3/test-release-r3e-browser-e2e.mjs
      - name: Prove R3e Selection MASK harness remains LOCAL_ONLY and Core authoritative
        run: |
          set -euo pipefail
          script=scripts/test-release-r3e-browser-e2e.mjs
          grep -q "dist-server/server.mjs" "$script"
          grep -q "path.resolve('dist')" "$script"
          grep -q "NODE_ENV: 'production'" "$script"
          grep -q "PostgresAuthStore" "$script"
          grep -q "canonical_projects" "$script"
          grep -q "canonical_project_history" "$script"
          grep -q "canonical_image_artifacts" "$script"
          grep -q "canonical_mask_artifacts" "$script"
          grep -q "Smart Select" "$script"
          grep -q "name: 'Add'" "$script"
          grep -F -q "projectImage.click({ position:" "$script"
          ! grep -F -q "page.mouse." "$script"
          grep -q "name: 'Done'" "$script"
          grep -q "/api/core/artifacts/masks" "$script"
          grep -q "Remove background" "$script"
          grep -q "R3E_BROWSER_SELECTION_MASK_ACCEPTED" "$script"
          grep -q "providerCalls, 0" "$script"
          grep -q "diagnostics.creativeRequests, \[\]" "$script"
          grep -q "diagnostics.financialRequests, \[\]" "$script"
          grep -q "diagnostics.externalBrowserRequests, \[\]" "$script"
          ! grep -E -q 'financialAccount|financialTrial|credit_grants|credit_wallets' "$script"
      - name: Bundle focused R3f LOCAL_ONLY failure harness without replacing production stores
        run: |
          npx esbuild scripts/test-release-r3f-browser-e2e.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/release-r3/test-release-r3f-browser-e2e.mjs \
            --external:node:* --external:pg --external:sharp --external:playwright
      - name: Prove R3f LOCAL_ONLY local capability failure cannot cross Provider or Billing
        run: node .test-cache/release-r3/test-release-r3f-browser-e2e.mjs
      - name: Prove R3f failure harness uses real Core and forbids fallback authority
        run: |
          set -euo pipefail
          script=scripts/test-release-r3f-browser-e2e.mjs
          grep -q "dist-server/server.mjs" "$script"
          grep -q "path.resolve('dist')" "$script"
          grep -q "NODE_ENV: 'production'" "$script"
          grep -q "PostgresAuthStore" "$script"
          grep -q "browserContext.addInitScript" "$script"
          grep -q "CompressionStream" "$script"
          grep -q "canonical_projects" "$script"
          grep -q "canonical_project_history" "$script"
          grep -q "canonical_image_artifacts" "$script"
          grep -q "local_execution_tickets" "$script"
          grep -q "consumed_at" "$script"
          grep -q "finalized_status" "$script"
          grep -q "R3F_BROWSER_LOCAL_ONLY_FAILURE_ACCEPTED" "$script"
          grep -q "providerCalls, 0" "$script"
          grep -q "diagnostics.creativeRequests, \[\]" "$script"
          grep -q "diagnostics.financialRequests, \[\]" "$script"
          grep -q "diagnostics.externalBrowserRequests, \[\]" "$script"
          grep -q "diagnostics.projectMutations, \[\]" "$script"
          ! grep -E -q 'page\.route|browserContext\.route|context\.route|route\.abort|route\.fulfill|route\.continue' "$script"
          ! grep -E -q 'financialAccount|financialTrial|credit_grants|credit_wallets' "$script"
      - name: Bundle focused R3g zero-object Fashion Outfits harness without replacing production stores
        run: |
          npx esbuild scripts/test-release-r3g-browser-e2e.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/release-r3/test-release-r3g-browser-e2e.mjs \
            --external:node:* --external:pg --external:sharp --external:playwright
      - name: Prove R3g zero-object Project Fashion Outfits journey
        run: node .test-cache/release-r3/test-release-r3g-browser-e2e.mjs
      - name: Prove R3g navigation uses canonical Fashion authorities without Detect Object MASK or fallback
        run: |
          set -euo pipefail
          script=scripts/test-release-r3g-browser-e2e.mjs
          grep -q "dist-server/server.mjs" "$script"
          grep -q "path.resolve('dist')" "$script"
          grep -q "NODE_ENV: 'production'" "$script"
          grep -q "PostgresAuthStore" "$script"
          grep -q "canonical_projects" "$script"
          grep -q "canonical_project_history" "$script"
          grep -q "canonical_mask_artifacts" "$script"
          grep -q "local_execution_tickets" "$script"
          grep -q "p.objects" "$script"
          grep -q "/api/core/garments" "$script"
          grep -q "/api/core/wardrobe/garments" "$script"
          grep -q "/api/core/wardrobe/outfits" "$script"
          grep -q "Canonical fashion wardrobe" "$script"
          grep -q "Canonical Outfit builder" "$script"
          grep -q "R3G_BROWSER_ZERO_OBJECT_FASHION_OUTFITS_ACCEPTED" "$script"
          grep -q "providerCalls, 0" "$script"
          grep -q "diagnostics.localExecutionRequests, \[\]" "$script"
          grep -q "diagnostics.creativeRequests, \[\]" "$script"
          grep -q "diagnostics.financialRequests, \[\]" "$script"
          grep -q "diagnostics.maskRequests, \[\]" "$script"
          grep -q "diagnostics.projectMutations, \[\]" "$script"
          grep -q "diagnostics.externalBrowserRequests, \[\]" "$script"
          ! grep -E -q 'page\.route|browserContext\.route|context\.route|route\.abort|route\.fulfill|route\.continue' "$script"
          ! grep -E -q 'financialAccount|financialTrial|credit_grants|credit_wallets|saveObjects|persistMask|smartPoint|selectionPointer' "$script"
      - name: Bundle focused R3h managed Fashion mutation harness without replacing production stores
        run: |
          npx esbuild scripts/test-release-r3h-browser-e2e.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/release-r3/test-release-r3h-browser-e2e.mjs \
            --external:node:* --external:pg --external:sharp --external:playwright
      - name: Prove R3h managed garment create favorite collection membership journey
        run: node .test-cache/release-r3/test-release-r3h-browser-e2e.mjs
      - name: Prove R3h stays on revision-bound canonical Fashion mutation authority
        run: |
          set -euo pipefail
          script=scripts/test-release-r3h-browser-e2e.mjs
          grep -q "dist-server/server.mjs" "$script"
          grep -q "path.resolve('dist')" "$script"
          grep -q "NODE_ENV: 'production'" "$script"
          grep -q "PostgresAuthStore" "$script"
          grep -q "garmentSourcePixelSha256" "$script"
          grep -q "storedPixelSha256" "$script"
          grep -q "Managed Garment response hash must bind to durable PostgreSQL bytes" "$script"
          grep -q "x-expected-garment-revision" "$script"
          grep -q "x-expected-collection-revision" "$script"
          grep -q "canonical_garments" "$script"
          grep -q "canonical_garment_views" "$script"
          grep -q "canonical_garment_tags" "$script"
          grep -q "canonical_garment_collections" "$script"
          grep -q "canonical_garment_collection_members" "$script"
          grep -q "PNG_RGBA8_LOSSLESS" "$script"
          grep -q "POSTGRES_BYTEA_V1" "$script"
          grep -q "R3H_BROWSER_MANAGED_GARMENT_COLLECTION_ACCEPTED" "$script"
          grep -q "providerCalls, 0" "$script"
          grep -q "diagnostics.localExecutionRequests, \[\]" "$script"
          grep -q "diagnostics.creativeRequests, \[\]" "$script"
          grep -q "diagnostics.financialRequests, \[\]" "$script"
          grep -q "diagnostics.maskRequests, \[\]" "$script"
          grep -q "diagnostics.genericAssetRequests, \[\]" "$script"
          grep -q "diagnostics.projectMutations, \[\]" "$script"
          grep -q "diagnostics.externalBrowserRequests, \[\]" "$script"
          ! grep -E -q 'page\.route|browserContext\.route|context\.route|route\.abort|route\.fulfill|route\.continue' "$script"
          ! grep -E -q 'financialAccount|financialTrial|credit_grants|credit_wallets' "$script"
      - name: Check committed diff whitespace
        run: git diff --check "$BASE_SHA"..HEAD
