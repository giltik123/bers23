name: Exposure Deterministic Tool Candidate

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/platform/creative/deterministic/Exposure.ts'
      - 'src/platform/creative/deterministic/ExposureIdentity.js'
      - 'src/platform/creative/deterministic/DeterministicToolRegistry.ts'
      - 'server/core/localExecution/productionLocalExecutorPolicy.ts'
      - 'server/core/providers/productionExecutionCapabilities.ts'
      - 'src/platform/creative/canonical/planning/CanonicalPlanningService.ts'
      - 'tests/deterministic-exposure-contract.test.ts'
      - 'tests/deterministic-crop-contract.test.ts'
      - 'tests/background-isolation-canonical-wiring.test.ts'
      - '.github/workflows/exposure-deterministic-tool-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exposure-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core registry surfaces
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Bundle Exposure and registry regressions
        run: |
          set -euo pipefail
          mkdir -p .test-cache/p192-exposure
          for file in \
            tests/deterministic-exposure-contract.test.ts \
            tests/deterministic-crop-contract.test.ts \
            tests/background-isolation-canonical-wiring.test.ts; do
            out=".test-cache/p192-exposure/$(basename "${file%.ts}").mjs"
            npx esbuild "$file" --bundle --platform=node --format=esm --target=node24 --outfile="$out" --external:node:* --external:pg --external:sharp
          done
      - name: Prove Exposure kernel and data-only registry contract
        run: |
          node --test \
            .test-cache/p192-exposure/deterministic-exposure-contract.test.mjs \
            .test-cache/p192-exposure/deterministic-crop-contract.test.mjs \
            .test-cache/p192-exposure/background-isolation-canonical-wiring.test.mjs
      - name: Build production browser
        run: npm run build
      - name: Prove Exposure candidate remains production fail closed
        run: |
          set -euo pipefail
          kernel=src/platform/creative/deterministic/Exposure.ts
          registry=src/platform/creative/deterministic/DeterministicToolRegistry.ts
          policy=server/core/localExecution/productionLocalExecutorPolicy.ts
          capabilities=server/core/providers/productionExecutionCapabilities.ts
          planner=src/platform/creative/canonical/planning/CanonicalPlanningService.ts
          grep -q "SRGB_ENCODED_BYTE_DOMAIN" "$registry"
          grep -q "Q16_16_COMMITTED_EIGHTH_STOP_TABLE" "$registry"
          grep -q "EXPOSURE_GAIN_Q16_BY_EIGHTH_STOP" "$kernel"
          grep -q "transparent RGB bytes are transformed" "$kernel"
          ! grep -q "EXPOSURE_CAPABILITY" "$policy"
          ! grep -q "local:tool:exposure:v1" "$policy"
          ! grep -q "EXPOSURE_CAPABILITY" "$capabilities"
          ! grep -q "EXPOSURE" "$planner"
          test -n "$BASE_SHA"
          git diff --check "$BASE_SHA"..HEAD
