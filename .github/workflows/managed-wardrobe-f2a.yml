name: Fashion F2a managed wardrobe authority

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  managed-wardrobe-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: managed_wardrobe_f2a_test
          POSTGRES_USER: managed_wardrobe_f2a_test
          POSTGRES_PASSWORD: managed_wardrobe_f2a_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U managed_wardrobe_f2a_test -d managed_wardrobe_f2a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://managed_wardrobe_f2a_test:managed_wardrobe_f2a_test@127.0.0.1:5432/managed_wardrobe_f2a_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA before dependency or database work
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck Core server
        run: npm run server:typecheck
      - name: Build production Core and prove migrations 022/023 are packaged
        run: |
          npm run server:build
          test -f dist/core-server/core/fashion/migrations/022_managed_garments_and_initial_views.sql
          test -f dist/core-server/core/fashion/migrations/023_managed_garment_wardrobe_metadata.sql
      - name: Bundle F2a and F1b PostgreSQL acceptance
        run: |
          mkdir -p .test-cache/managed-wardrobe-f2a/migrations
          node --input-type=module - <<'EOF'
          import { build } from 'esbuild';
          const common = {
            bundle: true,
            platform: 'node',
            format: 'esm',
            target: 'node24',
            external: ['pg', 'sharp', 'node:*'],
          };
          await build({
            ...common,
            entryPoints: ['tests/managed-wardrobe-metadata-postgres.test.ts'],
            outfile: '.test-cache/managed-wardrobe-f2a/managed-wardrobe-metadata-postgres.test.mjs',
          });
          await build({
            ...common,
            entryPoints: ['tests/managed-garment-multiview-postgres.test.ts'],
            outfile: '.test-cache/managed-wardrobe-f2a/managed-garment-multiview-postgres.test.mjs',
          });
          EOF
          cp server/core/fashion/migrations/022_managed_garments_and_initial_views.sql .test-cache/managed-wardrobe-f2a/migrations/
          cp server/core/fashion/migrations/023_managed_garment_wardrobe_metadata.sql .test-cache/managed-wardrobe-f2a/migrations/
      - name: Prove typed metadata, shared revision concurrency, lifecycle, deletion and drift repair
        run: node --test --test-concurrency=1 .test-cache/managed-wardrobe-f2a/managed-wardrobe-metadata-postgres.test.mjs
      - name: Preserve F1b multi-view authority on Wardrobe schema
        run: node --test --test-concurrency=1 .test-cache/managed-wardrobe-f2a/managed-garment-multiview-postgres.test.mjs
      - name: Preserve zero-object Fashion navigation lockdown
        run: node --test tests/editor-zero-object-navigation.test.mjs
