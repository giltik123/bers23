name: Sprint 6.42 integrated acceptance

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  integrated-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integration_test
          POSTGRES_USER: integration_test
          POSTGRES_PASSWORD: integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration_test -d integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://integration_test:integration_test@127.0.0.1:5432/integration_test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint
      - name: A plus B device capability integration
        run: |
          mkdir -p .test-cache/6.42-integration
          npx esbuild tests/device-capability-fleet-integration.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/device-capability-fleet-integration.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/device-capability-fleet-integration.test.mjs
      - name: C0 lazy browser Local AI composition
        run: |
          npx esbuild tests/browser-local-ai-composition.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --loader:.pem=text --loader:.sig=text --loader:.wasm=file \
            --outfile=.test-cache/6.42-integration/browser-local-ai-composition.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/browser-local-ai-composition.test.mjs
          grep -F "createSelectionSegmentation({ projectId: project.id, imageArtifactId" src/pages/Editor.jsx
      - name: C1 deterministic mask refinement lineage
        run: |
          npx esbuild tests/mask-refinement-lineage.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/mask-refinement-lineage.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/mask-refinement-lineage.test.mjs
      - name: C1 real PostgreSQL mask lineage authority
        run: node --experimental-strip-types --test server/core/artifacts/maskArtifactLineage.integration.test.mjs
      - name: C2 versioned authority, canonical wiring and browser executor
        run: |
          npx esbuild tests/local-execution-v2-executor-contract.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/local-execution-v2-executor-contract.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/local-execution-v2-executor-contract.test.mjs
          npx esbuild tests/background-isolation-canonical-wiring.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/background-isolation-canonical-wiring.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/background-isolation-canonical-wiring.test.mjs
          npx esbuild tests/background-isolation-browser-executor.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/background-isolation-browser-executor.test.mjs \
            --external:node:* --external:sharp
          node --test .test-cache/6.42-integration/background-isolation-browser-executor.test.mjs
          npx esbuild tests/background-isolation-browser-composition.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/background-isolation-browser-composition.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/background-isolation-browser-composition.test.mjs
          grep -F "createBackgroundIsolation({ projectId: project.id })" src/pages/Editor.jsx
          grep -F "finalArtifactId: result.canonicalArtifactId" src/pages/Editor.jsx
      - name: C2 real PostgreSQL pixel, lineage, replay and zero-cloud vertical
        run: |
          mkdir -p .test-cache/6.42-integration/migrations .test-cache/artifacts/migrations
          npx esbuild tests/background-isolation-postgres-vertical.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/background-isolation-postgres-vertical.test.mjs \
            --external:node:* --external:pg --external:sharp
          cp server/transactions/infrastructure/postgres/migrations/001_transaction_store.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/002_canonical_mask_artifacts.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/003_canonical_final_image_artifacts.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/004_canonical_projects_and_originals.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/005_canonical_project_history_versions.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/006_project_history_acceptance_hardening.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/007_project_history_source_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/008_canonical_auth_identity_sessions.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/009_auth_lifecycle_oauth.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/010_registration_attempt_binding.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/011_auth_abuse_session_controls.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/012_local_execution_uploads.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/013_local_execution_ticket_ledger.sql .test-cache/artifacts/migrations/
          node --test .test-cache/6.42-integration/background-isolation-postgres-vertical.test.mjs
      - name: C3 Real-ESRGAN candidate, canonical and browser/server contracts
        run: |
          npx esbuild tests/realesrgan-release-policy.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-release-policy.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/realesrgan-release-policy.test.mjs
          npx esbuild tests/realesrgan-canonical-wiring.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-canonical-wiring.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/realesrgan-canonical-wiring.test.mjs
          npx esbuild tests/realesrgan-workflow-verifier.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-workflow-verifier.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/realesrgan-workflow-verifier.test.mjs
          npx esbuild tests/realesrgan-browser-executor.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-browser-executor.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/realesrgan-browser-executor.test.mjs
          npx esbuild tests/realesrgan-browser-composition.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --loader:.wasm=file \
            --outfile=.test-cache/6.42-integration/realesrgan-browser-composition.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/realesrgan-browser-composition.test.mjs
          node --test tests/realesrgan-editor-boundary.test.mjs
          node --test tests/realesrgan-release-workflow.test.mjs
          npx esbuild tests/realesrgan-service-contract.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-service-contract.test.mjs \
            --external:node:* --external:sharp
          node --test .test-cache/6.42-integration/realesrgan-service-contract.test.mjs
          python -m py_compile scripts/build-realesrgan-x4v3-release.py
          grep -F '"artifactState": "EXPORT_REQUIRED"' src/platform/creative/local-ai/models/super-resolution.manifest.json
      - name: C3 real PostgreSQL model admission, variable-canvas history, replay and zero-cloud vertical
        run: |
          mkdir -p .test-cache/6.42-integration/migrations .test-cache/artifacts/migrations
          npx esbuild tests/project-dimension-history-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/project-dimension-history-postgres.test.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/realesrgan-postgres-vertical.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-postgres-vertical.test.mjs \
            --external:node:* --external:pg --external:sharp
          cp server/transactions/infrastructure/postgres/migrations/001_transaction_store.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/002_canonical_mask_artifacts.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/003_canonical_final_image_artifacts.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/004_canonical_projects_and_originals.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/005_canonical_project_history_versions.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/006_project_history_acceptance_hardening.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/007_project_history_source_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/008_canonical_auth_identity_sessions.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/009_auth_lifecycle_oauth.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/010_registration_attempt_binding.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/011_auth_abuse_session_controls.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/012_local_execution_uploads.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/013_local_execution_ticket_ledger.sql .test-cache/artifacts/migrations/
          node --test .test-cache/6.42-integration/project-dimension-history-postgres.test.mjs
          node --test .test-cache/6.42-integration/realesrgan-postgres-vertical.test.mjs
      - name: Canonical route and durable fleet regressions
        run: |
          npm run test:creative-route-6.41c4
          npm run test:durable-model-fleet
      - name: Production browser build contract
        run: |
          npm run build --if-present
          npm run check:browser-bundle
