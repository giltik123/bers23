name: Sprint 6.42 integrated acceptance

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  integrated-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integration_test
          POSTGRES_USER: integration_test
          POSTGRES_PASSWORD: integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration_test -d integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://integration_test:integration_test@127.0.0.1:5432/integration_test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint
      - name: A plus B device capability integration
        run: |
          mkdir -p .test-cache/6.42-integration
          npx esbuild tests/device-capability-fleet-integration.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/device-capability-fleet-integration.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/device-capability-fleet-integration.test.mjs
      - name: C0 lazy browser Local AI composition
        run: |
          npx esbuild tests/browser-local-ai-composition.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --loader:.pem=text --loader:.sig=text --loader:.wasm=file \
            --outfile=.test-cache/6.42-integration/browser-local-ai-composition.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/browser-local-ai-composition.test.mjs
          grep -F "createSelectionSegmentation({ projectId: project.id, imageArtifactId" src/pages/Editor.jsx
      - name: C1 deterministic mask refinement lineage
        run: |
          npx esbuild tests/mask-refinement-lineage.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/mask-refinement-lineage.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/mask-refinement-lineage.test.mjs
      - name: C1 real PostgreSQL mask lineage authority
        run: node --experimental-strip-types --test server/core/artifacts/maskArtifactLineage.integration.test.mjs
      - name: C2 deterministic tool authority, canonical wiring and browser executors
        run: |
          npx esbuild tests/local-execution-v2-executor-contract.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/local-execution-v2-executor-contract.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/local-execution-v2-executor-contract.test.mjs
          npx esbuild tests/background-isolation-canonical-wiring.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/background-isolation-canonical-wiring.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/background-isolation-canonical-wiring.test.mjs
          mkdir -p .test-cache/6.42-integration/crop
          npx esbuild tests/deterministic-crop-contract.test.ts tests/deterministic-crop-canonical-wiring.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outdir=.test-cache/6.42-integration/crop \
            --external:node:* --external:sharp
          node --test .test-cache/6.42-integration/crop/*.js
          npx esbuild tests/background-isolation-browser-executor.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/background-isolation-browser-executor.test.mjs \
            --external:node:* --external:sharp
          node --test .test-cache/6.42-integration/background-isolation-browser-executor.test.mjs
          npx esbuild tests/background-isolation-browser-composition.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/background-isolation-browser-composition.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/background-isolation-browser-composition.test.mjs
          grep -F "createBackgroundIsolation({ projectId: project.id })" src/pages/Editor.jsx
          grep -F "finalArtifactId: result.canonicalArtifactId" src/pages/Editor.jsx
      - name: C2 real PostgreSQL deterministic pixel, lineage, replay and zero-cloud verticals
        run: |
          mkdir -p .test-cache/6.42-integration/migrations .test-cache/artifacts/migrations .test-cache/6.42-integration/c2-postgres/migrations
          npx esbuild tests/background-isolation-postgres-vertical.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/c2-postgres/background-isolation-postgres-vertical.test.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/deterministic-crop-postgres-vertical.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/c2-postgres/deterministic-crop-postgres-vertical.test.mjs \
            --external:node:* --external:pg --external:sharp
          cp server/transactions/infrastructure/postgres/migrations/001_transaction_store.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/002_canonical_mask_artifacts.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/003_canonical_final_image_artifacts.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/004_canonical_projects_and_originals.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/005_canonical_project_history_versions.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/006_project_history_acceptance_hardening.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/007_project_history_source_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/008_canonical_auth_identity_sessions.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/009_auth_lifecycle_oauth.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/010_registration_attempt_binding.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/011_auth_abuse_session_controls.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/012_local_execution_uploads.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/014_canonical_mask_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/017_local_segmentation_mask_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/018_canonical_final_image_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/019_canonical_crop_final_lineage.sql .test-cache/6.42-integration/migrations/
          cp .test-cache/6.42-integration/migrations/*.sql .test-cache/6.42-integration/c2-postgres/migrations/
          cp server/core/artifacts/migrations/013_local_execution_ticket_ledger.sql .test-cache/artifacts/migrations/
          cp server/core/artifacts/migrations/015_workflow_continuations.sql .test-cache/artifacts/migrations/
          cp server/core/artifacts/migrations/016_local_execution_result_replay_binding.sql .test-cache/artifacts/migrations/
          node --test --test-concurrency=1 .test-cache/6.42-integration/c2-postgres/background-isolation-postgres-vertical.test.mjs .test-cache/6.42-integration/c2-postgres/deterministic-crop-postgres-vertical.test.mjs
      - name: C3 Real-ESRGAN candidate, canonical and browser/server contracts
        run: |
          npx esbuild tests/realesrgan-release-policy.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-release-policy.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/realesrgan-release-policy.test.mjs
          npx esbuild tests/realesrgan-canonical-wiring.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-canonical-wiring.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/realesrgan-canonical-wiring.test.mjs
          npx esbuild tests/realesrgan-workflow-verifier.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-workflow-verifier.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/realesrgan-workflow-verifier.test.mjs
          npx esbuild tests/realesrgan-browser-executor.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-browser-executor.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/realesrgan-browser-executor.test.mjs
          npx esbuild tests/realesrgan-browser-composition.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --loader:.wasm=file \
            --outfile=.test-cache/6.42-integration/realesrgan-browser-composition.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/realesrgan-browser-composition.test.mjs
          node --test tests/realesrgan-editor-boundary.test.mjs
          node --test tests/realesrgan-release-workflow.test.mjs
          npx esbuild tests/realesrgan-service-contract.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-service-contract.test.mjs \
            --external:node:* --external:sharp
          node --test .test-cache/6.42-integration/realesrgan-service-contract.test.mjs
          python -m py_compile scripts/build-realesrgan-x4v3-release.py
          node --input-type=module <<'NODE'
          import manifest from './src/platform/creative/local-ai/models/super-resolution.manifest.json' with { type: 'json' };
          if (manifest.status !== 'CANDIDATE') throw new Error(`unexpected Real-ESRGAN release status: ${manifest.status}`);
          if (!['EXPORT_REQUIRED', 'SIGNED_RELEASE'].includes(manifest.artifactState)) throw new Error(`unexpected Real-ESRGAN artifact state: ${manifest.artifactState}`);
          if (manifest.productionApprovalEvidence !== null) throw new Error('CANDIDATE must not carry production approval evidence');
          NODE
      - name: C3 real PostgreSQL model admission, variable-canvas history, replay and zero-cloud vertical
        run: |
          mkdir -p .test-cache/6.42-integration/migrations .test-cache/artifacts/migrations
          npx esbuild tests/project-dimension-history-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/project-dimension-history-postgres.test.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/realesrgan-postgres-vertical.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/realesrgan-postgres-vertical.test.mjs \
            --external:node:* --external:pg --external:sharp
          cp server/transactions/infrastructure/postgres/migrations/001_transaction_store.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/002_canonical_mask_artifacts.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/003_canonical_final_image_artifacts.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/004_canonical_projects_and_originals.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/005_canonical_project_history_versions.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/006_project_history_acceptance_hardening.sql .test-cache/6.42-integration/migrations/
          cp server/core/projects/migrations/007_project_history_source_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/008_canonical_auth_identity_sessions.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/009_auth_lifecycle_oauth.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/010_registration_attempt_binding.sql .test-cache/6.42-integration/migrations/
          cp server/core/auth/migrations/011_auth_abuse_session_controls.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/012_local_execution_uploads.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/014_canonical_mask_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/017_local_segmentation_mask_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/018_canonical_final_image_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/019_canonical_crop_final_lineage.sql .test-cache/6.42-integration/migrations/
          cp server/core/artifacts/migrations/013_local_execution_ticket_ledger.sql .test-cache/artifacts/migrations/
          cp server/core/artifacts/migrations/015_workflow_continuations.sql .test-cache/artifacts/migrations/
          cp server/core/artifacts/migrations/016_local_execution_result_replay_binding.sql .test-cache/artifacts/migrations/
          node --test .test-cache/6.42-integration/project-dimension-history-postgres.test.mjs
          node --test .test-cache/6.42-integration/realesrgan-postgres-vertical.test.mjs
      - name: C5 MODNet candidate trust, export and release contracts
        run: |
          npx esbuild tests/modnet-release-policy.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/modnet-release-policy.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/modnet-release-policy.test.mjs
          node --test tests/modnet-export-security.test.mjs
          node --test tests/modnet-release-workflow.test.mjs
          python -m py_compile scripts/inspect-modnet-checkpoint.py scripts/build-modnet-portrait-matting-release.py
          node --input-type=module <<'NODE'
          import manifest from './src/platform/creative/local-ai/models/portrait-matting.manifest.json' with { type: 'json' };
          if (manifest.status !== 'CANDIDATE') throw new Error(`unexpected MODNet release status: ${manifest.status}`);
          if (!['EXPORT_PINNED_RELEASE_REQUIRED', 'SIGNED_RELEASE'].includes(manifest.artifactState)) throw new Error(`unexpected MODNet artifact state: ${manifest.artifactState}`);
          if (manifest.upstream?.checkpoint?.identityState !== 'PINNED') throw new Error('MODNet checkpoint identity must stay PINNED');
          if (manifest.bersExport?.state !== 'PINNED') throw new Error('MODNet BERS export identity must stay PINNED');
          if (manifest.productionApprovalEvidence !== null) throw new Error('MODNet CANDIDATE must not carry production approval evidence');
          NODE
      - name: C6/C8 LaMa candidate provenance, pinned artifact and release contracts
        run: |
          npx esbuild tests/lama-candidate-policy.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/6.42-integration/lama-candidate-policy.test.mjs \
            --external:node:*
          node --test .test-cache/6.42-integration/lama-candidate-policy.test.mjs
          node --test tests/lama-acquisition-security.test.mjs
          node --test tests/lama-dynamo-onnx-security.test.mjs
          node --test tests/lama-release-reproducibility.test.mjs
          node --test tests/lama-release-workflow.test.mjs
          python -m py_compile scripts/inspect-lama-authoritative-folder.py scripts/inspect-lama-checkpoint.py scripts/probe-lama-cross-process-reproducibility.py
          node --input-type=module <<'NODE'
          import manifest from './src/platform/creative/local-ai/models/lama-inpainting.manifest.json' with { type: 'json' };
          if (manifest.status !== 'CANDIDATE') throw new Error(`unexpected LaMa status: ${manifest.status}`);
          if (!['EXPORT_PINNED_RELEASE_REQUIRED', 'SIGNED_RELEASE'].includes(manifest.artifactState)) throw new Error(`unexpected LaMa artifact state: ${manifest.artifactState}`);
          if (manifest.upstream?.checkpoint?.identityState !== 'PINNED') throw new Error('LaMa checkpoint identity must stay PINNED');
          if (manifest.runtimeFeasibility?.state !== 'DYNAMO_ONNX_CPU_WASM_PROVEN_WEBGPU_REAL_DEVICE_REQUIRED') throw new Error(`unexpected LaMa runtime state: ${manifest.runtimeFeasibility?.state}`);
          if (manifest.runtimeFeasibility?.directExportEvidence?.result !== 'BLOCKED_UNSUPPORTED_ATEN_FFT_RFFTN') throw new Error('LaMa legacy FFT blocker evidence changed');
          if (manifest.runtimeFeasibility?.directExportEvidence?.artifactProduced !== false) throw new Error('LaMa legacy probe must not claim an artifact');
          if (manifest.runtimeFeasibility?.directExportEvidence?.runtimeAuthorityGranted !== false) throw new Error('LaMa legacy probe must not grant runtime authority');
          if (manifest.runtimeFeasibility?.cpuOrt !== 'PROVEN_HOSTED_ORT_1_27_MULTISHAPE') throw new Error(`unexpected LaMa CPU ORT evidence: ${manifest.runtimeFeasibility?.cpuOrt}`);
          if (manifest.runtimeFeasibility?.browserWasm !== 'PROVEN_HOSTED_CHROME_ORT_WEB_1_27_256') throw new Error(`unexpected LaMa browser WASM evidence: ${manifest.runtimeFeasibility?.browserWasm}`);
          if (manifest.runtimeFeasibility?.browserWebGpu !== 'HOSTED_SWIFTSHADER_INFERENCE_TIMEOUT_REAL_DEVICE_UNPROVEN') throw new Error(`unexpected LaMa browser WebGPU evidence: ${manifest.runtimeFeasibility?.browserWebGpu}`);
          if (manifest.runtimeFeasibility?.realDeviceWebGpu !== 'UNPROVEN') throw new Error('LaMa real-device WebGPU must remain unproven');
          const modern = manifest.runtimeFeasibility?.modernDynamoOnnxEvidence;
          if (modern?.cpuOrtResult !== 'PASS_MULTISHAPE') throw new Error('LaMa modern CPU ORT proof missing');
          if (modern?.browserWasmResult !== 'PASS') throw new Error('LaMa modern browser WASM proof missing');
          if (modern?.hostedWebGpu?.result !== 'WEBGPU_INFERENCE_BLOCKED') throw new Error('LaMa hosted WebGPU blocker changed');
          if (modern?.hostedWebGpu?.timeoutStage !== 'INFERENCE') throw new Error('LaMa hosted WebGPU timeout stage changed');
          if (modern?.softwareAdapterLikely === false) throw new Error('LaMa hosted WebGPU evidence unexpectedly claims hardware');
          if (modern?.hostedWebGpu?.softwareAdapterLikely !== true) throw new Error('LaMa hosted WebGPU evidence must remain software-adapter-only');
          if (modern?.hostedWebGpu?.realDeviceEvidence !== false) throw new Error('LaMa hosted WebGPU must not claim real-device evidence');
          if (modern?.runtimeAuthorityGranted !== false || modern?.productionDeviceApproval !== false || modern?.releaseArtifactIdentityEstablished !== true) throw new Error('LaMa C8 identity/runtime boundary changed');
          if (manifest.bersArtifact?.state !== 'PINNED' || manifest.bersArtifact?.format !== 'ONNX' || manifest.bersArtifact?.opset !== 18) throw new Error('LaMa BERS artifact must stay exact PINNED ONNX opset 18');
          if (manifest.bersArtifact?.size !== 208593659 || manifest.bersArtifact?.sha256 !== '8bf7891efa16ea07de31fc98c5f0c017b399956cba0182813ddf23d9072792c7') throw new Error('LaMa BERS artifact byte identity changed');
          if (manifest.productionApprovalEvidence !== null) throw new Error('LaMa CANDIDATE must not carry production approval evidence');
          if (manifest.artifactState === 'EXPORT_PINNED_RELEASE_REQUIRED') {
            if (manifest.verificationKeyId !== null) throw new Error('LaMa pre-release candidate must not carry a verification key');
            if (manifest.artifacts?.model?.url !== null || manifest.artifacts?.model?.signatureUrl !== null || manifest.artifacts?.model?.size !== null || manifest.artifacts?.model?.sha256 !== null) throw new Error('LaMa pre-release candidate must not expose signed release assets');
          } else {
            if (manifest.verificationKeyId !== 'bers-lama-inpainting-release-2026-08') throw new Error('LaMa signed release key id changed');
            const model = manifest.artifacts?.model;
            if (model?.size !== 208593659 || model?.sha256 !== '8bf7891efa16ea07de31fc98c5f0c017b399956cba0182813ddf23d9072792c7') throw new Error('LaMa signed release model identity changed');
            if (typeof model?.url !== 'string' || !model.url.startsWith('https://github.com/giltik123/bers23/releases/download/lama-big-places-inpainting-v1.0.0-candidate.1/')) throw new Error('LaMa signed release model URL changed');
            if (typeof model?.signatureUrl !== 'string' || !model.signatureUrl.startsWith('https://github.com/giltik123/bers23/releases/download/lama-big-places-inpainting-v1.0.0-candidate.1/')) throw new Error('LaMa signed release signature URL changed');
          }
          NODE
      - name: Canonical route and durable fleet regressions
        run: |
          npm run test:creative-route-6.41c4
          npm run test:durable-model-fleet
      - name: Production browser build contract
        run: |
          npm run build --if-present
          npm run check:browser-bundle
