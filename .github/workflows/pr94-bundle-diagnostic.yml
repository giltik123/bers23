name: PR94 bundle diagnostic

on:
  push:
    branches: ["sprint-6.39b-auth-lifecycle-oauth"]

jobs:
  locate-assertion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Build exact controlled vertical bundle and locate CI assertion
        run: |
          mkdir -p .test-cache
          npx esbuild tests/core-server-postgres-vertical.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/core-server-postgres-vertical.test.js --external:pg --external:sharp --external:node:*
          nl -ba .test-cache/core-server-postgres-vertical.test.js | sed -n '4836,4848p'
