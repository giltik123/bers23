name: P1b/P1e/P1f/P1g Job Center canonical execution authority

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/api/executionRunRecoveryClient.js'
      - 'src/api/executionRunRecoveryClient.test.mjs'
      - 'src/lib/jobs/executionRunProjection.js'
      - 'src/lib/jobs/executionRunProjection.test.mjs'
      - 'src/lib/jobs/executionRunFinalResultProjection.test.mjs'
      - 'src/lib/jobs/executionRunProjectionAuthority.test.mjs'
      - 'src/lib/jobs/creativeExecutionControl.js'
      - 'src/lib/jobs/creativeExecutionControl.test.mjs'
      - 'src/lib/jobs/jobModel.js'
      - 'src/lib/jobs/jobModelEphemeral.test.mjs'
      - 'src/lib/jobs/jobRepeatPolicy.js'
      - 'src/lib/jobs/jobRepeatPolicy.test.mjs'
      - 'src/lib/jobs/jobRetryManager.js'
      - 'src/lib/jobs/jobScheduler.js'
      - 'src/lib/jobs/jobEphemeralAuthority.test.mjs'
      - 'src/components/editor/jobs/CanonicalExecutionRunRow.jsx'
      - 'src/components/editor/jobs/JobCenter.jsx'
      - 'src/components/editor/jobs/JobQueuePanel.jsx'
      - 'src/components/editor/jobs/JobRow.jsx'
      - 'src/lib/jobs/jobManager.js'
      - 'src/lib/jobs/jobStorage.js'
      - 'server/core/http/executionRunRecoveryHttpAdapter.ts'
      - 'server/core/http/executionRunRecoveryHttpAdapter.test.mjs'
      - 'server/core/artifacts/postgresImageArtifactStore.ts'
      - 'server/core/artifacts/signedArtifactAuthority.ts'
      - 'server/index.ts'
      - 'tests/execution-run-recovery-http-postgres.test.ts'
      - '.github/workflows/job-center-execution-run-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-job-center-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Prove GET-only recovery, durable FINAL projection, owning Creative cancel and explicit session repeat semantics
        run: node --test src/api/executionRunRecoveryClient.test.mjs src/lib/jobs/executionRunProjection.test.mjs src/lib/jobs/executionRunFinalResultProjection.test.mjs src/lib/jobs/creativeExecutionControl.test.mjs src/lib/jobs/jobRepeatPolicy.test.mjs src/lib/jobs/executionRunProjectionAuthority.test.mjs src/lib/jobs/jobModelEphemeral.test.mjs src/lib/jobs/jobEphemeralAuthority.test.mjs
      - name: Preserve accepted server recovery HTTP contract
        run: node --experimental-strip-types --test server/core/http/executionRunRecoveryHttpAdapter.test.mjs
      - name: Typecheck browser and Core contracts
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Build production browser
        run: npm run build
      - name: Prove canonical recovery remains observation-only while projecting durable FINAL and session repeats stay new operations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "${BASE_SHA:-}"
          UNEXPECTED_SERVER="$(git diff --name-only "$BASE_SHA"..HEAD -- server | grep -Ev '^(server/index\.ts|server/core/http/executionRunRecoveryHttpAdapter\.ts|server/core/http/executionRunRecoveryHttpAdapter\.test\.mjs)$' || true)"
          test -z "$UNEXPECTED_SERVER"
          ! grep -E -q 'coreClient|jobManager|jobStorage|subscriptionUsage|subscriptionValidator|Billing|billing|provider|\.cancel\(|\.retry\(|\.issue\(' src/lib/jobs/executionRunProjection.js
          ! grep -E -q "method: 'POST'|method: 'PATCH'|method: 'DELETE'|coreClient|entities|creative|localExecution" src/api/executionRunRecoveryClient.js
          grep -q 'RESULT_PATH' src/lib/jobs/executionRunProjection.js
          grep -q "status !== 'SUCCEEDED' || capability !== 'CREATIVE_EXECUTION' || authorityKind !== 'CREATIVE_EXECUTION'" src/lib/jobs/executionRunProjection.js
          grep -q "run.capability === 'CREATIVE_EXECUTION'" src/components/editor/jobs/CanonicalExecutionRunRow.jsx
          grep -q "run.authorityKind === 'CREATIVE_EXECUTION'" src/components/editor/jobs/CanonicalExecutionRunRow.jsx
          grep -q "run.status === 'RUNNING'" src/components/editor/jobs/CanonicalExecutionRunRow.jsx
          grep -q "control?.state === 'AVAILABLE'" src/components/editor/jobs/CanonicalExecutionRunRow.jsx
          grep -q "run.status === 'SUCCEEDED'" src/components/editor/jobs/CanonicalExecutionRunRow.jsx
          grep -q "run.result?.kind === 'FINAL_IMAGE'" src/components/editor/jobs/CanonicalExecutionRunRow.jsx
          grep -q 'href={run.result.imageUrl}' src/components/editor/jobs/CanonicalExecutionRunRow.jsx
          grep -q 'data-canonical-execution-result' src/components/editor/jobs/CanonicalExecutionRunRow.jsx
          ! grep -E -q 'jobManager|jobStorage|onRunAgain|onRetry|onDuplicate|onMoveUp|coreClient|execution-runs|runAgain|retry|duplicate' src/components/editor/jobs/CanonicalExecutionRunRow.jsx
          grep -q 'new CreativeExecutionControlPolicy(coreClient.creative)' src/components/editor/jobs/JobCenter.jsx
          grep -q 'await creativeControl.cancel(run)' src/components/editor/jobs/JobCenter.jsx
          grep -q 'await canonicalProjection.refresh()' src/components/editor/jobs/JobCenter.jsx
          ! grep -E -q 'ExecutionRunRegistry|coreClient\.executionRuns|execution-runs/.*/(cancel|retry)' src/lib/jobs/creativeExecutionControl.js src/components/editor/jobs/JobCenter.jsx
          ! grep -q 'coreClient.creative.execute' src/components/editor/jobs/JobCenter.jsx
          ! grep -E -q 'retry|duplicate|runAgain' src/lib/jobs/creativeExecutionControl.js
          ! grep -E -q 'jobStorage|JobRecord|coreClient\.entities|_persist\(' src/lib/jobs/jobManager.js
          ! grep -E -q 'coreClient|JobRecord|entities\.|\.create\(|\.update\(|\.filter\(' src/lib/jobs/jobStorage.js
          grep -q 'EPHEMERAL_CLIENT_TASK' src/lib/jobs/jobModel.js
          grep -q 'EPHEMERAL_CLIENT_TASK' src/lib/jobs/jobManager.js
          grep -q 'onJobFailure: () => false' src/lib/jobs/jobManager.js
          grep -q 'Run again starts a new operation' src/components/editor/jobs/JobCenter.jsx
          grep -q 'onRunAgain={(id) => jobManager.runAgain(id)}' src/components/editor/jobs/JobCenter.jsx
          ! grep -E -q 'onRetry|jobManager\.retry' src/components/editor/jobs/JobCenter.jsx src/components/editor/jobs/JobRow.jsx
          grep -q 'type ExecutionRunResultReader' server/core/http/executionRunRecoveryHttpAdapter.ts
          grep -q 'resolveCreativeFinal(scope: ExecutionRunScope, executionId: string)' server/core/http/executionRunRecoveryHttpAdapter.ts
          grep -q 'results.resolveCreativeFinal(scope, run.authorityRef)' server/core/http/executionRunRecoveryHttpAdapter.ts
          ! grep -E -q '\.(issue|start|succeed|fail|cancel|markUnknown)\(' server/core/http/executionRunRecoveryHttpAdapter.ts
          grep -q 'production.artifacts.images.loadFinalByExecution(executionId, scope)' server/index.ts
          grep -q 'production.artifacts.external.issueStoredFinal(stored.storageId, scope)' server/index.ts
          grep -q 'production.artifacts.external.issueStoredFinalDelivery' server/index.ts
      - name: Check committed diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"..HEAD