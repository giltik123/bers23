name: Fashion F4b deterministic garment mesh warp kernel

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deterministic-garment-mesh-warp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA before dependency work
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core contracts
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Bundle deterministic garment mesh warp acceptance
        run: |
          mkdir -p .test-cache/fashion-garment-mesh-warp-f4b
          npx esbuild \
            tests/deterministic-garment-mesh-warp.test.ts \
            tests/deterministic-garment-mesh-warp-admission-boundary.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outdir=.test-cache/fashion-garment-mesh-warp-f4b \
            --external:node:*
      - name: Prove Q16 topology raster sampling repeatability and fail-closed admission boundary
        run: node --test .test-cache/fashion-garment-mesh-warp-f4b/*.js
      - name: Prove F4b.1 does not enable production execution or Try-On
        run: |
          ! grep -R -E 'garment-mesh-warp|GARMENT_MESH_WARP' \
            server/core/localExecution/productionLocalExecutorPolicy.ts \
            server/core/providers/productionExecutionCapabilities.ts \
            server/core/providers/productionExecutionRoute.ts \
            server/core/providers/productionTargetSelection.ts \
            src/platform/creative/deterministic/DeterministicToolRegistry.ts
          grep -q "TRYON_EXECUTION_NOT_WIRED" src/lib/tryon/tryonEngine.js
          ! grep -E 'garment-mesh-warp|GARMENT_MESH_WARP' src/lib/tryon/tryonEngine.js
