name: Fashion F4b.6d.1 Try-On recovery preview foundation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/core/fashion/FashionTryOnRecoveryPreviewService.ts'
      - 'tests/fashion-tryon-recovery-preview-f4b6d1.test.ts'
      - 'tests/fashion-tryon-recovery-preview-boundary.test.mjs'
      - '.github/workflows/fashion-tryon-recovery-preview-foundation-f4b6d1.yml'

permissions:
  contents: read

jobs:
  recovery-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact PR head SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prove recovery preview semantics
        run: node --experimental-strip-types --test tests/fashion-tryon-recovery-preview-f4b6d1.test.ts
      - name: Prove recovery preview authority boundary
        run: node --test tests/fashion-tryon-recovery-preview-boundary.test.mjs
      - name: Re-prove accepted stable-intent FINAL recovery chain
        run: |
          set -euo pipefail
          mkdir -p .test-cache/fashion-tryon-recovery-preview
          for spec in \
            fashion-tryon-orchestration-contract-f4b6b1 \
            fashion-tryon-warp-orchestration-f4b6b2 \
            fashion-tryon-texture-continuation-f4b6b3 \
            fashion-texture-final-recovery-f4b6b4a \
            fashion-texture-final-intent-binding-f4b6b4c \
            fashion-texture-final-resolved-evidence-f4b6b4c \
            fashion-tryon-final-result-f4b6b4c
          do
            npx esbuild "tests/${spec}.test.ts" \
              --bundle --platform=node --format=esm --target=node24 \
              --outfile=".test-cache/fashion-tryon-recovery-preview/${spec}.test.mjs" \
              --external:node:* --external:sharp --external:pg
          done
          node --test --test-concurrency=1 .test-cache/fashion-tryon-recovery-preview/*.test.mjs
      - name: Typecheck production Core
        run: npm run server:typecheck
      - name: Reject premature transport and UI activation
        run: |
          set -euo pipefail
          ! grep -q 'FashionTryOnRecoveryPreviewService' server/index.ts
          ! grep -q 'FashionTryOnRecoveryPreviewService' src/api/coreClient.js
          grep -q 'TRYON_EXECUTION_NOT_WIRED' src/lib/tryon/tryonEngine.js
      - name: Check committed diff whitespace
        run: git diff --check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
