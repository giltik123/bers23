name: Sprint 6.42C7 LaMa Dynamo ONNX feasibility

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  LAMA_MIRROR_COMMIT: 05cb2be7f8dbe6ca7c6e78f4fc827a4b2baaa4a9
  LAMA_MIRROR_ARCHIVE_SIZE: '381428720'
  LAMA_MIRROR_ARCHIVE_SHA256: f1b358ca24093b93a106183b98a3dea6e8ed09f3b43ea7251eb2c81e7b4575f6
  LAMA_CHECKPOINT_SIZE: '410046389'
  LAMA_CHECKPOINT_SHA256: fccb7adffd53ec0974ee5503c3731c2c2f1e7e07856fd9228cdcc0b46fd5d423
  LAMA_CONFIG_SIZE: '3947'
  LAMA_CONFIG_SHA256: 4fdeed49926e13b101c4dd9e193acec9e58677dfdb4ba49dd6a3a8927964e2a7

jobs:
  native-dynamo-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify C7 static fail-closed policy before network/model work
        run: |
          set -euo pipefail
          node --test tests/lama-dynamo-onnx-security.test.mjs tests/lama-webgpu-feasibility.test.mjs
          python -m py_compile \
            scripts/bridge-lama-generator-safetensors.py \
            scripts/probe-lama-dynamo-onnx.py \
            scripts/probe-lama-dynamo-multishape.py \
            scripts/inspect-lama-checkpoint.py
          node --check scripts/test-lama-browser-wasm-acceptance.mjs
          node --check scripts/test-lama-browser-webgpu-feasibility.mjs
          npm run check:model-weight-tracking
          test "$(git ls-files '*.ckpt' '*.pth' '*.pt' '*.safetensors' '*.onnx' | wc -l)" -eq 0

      - name: Clone exact LaMa upstream
        run: |
          set -euo pipefail
          git clone https://github.com/advimman/lama "${RUNNER_TEMP}/lama"
          git -C "${RUNNER_TEMP}/lama" checkout --detach 786f5936b27fb3dacd2b1ad799e4de968ea697e7
          test "$(git -C "${RUNNER_TEMP}/lama" rev-parse HEAD)" = 786f5936b27fb3dacd2b1ad799e4de968ea697e7
          grep -F 'torch.fft.rfftn' "${RUNNER_TEMP}/lama/saicinpainting/training/modules/ffc.py"
          grep -F 'torch.fft.irfftn' "${RUNNER_TEMP}/lama/saicinpainting/training/modules/ffc.py"

      - name: Acquire pinned transport and materialize authoritative checkpoint member
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lama-c7" .test-cache/6.42c7
          archive="${RUNNER_TEMP}/lama-c7/big-lama.zip"
          curl -fL --retry 3 --retry-all-errors \
            "https://huggingface.co/smartywu/big-lama/resolve/${LAMA_MIRROR_COMMIT}/big-lama.zip" \
            -o "${archive}"
          test "$(stat -c%s "${archive}")" = "${LAMA_MIRROR_ARCHIVE_SIZE}"
          test "$(sha256sum "${archive}" | cut -d' ' -f1)" = "${LAMA_MIRROR_ARCHIVE_SHA256}"
          python - "${archive}" "${RUNNER_TEMP}/lama-c7" <<'PY'
          import hashlib, os, pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          expected = {
              'big-lama/config.yaml': (int(os.environ['LAMA_CONFIG_SIZE']), os.environ['LAMA_CONFIG_SHA256']),
              'big-lama/models/best.ckpt': (int(os.environ['LAMA_CHECKPOINT_SIZE']), os.environ['LAMA_CHECKPOINT_SHA256']),
          }
          with zipfile.ZipFile(archive, 'r') as bundle:
              names = [item.filename for item in bundle.infolist() if not item.is_dir()]
              if set(names) != set(expected) or len(names) != 2:
                  raise RuntimeError(f'unexpected Big-LaMa transport members: {names!r}')
              for name, (expected_size, expected_sha) in expected.items():
                  info = bundle.getinfo(name)
                  if info.file_size != expected_size:
                      raise RuntimeError(f'{name} size mismatch')
                  digest = hashlib.sha256()
                  target = out / pathlib.PurePosixPath(name).name
                  with bundle.open(info, 'r') as source, target.open('wb') as sink:
                      for chunk in iter(lambda: source.read(1024 * 1024), b''):
                          digest.update(chunk)
                          sink.write(chunk)
                  if digest.hexdigest() != expected_sha:
                      target.unlink(missing_ok=True)
                      raise RuntimeError(f'{name} SHA-256 mismatch against authoritative C6 identity')
          print('C7 AUTHORITATIVE MEMBER IDENTITIES: PASS')
          PY

      - name: Install pinned C6-proven bridge environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check kornia==0.5.0 safetensors==0.8.0
          python - <<'PY'
          import safetensors, torch
          assert torch.__version__.startswith('2.6.0'), torch.__version__
          assert safetensors.__version__ == '0.8.0', safetensors.__version__
          print('C7 BRIDGE ENVIRONMENT: PASS', torch.__version__, safetensors.__version__)
          PY

      - name: Bridge legacy checkpoint to tensor-only safetensors and remove pickle source
        run: |
          set -euo pipefail
          python scripts/bridge-lama-generator-safetensors.py \
            --source "${RUNNER_TEMP}/lama" \
            --checkpoint "${RUNNER_TEMP}/lama-c7/best.ckpt" \
            --state-out "${RUNNER_TEMP}/lama-c7/generator.safetensors" \
            --report .test-cache/6.42c7/lama-generator-bridge.json
          python - <<'PY'
          import json, os, pathlib
          evidence = json.load(open('.test-cache/6.42c7/lama-generator-bridge.json', encoding='utf-8'))
          assert evidence['status'] == 'CANDIDATE'
          assert evidence['productionDeviceApproval'] is False
          assert evidence['runtimeAuthorityGranted'] is False
          assert evidence['sourceCheckpoint']['sha256'] == 'fccb7adffd53ec0974ee5503c3731c2c2f1e7e07856fd9228cdcc0b46fd5d423'
          assert evidence['sourceCheckpoint']['verifiedBeforeDeserialization'] is True
          assert evidence['sourceCheckpoint']['weightsOnly'] is True
          bridge = evidence['bridge']
          assert bridge['format'] == 'SAFETENSORS'
          assert bridge['pickleFree'] is True
          assert bridge['keyCount'] == 989
          assert bridge['tensorElements'] == 51057179
          assert bridge['ephemeral'] is True
          assert bridge['published'] is False
          state = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lama-c7' / 'generator.safetensors'
          assert state.is_file() and state.stat().st_size == bridge['fileSize']
          print('C7 TENSOR-ONLY BRIDGE POLICY: PASS', bridge['sha256'])
          PY
          rm -f "${RUNNER_TEMP}/lama-c7/best.ckpt" "${RUNNER_TEMP}/lama-c7/big-lama.zip"
          test ! -e "${RUNNER_TEMP}/lama-c7/best.ckpt"
          test ! -e "${RUNNER_TEMP}/lama-c7/big-lama.zip"
          test -s "${RUNNER_TEMP}/lama-c7/generator.safetensors"

      - name: Install pinned modern exporter and matching ORT runtime line
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            numpy==2.4.6 \
            kornia==0.5.0 \
            safetensors==0.8.0 \
            onnx==1.22.0 \
            onnxscript==0.7.1 \
            onnxruntime==1.27.0
          python - <<'PY'
          import inspect, numpy, onnx, onnxruntime, onnxscript, safetensors, torch
          assert torch.__version__.startswith('2.13.0'), torch.__version__
          assert numpy.__version__ == '2.4.6'
          assert safetensors.__version__ == '0.8.0'
          assert onnx.__version__ == '1.22.0'
          assert onnxscript.__version__ == '0.7.1'
          assert onnxruntime.__version__ == '1.27.0'
          assert 'fallback' not in inspect.signature(torch.onnx.export).parameters
          assert 'dynamic_shapes' in inspect.signature(torch.onnx.export).parameters
          print('C7 EXPORT ENVIRONMENT: PASS', torch.__version__, numpy.__version__, safetensors.__version__, onnx.__version__, onnxscript.__version__, onnxruntime.__version__)
          PY

      - name: Probe native dynamic Dynamo export and CPU ORT multi-shape parity
        run: |
          set -euo pipefail
          test ! -e "${RUNNER_TEMP}/lama-c7/best.ckpt"
          python scripts/probe-lama-dynamo-multishape.py \
            --source "${RUNNER_TEMP}/lama" \
            --state "${RUNNER_TEMP}/lama-c7/generator.safetensors" \
            --bridge-report .test-cache/6.42c7/lama-generator-bridge.json \
            --model-out "${RUNNER_TEMP}/lama-c7/lama-big-dynamo-dynamic.onnx" \
            --report .test-cache/6.42c7/lama-dynamo-onnx-multishape.json \
            --browser-input-out "${RUNNER_TEMP}/lama-c7/browser-input-256.f32" \
            --browser-reference-out "${RUNNER_TEMP}/lama-c7/browser-reference-256.f32"

      - name: Require exact CPU multi-shape parity before browser gate
        run: |
          python - <<'PY'
          import json, os, pathlib
          evidence = json.load(open('.test-cache/6.42c7/lama-dynamo-onnx-multishape.json', encoding='utf-8'))
          assert evidence['status'] == 'CANDIDATE'
          assert evidence['productionDeviceApproval'] is False
          assert evidence['runtimeAuthorityGranted'] is False
          assert evidence['checkpointSha256'] == 'fccb7adffd53ec0974ee5503c3731c2c2f1e7e07856fd9228cdcc0b46fd5d423'
          assert evidence['environment']['legacyFallbackParameterPresent'] is False
          assert evidence['environment']['safetensors'] == '0.8.0'
          bridge = evidence['bridgeProof']
          assert bridge['legacyCheckpointDeserializedInExporterProcess'] is False
          assert bridge['bridgeFormat'] == 'SAFETENSORS'
          assert bridge['bridgePickleFree'] is True
          assert bridge['sourceCheckpointSha256'] == evidence['checkpointSha256']
          assert bridge['sourceCheckpointWeightsOnlyProof'] is True
          assert bridge['generatorStateKeyCount'] == 989
          assert bridge['generatorTensorElements'] == 51057179
          export = evidence['export']
          assert export['dynamo'] is True
          assert export['legacyFallbackAllowed'] is False
          assert export['opset'] == 18
          assert export['result'] == 'EXPORTED_STANDARD_DFT_CPU_ORT_MULTISHAPE_PASS', export['result']
          assert evidence['graph']['standardDftNodeCount'] > 0
          assert evidence['graph']['customNodes'] == []
          assert evidence['graph']['atenLikeNodes'] == []
          assert evidence['graph']['dynamicHeight'] is True
          assert evidence['graph']['dynamicWidth'] is True
          assert evidence['cpuOrt']['result'] == 'PASS'
          shapes = [item['shape'] for item in evidence['cpuOrt']['shapeResults']]
          assert shapes == [[64,64],[256,256],[256,384],[512,512]], shapes
          for item in evidence['cpuOrt']['shapeResults']:
              assert item['result'] == 'PASS', item
              assert item['rawParity']['maxAbs'] <= 2e-4
              assert item['rawParity']['rmse'] <= 5e-5
              assert item['semanticContract']['maskValues'] == [0.0, 1.0]
              assert item['semanticContract']['maskOneMeansInpaint'] is True
              assert item['semanticContract']['maskChannelExact'] is True
              assert item['semanticContract']['maskedRgbZero'] is True
              assert item['semanticContract']['knownRgbPreservedInGeneratorInput'] is True
              assert item['referenceComposite']['knownRegionBitExact'] is True
              assert item['ortComposite']['knownRegionBitExact'] is True
          assert evidence['browserReference']['shape'] == [256,256]
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lama-c7'
          assert (root / 'browser-input-256.f32').is_file()
          assert (root / 'browser-reference-256.f32').is_file()
          assert evidence.get('productionPromotionAllowed', False) is False
          print('C7 exact CPU multi-shape gate: PASS')
          PY

      - name: Install pinned repository browser dependencies
        run: |
          set -euo pipefail
          npm ci
          node -e "const p=require('./node_modules/onnxruntime-web/package.json'); if(p.version!=='1.27.0') throw new Error(p.version); console.log('ONNX Runtime Web 1.27.0: PASS')"
          google-chrome --version

      - name: Run local Chrome LaMa WASM parity
        run: |
          set -euo pipefail
          node scripts/test-lama-browser-wasm-acceptance.mjs \
            --model "${RUNNER_TEMP}/lama-c7/lama-big-dynamo-dynamic.onnx" \
            --input "${RUNNER_TEMP}/lama-c7/browser-input-256.f32" \
            --reference "${RUNNER_TEMP}/lama-c7/browser-reference-256.f32" \
            --cpu-evidence .test-cache/6.42c7/lama-dynamo-onnx-multishape.json \
            --report .test-cache/6.42c7/lama-browser-wasm.json

      - name: Require exact browser WASM parity before WebGPU feasibility
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          const browser = JSON.parse(await fs.readFile('.test-cache/6.42c7/lama-browser-wasm.json', 'utf8'));
          const cpu = JSON.parse(await fs.readFile('.test-cache/6.42c7/lama-dynamo-onnx-multishape.json', 'utf8'));
          assert.equal(browser.status, 'CANDIDATE');
          assert.equal(browser.result, 'PASS');
          assert.equal(browser.provider, 'wasm');
          assert.equal(browser.onnxruntimeWebVersion, '1.27.0');
          assert.deepEqual(browser.shape, [256,256]);
          assert.equal(browser.modelSha256, cpu.export.sha256);
          assert.equal(browser.cpuEvidenceResult, 'EXPORTED_STANDARD_DFT_CPU_ORT_MULTISHAPE_PASS');
          assert.equal(browser.cpuOrtSameShapeResult, 'PASS');
          assert.equal(browser.runtimeAuthorityGranted, false);
          assert.equal(browser.productionDeviceApproval, false);
          assert.equal(browser.browserExecutionIsProductionApproval, false);
          assert.equal(browser.productionPromotionAllowed, false);
          assert.deepEqual(browser.networkDiagnostics.externalHttpRequests, []);
          assert.deepEqual(browser.networkDiagnostics.pageErrors, []);
          assert.deepEqual(browser.outputTensorShape, [1,3,256,256]);
          assert.equal(browser.referenceKind, 'PINNED_PYTORCH_GENERATOR_FLOAT32');
          assert.ok(browser.metrics.maxAbs <= 2e-4, browser.metrics.maxAbs);
          assert.ok(browser.metrics.rmse <= 5e-5, browser.metrics.rmse);
          assert.ok(browser.ortLocalAssets.some(item => item.url.includes('.wasm') && item.status === 200));
          assert.ok(browser.ortLocalAssets.some(item => item.url.includes('.mjs') && item.status === 200));
          console.log('C7 exact browser WASM gate: PASS');
          NODE

      - name: Run hosted Chrome LaMa WebGPU feasibility
        run: |
          set -euo pipefail
          node scripts/test-lama-browser-webgpu-feasibility.mjs \
            --model "${RUNNER_TEMP}/lama-c7/lama-big-dynamo-dynamic.onnx" \
            --input "${RUNNER_TEMP}/lama-c7/browser-input-256.f32" \
            --reference "${RUNNER_TEMP}/lama-c7/browser-reference-256.f32" \
            --cpu-evidence .test-cache/6.42c7/lama-dynamo-onnx-multishape.json \
            --wasm-evidence .test-cache/6.42c7/lama-browser-wasm.json \
            --report .test-cache/6.42c7/lama-browser-webgpu.json

      - name: Validate hosted WebGPU classification without granting authority
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          const webgpu = JSON.parse(await fs.readFile('.test-cache/6.42c7/lama-browser-webgpu.json', 'utf8'));
          const cpu = JSON.parse(await fs.readFile('.test-cache/6.42c7/lama-dynamo-onnx-multishape.json', 'utf8'));
          assert.equal(webgpu.status, 'CANDIDATE');
          assert.equal(webgpu.provider, 'webgpu');
          assert.equal(webgpu.onnxruntimeWebVersion, '1.27.0');
          assert.deepEqual(webgpu.shape, [256,256]);
          assert.equal(webgpu.modelSha256, cpu.export.sha256);
          assert.equal(webgpu.cpuEvidenceResult, 'EXPORTED_STANDARD_DFT_CPU_ORT_MULTISHAPE_PASS');
          assert.equal(webgpu.cpuOrtSameShapeResult, 'PASS');
          assert.equal(webgpu.wasmSameShapeResult, 'PASS');
          assert.equal(webgpu.runtimeAuthorityGranted, false);
          assert.equal(webgpu.productionDeviceApproval, false);
          assert.equal(webgpu.browserExecutionIsProductionApproval, false);
          assert.equal(webgpu.productionPromotionAllowed, false);
          assert.equal(webgpu.hostedSoftwareFeasibilityOnly, true);
          assert.equal(webgpu.hostedRunner, true);
          assert.equal(webgpu.realDeviceEvidence, false);
          assert.equal(webgpu.providerFallbackAllowed, false);
          assert.deepEqual(webgpu.executionProviders, ['webgpu']);
          assert.deepEqual(webgpu.networkDiagnostics.externalHttpRequests, []);
          assert.deepEqual(webgpu.networkDiagnostics.pageErrors, []);
          const allowed = new Set([
            'WEBGPU_API_UNAVAILABLE', 'WEBGPU_ADAPTER_REQUEST_FAILED', 'WEBGPU_ADAPTER_UNAVAILABLE',
            'WEBGPU_SESSION_BLOCKED', 'WEBGPU_INFERENCE_BLOCKED', 'WEBGPU_PARITY_FAILED', 'PASS',
          ]);
          assert.ok(allowed.has(webgpu.result), webgpu.result);
          if (webgpu.result === 'PASS') {
            assert.deepEqual(webgpu.outputTensorShape, [1,3,256,256]);
            assert.equal(webgpu.referenceKind, 'PINNED_PYTORCH_GENERATOR_FLOAT32');
            assert.ok(webgpu.metrics.maxAbs <= 2e-4, webgpu.metrics.maxAbs);
            assert.ok(webgpu.metrics.rmse <= 5e-5, webgpu.metrics.rmse);
            assert.ok(webgpu.adapter);
          }
          console.log('C7 hosted WebGPU result=', webgpu.result);
          NODE

      - name: Destroy ephemeral tensor/model/reference bytes before evidence upload
        run: |
          set -euo pipefail
          rm -f \
            "${RUNNER_TEMP}/lama-c7/generator.safetensors" \
            "${RUNNER_TEMP}/lama-c7/lama-big-dynamo-dynamic.onnx" \
            "${RUNNER_TEMP}/lama-c7/browser-input-256.f32" \
            "${RUNNER_TEMP}/lama-c7/browser-reference-256.f32"
          test ! -e "${RUNNER_TEMP}/lama-c7/generator.safetensors"
          test ! -e "${RUNNER_TEMP}/lama-c7/lama-big-dynamo-dynamic.onnx"
          test ! -e "${RUNNER_TEMP}/lama-c7/browser-input-256.f32"
          test ! -e "${RUNNER_TEMP}/lama-c7/browser-reference-256.f32"

      - name: Upload C7 feasibility JSON evidence only
        uses: actions/upload-artifact@v4
        with:
          name: lama-c7-dynamo-feasibility-evidence
          path: |
            .test-cache/6.42c7/lama-generator-bridge.json
            .test-cache/6.42c7/lama-dynamo-onnx-multishape.json
            .test-cache/6.42c7/lama-browser-wasm.json
            .test-cache/6.42c7/lama-browser-webgpu.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish C7 dynamic and browser summary
        run: |
          cpu_result="$(python -c "import json; print(json.load(open('.test-cache/6.42c7/lama-dynamo-onnx-multishape.json'))['export']['result'])")"
          wasm_result="$(node -e "const x=require('./.test-cache/6.42c7/lama-browser-wasm.json'); console.log(x.result)")"
          webgpu_result="$(node -e "const x=require('./.test-cache/6.42c7/lama-browser-webgpu.json'); console.log(x.result)")"
          bridge_sha="$(python -c "import json; print(json.load(open('.test-cache/6.42c7/lama-generator-bridge.json'))['bridge']['sha256'])")"
          {
            echo '## LaMa dynamic Dynamo ONNX + browser WASM/WebGPU feasibility'
            echo
            echo '- Status: CANDIDATE / feasibility only'
            echo '- Upstream revision: `786f5936b27fb3dacd2b1ad799e4de968ea697e7`'
            echo '- Checkpoint: exact C6 authoritative SHA `fccb7adffd53ec0974ee5503c3731c2c2f1e7e07856fd9228cdcc0b46fd5d423`'
            echo '- Legacy checkpoint reader: PyTorch 2.6 restricted weights-only loader'
            echo "- Ephemeral tensor bridge: safetensors 0.8.0 / SHA \`${bridge_sha}\`"
            echo '- Legacy checkpoint removed before modern exporter environment'
            echo '- Export environment: PyTorch 2.13.0 CPU / NumPy 2.4.6 / ONNX 1.22.0 / ONNXScript 0.7.1'
            echo '- CPU runtime: ONNX Runtime 1.27.0'
            echo '- Dynamic shapes: modulo-8 H/W, tested 64x64, 256x256, 256x384, 512x512'
            echo "- CPU result: \`${cpu_result}\`"
            echo '- Browser WASM runtime: production BrowserOnnxSessionFactory / ONNX Runtime Web 1.27.0'
            echo "- Browser WASM 256x256 result: \`${wasm_result}\`"
            echo '- Browser WebGPU runtime: ONNX Runtime Web 1.27.0 / webgpu-only / no WASM fallback'
            echo "- Hosted WebGPU 256x256 result: \`${webgpu_result}\`"
            echo '- Hosted SwiftShader/software WebGPU is feasibility evidence only; real-device approval remains absent'
            echo '- Ephemeral tensor/model/reference bytes were destroyed before JSON artifact upload'
            echo '- Production/runtime authority: NOT GRANTED'
          } >> "${GITHUB_STEP_SUMMARY}"
