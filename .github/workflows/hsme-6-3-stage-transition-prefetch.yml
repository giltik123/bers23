name: HSME-6.3 deterministic stage-transition prefetch schedule

on:
  pull_request:
    paths:
      - 'server/core/training/HsmeStageRouteTableV1.ts'
      - 'server/core/training/HsmeStageTransitionPrefetchScheduleV1.ts'
      - 'server/core/training/HsmeStageTransitionPrefetchScheduleV1.test.mjs'
      - '.github/workflows/hsme-6-3-stage-transition-prefetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transition-prefetch:
    name: deterministic next-stage expert prefetch schedule
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck server
        run: npm run server:typecheck
      - name: Run transition-prefetch regressions
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-6-3
          npx esbuild server/core/training/HsmeStageTransitionPrefetchScheduleV1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-6-3/stage-prefetch.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-6-3/stage-prefetch.test.mjs
      - name: Prove exact route-table asset-roster and policy origins
        run: |
          set -euo pipefail
          SRC=server/core/training/HsmeStageTransitionPrefetchScheduleV1.ts
          grep -F 'hsmeStageRouteTableV1Digest(' "$SRC"
          grep -F 'verifyStageRouteTable(table,tableSha)' "$SRC"
          grep -F 'hsmeStagePrefetchAssetRosterV1Digest(' "$SRC"
          grep -F 'verifyStagePrefetchAssetRoster(roster,rosterSha)' "$SRC"
          grep -F 'hsmeStageTransitionPrefetchPolicyV1Digest(' "$SRC"
          grep -F 'verifyStageTransitionPrefetchPolicy(policy,policySha)' "$SRC"
      - name: Prove deterministic target-minus-source asset derivation
        run: |
          set -euo pipefail
          SRC=server/core/training/HsmeStageTransitionPrefetchScheduleV1.ts
          grep -F "'GEOMETRY_TO_APPEARANCE'" "$SRC"
          grep -F "'APPEARANCE_TO_DETAIL'" "$SRC"
          grep -F 'sourceIds.has(v.expertId)' "$SRC"
          grep -F 'STAGE_TRANSITION_PREFETCH_BYTE_CAP_EXCEEDED' "$SRC"
          grep -F 'targetDeterministicRouteSeedSha256' "$SRC"
          grep -F 'targetDeterministicRouteContractSha256' "$SRC"
          grep -F 'networkAllowed:false' "$SRC"
      - name: Prove no transfer inference or production authority
        run: |
          set -euo pipefail
          SRC=server/core/training/HsmeStageTransitionPrefetchScheduleV1.ts
          grep -F 'STAGE_TRANSITION_PREFETCH_SCHEDULE_FROZEN_NOT_EXECUTED' "$SRC"
          grep -F 'movementExecutionAllowed:false' "$SRC"
          grep -F 'stageRoutingExecutionAllowed:false' "$SRC"
          grep -F 'inferenceExecutionAllowed:false' "$SRC"
          grep -F 'routeMutationAllowed:false' "$SRC"
          grep -F 'modelInstallAllowed:false' "$SRC"
          grep -F 'providerAuthorityGranted:false' "$SRC"
          ! grep -nE "from ['\"]node:(fs|fs/promises|child_process)|writeFile|appendFile|spawn\(|(^|[^[:alnum:]_])exec\(|execFile\(|fork\(|ModelFleet(Service|Client)|reserveCredits|spendCredits|(^|[^[:alnum:]_])fetch\(|https?://" "$SRC"
      - name: Prove exact prefetch regressions
        run: |
          set -euo pipefail
          TEST=server/core/training/HsmeStageTransitionPrefetchScheduleV1.test.mjs
          grep -F 'exact target-minus-source expert delta' "$TEST"
          grep -F 'zero new bytes when target experts are already active' "$TEST"
          grep -F 'trusted origins are mandatory' "$TEST"
          grep -F 'exactly cover used expert id-content identities' "$TEST"
          grep -F 'exact-byte cap is enforced' "$TEST"
          grep -F 'trigger must stay strictly inside' "$TEST"
          grep -F 'network movement and route-mutation authority' "$TEST"
      - name: Diff hygiene
        run: git diff --check "$(git merge-base HEAD origin/${{ github.event.pull_request.base.ref }})"..HEAD
