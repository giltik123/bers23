name: Affine Deterministic Tool Candidate

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/platform/creative/deterministic/AffineTransform.ts'
      - 'src/platform/creative/deterministic/AffineTransformIdentity.js'
      - 'src/platform/creative/deterministic/DeterministicToolRegistry.ts'
      - 'server/core/localExecution/productionLocalExecutorPolicy.ts'
      - 'server/core/providers/productionExecutionCapabilities.ts'
      - 'src/platform/creative/canonical/planning/CanonicalPlanningService.ts'
      - 'tests/deterministic-affine-transform-contract.test.ts'
      - 'tests/deterministic-crop-contract.test.ts'
      - 'tests/background-isolation-canonical-wiring.test.ts'
      - '.github/workflows/affine-deterministic-tool-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affine-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core registry surfaces
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Bundle Affine and registry regressions
        run: |
          set -euo pipefail
          mkdir -p .test-cache/p192-affine
          for file in             tests/deterministic-affine-transform-contract.test.ts             tests/deterministic-crop-contract.test.ts             tests/background-isolation-canonical-wiring.test.ts; do
            out=".test-cache/p192-affine/$(basename "${file%.ts}").mjs"
            npx esbuild "$file" --bundle --platform=node --format=esm --target=node24 --outfile="$out" --external:node:* --external:pg --external:sharp
          done
      - name: Prove Affine kernel and data-only registry contract
        run: |
          node --test             .test-cache/p192-affine/deterministic-affine-transform-contract.test.mjs             .test-cache/p192-affine/deterministic-crop-contract.test.mjs             .test-cache/p192-affine/background-isolation-canonical-wiring.test.mjs
      - name: Build production browser
        run: npm run build
      - name: Prove Affine candidate remains production fail closed
        run: |
          set -euo pipefail
          kernel=src/platform/creative/deterministic/AffineTransform.ts
          registry=src/platform/creative/deterministic/DeterministicToolRegistry.ts
          policy=server/core/localExecution/productionLocalExecutorPolicy.ts
          capabilities=server/core/providers/productionExecutionCapabilities.ts
          planner=src/platform/creative/canonical/planning/CanonicalPlanningService.ts
          grep -q "INVERSE_AFFINE_Q16_16" "$registry"
          grep -q "TRANSPARENT_BLACK" "$registry"
          grep -q "normalizeAffineInverseMatrixQ16" "$kernel"
          ! grep -q "AFFINE_TRANSFORM_CAPABILITY" "$policy"
          ! grep -q "local:tool:affine-transform:v1" "$policy"
          ! grep -q "AFFINE_TRANSFORM_CAPABILITY" "$capabilities"
          ! grep -q "AFFINE_TRANSFORM" "$planner"
          test -n "$BASE_SHA"
          git diff --check "$BASE_SHA"..HEAD
