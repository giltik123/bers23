name: HSME-2a.3.2a pre-observation fixture plan

on:
  pull_request:
    paths:
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationBenchmarkFixturePlanV1.ts'
      - 'src/platform/creative/local-ai/hsme/hsme-foundation-benchmark-fixture-plan.v1.json'
      - 'tests/creative-hsme-foundation-benchmark-fixture-plan-v1.test.mjs'
      - 'tests/fixtures/tiny-sd-d6-quality-corpus-v1.json'
      - '.github/workflows/hsme-2a-3-2a-foundation-fixture-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-plan-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Prove pre-observation fixture freeze rules
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-2a
          npx esbuild tests/creative-hsme-foundation-benchmark-fixture-plan-v1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-2a/fixture.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-2a/fixture.test.mjs

      - name: Reuse the exact accepted D6 corpus
        run: |
          set -euo pipefail
          test "$(sha256sum tests/fixtures/tiny-sd-d6-quality-corpus-v1.json | awk '{print $1}')" = \
            "ce8bb069c7d3d99b56c97a19c415fca9a4d7643c9d04a1b75e225e3b948199fe"

      - name: Pending fixture plan cannot claim evidence or model authority
        run: |
          set -euo pipefail
          PLAN=src/platform/creative/local-ai/hsme/hsme-foundation-benchmark-fixture-plan.v1.json
          grep -F '"state": "EVIDENCE_PENDING"' "${PLAN}"
          grep -F '"assets": []' "${PLAN}"
          test "$(grep -c '"thresholdState": "PIN_REQUIRED"' "${PLAN}")" -eq 11
          grep -F '"privateUserDataAllowed": false' "${PLAN}"
          grep -F '"candidateOutputsObserved": false' "${PLAN}"
          grep -F '"postObservationMutationAllowed": false' "${PLAN}"
          grep -F '"ordinaryCiModelExecutionAllowed": false' "${PLAN}"

      - name: Ordinary CI cannot acquire or execute models
        run: |
          set -euo pipefail
          ! grep -E 'snapshot_download\(|from_pretrained\(|nvidia-smi|torch\.cuda|secrets\.' \
            src/platform/creative/local-ai/hsme/HsmeFoundationBenchmarkFixturePlanV1.ts \
            tests/creative-hsme-foundation-benchmark-fixture-plan-v1.test.mjs
          ! sed '/grep -E/d' .github/workflows/hsme-2a-3-2a-foundation-fixture-plan.yml | \
            grep -E 'pip install.*torch|huggingface-cli|hf download|wget|curl|snapshot_download|from_pretrained'
