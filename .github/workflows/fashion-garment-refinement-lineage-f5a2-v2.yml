name: Fashion F5a.2 dual-bound refinement FINAL lineage

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  refinement-final-lineage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fashion_f5a2_lineage_test
          POSTGRES_USER: fashion_f5a2_lineage_test
          POSTGRES_PASSWORD: fashion_f5a2_lineage_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U fashion_f5a2_lineage_test -d fashion_f5a2_lineage_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fashion_f5a2_lineage_test:fashion_f5a2_lineage_test@127.0.0.1:5432/fashion_f5a2_lineage_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck build and package migration 032 only
        run: |
          npm run typecheck
          npm run server:typecheck
          npm run server:build
          test -f dist-server/migrations/032_fashion_garment_refinement_final_lineage.sql
          test ! -f dist-server/migrations/033_fashion_garment_refinement_extension_repair.sql
      - name: Prove aggregate production migration and readiness
        run: |
          npm run db:migrate:transactions
          npm run db:check:transactions
      - name: Bundle dual-bound F5 and accepted F4 PostgreSQL vectors
        run: |
          mkdir -p .test-cache/fashion-f5a2-lineage
          npx esbuild tests/fashion-garment-refinement-final-lineage-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f5a2-lineage/f5.test.mjs --external:node:* --external:pg --external:sharp
          npx esbuild tests/fashion-garment-texture-final-lineage-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-f5a2-lineage/f4.test.mjs --external:node:* --external:pg --external:sharp
      - name: Prove direct F4 parent plus existing Project stale-source guard
        run: node --test --test-concurrency=1 .test-cache/fashion-f5a2-lineage/*.test.mjs
      - name: Prove schema-only authority boundary
        run: |
          grep -q "refinement_parent_image_storage_id" server/core/fashion/migrations/032_fashion_garment_refinement_final_lineage.sql
          grep -q "parent_image.source_image_storage_id = NEW.source_image_storage_id" server/core/fashion/migrations/032_fashion_garment_refinement_final_lineage.sql
          grep -q "p.current_image_storage_id = NEW.source_image_storage_id" server/core/fashion/migrations/032_fashion_garment_refinement_final_lineage.sql
          grep -q "GARMENT_APPEARANCE_REFINEMENT_PRODUCTION_ADMISSION = 'NOT_ADMITTED'" src/platform/creative/deterministic/GarmentAppearanceRefinementIdentity.js
          if grep -E "from ['\"].*(providers|billing|fashn|diffusion|transformers|onnx)" server/core/fashion/garmentAppearanceRefinementFinalLineageSchema.ts; then
            echo "F5a.2 schema imported runtime/provider authority" >&2; exit 1
          fi
          grep -q "TRYON_EXECUTION_NOT_WIRED" src/lib/tryon/tryonEngine.js
