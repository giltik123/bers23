name: Fashion F3c Canonical Outfit UI

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/api/coreClient.js'
      - 'src/api/coreResourceUrl.js'
      - 'src/api/managedGarmentClient.js'
      - 'src/api/managedGarmentCollectionClient.js'
      - 'src/api/managedOutfitClient.js'
      - 'src/api/managedWardrobeClient.js'
      - 'src/application/fashion/canonicalOutfitViewModel.js'
      - 'src/components/editor/outfits/OutfitPanel.jsx'
      - 'src/components/ui/button.jsx'
      - 'src/components/ui/input.jsx'
      - 'src/lib/app-params.js'
      - 'src/lib/utils.js'
      - 'src/lib/i18n/FormattingService.js'
      - 'src/lib/i18n/LanguageDetector.js'
      - 'src/lib/i18n/languages.js'
      - 'src/lib/i18n/LanguageStorage.js'
      - 'src/lib/i18n/LocalizationAnalytics.js'
      - 'src/lib/i18n/LocalizationManager.js'
      - 'src/lib/i18n/RTLManager.js'
      - 'src/lib/i18n/TranslationLoader.js'
      - 'src/lib/i18n/TranslationProvider.jsx'
      - '.github/workflows/fashion-canonical-outfit-ui-f3c.yml'
      - 'scripts/build-fashion-f3c-browser-closure.mjs'
      - 'tests/fashion-f3c-browser-build-closure.test.mjs'
      - 'tests/canonical-outfit-view-model.test.mjs'
      - 'tests/managed-outfit-browser-client.test.mjs'
      - 'tests/managed-outfit-browser-server-contract.test.mjs'
      - 'tests/fashion-canonical-outfit-ui.test.mjs'
      - 'tests/editor-zero-object-navigation.test.mjs'
      - 'src/components/editor/creative/CreativeStudioPanel.jsx'
      - 'src/pages/Editor.jsx'
      - 'src/components/editor/fashion/FashionPanel.jsx'
      - 'src/components/editor/agent/AgentPanel.jsx'
      - 'src/components/editor/outfits/TryOnPanel.jsx'
      - 'server/core/fashion/postgresOutfitStore.ts'
      - 'server/core/fashion/postgresGarmentWardrobeStore.ts'
      - 'server/core/http/managedOutfitHttpAdapter.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'src/components/editor/fashion/CanonicalCollectionsView.jsx'
      - 'src/lib/i18n/locales/en/index.js'
      - 'src/lib/i18n/locales/ru/index.js'
      - 'tests/fashion-canonical-collections-ui.test.mjs'
      - 'tests/release-r3g-browser-boundaries.test.mjs'
      - 'tests/release-r3h-browser-boundaries.test.mjs'
      - 'tests/release-r3i-browser-boundaries.test.mjs'
      - 'scripts/test-release-r3g-browser-e2e.mjs'
      - 'scripts/test-release-r3h-browser-e2e.mjs'
      - 'scripts/test-release-r3i-browser-e2e.mjs'

permissions:
  contents: read

jobs:
  canonical-outfit-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact PR head SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prove Outfit view-model semantics
        run: node --test tests/canonical-outfit-view-model.test.mjs
      - name: Re-prove accepted F3 browser and server contract
        run: |
          node --test tests/managed-outfit-browser-client.test.mjs
          node --test tests/managed-outfit-browser-server-contract.test.mjs
      - name: Prove canonical Outfit UI authority and zero-object navigation
        run: |
          node --test tests/fashion-canonical-outfit-ui.test.mjs
          node --test tests/editor-zero-object-navigation.test.mjs
      - name: Prove bounded F3c browser compile closure
        run: node --test tests/fashion-f3c-browser-build-closure.test.mjs
      - name: Reject legacy, execution and financial authority widening
        run: |
          set -euo pipefail
          FILES=(
            src/application/fashion/canonicalOutfitViewModel.js
            src/components/editor/outfits/OutfitPanel.jsx
          )
          ! grep -E -q 'outfitManager|coreClient\.entities|FASHN|billing|credits|onCommit|onRollback|fetch\(' "${FILES[@]}"
          grep -q 'coreClient.fashion.outfits' src/components/editor/outfits/OutfitPanel.jsx
          grep -q 'coreClient.fashion.wardrobe' src/components/editor/outfits/OutfitPanel.jsx
          grep -q 'outfits.reorderEntries' src/application/fashion/canonicalOutfitViewModel.js
          grep -q 'outfits.updateMetadata' src/application/fashion/canonicalOutfitViewModel.js
      - name: Keep Creative Studio disconnected from Outfit data
        run: |
          ! grep -E -q 'coreClient|outfitManager' src/components/editor/creative/CreativeStudioPanel.jsx
          grep -q 'outfits: \[\]' src/components/editor/creative/CreativeStudioPanel.jsx
      - name: Check committed diff whitespace
        run: git diff --check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
