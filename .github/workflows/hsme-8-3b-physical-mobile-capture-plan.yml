name: HSME-8.3b physical mobile capture plan

on:
  pull_request:
    paths:
      - 'server/core/training/HsmeHardwarePlacementMatrixV1.ts'
      - 'server/core/training/HsmeRealMobileQualificationV1.ts'
      - 'server/core/training/HsmePhysicalMobileCapturePlanV1.ts'
      - 'server/core/training/HsmePhysicalMobileCapturePlanV1.test.mjs'
      - '.github/workflows/hsme-8-3b-physical-mobile-capture-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-plan:
    name: exact physical mobile capture plan freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck server
        run: npm run server:typecheck

      - name: Run capture-plan regressions
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-8-3b
          npx esbuild server/core/training/HsmePhysicalMobileCapturePlanV1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-8-3b/physical-mobile-capture-plan.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-8-3b/physical-mobile-capture-plan.test.mjs

      - name: Prove exact matrix policy and reviewed request trust
        run: |
          set -euo pipefail
          SRC=server/core/training/HsmePhysicalMobileCapturePlanV1.ts
          grep -F 'hsmeHardwarePlacementMatrixV1Digest(' "$SRC"
          grep -F 'verifyHardwarePlacementMatrix(' "$SRC"
          grep -F 'hsmeRealMobileQualificationPolicyV1Digest(' "$SRC"
          grep -F 'verifyRealMobileQualificationPolicy(' "$SRC"
          grep -F 'hsmePhysicalMobileCaptureRequestV1Digest(' "$SRC"
          grep -F 'verifyPhysicalMobileCaptureRequest(' "$SRC"

      - name: Prove exact candidate placement and pre-outcome binding
        run: |
          set -euo pipefail
          SRC=server/core/training/HsmePhysicalMobileCapturePlanV1.ts
          grep -F 'row.fleetModelId!==request.fleetModelId' "$SRC"
          grep -F 'row.representationContentSha256!==' "$SRC"
          grep -F 'row.measurementEvidenceSha256!==' "$SRC"
          grep -F 'row.runtimeIdentity!==request.runtimeIdentity' "$SRC"
          grep -F 'row.actualPlacement!==request.requestedPlacement' "$SRC"
          grep -F 'request.repeatedRunCount<policy.minRepeatedRunCount' "$SRC"
          grep -F 'PHYSICAL_MOBILE_CAPTURE_REQUEST_NOT_CURRENT' "$SRC"

      - name: Prove battery zero-network and mandatory telemetry law
        run: |
          set -euo pipefail
          SRC=server/core/training/HsmePhysicalMobileCapturePlanV1.ts
          grep -F 'requireBatteryPower:true' "$SRC"
          grep -F 'networkBytesDuringExecution:0' "$SRC"
          grep -F 'requireFoundationPhysicalBundle:true' "$SRC"
          grep -F 'requireIndependentNativeTelemetryAttestation:true' "$SRC"
          grep -F "'MEASURED_ENERGY_MICROJOULES'" "$SRC"
          grep -F "'THERMAL_START_PEAK_END'" "$SRC"
          grep -F "'THROTTLED_RUN_COUNT'" "$SRC"

      - name: Prove no device execution qualification or model authority
        run: |
          set -euo pipefail
          SRC=server/core/training/HsmePhysicalMobileCapturePlanV1.ts
          grep -F 'PHYSICAL_MOBILE_CAPTURE_PLAN_FROZEN_NOT_EXECUTED' "$SRC"
          grep -F 'physicalCaptureExecutionAllowed:false' "$SRC"
          grep -F 'qualificationAllowed:false' "$SRC"
          grep -F 'modelInstallAllowed:false' "$SRC"
          grep -F 'durableModelFleetPromotionAllowed:false' "$SRC"
          grep -F 'providerAuthorityGranted:false' "$SRC"
          grep -F 'billingAuthorityGranted:false' "$SRC"
          ! grep -nE 'qualifyHsmeRealMobileEvidenceV1|REAL_MOBILE_QUALIFICATION_READY_NOT_ADMITTED|fetch\(|https?://|\.install\(|\.remove\(|reserveCredits|spendCredits' "$SRC"

      - name: Prove post-hoc drift regressions
        run: |
          set -euo pipefail
          TEST=server/core/training/HsmePhysicalMobileCapturePlanV1.test.mjs
          grep -F 'capture run count may not fall below frozen qualification minimum' "$TEST"
          grep -F 'stale or not-yet-reviewed capture request is BLOCKED before device execution' "$TEST"
          grep -F 'fleet runtime device placement and prior measurement binding cannot drift' "$TEST"
          grep -F 'battery zero-network and independent physical trust requirements are immutable' "$TEST"
          grep -F 'required telemetry cannot be removed or augmented post review' "$TEST"
          grep -F 'unknown post-hoc selection fields fail exact request schema' "$TEST"

      - name: Diff hygiene
        run: git diff --check "$(git merge-base HEAD origin/${{ github.event.pull_request.base.ref }})"..HEAD
