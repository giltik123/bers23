name: Temporary sharp 0.35.5 lockfile refresh
on:
  pull_request:
    branches: [main]
  push:
    branches: [security/sharp-0.35.5-20261009]
    paths:
      - package.json
      - .github/workflows/sharp-lockfile-refresh.yml
permissions:
  contents: write
jobs:
  regenerate-verified-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Resolve exact patched sharp dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify locked sharp and patched libvips
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(lock.packages['node_modules/sharp'].version, '0.35.5');
          assert.equal(lock.packages['node_modules/@img/sharp-libvips-linux-x64'].version, '1.3.4');
          NODE
      - name: Clean install and mandatory production security audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: patched-sharp-verified-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified lockfile only to security branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/sharp-0.35.5-20261009'
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          test -n "$(git status --porcelain -- package-lock.json)"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Security: regenerate vetted sharp 0.35.5 lockfile"
          git push origin HEAD:security/sharp-0.35.5-20261009
