name: Security production dependency override-resolution staging

on:
  push:
    branches: [ "security-production-dependency-overrides-staging" ]
    paths:
      - '.github/workflows/security-production-dependency-overrides-staging.yml'

permissions:
  contents: write

jobs:
  generate-minimal-safe-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Inject temporary resolver-only security overrides
        run: |
          cp package.json "$RUNNER_TEMP/package.json.original"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = { ...(pkg.overrides ?? {}), fflate: '0.8.3', 'postcss-selector-parser': '6.1.4' };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
          cp "$RUNNER_TEMP/package.json.original" package.json
      - name: Prove top-level manifest is byte-unchanged
        run: git diff --exit-code -- package.json
      - name: Prove exact transitive patches were selected
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = new Map([
            ['node_modules/fflate', '0.8.3'],
            ['node_modules/postcss-selector-parser', '6.1.4'],
          ]);
          for (const [path, version] of expected) {
            if (lock.packages?.[path]?.version !== version) throw new Error(`${path} resolved to ${lock.packages?.[path]?.version}`);
          }
          NODE
      - name: Prove generated lock works without overrides
        run: npm ci
      - name: Prove production audit is clear at enforced threshold
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit generated lock only
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- package.json)"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Expected package-lock.json remediation did not occur' >&2
            exit 1
          fi
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "security: resolve vulnerable transitives to safe patches"
          git push origin "HEAD:${GITHUB_REF_NAME}"
