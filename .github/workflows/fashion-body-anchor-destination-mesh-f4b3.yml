name: Fashion F4b.3 server-owned body anchors and destination mesh

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_fashion_execution_relevance:
    name: classify-fashion-execution-relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Classify F4b.3 execution relevance from trusted base
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            printf '%s\n' 'relevant=true' 'classification=RELEVANT_FASHION_EXECUTION_ACCEPTANCE_REQUIRED' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${EVENT_NAME}" = "pull_request"
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          TRUSTED_CLASSIFIER="${RUNNER_TEMP}/fashion-execution-base-classifier.mjs"
          trap 'rm -f "${TRUSTED_CLASSIFIER}"' EXIT
          git show "${BASE_SHA}:scripts/classify-fashion-execution-ci.mjs" > "${TRUSTED_CLASSIFIER}"
          test -s "${TRUSTED_CLASSIFIER}"
          test "$(wc -c < "${TRUSTED_CLASSIFIER}")" -le 1048576
          git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" \
            | node "${TRUSTED_CLASSIFIER}" --profile F4B3_BODY_ANCHOR --stdin0 --github-output "${GITHUB_OUTPUT}"
      - name: Prove Fashion execution relevance and workflow trust contracts
        run: node --test tests/fashion-execution-ci-relevance.test.mjs tests/fashion-execution-ci-workflow-trust.test.mjs

  heavy_body_anchor_destination_mesh:
    name: body-anchor-destination-mesh-heavy
    needs: classify_fashion_execution_relevance
    if: ${{ needs.classify_fashion_execution_relevance.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fashion_f4b3_body_anchor_test
          POSTGRES_USER: fashion_f4b3_body_anchor_test
          POSTGRES_PASSWORD: fashion_f4b3_body_anchor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fashion_f4b3_body_anchor_test -d fashion_f4b3_body_anchor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fashion_f4b3_body_anchor_test:fashion_f4b3_body_anchor_test@127.0.0.1:5432/fashion_f4b3_body_anchor_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA before dependency or database work
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core contracts
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Build production Core and package migration 028
        run: |
          npm run server:build
          test -f dist-server/migrations/028_project_body_anchor_sets.sql
      - name: Apply and verify predecessor canonical schemas
        run: |
          npm run db:migrate:transactions
          npm run db:check:transactions
      - name: Bundle F4b.3 deterministic geometry and PostgreSQL acceptance
        run: |
          mkdir -p .test-cache/fashion-body-anchor-f4b3
          npx esbuild tests/fashion-body-anchor-destination-mesh-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-body-anchor-f4b3/fashion-body-anchor-destination-mesh-postgres.test.mjs \
            --external:node:* --external:pg --external:sharp
          npx esbuild tests/fashion-body-anchor-schema-postgres.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-body-anchor-f4b3/fashion-body-anchor-schema-postgres.test.mjs \
            --external:node:* --external:pg
      - name: Prove exact Project evidence immutable anchors deterministic Q16 mesh and fail-closed schema readiness
        run: node --test --test-concurrency=1 .test-cache/fashion-body-anchor-f4b3/*.test.mjs
      - name: Prove F4b.3 grants no pixel execution provider Billing or Try-On authority
        run: |
          ! grep -R -E 'garment-mesh-warp|GARMENT_MESH_WARP' \
            server/core/localExecution/productionLocalExecutorPolicy.ts \
            server/core/providers/productionExecutionCapabilities.ts \
            server/core/providers/productionExecutionRoute.ts \
            server/core/providers/productionTargetSelection.ts \
            src/platform/creative/deterministic/DeterministicToolRegistry.ts
          grep -q "TRYON_EXECUTION_NOT_WIRED" src/lib/tryon/tryonEngine.js
          ! grep -R -E 'FAL_KEY|creditsUsed|Billing|provider' \
            server/core/fashion/bodyAnchorGeometry.ts \
            server/core/fashion/postgresProjectBodyAnchorStore.ts

  body-anchor-destination-mesh:
    name: body-anchor-destination-mesh
    needs: [classify_fashion_execution_relevance, heavy_body_anchor_destination_mesh]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require F4b.3 acceptance exactly when body-anchor execution authority is relevant
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_fashion_execution_relevance.result }}
          RELEVANT: ${{ needs.classify_fashion_execution_relevance.outputs.relevant }}
          CLASSIFICATION: ${{ needs.classify_fashion_execution_relevance.outputs.classification }}
          HEAVY_RESULT: ${{ needs.heavy_body_anchor_destination_mesh.result }}
        run: |
          set -euo pipefail
          test "${CLASSIFIER_RESULT}" = "success"
          if [ "${RELEVANT}" = "true" ]; then
            test "${CLASSIFICATION}" = "RELEVANT_FASHION_EXECUTION_ACCEPTANCE_REQUIRED"
            test "${HEAVY_RESULT}" = "success"
            exit 0
          fi
          test "${RELEVANT}" = "false"
          test "${CLASSIFICATION}" = "NOT_APPLICABLE_NON_FASHION_EXECUTION_CHANGE"
          test "${HEAVY_RESULT}" = "skipped"
