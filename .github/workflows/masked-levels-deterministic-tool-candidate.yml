name: Masked Levels Deterministic Tool Candidate

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/platform/creative/deterministic/Levels.ts'
      - 'src/platform/creative/deterministic/LevelsIdentity.js'
      - 'src/platform/creative/deterministic/MaskedLevels.ts'
      - 'src/platform/creative/deterministic/MaskedLevelsIdentity.js'
      - 'src/platform/creative/deterministic/DeterministicToolRegistry.ts'
      - 'server/core/localExecution/productionLocalExecutorPolicy.ts'
      - 'server/core/providers/productionExecutionCapabilities.ts'
      - 'src/platform/creative/canonical/planning/CanonicalPlanningService.ts'
      - 'scripts/classify-fashion-execution-ci.mjs'
      - 'scripts/f4b4-postgres-ci-closure.json'
      - 'tests/deterministic-masked-levels-contract.test.ts'
      - 'tests/deterministic-levels-contract.test.ts'
      - 'tests/deterministic-crop-contract.test.ts'
      - 'tests/background-isolation-canonical-wiring.test.ts'
      - 'tests/fashion-f4b4-execution-ci-relevance.test.mjs'
      - 'tests/fashion-f4b4-postgres-ci-relevance.test.mjs'
      - '.github/workflows/masked-levels-deterministic-tool-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  masked-levels-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core registry surfaces
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Bundle Masked Levels and registry regressions
        run: |
          set -euo pipefail
          mkdir -p .test-cache/p192-masked-levels
          for file in             tests/deterministic-masked-levels-contract.test.ts             tests/deterministic-levels-contract.test.ts             tests/deterministic-crop-contract.test.ts             tests/background-isolation-canonical-wiring.test.ts; do
            out=".test-cache/p192-masked-levels/$(basename "${file%.ts}").mjs"
            npx esbuild "$file" --bundle --platform=node --format=esm --target=node24 --outfile="$out" --external:node:* --external:pg --external:sharp
          done
      - name: Prove Masked Levels kernel and data-only registry contract
        run: |
          node --test             .test-cache/p192-masked-levels/deterministic-masked-levels-contract.test.mjs             .test-cache/p192-masked-levels/deterministic-levels-contract.test.mjs             .test-cache/p192-masked-levels/deterministic-crop-contract.test.mjs             .test-cache/p192-masked-levels/background-isolation-canonical-wiring.test.mjs
      - name: Build production browser
        run: npm run build
      - name: Prove Masked Levels candidate remains production fail closed
        run: |
          set -euo pipefail
          kernel=src/platform/creative/deterministic/MaskedLevels.ts
          registry=src/platform/creative/deterministic/DeterministicToolRegistry.ts
          policy=server/core/localExecution/productionLocalExecutorPolicy.ts
          capabilities=server/core/providers/productionExecutionCapabilities.ts
          planner=src/platform/creative/canonical/planning/CanonicalPlanningService.ts
          grep -q "SRGB_ENCODED_LEVELS_PIECEWISE_LINEAR_INTEGER_MASK_ALPHA8_BLEND" "$registry"
          grep -q "SOURCE_ADJUSTED_ALPHA8_ROUND_HALF_UP" "$registry"
          grep -q "levelsChannel" "$kernel"
          grep -q "maskAlpha" "$kernel"
          grep -q "floating-point gamma/power curve" "$kernel"
          ! grep -q "MASKED_LEVELS_CAPABILITY" "$policy"
          ! grep -q "local:tool:masked-levels:v1" "$policy"
          ! grep -q "MASKED_LEVELS_CAPABILITY" "$capabilities"
          ! grep -q "MASKED_LEVELS_OPERATION" "$planner"
          test -n "$BASE_SHA"
          git diff --check "$BASE_SHA"..HEAD
