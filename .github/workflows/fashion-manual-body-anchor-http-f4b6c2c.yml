name: Fashion F4b.6c.2c manual body-anchor acquisition transport

on:
  pull_request:
    branches:
      - main
      - fashion-readiness-anchor-sequence-f4b6c2b-clean
  workflow_dispatch:

jobs:
  manual-body-anchor-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core production acquisition transport
        run: |
          npm run typecheck
          npm run server:typecheck
          npm run server:build
          test -f dist-server/migrations/031_project_body_anchor_acquisition_sequence.sql
          test -f dist-server/migrations/032_project_body_anchor_sequence_consumer_cutover.sql
      - name: Bundle service HTTP and persistence-foundation tests
        run: |
          mkdir -p .test-cache/fashion-manual-body-anchor-http
          npx esbuild tests/fashion-manual-body-anchor-http-f4b6c2c.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/fashion-manual-body-anchor-http/http.test.mjs \
            --external:node:*
      - name: Prove server-resolved source fixed provenance redaction and CSRF boundary
        run: node --test .test-cache/fashion-manual-body-anchor-http/http.test.mjs
      - name: Prove one production body-anchor graph and no provider or Try-On execution authority
        run: |
          grep -q "resolveStoredImageEvidence" server/core/fashion/ManualProjectBodyAnchorAcquisitionService.ts
          grep -q "createForExpectedImage" server/core/fashion/ManualProjectBodyAnchorAcquisitionService.ts
          grep -q "assertPersistedAuthority" server/core/fashion/ManualProjectBodyAnchorAcquisitionService.ts
          grep -q "bodyAnchorPayloadSha256" server/core/fashion/ManualProjectBodyAnchorAcquisitionService.ts
          grep -q "MANUAL_BODY_ANCHOR_PRODUCER_ID = 'bers.manual-body-anchors'" server/core/fashion/ManualProjectBodyAnchorAcquisitionService.ts
          grep -q "assertBrowserMutationAllowed" server/core/http/manualProjectBodyAnchorHttpAdapter.ts
          grep -q "forbidden_client_authority" server/core/http/manualProjectBodyAnchorHttpAdapter.ts
          ! grep -q "id: anchorSet.id" server/core/http/manualProjectBodyAnchorHttpAdapter.ts
          ! grep -E "from 'pg'|providers|Billing|FAL_KEY|FASHN|tryonEngine" \
            server/core/fashion/ManualProjectBodyAnchorAcquisitionService.ts \
            server/core/http/manualProjectBodyAnchorHttpAdapter.ts
          grep -q "new ManualProjectBodyAnchorAcquisitionService" server/core/composition/createProductionGarmentMeshWarp.ts
          grep -q "bodyAnchors," server/core/composition/createProductionGarmentMeshWarp.ts
          grep -q "Object.defineProperty(execution, 'readiness'" server/core/composition/createProductionGarmentMeshWarp.ts
          grep -q "Object.defineProperty(execution, 'manualBodyAnchorAcquisition'" server/core/composition/createProductionGarmentMeshWarp.ts
          grep -q "writable: false" server/core/composition/createProductionGarmentMeshWarp.ts
          grep -q "production.localExecution.garmentMeshWarp.manualBodyAnchorAcquisition" server/index.ts
          grep -q "manualBodyAnchorAdapter" server/index.ts
          grep -q "fashionTryOnReadinessAdapter" server/index.ts
          grep -q "body-anchors" server/index.ts
          grep -q "TRYON_EXECUTION_NOT_WIRED" src/lib/tryon/tryonEngine.js
          ! grep -q "manualBodyAnchorAcquisition" src/lib/tryon/tryonEngine.js
