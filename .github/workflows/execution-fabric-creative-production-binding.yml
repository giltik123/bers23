name: Execution Fabric Creative production run binding

on:
  push:
    branches:
      - execution-fabric-creative-production-binding-staging
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/core/application/creativeExecutionService.ts'
      - 'server/core/composition/createCreativeCore.ts'
      - 'server/core/composition/createProductionCore.ts'
      - 'server/core/execution/**'
      - 'server/core/http/creativeLifecycleHandlers.ts'
      - 'server/core/http/nodeHttpAdapter.ts'
      - 'server/core/providers/falWorkflowRuntime.ts'
      - 'src/platform/creative/canonical/CreativeExecutionPlatform.ts'
      - 'src/platform/creative/provider-platform/contracts.ts'
      - 'src/platform/creative/provider-runtime/index.ts'
      - 'src/platform/creative/provider-runtime/ProviderArtifactEgressTransport.ts'
      - 'src/platform/creative/providers/fal/FalJobTracker.ts'
      - 'src/platform/creative/providers/fal/FalProvider.ts'
      - 'src/platform/creative/providers/fal/types.ts'
      - 'src/platform/creative/workflow-engine/WorkflowEngine.ts'
      - 'src/platform/creative/workflow-engine/types.ts'
      - 'src/lib/jobs/jobManager.js'
      - 'src/lib/jobs/jobRepeatPolicy.js'
      - 'src/lib/jobs/jobRepeatPolicy.test.mjs'
      - 'src/lib/jobs/jobRetryManager.js'
      - 'src/lib/jobs/jobScheduler.js'
      - 'src/lib/jobs/jobEphemeralAuthority.test.mjs'
      - 'src/lib/jobs/executionRunProjectionAuthority.test.mjs'
      - 'src/components/editor/jobs/JobCenter.jsx'
      - 'src/components/editor/jobs/JobRow.jsx'
      - 'tests/creative-cancellation-http.test.ts'
      - 'tests/creative-cancellation-race.test.ts'
      - 'tests/creative-execution-run-binding.test.ts'
      - 'tests/creative-execution-run-restart-postgres.test.ts'
      - 'tests/creative-fal-artifact-cancellation.integration.test.ts'
      - 'tests/creative-fal-cancellation.test.ts'
      - 'tests/creative-pre-execution-cancellation.test.ts'
      - 'tests/creative-reservation-cancellation.test.ts'
      - 'tests/provider-transport-cancellation.test.ts'
      - 'tests/core-server-postgres-vertical.test.ts'
      - 'tests/canonical-product-vertical-slice.test.ts'
      - '.github/workflows/execution-fabric-creative-production-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creative-production-run-binding:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creative_run_binding_test
          POSTGRES_USER: creative_run_binding_test
          POSTGRES_PASSWORD: creative_run_binding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creative_run_binding_test -d creative_run_binding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://creative_run_binding_test:creative_run_binding_test@127.0.0.1:5432/creative_run_binding_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Core server
        run: npm run server:typecheck
      - name: Build production Core and retain migration 034
        run: |
          npm run server:build
          test -f dist-server/migrations/034_execution_run_registry.sql
      - name: Prove production database migration and readiness
        run: |
          npm run db:migrate:transactions
          npm run db:check:transactions
      - name: Bundle Creative durable binding acceptance
        run: |
          mkdir -p .test-cache/creative-production-binding
          node --input-type=module <<'EOF'
          import { build } from 'esbuild';
          for (const [entry, outfile] of [
            ['tests/creative-execution-run-binding.test.ts', '.test-cache/creative-production-binding/creative-execution-run-binding.test.mjs'],
            ['tests/creative-execution-run-restart-postgres.test.ts', '.test-cache/creative-production-binding/creative-execution-run-restart-postgres.test.mjs'],
            ['tests/creative-fal-cancellation.test.ts', '.test-cache/creative-production-binding/creative-fal-cancellation.test.mjs'],
            ['tests/creative-fal-artifact-cancellation.integration.test.ts', '.test-cache/creative-production-binding/creative-fal-artifact-cancellation.integration.test.mjs'],
            ['tests/creative-cancellation-http.test.ts', '.test-cache/creative-production-binding/creative-cancellation-http.test.mjs'],
            ['tests/creative-cancellation-race.test.ts', '.test-cache/creative-production-binding/creative-cancellation-race.test.mjs'],
            ['tests/creative-pre-execution-cancellation.test.ts', '.test-cache/creative-production-binding/creative-pre-execution-cancellation.test.mjs'],
            ['tests/creative-reservation-cancellation.test.ts', '.test-cache/creative-production-binding/creative-reservation-cancellation.test.mjs'],
            ['tests/provider-transport-cancellation.test.ts', '.test-cache/creative-production-binding/provider-transport-cancellation.test.mjs'],
            ['tests/canonical-product-vertical-slice.test.ts', '.test-cache/creative-production-binding/canonical-product-vertical-slice.test.mjs'],
          ]) await build({
            entryPoints: [entry],
            bundle: true,
            platform: 'node',
            format: 'esm',
            target: 'node24',
            outfile,
            external: ['pg', 'sharp', 'node:*'],
          });
          EOF
      - name: Prove service lifecycle ordering, owning cancellation and replay guard
        run: node --test .test-cache/creative-production-binding/creative-execution-run-binding.test.mjs
      - name: Prove cancellation/provider failure race never creates false CANCELLED truth
        run: node --test .test-cache/creative-production-binding/creative-cancellation-race.test.mjs
      - name: Prove prepared cancellation releases Billing exactly once before SKIPPED
        run: node --test .test-cache/creative-production-binding/creative-pre-execution-cancellation.test.mjs
      - name: Prove reserve-in-flight cancellation cannot leak Billing or dispatch provider work
        run: node --test .test-cache/creative-production-binding/creative-reservation-cancellation.test.mjs
      - name: Prove active Fal cancellation is abort-backed and non-retryable
        run: node --test .test-cache/creative-production-binding/creative-fal-cancellation.test.mjs
      - name: Prove production Fal artifact egress shares owning cancellation signal
        run: node --test .test-cache/creative-production-binding/creative-fal-artifact-cancellation.integration.test.mjs
      - name: Prove provider transports fail fast on pre-aborted owning signals
        run: node --test .test-cache/creative-production-binding/provider-transport-cancellation.test.mjs
      - name: Prove lifecycle HTTP waits for owning cancellation reconciliation
        run: node --test .test-cache/creative-production-binding/creative-cancellation-http.test.mjs
      - name: Prove PostgreSQL process-restart replay cannot redispatch spend or provider work
        run: node --test --test-concurrency=1 .test-cache/creative-production-binding/creative-execution-run-restart-postgres.test.mjs
      - name: Prove browser repeat policy cannot become Creative redispatch authority
        run: |
          set -euo pipefail
          grep -q 'onJobFailure: () => false' src/lib/jobs/jobManager.js
          grep -q 'buildNewOperationRepeatMetadata(job)' src/lib/jobs/jobManager.js
          grep -q "NEW_OPERATION: 'NEW_OPERATION'" src/lib/jobs/jobRepeatPolicy.js
          ! grep -E -q 'jobRetryManager|jobScheduler|retry\(jobId\)' src/lib/jobs/jobManager.js
          ! grep -q 'coreClient.creative.execute' src/components/editor/jobs/JobCenter.jsx
          ! grep -E -q 'onRunAgain|onRetry|onDuplicate' src/components/editor/jobs/CanonicalExecutionRunRow.jsx
      - name: Preserve accepted Creative provider Billing and scope semantics
        run: node --test .test-cache/creative-production-binding/canonical-product-vertical-slice.test.mjs
      - name: Prove real HTTP Project scope reaches durable Run then Billing and provider authority
        run: npm run test:core-server-postgres-vertical
      - name: Prove production composition is fail-closed on durable registry readiness and owning cancel
        run: |
          set -euo pipefail
          grep -q 'checkExecutionRunSchema(transactions.pool)' server/core/composition/createProductionCore.ts
          grep -q 'migrateExecutionRunSchema(transactions.pool)' server/core/composition/createProductionCore.ts
          grep -q 'new PostgresExecutionRunRegistry(transactions.pool)' server/core/composition/createProductionCore.ts
          grep -q '^      executionRuns,$' server/core/composition/createProductionCore.ts
          grep -q 'executionRuns: input.executionRuns' server/core/composition/createCreativeCore.ts
          grep -q 'executionRuns.issue' server/core/application/creativeExecutionService.ts
          grep -q 'creative_reconciliation_required' server/core/application/creativeExecutionService.ts
          grep -q "outcome.status === 'UNKNOWN'" server/core/application/creativeExecutionService.ts
          grep -q 'executionRuns.cancel' server/core/application/creativeExecutionService.ts
          grep -q 'CREATIVE_EXECUTION_CANCELLED' server/core/application/creativeExecutionService.ts
          grep -q 'runtime.cancel' server/core/application/creativeExecutionService.ts
          grep -q 'cancelPreparedExecution' server/core/application/creativeExecutionService.ts
          grep -q 'cancelPreparedExecution' src/platform/creative/canonical/CreativeExecutionPlatform.ts
          grep -q 'await input.core.lifecycle.cancel' server/core/http/nodeHttpAdapter.ts
          grep -q 'cancel(workflowId: string)' server/core/providers/falWorkflowRuntime.ts
          grep -q 'signal?: AbortSignal' src/platform/creative/provider-platform/contracts.ts
          grep -q 'signal: AbortSignal = new AbortController().signal' src/platform/creative/provider-runtime/index.ts
          ! grep -E -q 'LOCAL_EXECUTION.*cancel|WORKFLOW_CONTINUATION.*cancel|WORKFLOW_STEP.*cancel' server/core/application/creativeExecutionService.ts
          ! grep -R -E -q 'ExecutionRunRegistry\.cancel|executionRuns\.cancel|/api/core/execution-runs/[^ ]*/cancel' src
      - name: Reject authority widening in Creative binding slice
        run: |
          set -euo pipefail
          FILES=(
            server/core/application/creativeExecutionService.ts
            server/core/composition/createCreativeCore.ts
            server/core/composition/createProductionCore.ts
            server/core/http/creativeLifecycleHandlers.ts
            server/core/providers/falWorkflowRuntime.ts
            src/platform/creative/canonical/CreativeExecutionPlatform.ts
          )
          ! grep -E -q '/api/core/(jobs|agent|automation)|JobRecord|coreClient\.entities|FASHN|stripe' "${FILES[@]}"
      - name: Check committed diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --check "$BASE_SHA"..HEAD
          else
            git diff --check HEAD^..HEAD
          fi
