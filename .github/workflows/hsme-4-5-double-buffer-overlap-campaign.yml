name: HSME-4.5 measured double-buffer overlap campaign

on:
  pull_request:
    paths:
      - 'server/core/training/HsmeAdaptiveResidencyExperimentPlanV1.ts'
      - 'server/core/training/HsmeDeterministicResidencyScheduleV1.ts'
      - 'server/core/training/HsmeDoubleBufferComparisonV1.ts'
      - 'server/core/training/HsmeDoubleBufferComparisonV1.test.mjs'
      - '.github/workflows/hsme-4-5-double-buffer-overlap-campaign.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  double-buffer:
    name: measured serialized vs double-buffer overlap
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck server
        run: npm run server:typecheck
      - name: Run double-buffer campaign regressions
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-4-5
          npx esbuild server/core/training/HsmeDoubleBufferComparisonV1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-4-5/double-buffer.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-4-5/double-buffer.test.mjs
      - name: Prove measured overlap and parity law
        run: |
          set -euo pipefail
          SRC=server/core/training/HsmeDoubleBufferComparisonV1.ts
          grep -F 'serialized control overlap must be zero' "$SRC"
          grep -F 'observed overlap exceeds transfer/compute window' "$SRC"
          grep -F 'DOUBLE_BUFFER_CONTENT_OR_QUALITY_PARITY_MISMATCH' "$SRC"
          grep -F 'realMeasuredEvidence!==true' "$SRC"
      - name: Prove exact plan schedule campaign origins and budgets
        run: |
          set -euo pipefail
          SRC=server/core/training/HsmeDoubleBufferComparisonV1.ts
          grep -F 'verifyResidencyPlan(' "$SRC"
          grep -F 'verifySchedule(' "$SRC"
          grep -F 'verifyCampaign(' "$SRC"
          grep -F 'verifyMeasurement(' "$SRC"
          grep -F 'DOUBLE_BUFFER_MEASUREMENT_BUDGET_EXCEEDED' "$SRC"
          grep -F 'DOUBLE_BUFFER_CAMPAIGN_CAP_ESCALATION' "$SRC"
      - name: Prove no disposition or production authority
        run: |
          set -euo pipefail
          SRC=server/core/training/HsmeDoubleBufferComparisonV1.ts
          grep -F 'DOUBLE_BUFFER_COMPARISON_READY_NOT_DISPOSED' "$SRC"
          grep -F 'dispositionAllowed:false' "$SRC"
          grep -F 'modelInstallAllowed:false' "$SRC"
          grep -F 'providerAuthorityGranted:false' "$SRC"
          grep -F 'billingAuthorityGranted:false' "$SRC"
          ! grep -nE "from ['\"]node:(fs|fs/promises|child_process)|writeFile|appendFile|spawn\(|exec\(|execFile\(|fork\(|ModelFleet(Service|Client)|reserveCredits|spendCredits|fetch\(|https?://" "$SRC"
      - name: Diff hygiene
        run: git diff --check "$(git merge-base HEAD origin/${{ github.event.pull_request.base.ref }})"..HEAD
