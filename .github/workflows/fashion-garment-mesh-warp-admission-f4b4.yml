name: Fashion F4b.4 production garment mesh-warp admission

on:
  pull_request:
    branches: [ "main", "fashion-production-garment-mesh-warp-f4b4" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_fashion_execution_relevance:
    name: classify-fashion-execution-relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Classify F4b.4 warp admission relevance from trusted base
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            printf '%s\n' 'relevant=true' 'classification=RELEVANT_FASHION_EXECUTION_ACCEPTANCE_REQUIRED' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${EVENT_NAME}" = "pull_request"
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          TRUSTED_CLASSIFIER="${RUNNER_TEMP}/fashion-execution-base-classifier.mjs"
          trap 'rm -f "${TRUSTED_CLASSIFIER}"' EXIT
          git show "${BASE_SHA}:scripts/classify-fashion-execution-ci.mjs" > "${TRUSTED_CLASSIFIER}"
          test -s "${TRUSTED_CLASSIFIER}"
          test "$(wc -c < "${TRUSTED_CLASSIFIER}")" -le 1048576
          git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" \
            | node "${TRUSTED_CLASSIFIER}" --profile F4B4_WARP_ADMISSION --stdin0 --github-output "${GITHUB_OUTPUT}"
      - name: Prove Fashion execution relevance and workflow trust contracts
        run: node --test tests/fashion-execution-ci-relevance.test.mjs tests/fashion-execution-ci-workflow-trust.test.mjs

  heavy_garment_mesh_warp_admission:
    name: garment-mesh-warp-admission-heavy
    needs: classify_fashion_execution_relevance
    if: ${{ needs.classify_fashion_execution_relevance.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck and build admitted production authority
        run: |
          npm run typecheck
          npm run server:typecheck
          npm run server:build
      - name: Bundle managed-input, policy, Core-recompute, verifier, browser and transport contracts
        run: |
          mkdir -p .test-cache/fashion-f4b4-admission
          npx esbuild tests/local-execution-managed-input-platform.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/platform.mjs --metafile=.test-cache/fashion-f4b4-admission/platform.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-managed-input-limits.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/managed-limits.mjs --metafile=.test-cache/fashion-f4b4-admission/managed-limits.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-registry-contract.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/registry.mjs --metafile=.test-cache/fashion-f4b4-admission/registry.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-planner-contract.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/planner.mjs --metafile=.test-cache/fashion-f4b4-admission/planner.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-ticket-contract.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/ticket.mjs --metafile=.test-cache/fashion-f4b4-admission/ticket.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/artifact-authority-stored-image-evidence.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/project-evidence.mjs --metafile=.test-cache/fashion-f4b4-admission/project-evidence.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-input-delivery.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/delivery.mjs --metafile=.test-cache/fashion-f4b4-admission/delivery.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-execution-service.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/service.mjs --metafile=.test-cache/fashion-f4b4-admission/service.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-workflow-verifier.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/verifier.mjs --metafile=.test-cache/fashion-f4b4-admission/verifier.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-browser-executor.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/browser.mjs --metafile=.test-cache/fashion-f4b4-admission/browser.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-http-adapter.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/http.mjs --metafile=.test-cache/fashion-f4b4-admission/http.meta.json --external:node:* --external:pg --external:sharp
          npx esbuild tests/deterministic-garment-mesh-warp-admission-boundary.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/production-policy.mjs --metafile=.test-cache/fashion-f4b4-admission/production-policy.meta.json --external:node:* --external:pg --external:sharp
      - name: Prove actual F4b.4 bundles exclude unrelated aggregate and model-policy graphs
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          const dir = '.test-cache/fashion-f4b4-admission';
          const metaFiles = (await readdir(dir)).filter(name => name.endsWith('.meta.json')).sort();
          if (metaFiles.length !== 12) throw new Error(`Expected 12 F4b.4 bundle metafiles, found ${metaFiles.length}`);
          const inputs = new Set();
          const inputsByMeta = new Map();
          for (const name of metaFiles) {
            const meta = JSON.parse(await readFile(`${dir}/${name}`, 'utf8'));
            const normalizedInputs = new Set(Object.keys(meta.inputs ?? {}).map(input => input.replaceAll('\\', '/').replace(/^\.\//, '')));
            inputsByMeta.set(name, normalizedInputs);
            for (const input of normalizedInputs) inputs.add(input);
          }
          const banned = [
            'src/platform/creative/deterministic/DeterministicToolRegistry.ts',
            'server/core/localExecution/productionLocalExecutorPolicy.ts',
            'server/core/localExecution/productionLocalModelPolicy.ts',
            'server/core/providers/productionExecutionCapabilities.ts',
            'server/core/providers/productionExecutionRoute.ts',
            'server/core/providers/productionTargetSelection.ts',
            'src/platform/creative/local-ai/models/super-resolution.manifest.json',
            'src/platform/creative/deterministic/GarmentTextureCompositeRegistryDefinition.js',
          ];
          const escapes = [];
          for (const candidate of banned) {
            const owners = [...inputsByMeta.entries()]
              .filter(([, metaInputs]) => metaInputs.has(candidate))
              .map(([name]) => name);
            if (owners.length) escapes.push(`${candidate} <= ${owners.join(',')}`);
          }
          if (escapes.length) throw new Error(`F4b.4 structural bundle dependency escaped narrow policy leaves:\n${escapes.join('\n')}`);
          const required = [
            'src/platform/creative/deterministic/GarmentMeshWarpRegistryDefinition.js',
            'server/core/localExecution/productionGarmentMeshWarpExecutorPolicy.ts',
            'server/core/providers/productionGarmentMeshWarpExecutionPolicy.ts',
          ];
          for (const candidate of required) {
            if (!inputs.has(candidate)) throw new Error(`F4b.4 bundle dependency proof did not exercise required leaf: ${candidate}`);
          }
          console.log(`F4B4_BUNDLE_METAFILES=${metaFiles.length}`);
          console.log(`F4B4_BUNDLE_INPUTS=${inputs.size}`);
          NODE
      - name: Prove Project and managed Garment ticket namespaces stay distinct
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/platform.mjs
      - name: Prove oversized basis views fail before ticket issuance and delivery
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/managed-limits.mjs
      - name: Prove registry describes managed authority separately from Project inputs
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/registry.mjs
      - name: Prove planner and production policy admit only the exact LOCAL_ONLY warp tuple
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/planner.mjs
      - name: Prove exact server-only ticket contract fails closed on authority drift
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/ticket.mjs
      - name: Prove signed Project artifact resolves to exact durable storage evidence
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/project-evidence.mjs
      - name: Prove purpose-bound Garment bytes and server mesh delivery
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/delivery.mjs
      - name: Prove Core byte-exact recomputation, intermediate persistence and replay
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/service.mjs
      - name: Prove verifier accepts only byte-exact Fashion WORKING intermediates
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/verifier.mjs
      - name: Prove browser executes only Core-owned envelope and returns no Project authority
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/browser.mjs
      - name: Prove HTTP boundary accepts intent only and delivers one purpose-bound envelope
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/http.mjs
      - name: Prove admission remains Fashion-only and Try-On stays unwired
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/production-policy.mjs
      - name: Assert exact production admission surface
        run: |
          grep -q "PRODUCTION_ADMISSION = 'ADMITTED'" src/platform/creative/deterministic/GarmentMeshWarpIdentity.js
          grep -q 'productionGarmentMeshWarpExecutorsByCapability' server/core/localExecution/productionLocalExecutorPolicy.ts
          grep -q 'GARMENT_MESH_WARP_CAPABILITY' server/core/localExecution/productionGarmentMeshWarpExecutorPolicy.ts
          grep -q 'GARMENT_MESH_WARP_PRODUCTION_EXECUTION_RULE' server/core/providers/productionExecutionCapabilities.ts
          grep -q 'GARMENT_MESH_WARP_PRODUCTION_EXECUTION_RULE' server/core/providers/productionExecutionRoute.ts
          grep -q 'GARMENT_MESH_WARP_PRODUCTION_EXECUTION_RULE' server/core/providers/productionTargetSelection.ts
          grep -q 'GARMENT_MESH_WARP_OPERATION' server/core/providers/productionGarmentMeshWarpExecutionPolicy.ts
          grep -q 'TRYON_EXECUTION_NOT_WIRED' src/lib/tryon/tryonEngine.js
          ! grep -Eq 'garment-mesh-warp|GARMENT_MESH_WARP' src/lib/tryon/tryonEngine.js

  garment-mesh-warp-admission:
    name: garment-mesh-warp-admission
    needs: [classify_fashion_execution_relevance, heavy_garment_mesh_warp_admission]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require F4b.4 admission acceptance exactly when GarmentMeshWarp production admission is relevant
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_fashion_execution_relevance.result }}
          RELEVANT: ${{ needs.classify_fashion_execution_relevance.outputs.relevant }}
          CLASSIFICATION: ${{ needs.classify_fashion_execution_relevance.outputs.classification }}
          HEAVY_RESULT: ${{ needs.heavy_garment_mesh_warp_admission.result }}
        run: |
          set -euo pipefail
          test "${CLASSIFIER_RESULT}" = "success"
          if [ "${RELEVANT}" = "true" ]; then
            test "${CLASSIFICATION}" = "RELEVANT_FASHION_EXECUTION_ACCEPTANCE_REQUIRED"
            test "${HEAVY_RESULT}" = "success"
            exit 0
          fi
          test "${RELEVANT}" = "false"
          test "${CLASSIFICATION}" = "NOT_APPLICABLE_NON_FASHION_EXECUTION_CHANGE"
          test "${HEAVY_RESULT}" = "skipped"
