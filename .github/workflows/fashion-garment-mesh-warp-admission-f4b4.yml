name: Fashion F4b.4 production garment mesh-warp admission

on:
  pull_request:
    branches: [ "main", "fashion-production-garment-mesh-warp-f4b4" ]
  workflow_dispatch:

jobs:
  garment-mesh-warp-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck and build before widening production authority
        run: |
          npm run typecheck
          npm run server:typecheck
          npm run server:build
      - name: Bundle managed-input, registry, planner, ticket, Project-evidence, delivery and Core-recompute contracts
        run: |
          mkdir -p .test-cache/fashion-f4b4-admission
          npx esbuild tests/local-execution-managed-input-platform.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/platform.mjs --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-registry-contract.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/registry.mjs --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-planner-contract.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/planner.mjs --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-ticket-contract.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/ticket.mjs --external:node:* --external:pg --external:sharp
          npx esbuild tests/artifact-authority-stored-image-evidence.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/project-evidence.mjs --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-input-delivery.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/delivery.mjs --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-execution-service.test.ts --bundle --platform=node --format=esm --target=node24 --outfile=.test-cache/fashion-f4b4-admission/service.mjs --external:node:* --external:pg --external:sharp
      - name: Prove Project and managed Garment ticket namespaces stay distinct
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/platform.mjs
      - name: Prove registry describes managed authority without admitting production execution
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/registry.mjs
      - name: Prove canonical planner requires a closed server-owned warp binding
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/planner.mjs
      - name: Prove exact server-only ticket contract fails closed on authority drift
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/ticket.mjs
      - name: Prove signed Project artifact resolves to exact durable storage evidence
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/project-evidence.mjs
      - name: Prove purpose-bound Garment bytes and server mesh delivery
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/delivery.mjs
      - name: Prove Core byte-exact recomputation, intermediate persistence and replay
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-admission/service.mjs
      - name: Keep production pixel admission closed until PostgreSQL vertical proof lands
        run: |
          grep -q "PRODUCTION_ADMISSION = 'NOT_ADMITTED'" src/platform/creative/deterministic/GarmentMeshWarpIdentity.js
          ! grep -q 'GARMENT_MESH_WARP_CAPABILITY' server/core/localExecution/productionLocalExecutorPolicy.ts
          ! grep -q 'GARMENT_MESH_WARP_OPERATION' server/core/providers/productionExecutionCapabilities.ts
          ! grep -q 'GARMENT_MESH_WARP_OPERATION' server/core/providers/productionExecutionRoute.ts
          ! grep -q 'GARMENT_MESH_WARP_OPERATION' server/core/providers/productionTargetSelection.ts
