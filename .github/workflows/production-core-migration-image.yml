name: Production Core migration image contract

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  migrate-and-start:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: core_migration_test
          POSTGRES_USER: core_migration_test
          POSTGRES_PASSWORD: core_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_migration_test -d core_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOURCE_DATABASE_URL: postgresql://core_migration_test:core_migration_test@127.0.0.1:5432/core_migration_test
      IMAGE_DATABASE_URL: postgresql://core_migration_test:core_migration_test@127.0.0.1:5432/core_migration_image_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck and build Core distribution
        run: |
          npm run server:typecheck
          npm run server:build
          test -s dist-server/server.mjs
          test -s dist-server/migrate.mjs
          test -f dist-server/migrations/001_transaction_store.sql
          test -f dist-server/migrations/015_workflow_continuations.sql
          test -f dist-server/migrations/033_manual_parametric_basis_content_uniqueness.sql
          test -f dist-server/migrations/034_execution_run_registry.sql
          test -f dist-server/migrations/035_project_body_anchor_idempotency.sql
          test "$(find dist-server/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 35
          test "$(find dist-server/migrations -maxdepth 1 -type f -name '*.down.sql' | wc -l)" -eq 0
      - name: Prove bundled migrator on a clean PostgreSQL database
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
          NODE_ENV: production
        run: |
          node dist-server/migrate.mjs migrate
          node dist-server/migrate.mjs check
          node dist-server/migrate.mjs migrate
          node dist-server/migrate.mjs check
          node --input-type=module <<'NODE'
          import { Pool } from 'pg';
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          try {
            const result = await pool.query(`SELECT
              to_regclass('workflow_continuations')::text AS continuation,
              to_regclass('canonical_execution_runs')::text AS execution_runs,
              EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema=current_schema()
                  AND table_name='canonical_project_body_anchor_sets'
                  AND column_name='idempotency_key' AND udt_name='uuid'
              ) AS body_anchor_idempotency_key,
              EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema=current_schema()
                  AND table_name='canonical_project_body_anchor_sets'
                  AND column_name='idempotency_binding_sha256' AND udt_name='bpchar'
              ) AS body_anchor_idempotency_binding,
              to_regclass('canonical_project_body_anchor_sets_owner_idempotency_key_unique')::text AS body_anchor_idempotency_index`);
            if (result.rows[0]?.continuation !== 'workflow_continuations') throw new Error('migration 015 was not applied');
            if (result.rows[0]?.execution_runs !== 'canonical_execution_runs') throw new Error('migration 034 was not applied');
            if (result.rows[0]?.body_anchor_idempotency_key !== true) throw new Error('migration 035 idempotency key was not applied');
            if (result.rows[0]?.body_anchor_idempotency_binding !== true) throw new Error('migration 035 binding hash was not applied');
            if (result.rows[0]?.body_anchor_idempotency_index !== 'canonical_project_body_anchor_sets_owner_idempotency_key_unique') throw new Error('migration 035 unique index was not applied');
          } finally { await pool.end(); }
          NODE
      - name: Create independent clean database for immutable-image proof
        run: |
          DATABASE_URL="postgresql://core_migration_test:core_migration_test@127.0.0.1:5432/postgres" node --input-type=module <<'NODE'
          import { Pool } from 'pg';
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          try { await pool.query('CREATE DATABASE core_migration_image_test'); }
          finally { await pool.end(); }
          NODE
      - name: Build immutable production image
        run: docker build -t bers-core-migration:${{ github.sha }} .
      - name: Prove the production image owns one-shot migration and readiness
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$IMAGE_DATABASE_URL" \
            bers-core-migration:${{ github.sha }} node dist-server/migrate.mjs migrate
          docker run --rm --network host \
            -e DATABASE_URL="$IMAGE_DATABASE_URL" \
            bers-core-migration:${{ github.sha }} node dist-server/migrate.mjs check
          docker run --rm --network host \
            -e DATABASE_URL="$IMAGE_DATABASE_URL" \
            bers-core-migration:${{ github.sha }} node dist-server/migrate.mjs migrate
          docker run -d --name bers-core-migration-smoke --network host \
            -e PORT=18081 \
            -e DATABASE_URL="$IMAGE_DATABASE_URL" \
            -e FAL_KEY=test-fal-key \
            -e JWT_SECRET=test-jwt-secret \
            -e JWT_ISSUER=bers-test \
            -e JWT_AUDIENCE=bers-core \
            -e AUTH_CHALLENGE_SECRET=test-auth-challenge-secret \
            -e AUTH_DEFAULT_TENANT_ID=test-tenant \
            -e AUTH_PUBLIC_ORIGIN=https://app.example.test \
            -e RESEND_API_KEY=test-resend-key \
            -e AUTH_EMAIL_FROM='Bers Test <noreply@example.test>' \
            -e GOOGLE_OAUTH_CLIENT_ID=test-google-client \
            -e GOOGLE_OAUTH_CLIENT_SECRET=test-google-secret \
            -e ARTIFACT_SIGNING_SECRET=test-artifact-signing-secret \
            -e ALLOWED_WEB_ORIGINS=https://app.example.test \
            bers-core-migration:${{ github.sha }}
          diagnose() { docker logs bers-core-migration-smoke || true; }
          trap diagnose ERR
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/health/ready | grep -q '"status":"ready"'; then break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' bers-core-migration-smoke)" != true ]; then diagnose; exit 1; fi
            if [ "$attempt" = 30 ]; then diagnose; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/health/live | grep -q '"status":"live"'
          curl --fail --silent http://127.0.0.1:18081/health/ready | grep -q '"status":"ready"'
          docker rm -f bers-core-migration-smoke
