name: R3m Auth Lifecycle Browser E2E

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/App.jsx'
      - 'src/api/coreClient.js'
      - 'src/components/ProtectedRoute.jsx'
      - 'src/lib/AuthContext.jsx'
      - 'src/pages/Login.jsx'
      - 'src/pages/Register.jsx'
      - 'src/pages/ForgotPassword.jsx'
      - 'src/pages/ResetPassword.jsx'
      - 'src/pages/Settings.jsx'
      - 'server/core/auth/**'
      - 'server/core/composition/createProductionCore.ts'
      - 'server/core/config.ts'
      - 'server/core/http/**'
      - 'server/index.ts'
      - 'scripts/build-core-server.mjs'
      - 'scripts/serve-production-frontend.mjs'
      - 'scripts/production-core-api-proxy.mjs'
      - 'Dockerfile.frontend'
      - 'scripts/release-r3m-auth-email-capture-preload.mjs'
      - 'scripts/test-release-r3m-auth-lifecycle-browser-e2e.mjs'
      - 'tests/auth-client-contract.test.mjs'
      - 'tests/auth-public-route-routing.test.mjs'
      - '.github/workflows/release-r3m-auth-lifecycle-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-r3m-auth-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-lifecycle-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: release_r3m_test
          POSTGRES_USER: release_r3m_test
          POSTGRES_PASSWORD: release_r3m_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_r3m_test -d release_r3m_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://release_r3m_test:release_r3m_test@127.0.0.1:5432/release_r3m_test
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      VITE_CORE_API_URL: http://127.0.0.1:4212/api/core
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core auth surfaces
        run: |
          npm run typecheck
          npm run server:typecheck
          node --test tests/auth-client-contract.test.mjs
          node --test tests/auth-public-route-routing.test.mjs
          node --check scripts/release-r3m-auth-email-capture-preload.mjs
      - name: Build immutable Core and apply packaged production migrations
        run: |
          npm run server:build
          test -f dist-server/server.mjs
          test -f dist-server/migrations/008_canonical_auth_identity_sessions.sql
          test -f dist-server/migrations/009_auth_lifecycle_oauth.sql
          test -f dist-server/migrations/010_registration_attempt_binding.sql
          node dist-server/migrate.mjs migrate
          node dist-server/migrate.mjs check
      - name: Generate and mask ephemeral R3m runtime secrets
        run: |
          set -euo pipefail
          for name in FAL_KEY JWT_SECRET AUTH_CHALLENGE_SECRET RESEND_API_KEY GOOGLE_OAUTH_CLIENT_SECRET ARTIFACT_SIGNING_SECRET; do
            value="$(openssl rand -hex 32)"
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
      - name: Build real SPA against the built Core origin
        run: |
          npm run build
          test -f dist/index.html
      - name: Bundle external R3m browser harness
        run: |
          mkdir -p .test-cache/release-r3m
          npx esbuild scripts/test-release-r3m-auth-lifecycle-browser-e2e.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/release-r3m/test-release-r3m-auth-lifecycle-browser-e2e.mjs \
            --external:node:* --external:pg --external:playwright
      - name: Prove register OTP logout login reset and protected-route lifecycle
        run: |
          set -euo pipefail
          node .test-cache/release-r3m/test-release-r3m-auth-lifecycle-browser-e2e.mjs | tee .test-cache/release-r3m/runtime.log
          grep -q 'R3M_BROWSER_AUTH_LIFECYCLE_ACCEPTED' .test-cache/release-r3m/runtime.log
      - name: Preserve R3m production authority boundaries
        if: always()
        run: |
          set -euo pipefail
          harness=scripts/test-release-r3m-auth-lifecycle-browser-e2e.mjs
          preload=scripts/release-r3m-auth-email-capture-preload.mjs
          grep -q "https://api.resend.com/emails" "$preload"
          grep -q "originalFetch(input, init)" "$preload"
          grep -q "dist-server/server.mjs" "$harness"
          grep -q "NODE_ENV: 'production'" "$harness"
          grep -q "canonical_auth_users" "$harness"
          grep -q "canonical_auth_sessions" "$harness"
          grep -q "/register" "$harness"
          grep -q "Verify your email" "$harness"
          grep -q "/forgot-password" "$harness"
          grep -q "/reset-password" "$harness"
          grep -q "R3M_BROWSER_AUTH_LIFECYCLE_ACCEPTED" "$harness"
          ! grep -E -q 'PostgresAuthStore|provisionLocalUser|CanonicalAuthService' "$harness"
          ! grep -E -q 'page\.route\(|browserContext\.route\(|context\.route\(|route\.(fulfill|abort|continue|fallback)\(' "$harness"
          ! grep -E -q 'providers|billing|credits|transactions|projects|artifacts' "$preload"
          test -n "$BASE_SHA"
          git diff --check "$BASE_SHA"..HEAD
