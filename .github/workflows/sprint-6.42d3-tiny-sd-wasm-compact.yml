name: Sprint 6.42D3 Tiny-SD WASM compact

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_REVISION: cad0bd7495fa6c4bcca01b19a723dc91627fe84f

jobs:
  classify_tiny_sd_relevance:
    name: classify-tiny-sd-relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Classify heavyweight Tiny-SD relevance from trusted base
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            printf '%s\n' \
              'relevant=true' \
              'classification=RELEVANT_HEAVY_ACCEPTANCE_REQUIRED' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${EVENT_NAME}" = "pull_request"
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          TRUSTED_CLASSIFIER="${RUNNER_TEMP}/tiny-sd-heavy-ci-base-classifier.mjs"
          trap 'rm -f "${TRUSTED_CLASSIFIER}"' EXIT
          git show "${BASE_SHA}:scripts/classify-tiny-sd-heavy-ci.mjs" > "${TRUSTED_CLASSIFIER}"
          test -s "${TRUSTED_CLASSIFIER}"
          test "$(wc -c < "${TRUSTED_CLASSIFIER}")" -le 1048576
          git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" \
            | GITHUB_ACTIONS=false node "${TRUSTED_CLASSIFIER}" --stdin0 --github-output "${GITHUB_OUTPUT}"
          echo "trusted_base_classifier_sha=${BASE_SHA}"

      - name: Prove Tiny-SD relevance classifier contract
        run: node --test tests/tiny-sd-heavy-ci-relevance.test.mjs tests/tiny-sd-heavy-ci-workflow-trust.test.mjs

  heavy_wasm_d2_prep:
    name: wasm-d2-prep-${{ matrix.component }}
    needs: classify_tiny_sd_relevance
    if: ${{ needs.classify_tiny_sd_relevance.outputs.relevant == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        component: [text_encoder, unet, vae_decoder]
    uses: ./.github/workflows/tiny-sd-d3-wasm-d2-prep.yml
    with:
      component: ${{ matrix.component }}
      candidate_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  heavy_wasm_strategy:
    name: wasm-strategy-${{ matrix.component }}-${{ matrix.strategy }}
    needs: [classify_tiny_sd_relevance, heavy_wasm_d2_prep]
    if: ${{ needs.classify_tiny_sd_relevance.outputs.relevant == 'true' && needs.heavy_wasm_d2_prep.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: text_encoder
            strategy: dynamic_signed
          - component: text_encoder
            strategy: dynamic_signed_reduce_range
          - component: text_encoder
            strategy: weight_only_s8
          - component: text_encoder
            strategy: exact_fp16_storage
          - component: unet
            strategy: static_s8s8_qdq
          - component: unet
            strategy: static_u8u8_qdq
          - component: unet
            strategy: weight_only_s8
          - component: unet
            strategy: exact_fp16_storage
          - component: vae_decoder
            strategy: static_s8s8_qdq
          - component: vae_decoder
            strategy: static_u8u8_qdq
          - component: vae_decoder
            strategy: weight_only_s8
          - component: vae_decoder
            strategy: exact_fp16_storage
    uses: ./.github/workflows/tiny-sd-d3-wasm-strategy-phase.yml
    with:
      component: ${{ matrix.component }}
      strategy: ${{ matrix.strategy }}
      candidate_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  heavy_wasm_component_matrix:
    name: wasm-component-matrix-${{ matrix.component }}
    needs: [classify_tiny_sd_relevance, heavy_wasm_strategy]
    if: ${{ needs.classify_tiny_sd_relevance.outputs.relevant == 'true' && needs.heavy_wasm_strategy.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [text_encoder, unet, vae_decoder]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assert exact candidate, run and aggregate policy syntax
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          [[ "${WORKFLOW_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          python -m py_compile scripts/aggregate-tiny-sd-d3-wasm-strategy-evidence.py

      - name: Download JSON-only strategy evidence for component
        uses: actions/download-artifact@v4
        with:
          pattern: tiny-sd-d3-wasm-strategy-${{ matrix.component }}-*
          path: .test-cache/6.42d3-wasm/strategy-input
          merge-multiple: true

      - name: Aggregate original minimum-size winner policy
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(find .test-cache/6.42d3-wasm/strategy-input -type l | wc -l)" -eq 0
          test "$(find .test-cache/6.42d3-wasm/strategy-input -type f ! -name '*.json' | wc -l)" -eq 0
          python scripts/aggregate-tiny-sd-d3-wasm-strategy-evidence.py \
            --component "${{ matrix.component }}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --workflow-run-id "${WORKFLOW_RUN_ID}" \
            --input-dir .test-cache/6.42d3-wasm/strategy-input \
            --matrix-script scripts/prepare-tiny-sd-d3-wasm-strategy-matrix.py \
            --report ".test-cache/6.42d3-wasm/${{ matrix.component }}-matrix.json"

      - name: Upload JSON-only accepted component matrix
        uses: actions/upload-artifact@v4
        with:
          name: tiny-sd-d3-wasm-matrix-${{ matrix.component }}
          path: .test-cache/6.42d3-wasm/${{ matrix.component }}-matrix.json
          if-no-files-found: error
          retention-days: 14

  heavy_wasm_component_browser:
    name: wasm-component-browser-${{ matrix.component }}
    needs: [classify_tiny_sd_relevance, heavy_wasm_d2_prep, heavy_wasm_component_matrix]
    if: ${{ needs.classify_tiny_sd_relevance.outputs.relevant == 'true' && needs.heavy_wasm_d2_prep.result == 'success' && needs.heavy_wasm_component_matrix.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        component: [text_encoder, unet, vae_decoder]
    uses: ./.github/workflows/tiny-sd-d3-wasm-browser-phase.yml
    with:
      component: ${{ matrix.component }}
      candidate_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  wasm_compact_feasibility_gate:
    name: wasm-compact-feasibility
    needs:
      - classify_tiny_sd_relevance
      - heavy_wasm_d2_prep
      - heavy_wasm_strategy
      - heavy_wasm_component_matrix
      - heavy_wasm_component_browser
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require D3 WASM heavy acceptance when relevant
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_tiny_sd_relevance.result }}
          RELEVANT: ${{ needs.classify_tiny_sd_relevance.outputs.relevant }}
          CLASSIFICATION: ${{ needs.classify_tiny_sd_relevance.outputs.classification }}
          PREP_RESULT: ${{ needs.heavy_wasm_d2_prep.result }}
          STRATEGY_RESULT: ${{ needs.heavy_wasm_strategy.result }}
          MATRIX_RESULT: ${{ needs.heavy_wasm_component_matrix.result }}
          BROWSER_RESULT: ${{ needs.heavy_wasm_component_browser.result }}
          HEAVY_RESULT: ${{ needs.heavy_wasm_component_browser.result }}
        run: |
          set -euo pipefail
          test "${CLASSIFIER_RESULT}" = "success"
          if [ "${RELEVANT}" = "true" ]; then
            test "${CLASSIFICATION}" = "RELEVANT_HEAVY_ACCEPTANCE_REQUIRED"
            test "${PREP_RESULT}" = "success"
            test "${STRATEGY_RESULT}" = "success"
            test "${MATRIX_RESULT}" = "success"
            test "${BROWSER_RESULT}" = "success"
            test "${HEAVY_RESULT}" = "success"
            echo "Tiny-SD D3 WASM bounded prep + strategy + matrix + browser acceptance: SUCCESS"
            exit 0
          fi
          test "${RELEVANT}" = "false"
          test "${CLASSIFICATION}" = "NOT_APPLICABLE_PRODUCT_ONLY_CHANGE"
          test "${PREP_RESULT}" = "skipped"
          test "${STRATEGY_RESULT}" = "skipped"
          test "${MATRIX_RESULT}" = "skipped"
          test "${BROWSER_RESULT}" = "skipped"
          test "${HEAVY_RESULT}" = "skipped"
          echo "Tiny-SD D3 WASM: NOT_APPLICABLE_PRODUCT_ONLY_CHANGE"
