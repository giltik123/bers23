name: PR94 dependency autofix

on:
  push:
    branches: ["sprint-6.39b-auth-lifecycle-oauth"]

permissions:
  contents: write

jobs:
  harden-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-6.39b-auth-lifecycle-oauth
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Remove vulnerable dead code, upgrade patched router and refresh compatible fixes
        run: |
          npm pkg delete dependencies.react-quill
          npm install react-router-dom@7.18.2 --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --omit=dev --audit-level=moderate || true
      - name: Commit reviewed-input dependency graph update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade patched production dependencies [skip ci]"
          git push origin HEAD:sprint-6.39b-auth-lifecycle-oauth
