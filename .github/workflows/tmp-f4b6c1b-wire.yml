name: Temporary F4b6c1b wiring patcher

on:
  push:
    branches: [ "fashion/manual-parametric-http-f4b6c1b-clean" ]
    paths:
      - ".github/workflows/tmp-f4b6c1b-wire.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Apply exact source wiring
        run: |
          python3 scripts/tmp-f4b6c1b-wire.py
          git diff --check
          grep -q "manualParametricAdmission: garmentMeshWarp.manualParametricAdmission" server/core/composition/createProductionCore.ts
          grep -q "production.fashion.manualParametricAdmission" server/index.ts
          grep -q "admitManualParametricRepresentation" src/api/coreClient.js
      - name: Typecheck changed Core surfaces
        run: |
          npm ci
          npm run typecheck
          npm run server:typecheck
      - name: Commit source wiring only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/core/composition/createProductionCore.ts server/index.ts src/api/coreClient.js
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git commit -m "Wire manual PARAMETRIC transport through production Core"
          git push origin HEAD:${{ github.ref_name }}
