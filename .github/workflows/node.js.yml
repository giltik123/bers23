# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm run typecheck
    - run: npm run lint
    - run: npm run test:canonical-product-vertical

  postgres-transactions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: transaction_test
          POSTGRES_USER: transaction_test
          POSTGRES_PASSWORD: transaction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transaction_test -d transaction_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://transaction_test:transaction_test@127.0.0.1:5432/transaction_test
      DATABASE_URL: postgresql://transaction_test:transaction_test@127.0.0.1:5432/transaction_test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Apply transaction schema migration
        run: npm run db:migrate:transactions
      - name: Verify transaction schema readiness
        run: npm run db:check:transactions
      - name: Run PostgreSQL transaction integration tests
        run: npm run test:postgres
      - name: Run canonical product and real HTTP boundary
        run: npm run test:canonical-product
      - name: Enforce PostgreSQL production authority gate
        run: npm run test:creative-production-authority-postgres
