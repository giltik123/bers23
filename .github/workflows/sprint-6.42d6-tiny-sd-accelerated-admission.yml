name: Sprint 6.42D6 Tiny-SD accelerated admission contract

on:
  pull_request:
    branches:
      - main
      - sprint-6.42d5-tiny-sd-pipeline-composition
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_tiny_sd_relevance:
    name: classify-tiny-sd-relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Classify heavyweight Tiny-SD relevance from trusted base
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            printf '%s\n' \
              'relevant=true' \
              'classification=RELEVANT_HEAVY_ACCEPTANCE_REQUIRED' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${EVENT_NAME}" = "pull_request"
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          TRUSTED_CLASSIFIER="${RUNNER_TEMP}/tiny-sd-heavy-ci-base-classifier.mjs"
          trap 'rm -f "${TRUSTED_CLASSIFIER}"' EXIT
          git show "${BASE_SHA}:scripts/classify-tiny-sd-heavy-ci.mjs" > "${TRUSTED_CLASSIFIER}"
          test -s "${TRUSTED_CLASSIFIER}"
          test "$(wc -c < "${TRUSTED_CLASSIFIER}")" -le 1048576
          git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" \
            | GITHUB_ACTIONS=false node "${TRUSTED_CLASSIFIER}" --stdin0 --github-output "${GITHUB_OUTPUT}"
          echo "trusted_base_classifier_sha=${BASE_SHA}"

      - name: Prove Tiny-SD relevance classifier contract
        run: node --test tests/tiny-sd-heavy-ci-relevance.test.mjs tests/tiny-sd-heavy-ci-workflow-trust.test.mjs

  heavy_accelerated_admission_contract:
    name: accelerated-admission-contract-heavy
    needs: classify_tiny_sd_relevance
    if: ${{ needs.classify_tiny_sd_relevance.outputs.relevant == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact tested commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}" || {
            echo "D6 exact-head checkout mismatch: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}" >&2
            exit 1
          }

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Run fail-closed D6 admission policy
        run: |
          set -euo pipefail
          node --check scripts/tiny-sd-d6-accelerated-admission.mjs
          node --check scripts/capture-tiny-sd-d6-webgpu-device.mjs
          node --test tests/tiny-sd-d6-accelerated-admission-policy.test.mjs tests/tiny-sd-d6-device-capture-policy.test.mjs tests/tiny-sd-d6-quality-corpus-policy.test.mjs

      - name: Preserve production WASM-only browser authority
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const source = fs.readFileSync('src/platform/creative/local-ai/browser/BrowserOnnxSessionFactory.ts', 'utf8');
          if (!source.includes("from 'onnxruntime-web/wasm'")) {
            throw new Error('production BrowserOnnxSessionFactory no longer imports the reviewed WASM runtime');
          }
          if (!source.includes("options.executionProviders.some(provider => provider !== 'wasm')")) {
            throw new Error('production BrowserOnnxSessionFactory no longer fails closed on non-WASM providers');
          }
          if (!source.includes("executionProviders: ['wasm']")) {
            throw new Error('production BrowserOnnxSessionFactory no longer pins WASM execution');
          }
          if (/from\s+['\"]onnxruntime-web\/webgpu['\"]/.test(source) || source.includes("executionProviders: ['webgpu']")) {
            throw new Error('D6 research must not add WebGPU authority to the production browser factory');
          }
          NODE

      - name: Preserve hosted WebGPU negative-control boundary
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const source = fs.readFileSync('scripts/test-tiny-sd-d3-browser-webgpu.mjs', 'utf8');
          const required = [
            "precisionTier: 'FP16_INTERNAL_FP32_INT64_IO'",
            "providerFallbackAllowed: false",
            "hostedSoftwareFeasibilityOnly: true",
            "realDeviceEvidence: false",
            "missingRequiredFeatures",
            "shader-f16",
            "--use-angle=swiftshader",
          ];
          for (const marker of required) {
            if (!source.includes(marker)) throw new Error(`D3 hosted WebGPU negative-control marker drift: ${marker}`);
          }
          NODE

      - name: Preserve repository model-byte boundary
        run: |
          set -euo pipefail
          node scripts/check-model-weight-tracking.mjs
          test "$(git ls-files '*.ckpt' '*.pth' '*.pt' '*.safetensors' '*.onnx' '*.ort' '*.npz' '*.f32' '*.png.bin' | wc -l)" -eq 0

  accelerated_admission_contract_gate:
    name: accelerated-admission-contract
    needs: [classify_tiny_sd_relevance, heavy_accelerated_admission_contract]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require D6 accelerated admission heavy acceptance when relevant
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_tiny_sd_relevance.result }}
          RELEVANT: ${{ needs.classify_tiny_sd_relevance.outputs.relevant }}
          CLASSIFICATION: ${{ needs.classify_tiny_sd_relevance.outputs.classification }}
          HEAVY_RESULT: ${{ needs.heavy_accelerated_admission_contract.result }}
        run: |
          set -euo pipefail
          test "${CLASSIFIER_RESULT}" = "success"
          if [ "${RELEVANT}" = "true" ]; then
            test "${CLASSIFICATION}" = "RELEVANT_HEAVY_ACCEPTANCE_REQUIRED"
            test "${HEAVY_RESULT}" = "success"
            echo "Tiny-SD D6 accelerated admission contract: SUCCESS"
            exit 0
          fi
          test "${RELEVANT}" = "false"
          test "${CLASSIFICATION}" = "NOT_APPLICABLE_PRODUCT_ONLY_CHANGE"
          test "${HEAVY_RESULT}" = "skipped"
          echo "Tiny-SD D6 accelerated admission: NOT_APPLICABLE_PRODUCT_ONLY_CHANGE"
