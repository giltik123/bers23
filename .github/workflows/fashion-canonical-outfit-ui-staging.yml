name: Fashion canonical Outfit UI staging

on:
  push:
    branches:
      - fashion-canonical-outfit-ui-staging
    paths:
      - 'src/application/fashion/canonicalOutfitViewModel.js'
      - 'src/components/editor/outfits/OutfitPanel.jsx'
      - 'src/components/editor/creative/CreativeStudioPanel.jsx'
      - 'tests/canonical-outfit-view-model.test.mjs'
      - 'tests/fashion-canonical-outfit-ui.test.mjs'
      - 'tests/editor-zero-object-navigation.test.mjs'
      - '.github/workflows/fashion-canonical-outfit-ui-staging.yml'

permissions:
  contents: read

jobs:
  canonical-outfit-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact staging SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prove Outfit revision, partial-projection and reorder semantics
        run: node --test tests/canonical-outfit-view-model.test.mjs
      - name: Prove canonical Outfit UI authority boundary
        run: |
          node --test tests/fashion-canonical-outfit-ui.test.mjs
          node --test tests/editor-zero-object-navigation.test.mjs
      - name: Build production frontend
        run: npm run build
      - name: Reject legacy Outfit and execution authority
        run: |
          set -euo pipefail
          FILES=(
            src/application/fashion/canonicalOutfitViewModel.js
            src/components/editor/outfits/OutfitPanel.jsx
          )
          ! grep -E -q 'outfitManager|coreClient\.entities|FASHN|onCommit|onRollback' "${FILES[@]}"
          grep -q 'coreClient.fashion.outfits' src/components/editor/outfits/OutfitPanel.jsx
          grep -q 'coreClient.fashion.wardrobe' src/components/editor/outfits/OutfitPanel.jsx
          grep -q 'outfits.reorderEntries' src/application/fashion/canonicalOutfitViewModel.js
      - name: Keep Creative Studio disconnected from Outfit data
        run: |
          ! grep -E -q 'coreClient|outfitManager' src/components/editor/creative/CreativeStudioPanel.jsx
          grep -q 'outfits: \[\]' src/components/editor/creative/CreativeStudioPanel.jsx
      - name: Check committed diff whitespace
        run: git diff --check HEAD^..HEAD
