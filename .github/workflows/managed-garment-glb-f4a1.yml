name: Fashion F4a.1 strict GLB execution admission

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_fashion_authority_relevance:
    name: classify-fashion-authority-relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Classify Fashion authority relevance from trusted base
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            printf '%s\n' 'relevant=true' 'classification=RELEVANT_FASHION_AUTHORITY_ACCEPTANCE_REQUIRED' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${EVENT_NAME}" = "pull_request"
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          TRUSTED_CLASSIFIER="${RUNNER_TEMP}/fashion-authority-base-classifier.mjs"
          trap 'rm -f "${TRUSTED_CLASSIFIER}"' EXIT
          git show "${BASE_SHA}:scripts/classify-fashion-authority-ci.mjs" > "${TRUSTED_CLASSIFIER}"
          test -s "${TRUSTED_CLASSIFIER}"
          test "$(wc -c < "${TRUSTED_CLASSIFIER}")" -le 1048576
          git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" \
            | node "${TRUSTED_CLASSIFIER}" --stdin0 --github-output "${GITHUB_OUTPUT}"
      - name: Prove Fashion authority relevance and workflow trust contracts
        run: node --test tests/fashion-authority-ci-relevance.test.mjs tests/fashion-authority-ci-workflow-trust.test.mjs

  heavy_strict_glb_postgres:
    name: strict-glb-postgres-heavy
    needs: classify_fashion_authority_relevance
    if: ${{ needs.classify_fashion_authority_relevance.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: managed_garment_glb_f4a1_test
          POSTGRES_USER: managed_garment_glb_f4a1_test
          POSTGRES_PASSWORD: managed_garment_glb_f4a1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U managed_garment_glb_f4a1_test -d managed_garment_glb_f4a1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://managed_garment_glb_f4a1_test:managed_garment_glb_f4a1_test@127.0.0.1:5432/managed_garment_glb_f4a1_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck Core server
        run: npm run server:typecheck
      - name: Build production Core and prove Fashion representation migrations are packaged
        run: |
          npm run server:build
          test -f dist-server/migrations/026_managed_garment_representations.sql
          test -f dist-server/migrations/027_garment_representation_revocation_lifecycle.sql
      - name: Bundle F4a baseline and F4a.1 strict GLB PostgreSQL acceptance
        run: |
          mkdir -p .test-cache/managed-garment-glb-f4a1/migrations
          node --input-type=module - <<'NODE'
          import { build } from 'esbuild';
          const common = {
            bundle: true,
            platform: 'node',
            format: 'esm',
            target: 'node24',
            external: ['pg', 'sharp', 'node:*'],
          };
          for (const [entry, output] of [
            ['tests/managed-garment-representations-postgres.test.ts', 'managed-garment-representations-postgres.test.mjs'],
            ['tests/managed-garment-glb-execution-subset-postgres.test.ts', 'managed-garment-glb-execution-subset-postgres.test.mjs'],
          ]) {
            await build({ ...common, entryPoints: [entry], outfile: `.test-cache/managed-garment-glb-f4a1/${output}` });
          }
          NODE
          cp server/core/fashion/migrations/022_managed_garments_and_initial_views.sql .test-cache/managed-garment-glb-f4a1/migrations/
          cp server/core/fashion/migrations/023_managed_garment_wardrobe_metadata.sql .test-cache/managed-garment-glb-f4a1/migrations/
          cp server/core/fashion/migrations/024_managed_garment_collections.sql .test-cache/managed-garment-glb-f4a1/migrations/
          cp server/core/fashion/migrations/025_managed_outfits.sql .test-cache/managed-garment-glb-f4a1/migrations/
          cp server/core/fashion/migrations/026_managed_garment_representations.sql .test-cache/managed-garment-glb-f4a1/migrations/
          cp server/core/fashion/migrations/027_garment_representation_revocation_lifecycle.sql .test-cache/managed-garment-glb-f4a1/migrations/
      - name: Preserve F4a representation authority and revocation semantics
        run: node --test --test-concurrency=1 .test-cache/managed-garment-glb-f4a1/managed-garment-representations-postgres.test.mjs
      - name: Prove F4a.1 strict GLB indices and default-scene execution subset
        run: node --test --test-concurrency=1 .test-cache/managed-garment-glb-f4a1/managed-garment-glb-execution-subset-postgres.test.mjs

  strict-glb-postgres:
    name: strict-glb-postgres
    needs: [classify_fashion_authority_relevance, heavy_strict_glb_postgres]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require F4a.1 strict GLB acceptance exactly when Fashion authority is relevant
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_fashion_authority_relevance.result }}
          RELEVANT: ${{ needs.classify_fashion_authority_relevance.outputs.relevant }}
          CLASSIFICATION: ${{ needs.classify_fashion_authority_relevance.outputs.classification }}
          HEAVY_RESULT: ${{ needs.heavy_strict_glb_postgres.result }}
        run: |
          set -euo pipefail
          test "${CLASSIFIER_RESULT}" = "success"
          if [ "${RELEVANT}" = "true" ]; then
            test "${CLASSIFICATION}" = "RELEVANT_FASHION_AUTHORITY_ACCEPTANCE_REQUIRED"
            test "${HEAVY_RESULT}" = "success"
            exit 0
          fi
          test "${RELEVANT}" = "false"
          test "${CLASSIFICATION}" = "NOT_APPLICABLE_NON_FASHION_CHANGE"
          test "${HEAVY_RESULT}" = "skipped"
