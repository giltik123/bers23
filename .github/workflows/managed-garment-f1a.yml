name: Fashion F1a managed garment authority

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  managed-garment-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: managed_garment_test
          POSTGRES_USER: managed_garment_test
          POSTGRES_PASSWORD: managed_garment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U managed_garment_test -d managed_garment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://managed_garment_test:managed_garment_test@127.0.0.1:5432/managed_garment_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA before dependency or database work
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck Core server
        run: npm run server:typecheck
      - name: Build production Core and prove migration 022 is packaged
        run: |
          npm run server:build
          test -f dist-server/migrations/022_managed_garments_and_initial_views.sql
      - name: Bundle managed Garment PostgreSQL acceptance
        run: |
          mkdir -p .test-cache/managed-garment/migrations
          node --input-type=module - <<'EOF'
          import { build } from 'esbuild';
          const common = {
            bundle: true,
            platform: 'node',
            format: 'esm',
            target: 'node24',
            external: ['pg', 'sharp', 'node:*'],
          };
          await build({
            ...common,
            entryPoints: ['tests/managed-garment-postgres.test.ts'],
            outfile: '.test-cache/managed-garment/managed-garment-postgres.test.mjs',
          });
          await build({
            ...common,
            entryPoints: ['tests/managed-garment-schema-validation-postgres.test.ts'],
            outfile: '.test-cache/managed-garment/managed-garment-schema-validation-postgres.test.mjs',
          });
          EOF
          cp server/core/fashion/migrations/022_managed_garments_and_initial_views.sql .test-cache/managed-garment/migrations/
      - name: Prove stable identity, canonical bytes, delivery expiry and ownership isolation
        run: node --test .test-cache/managed-garment/managed-garment-postgres.test.mjs
      - name: Prove schema readiness rejects and repairs NOT VALID ownership foreign keys
        run: node --test .test-cache/managed-garment/managed-garment-schema-validation-postgres.test.mjs
      - name: Preserve zero-object Fashion lockdown until browser client wiring lands
        run: node --test tests/editor-zero-object-navigation.test.mjs
