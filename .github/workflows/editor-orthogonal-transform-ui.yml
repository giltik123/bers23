name: Editor Rotate and Flip UI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  editor-orthogonal-transform-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Prove Editor Rotate/Flip contract
        run: node --test tests/editor-orthogonal-transform-ui.test.mjs
      - name: Preserve stale FINAL recovery and canonical Editor contracts
        run: |
          node --test tests/editor-final-source-conflict-recovery.test.mjs
          npm run test:canonical-product-vertical
      - name: Build and typecheck browser boundary
        run: |
          npm run build
          npm run typecheck
