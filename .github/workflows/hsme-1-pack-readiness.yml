name: HSME-1 pack readiness contract

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'src/platform/creative/local-ai/hsme/**'
      - 'src/platform/creative/local-ai/lifecycle/DurableModelFleet.ts'
      - 'src/platform/creative/local-ai/trust/**'
      - 'src/platform/creative/local-ai/types.ts'
      - 'src/platform/creative/canonical/contracts.ts'
      - 'tests/creative-hsme-pack-v1.test.mjs'
      - '.github/workflows/hsme-1-pack-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsme-1-pack-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  hsme-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Typecheck browser and Core contracts
        run: |
          npm run typecheck
          npm run server:typecheck
      - name: Prove HSME pack identity and readiness fail closed
        run: node --experimental-strip-types --test tests/creative-hsme-pack-v1.test.mjs
      - name: HSME authority boundary hygiene
        run: |
          set -euo pipefail
          source='src/platform/creative/local-ai/hsme/HsmePackV1.ts'
          grep -Fq "Pick<DurableModelFleet, 'state'>" "$source"
          ! grep -E -q 'fleet\.(install|resume|remove|rollback)|providerSelector|billing|creditsWallet|artifactAuthority|projectService' "$source"
          ! grep -q 'suggestedTarget' "$source"
          git diff --check

  durable-fleet-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - name: Preserve durable lifecycle domain contract
        run: npm run test:durable-model-fleet
      - name: Preserve durable prerelease and browser-lock hardening
        run: |
          mkdir -p .test-cache/hsme-fleet
          npx esbuild tests/creative-durable-model-fleet-hardening.test.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --outfile=.test-cache/hsme-fleet/creative-durable-model-fleet-hardening.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-fleet/creative-durable-model-fleet-hardening.test.mjs
      - name: Preserve durable immutable-version and quarantine authority
        run: |
          mkdir -p .test-cache/hsme-fleet
          npx esbuild tests/creative-durable-model-fleet-authority.test.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --outfile=.test-cache/hsme-fleet/creative-durable-model-fleet-authority.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-fleet/creative-durable-model-fleet-authority.test.mjs
