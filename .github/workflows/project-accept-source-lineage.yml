name: Project Accept source-lineage concurrency acceptance

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  project-accept-source-lineage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: project_source_test
          POSTGRES_USER: project_source_test
          POSTGRES_PASSWORD: project_source_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_source_test -d project_source_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://project_source_test:project_source_test@127.0.0.1:5432/project_source_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA before dependency or database work
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck canonical Project authority
        run: npm run server:typecheck
      - name: Bundle Project source-lineage PostgreSQL acceptance
        run: |
          mkdir -p .test-cache/project-source-lineage
          node --input-type=module - <<'EOF'
          import { build } from 'esbuild';
          await build({
            entryPoints: ['tests/project-accept-source-lineage-postgres.test.ts'],
            bundle: true,
            platform: 'node',
            format: 'esm',
            target: 'node24',
            outfile: '.test-cache/project-source-lineage/project-accept-source-lineage-postgres.test.mjs',
            external: ['pg', 'sharp', 'node:*'],
          });
          EOF
      - name: Prove stale source-bound FINAL rejection and accepted replay
        run: node --test .test-cache/project-source-lineage/project-accept-source-lineage-postgres.test.mjs
