name: Sprint 6.42D4 secure threading classification

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_tiny_sd_relevance:
    name: classify-tiny-sd-relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Classify heavyweight Tiny-SD relevance from trusted base
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            printf '%s\n' \
              'relevant=true' \
              'classification=RELEVANT_HEAVY_ACCEPTANCE_REQUIRED' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${EVENT_NAME}" = "pull_request"
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          TRUSTED_CLASSIFIER="${RUNNER_TEMP}/tiny-sd-heavy-ci-base-classifier.mjs"
          trap 'rm -f "${TRUSTED_CLASSIFIER}"' EXIT
          git show "${BASE_SHA}:scripts/classify-tiny-sd-heavy-ci.mjs" > "${TRUSTED_CLASSIFIER}"
          test -s "${TRUSTED_CLASSIFIER}"
          test "$(wc -c < "${TRUSTED_CLASSIFIER}")" -le 1048576
          git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" \
            | GITHUB_ACTIONS=false node "${TRUSTED_CLASSIFIER}" --stdin0 --github-output "${GITHUB_OUTPUT}"
          echo "trusted_base_classifier_sha=${BASE_SHA}"

      - name: Prove Tiny-SD relevance classifier contract
        run: node --test tests/tiny-sd-heavy-ci-relevance.test.mjs tests/tiny-sd-heavy-ci-workflow-trust.test.mjs

  heavy_secure_threading_classification:
    name: secure-threading-classification-heavy
    needs: classify_tiny_sd_relevance
    if: ${{ needs.classify_tiny_sd_relevance.outputs.relevant == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify and classify pinned worker boundary
        run: |
          set -euo pipefail
          npm ci
          node --check scripts/classify-tiny-sd-d4-secure-threading.mjs
          node scripts/classify-tiny-sd-d4-secure-threading.mjs \
            --report .test-cache/6.42d4/tiny-sd-d4-secure-threading.json
          node - <<'JS'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.test-cache/6.42d4/tiny-sd-d4-secure-threading.json', 'utf8'));
          if (report.status !== 'CANDIDATE') throw new Error('D4 threading status changed');
          if (report.result !== 'SECURE_THREADING_BLOCKED') throw new Error('D4 threading classification changed');
          if (report.onnxRuntimeWeb.version !== '1.27.0') throw new Error('ORT Web pin changed');
          if (report.onnxRuntimeWeb.workerFactoryOrWorkerUrlHookInPinnedPublicApi !== false) throw new Error('Unexpected worker hook authority');
          if (report.acceptedBaseline.numThreads !== 1 || report.acceptedBaseline.proxy !== false || report.acceptedBaseline.workerFree !== true) throw new Error('Worker-free baseline changed');
          if (report.runtimeAuthorityGranted !== false || report.productionApproval !== false || report.editorAuthorityGranted !== false) throw new Error('Threading evidence granted authority');
          JS
          test "$(git ls-files '*.onnx' '*.ort' '*.npz' '*.bin' '*.safetensors' | wc -l)" -eq 0

      - name: Upload JSON-only threading evidence
        uses: actions/upload-artifact@v4
        with:
          name: tiny-sd-d4-secure-threading-evidence
          retention-days: 14
          if-no-files-found: error
          path: .test-cache/6.42d4/tiny-sd-d4-secure-threading.json

  secure_threading_classification_gate:
    name: secure-threading-classification
    needs: [classify_tiny_sd_relevance, heavy_secure_threading_classification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require D4 secure-threading heavy acceptance when relevant
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_tiny_sd_relevance.result }}
          RELEVANT: ${{ needs.classify_tiny_sd_relevance.outputs.relevant }}
          CLASSIFICATION: ${{ needs.classify_tiny_sd_relevance.outputs.classification }}
          HEAVY_RESULT: ${{ needs.heavy_secure_threading_classification.result }}
        run: |
          set -euo pipefail
          test "${CLASSIFIER_RESULT}" = "success"
          if [ "${RELEVANT}" = "true" ]; then
            test "${CLASSIFICATION}" = "RELEVANT_HEAVY_ACCEPTANCE_REQUIRED"
            test "${HEAVY_RESULT}" = "success"
            echo "Tiny-SD D4 secure threading classification: SUCCESS"
            exit 0
          fi
          test "${RELEVANT}" = "false"
          test "${CLASSIFICATION}" = "NOT_APPLICABLE_PRODUCT_ONLY_CHANGE"
          test "${HEAVY_RESULT}" = "skipped"
          echo "Tiny-SD D4 secure threading: NOT_APPLICABLE_PRODUCT_ONLY_CHANGE"
