name: BERS v1 release finalization guard

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'config/v1-release-finalization.json'
      - 'config/v1-release-readiness.json'
      - 'config/v1-capability-classification.json'
      - 'scripts/check-v1-release-finalization.mjs'
      - 'tests/v1-release-finalization.test.mjs'
      - 'docs/v1-release-finalization.md'
      - 'docs/v1-release-notes.md'
      - 'docs/v1-release-operations.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v1-release-finalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-finalization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Prove release state transition guard
        run: node --test tests/v1-release-finalization.test.mjs
      - name: Emit manifest-matched release finalization disposition
        run: |
          set -euo pipefail
          node scripts/check-v1-release-finalization.mjs | tee .test-cache-v1-release-finalization.log
          status="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const value = JSON.parse(readFileSync('config/v1-release-finalization.json', 'utf8'));
          process.stdout.write(String(value.status ?? ''));
          NODE
          )"
          case "$status" in
            BLOCKED_BEFORE_RC)
              grep -q '^BERS_V1_RELEASE_FINALIZATION_BLOCKED ' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_RC_SELECTED' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_RELEASE_AUTHORIZED' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_0_RELEASED' .test-cache-v1-release-finalization.log
              ;;
            RC_SELECTED)
              grep -q '^BERS_V1_RC_SELECTED ' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_RELEASE_FINALIZATION_BLOCKED' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_RELEASE_AUTHORIZED' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_0_RELEASED' .test-cache-v1-release-finalization.log
              ;;
            RELEASE_AUTHORIZED)
              grep -q '^BERS_V1_RELEASE_AUTHORIZED ' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_RELEASE_FINALIZATION_BLOCKED' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_RC_SELECTED' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_0_RELEASED' .test-cache-v1-release-finalization.log
              ;;
            RELEASED)
              grep -q '^BERS_V1_0_RELEASED ' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_RELEASE_FINALIZATION_BLOCKED' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_RC_SELECTED' .test-cache-v1-release-finalization.log
              ! grep -q 'BERS_V1_RELEASE_AUTHORIZED' .test-cache-v1-release-finalization.log
              ;;
            *)
              echo "Unknown release-finalization status: $status" >&2
              exit 1
              ;;
          esac
      - name: Verify immutable published v1.0.0 evidence when RELEASED
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const value=JSON.parse(readFileSync('config/v1-release-finalization.json','utf8'));
          process.stdout.write(String(value.status ?? ''));
          NODE
          )"
          if [ "$status" != RELEASED ]; then
            echo "Publication evidence verification is not required for $status."
            exit 0
          fi
          mkdir -p .test-cache-v1-published
          git fetch origin tag v1.0.0
          RELEASE_SHA="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const value=JSON.parse(readFileSync('config/v1-release-finalization.json','utf8'));
          process.stdout.write(String(value.releaseSha ?? ''));
          NODE
          )"
          test "$(git rev-list -n1 v1.0.0)" = "$RELEASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.0" --jq '.tag_name')" = v1.0.0
          gh release download v1.0.0 --dir .test-cache-v1-published
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const finalization=JSON.parse(readFileSync('config/v1-release-finalization.json','utf8'));
          const readiness=JSON.parse(readFileSync('config/v1-release-readiness.json','utf8'));
          const evidence=finalization.publicationEvidence;
          const files={
            releaseManifest:'bers-v1.0.0-release-manifest.json',
            requiredChecks:'required-checks.json',
            releaseDelta:'release-delta.json',
            publicationEvidence:'publication-evidence.json',
          };
          const read=name=>readFileSync(`.test-cache-v1-published/${name}`);
          const sha=value=>createHash('sha256').update(value).digest('hex');
          if (sha(read(files.releaseManifest)) !== evidence.releaseManifestSha256) throw new Error('published release manifest SHA mismatch');
          if (sha(read(files.requiredChecks)) !== evidence.requiredChecksSha256) throw new Error('published required-check evidence SHA mismatch');
          if (sha(read(files.releaseDelta)) !== evidence.releaseDeltaSha256) throw new Error('published release-delta evidence SHA mismatch');
          const publishedEvidence=JSON.parse(read(files.publicationEvidence).toString('utf8'));
          assert.deepEqual(publishedEvidence,evidence,'published publication evidence does not match committed ledger');
          const manifest=JSON.parse(read(files.releaseManifest).toString('utf8'));
          const checks=JSON.parse(read(files.requiredChecks).toString('utf8'));
          const delta=JSON.parse(read(files.releaseDelta).toString('utf8'));
          if (manifest.releaseSha !== finalization.releaseSha) throw new Error('published manifest release SHA mismatch');
          if (manifest.rcCoordinate !== readiness.rcCoordinate) throw new Error('published manifest RC mismatch');
          if (checks.sha !== finalization.releaseSha) throw new Error('published required-check SHA mismatch');
          if (delta.rcSha !== readiness.rcCoordinate || delta.releaseSha !== finalization.releaseSha) throw new Error('published delta coordinate mismatch');
          NODE
      - name: Check committed diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
