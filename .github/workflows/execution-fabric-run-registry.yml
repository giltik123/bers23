name: Execution Fabric durable run registry

on:
  push:
    branches:
      - execution-fabric-run-registry-staging
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/core/execution/**'
      - 'server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts'
      - 'server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.test.mjs'
      - 'server/core/workflow/LocalCompositeOutputUploadService.ts'
      - 'server/core/http/localCompositeContinuationHttpAdapter.ts'
      - 'server/core/composition/createProductionCore.ts'
      - 'server/index.ts'
      - 'server/transactions/infrastructure/postgres/transactionSchemaCli.ts'
      - 'scripts/build-core-server.mjs'
      - 'tests/execution-run-registry-postgres.test.ts'
      - '.github/workflows/execution-fabric-run-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-run-registry-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: execution_run_registry_test
          POSTGRES_USER: execution_run_registry_test
          POSTGRES_PASSWORD: execution_run_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U execution_run_registry_test -d execution_run_registry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://execution_run_registry_test:execution_run_registry_test@127.0.0.1:5432/execution_run_registry_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Core server
        run: npm run server:typecheck
      - name: Build production Core and package execution-run migrations
        run: |
          npm run server:build
          test -f dist-server/migrations/034_execution_run_registry.sql
          test -f dist-server/migrations/036_execution_run_workflow_continuation.sql
      - name: Prove production schema CLI migration and check
        run: |
          npm run db:migrate:transactions
          npm run db:check:transactions
      - name: Prove workflow-continuation projection semantics without redispatch authority
        run: node --experimental-strip-types --test server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.test.mjs
      - name: Bundle durable registry PostgreSQL acceptance
        run: |
          mkdir -p .test-cache/execution-run-registry/migrations
          node --input-type=module - <<'EOF'
          import { build } from 'esbuild';
          await build({
            entryPoints: ['tests/execution-run-registry-postgres.test.ts'],
            bundle: true,
            platform: 'node',
            format: 'esm',
            target: 'node24',
            outfile: '.test-cache/execution-run-registry/execution-run-registry-postgres.test.mjs',
            external: ['pg', 'sharp', 'node:*'],
          });
          EOF
          cp server/core/artifacts/migrations/003_canonical_final_image_artifacts.sql .test-cache/execution-run-registry/migrations/
          cp server/core/projects/migrations/004_canonical_projects_and_originals.sql .test-cache/execution-run-registry/migrations/
          cp server/core/projects/migrations/005_canonical_project_history_versions.sql .test-cache/execution-run-registry/migrations/
          cp server/core/projects/migrations/006_project_history_acceptance_hardening.sql .test-cache/execution-run-registry/migrations/
          cp server/core/projects/migrations/007_project_history_source_lineage.sql .test-cache/execution-run-registry/migrations/
          cp server/core/execution/migrations/034_execution_run_registry.sql .test-cache/execution-run-registry/migrations/
          cp server/core/execution/migrations/036_execution_run_workflow_continuation.sql .test-cache/execution-run-registry/migrations/
      - name: Prove durable run identity, scope, replay and lifecycle semantics
        run: node --test --test-concurrency=1 .test-cache/execution-run-registry/execution-run-registry-postgres.test.mjs
      - name: Prove exact production continuation and child-run projection wiring
        run: |
          set -euo pipefail
          grep -q 'new ExecutionRunBoundLocalCompositeContinuationService' server/core/composition/createProductionCore.ts
          grep -q 'delegate: admittedLocalComposite' server/core/composition/createProductionCore.ts
          grep -q 'continuations: new PostgresWorkflowContinuationStore(transactions.pool, now)' server/core/composition/createProductionCore.ts
          grep -q 'runs: executionRuns' server/core/composition/createProductionCore.ts
          grep -q "capability: 'WORKFLOW_CONTINUATION'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q "authorityKind: 'WORKFLOW_CONTINUATION'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q 'listChildren(scope: ExecutionRunScope, parentRunId: string' server/core/execution/executionRunRegistry.ts
          grep -q 'AND parent_run_id=\$4' server/core/execution/PostgresExecutionRunRegistry.ts
          grep -q "capability: 'LOCAL_EXECUTION'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q "authorityKind: 'LOCAL_EXECUTION_TICKET'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q 'parentRunId: parent.runId' server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q 'getByClientRequestId(scope, command.clientRequestId)' server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q 'preReconcile' server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
      - name: Prove D2 opens no Agent Automation browser provider or Billing authority
        run: |
          set -euo pipefail
          FILES=(
            server/core/execution/executionRunRegistry.ts
            server/core/execution/PostgresExecutionRunRegistry.ts
            server/core/execution/executionRunSchema.ts
            server/core/execution/migrations/034_execution_run_registry.sql
            server/core/execution/migrations/036_execution_run_workflow_continuation.sql
            server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          )
          ! grep -E -q 'coreClient|create.*HttpAdapter|/api/core/|providers|Billing|billing|FAL|fal_|stripe|JobRecord|coreClient\.entities' "${FILES[@]}"
          ! grep -E -q "'AGENT'|'AUTOMATION'|\"AGENT\"|\"AUTOMATION\"" server/core/execution/executionRunRegistry.ts server/core/execution/migrations/034_execution_run_registry.sql server/core/execution/migrations/036_execution_run_workflow_continuation.sql
          ! grep -q 'canonical_execution_runs' src/lib/jobs/jobStorage.js
      - name: Check committed diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --check "$BASE_SHA"..HEAD
          else
            git diff --check HEAD^..HEAD
          fi
