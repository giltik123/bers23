name: Execution Fabric durable run registry

on:
  push:
    branches:
      - execution-fabric-run-registry-staging
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/core/execution/**'
      - 'server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts'
      - 'server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.test.mjs'
      - 'server/core/workflow/createProductionLocalCompositeContinuation.ts'
      - 'server/core/workflow/LocalCompositeOutputUploadService.ts'
      - 'server/core/http/localCompositeContinuationHttpAdapter.ts'
      - 'server/core/http/executionRunRecoveryHttpAdapter.ts'
      - 'server/core/http/executionRunRecoveryHttpAdapter.test.mjs'
      - 'server/core/composition/createProductionCore.ts'
      - 'server/index.ts'
      - 'server/transactions/infrastructure/postgres/transactionSchemaCli.ts'
      - 'scripts/build-core-server.mjs'
      - 'tests/execution-run-registry-postgres.test.ts'
      - 'tests/execution-run-recovery-http-postgres.test.ts'
      - 'src/api/executionRunRecoveryClient.js'
      - 'src/api/executionRunRecoveryClient.test.mjs'
      - 'src/lib/jobs/executionRunProjection.js'
      - 'src/lib/jobs/executionRunProjection.test.mjs'
      - 'src/lib/jobs/executionRunProjectionAuthority.test.mjs'
      - 'src/components/editor/jobs/CanonicalExecutionRunRow.jsx'
      - 'src/components/editor/jobs/JobCenter.jsx'
      - 'src/components/editor/jobs/JobQueuePanel.jsx'
      - '.github/workflows/execution-fabric-run-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-run-registry-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: execution_run_registry_test
          POSTGRES_USER: execution_run_registry_test
          POSTGRES_PASSWORD: execution_run_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U execution_run_registry_test -d execution_run_registry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://execution_run_registry_test:execution_run_registry_test@127.0.0.1:5432/execution_run_registry_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Core server
        run: npm run server:typecheck
      - name: Build production Core and package execution-run migrations
        run: |
          npm run server:build
          test -f dist-server/migrations/034_execution_run_registry.sql
          test -f dist-server/migrations/036_execution_run_workflow_continuation.sql
          test -f dist-server/migrations/037_execution_run_workflow_internal_step.sql
      - name: Prove production schema CLI migration and check
        run: |
          npm run db:migrate:transactions
          npm run db:check:transactions
      - name: Prove workflow parent LOCAL child and INTERNAL verify projection semantics without redispatch authority
        run: node --experimental-strip-types --test server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.test.mjs
      - name: Prove authenticated ExecutionRun recovery HTTP boundary is read-only
        run: node --experimental-strip-types --test server/core/http/executionRunRecoveryHttpAdapter.test.mjs
      - name: Bundle durable registry PostgreSQL acceptance
        run: |
          mkdir -p .test-cache/execution-run-registry/migrations
          node --input-type=module - <<'EOF'
          import { build } from 'esbuild';
          const common = {
            bundle: true,
            platform: 'node',
            format: 'esm',
            target: 'node24',
            external: ['pg', 'sharp', 'node:*'],
          };
          await build({
            ...common,
            entryPoints: ['tests/execution-run-registry-postgres.test.ts'],
            outfile: '.test-cache/execution-run-registry/execution-run-registry-postgres.test.mjs',
          });
          await build({
            ...common,
            entryPoints: ['tests/execution-run-recovery-http-postgres.test.ts'],
            outfile: '.test-cache/execution-run-registry/execution-run-recovery-http-postgres.test.mjs',
          });
          EOF
          cp server/core/artifacts/migrations/003_canonical_final_image_artifacts.sql .test-cache/execution-run-registry/migrations/
          cp server/core/projects/migrations/004_canonical_projects_and_originals.sql .test-cache/execution-run-registry/migrations/
          cp server/core/projects/migrations/005_canonical_project_history_versions.sql .test-cache/execution-run-registry/migrations/
          cp server/core/projects/migrations/006_project_history_acceptance_hardening.sql .test-cache/execution-run-registry/migrations/
          cp server/core/projects/migrations/007_project_history_source_lineage.sql .test-cache/execution-run-registry/migrations/
          cp server/core/execution/migrations/034_execution_run_registry.sql .test-cache/execution-run-registry/migrations/
          cp server/core/execution/migrations/036_execution_run_workflow_continuation.sql .test-cache/execution-run-registry/migrations/
          cp server/core/execution/migrations/037_execution_run_workflow_internal_step.sql .test-cache/execution-run-registry/migrations/
      - name: Prove durable run identity scope parent binding replay and lifecycle semantics
        run: node --test --test-concurrency=1 .test-cache/execution-run-registry/execution-run-registry-postgres.test.mjs
      - name: Prove PostgreSQL-backed authenticated ExecutionRun recovery tree
        run: node --test --test-concurrency=1 .test-cache/execution-run-registry/execution-run-recovery-http-postgres.test.mjs
      - name: Prove exact production continuation LOCAL child INTERNAL verify and read-only recovery wiring
        run: |
          set -euo pipefail
          grep -q 'new ExecutionRunBoundLocalCompositeContinuationService' server/core/composition/createProductionCore.ts
          grep -q 'delegate: admittedLocalComposite' server/core/composition/createProductionCore.ts
          grep -q 'continuations: new PostgresWorkflowContinuationStore(transactions.pool, now)' server/core/composition/createProductionCore.ts
          grep -q 'runs: executionRuns' server/core/composition/createProductionCore.ts
          grep -q 'new ExecutionRunBoundLocalCompositeInternalVerifier' server/core/workflow/createProductionLocalCompositeContinuation.ts
          grep -q 'runs: input.runs' server/core/workflow/createProductionLocalCompositeContinuation.ts
          grep -q "capability: 'WORKFLOW_CONTINUATION'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q "authorityKind: 'WORKFLOW_CONTINUATION'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q 'listRoots(scope: ExecutionRunScope, limit?: number)' server/core/execution/executionRunRegistry.ts
          grep -q 'AND parent_run_id IS NULL' server/core/execution/PostgresExecutionRunRegistry.ts
          grep -q 'listChildren(scope: ExecutionRunScope, parentRunId: string' server/core/execution/executionRunRegistry.ts
          grep -q 'AND parent_run_id=\$4' server/core/execution/PostgresExecutionRunRegistry.ts
          grep -q "type ExecutionRunRecoveryReader = Pick<ExecutionRunRegistry, 'get' | 'listRoots' | 'listChildren'>" server/core/http/executionRunRecoveryHttpAdapter.ts
          grep -q 'new PostgresExecutionRunRegistry(production.transactions.pool)' server/index.ts
          grep -q 'get: executionRunRegistry.get.bind(executionRunRegistry)' server/index.ts
          grep -q 'listRoots: executionRunRegistry.listRoots.bind(executionRunRegistry)' server/index.ts
          grep -q 'listChildren: executionRunRegistry.listChildren.bind(executionRunRegistry)' server/index.ts
          grep -q "path === '/api/core/execution-runs'" server/index.ts
          ! grep -E -q '\.(issue|start|succeed|fail|cancel|markUnknown)\(' server/core/http/executionRunRecoveryHttpAdapter.ts
          ! grep -E -q 'Billing|billing|provider|FAL|fal_|stripe|ArtifactAuthority|ProjectStore' server/core/http/executionRunRecoveryHttpAdapter.ts
          grep -q "capability: 'LOCAL_EXECUTION'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q "authorityKind: 'LOCAL_EXECUTION_TICKET'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q "capability: 'WORKFLOW_STEP'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q "authorityKind: 'WORKFLOW_INTERNAL_STEP'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          test "$(grep -R -F "authorityKind: 'WORKFLOW_INTERNAL_STEP'" server/core --include='*.ts' | wc -l)" -eq 1
          grep -R -F "authorityKind: 'WORKFLOW_INTERNAL_STEP'" server/core --include='*.ts' | grep -q '^server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts:'
          grep -q 'parentRunId: parent.runId' server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q 'WORKFLOW_STEP execution run requires parentRunId' server/core/execution/PostgresExecutionRunRegistry.ts
          grep -q "parentRun.capability !== 'WORKFLOW_CONTINUATION'" server/core/execution/PostgresExecutionRunRegistry.ts
          grep -q 'getByClientRequestId(scope, command.clientRequestId)' server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q "snapshot?.state === 'RUNNING_INTERNAL'" server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          grep -q 'parent_run_id IS NOT NULL' server/core/execution/migrations/037_execution_run_workflow_internal_step.sql
      - name: Preserve D3 authority lockdown and prove P1a is observation-only
        run: |
          set -euo pipefail
          D3_FILES=(
            server/core/execution/executionRunRegistry.ts
            server/core/execution/PostgresExecutionRunRegistry.ts
            server/core/execution/executionRunSchema.ts
            server/core/execution/migrations/034_execution_run_registry.sql
            server/core/execution/migrations/036_execution_run_workflow_continuation.sql
            server/core/execution/migrations/037_execution_run_workflow_internal_step.sql
            server/core/workflow/ExecutionRunBoundLocalCompositeContinuationService.ts
          )
          ! grep -E -q 'coreClient|create.*HttpAdapter|/api/core/|providers|Billing|billing|FAL|fal_|stripe|JobRecord|coreClient\.entities' "${D3_FILES[@]}"
          ! grep -E -q "'AGENT'|'AUTOMATION'|\"AGENT\"|\"AUTOMATION\"" server/core/execution/executionRunRegistry.ts server/core/execution/migrations/034_execution_run_registry.sql server/core/execution/migrations/036_execution_run_workflow_continuation.sql server/core/execution/migrations/037_execution_run_workflow_internal_step.sql
          P1A_FILE=server/core/http/executionRunRecoveryHttpAdapter.ts
          ! grep -E -q 'coreClient|create.*Mutation|providers|Billing|billing|FAL|fal_|stripe|JobRecord|coreClient\.entities' "$P1A_FILE"
          ! grep -E -q '\.(issue|start|succeed|fail|cancel|markUnknown)\(' "$P1A_FILE"
          ! grep -q 'canonical_execution_runs' src/lib/jobs/jobStorage.js
      - name: Check committed diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --check "$BASE_SHA"..HEAD
          else
            git diff --check HEAD^..HEAD
          fi
