name: Fashion foreground occlusion R&D matte provenance
on:
  pull_request:
    paths:
      - 'src/platform/creative/deterministic/GarmentTextureComposite.ts'
      - 'server/core/fashion/foregroundOcclusionEvidence.ts'
      - 'tests/deterministic-garment-texture-composite.test.ts'
      - 'tests/fashion-foreground-occlusion-evidence.test.mjs'
      - '.github/workflows/fashion-foreground-occlusion-rnd.yml'
  push:
    branches:
      - 'fashion/foreground-occlusion-preview-20261009'
permissions:
  contents: read
jobs:
  foreground-matte-lineage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Verify purpose-bound foreground matte is Project/garment bound and non-authoritative
        run: node --experimental-strip-types --test tests/fashion-foreground-occlusion-evidence.test.mjs
