name: Sprint 6.42A local execution acceptance

on:
  pull_request:
    branches: [ "main" ]

jobs:
  local-execution-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Core local ticket, admission, lineage, scope and model-release contracts
        run: |
          mkdir -p .test-cache/6.42a-core
          npx esbuild \
            server/core/localExecution/localExecutionContract.test.mjs \
            server/core/localExecution/localExecutionIdempotency.test.mjs \
            server/core/localExecution/localExecutionScopedIdempotency.test.mjs \
            server/core/localExecution/localExecutionInputAdmission.test.mjs \
            server/core/localExecution/productionLocalModelPolicy.test.mjs \
            server/core/providers/productionOnDeviceRoute.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outdir=.test-cache/6.42a-core --external:node:*
          test_files="$(find .test-cache/6.42a-core -type f -name '*.js' -print)"
          test -n "$test_files"
          node --test $test_files
      - name: Canonical ON_DEVICE route, restart and zero-cloud proof
        run: |
          npm run test:creative-route-6.41c4
          mkdir -p .test-cache/6.42a-security
          npx esbuild \
            tests/creative-on-device-security.test.ts \
            tests/creative-on-device-local-failure.test.ts \
            tests/creative-on-device-success.test.ts \
            tests/local-segmentation-restart.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outdir=.test-cache/6.42a-security --external:node:*
          node --test .test-cache/6.42a-security/*.js
      - name: Browser ticket to admitted MASK boundary
        run: npm run test:intelligent-selection
      - name: Device capability, model trust and resource policy
        run: |
          mkdir -p .test-cache
          npx esbuild tests/creative-local-ai.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --loader:.pem=text --loader:.sig=text --loader:.wasm=file \
            --outfile=.test-cache/creative-local-ai.test.mjs --external:node:*
          npx esbuild tests/device-capability-contract.test.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/device-capability-contract.test.mjs --external:node:*
          node --test .test-cache/creative-local-ai.test.mjs .test-cache/device-capability-contract.test.mjs

  local-execution-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: local_execution_test
          POSTGRES_USER: local_execution_test
          POSTGRES_PASSWORD: local_execution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U local_execution_test -d local_execution_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://local_execution_test:local_execution_test@127.0.0.1:5432/local_execution_test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Apply complete canonical schema
        run: npm run db:migrate:transactions
      - name: Verify complete canonical schema
        run: npm run db:check:transactions
      - name: Durable schema repair, ticket, quarantine and canonical MASK contracts
        run: |
          node --experimental-strip-types --test \
            server/core/localExecution/localExecutionLedgerSchema.integration.test.mjs \
            server/core/localExecution/PostgresLocalExecutionLedger.integration.test.mjs \
            server/core/localExecution/PostgresLocalExecutionUploadStore.integration.test.mjs \
            server/core/artifacts/postgresMaskArtifactStore.localExecution.integration.test.mjs
