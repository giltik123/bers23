name: Fashion F4b.4 PostgreSQL garment mesh-warp vertical

on:
  pull_request:
    branches: [ "main", "fashion-production-garment-mesh-warp-f4b4" ]
  workflow_dispatch:

jobs:
  garment-mesh-warp-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fashion_f4b4_service_test
          POSTGRES_USER: fashion_f4b4_service_test
          POSTGRES_PASSWORD: fashion_f4b4_service_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashion_f4b4_service_test -d fashion_f4b4_service_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fashion_f4b4_service_test:fashion_f4b4_service_test@127.0.0.1:5432/fashion_f4b4_service_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Typecheck and build production Core
        run: |
          npm run typecheck
          npm run server:typecheck
          npm run server:build
          test -f dist-server/migrations/028_project_body_anchor_sets.sql
          test -f dist-server/migrations/029_fashion_garment_warp_layers.sql
      - name: Apply canonical transaction predecessor schema
        run: |
          npm run db:migrate:transactions
          npm run db:check:transactions
      - name: Bundle PostgreSQL F4b.4 execution and closed-composition verticals
        run: |
          runtime=.test-cache/fashion-f4b4-service-postgres
          artifact_runtime=.test-cache/artifacts/migrations
          mkdir -p "$runtime/migrations" "$artifact_runtime"
          mapfile -t migration_files < <(find server -type f -path '*/migrations/*.sql' -print | sort)
          test "${#migration_files[@]}" -gt 0
          duplicates="$(printf '%s\n' "${migration_files[@]}" | xargs -n1 basename | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "::error::Cannot stage bundled schema migrations because migration basenames collide:"
            printf '%s\n' "$duplicates"
            exit 1
          fi
          for source in "${migration_files[@]}"; do
            name="$(basename "$source")"
            cp "$source" "$runtime/migrations/$name"
            cp "$source" "$artifact_runtime/$name"
          done
          npx esbuild tests/garment-mesh-warp-service-postgres.test.ts --bundle --platform=node --format=esm --target=node24 --outfile="$runtime/service.mjs" --external:node:* --external:pg --external:sharp
          npx esbuild tests/garment-mesh-warp-production-composition-closed.test.ts --bundle --platform=node --format=esm --target=node24 --outfile="$runtime/composition-closed.mjs" --external:node:* --external:pg --external:sharp
      - name: Prove durable ticket, quarantine, Core recompute and immutable Fashion layer
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-service-postgres/service.mjs
      - name: Prove production Core is composed but policy remains fail-closed without side effects
        run: node --test --test-concurrency=1 .test-cache/fashion-f4b4-service-postgres/composition-closed.mjs
      - name: Keep production policy closed until final admission flip
        run: |
          grep -q "PRODUCTION_ADMISSION = 'NOT_ADMITTED'" src/platform/creative/deterministic/GarmentMeshWarpIdentity.js
          ! grep -q 'GARMENT_MESH_WARP_CAPABILITY' server/core/localExecution/productionLocalExecutorPolicy.ts
          ! grep -q 'GARMENT_MESH_WARP_OPERATION' server/core/providers/productionExecutionCapabilities.ts
          ! grep -q 'GARMENT_MESH_WARP_OPERATION' server/core/providers/productionExecutionRoute.ts
          ! grep -q 'GARMENT_MESH_WARP_OPERATION' server/core/providers/productionTargetSelection.ts
