name: HSME-2a.3.3a foundation benchmark run evidence contract

on:
  pull_request:
    paths:
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationBenchmarkRunEvidenceV1.ts'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationQualityBakeoffV1.ts'
      - 'src/platform/creative/local-ai/hsme/hsme-foundation-benchmark-campaign.v1.json'
      - 'src/platform/creative/local-ai/hsme/hsme-foundation-benchmark-candidate-trust.v1.json'
      - 'src/platform/creative/local-ai/hsme/hsme-foundation-benchmark-fixture-plan.v1.json'
      - 'src/platform/creative/local-ai/hsme/hsme-foundation-fixture-pack-evidence.v1.json'
      - 'tests/creative-hsme-foundation-benchmark-run-evidence-v1.test.mjs'
      - 'tests/creative-hsme-foundation-quality-bakeoff-v1.test.mjs'
      - 'scripts/hsme-foundation-benchmark-evidence-collector.mjs'
      - 'tests/hsme-foundation-benchmark-evidence-collector.test.mjs'
      - 'src/platform/creative/local-ai/hsme/hsme-foundation-benchmark-dispatch-matrix.v1.json'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationQualityFinalizationV1.ts'
      - 'tests/creative-hsme-foundation-quality-finalization-v1.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationQualityFrontierV1.ts'
      - 'tests/creative-hsme-foundation-quality-frontier-v1.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationResourceEvidenceV1.ts'
      - 'tests/creative-hsme-foundation-resource-evidence-v1.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationParetoEfficiencyV1.ts'
      - 'tests/creative-hsme-foundation-pareto-efficiency-v1.test.mjs'
      - 'scripts/hsme-foundation-resource-evidence-collector.mjs'
      - 'tests/hsme-foundation-resource-evidence-collector.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationTierQualificationV1.ts'
      - 'tests/creative-hsme-foundation-tier-qualification-v1.test.mjs'
      - 'src/platform/creative/local-ai/benchmark/BenchmarkEvidence.ts'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationTargetDeviceBenchmarkAdapterV1.ts'
      - 'tests/creative-hsme-foundation-target-device-adapter-v1.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationTargetDeviceMeasuredCaptureV1.ts'
      - 'tests/creative-hsme-foundation-target-device-measured-capture-v1.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationNativeMobileWorkingSetAdaptersV1.ts'
      - 'tests/creative-hsme-native-mobile-working-set-adapters-v1.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationPhysicalMobileValidationEvidenceV1.ts'
      - 'tests/creative-hsme-physical-mobile-validation-evidence-v1.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationPhysicalTargetEvidenceBindingV1.ts'
      - 'tests/creative-hsme-physical-target-evidence-binding-v1.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationPhysicalReuseRuntimeOverlayV1.ts'
      - 'tests/creative-hsme-physical-reuse-runtime-overlay-v1.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationPendingReuseRuntimeApplicationV1.ts'
      - 'tests/creative-hsme-pending-reuse-runtime-application-v1.test.mjs'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationReuseDecisionV1.ts'
      - 'src/platform/creative/local-ai/hsme/HsmeFoundationReuseEvidenceQualificationV1.ts'
      - 'tests/creative-hsme-reuse-evidence-qualification-v1.test.mjs'
      - '.github/workflows/hsme-2a-3-3a-foundation-run-evidence-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-evidence-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Prove raw run evidence against frozen campaign/trust/fixtures
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3a
          npx esbuild tests/creative-hsme-foundation-benchmark-run-evidence-v1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3a/run-evidence.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3a/run-evidence.test.mjs

      - name: Preserve quality-first bakeoff contract with frozen composition dimension
        run: |
          set -euo pipefail
          npx esbuild tests/creative-hsme-foundation-quality-bakeoff-v1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3a/quality.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3a/quality.test.mjs

      - name: Raw evidence cannot encode efficiency, scores or winner authority
        run: |
          set -euo pipefail
          CONTRACT=src/platform/creative/local-ai/hsme/HsmeFoundationBenchmarkRunEvidenceV1.ts
          ! grep -E 'latencyMs|workingMemoryBytes|installedBytes|costMicrousd|qualityScore|aggregateScore|selectedCandidateId' "${CONTRACT}"
          grep -F "'BLOCKED_PARITY_PENDING'" "${CONTRACT}"
          grep -F "'composition-count-spatial-correctness'" src/platform/creative/local-ai/hsme/HsmeFoundationQualityBakeoffV1.ts
          grep -F "productionAuthorityGranted: false" "${CONTRACT}"
          grep -F "winnerSelectionAllowed: false" "${CONTRACT}"


  protected-executor-contract:
    name: HSME-2a.3.3b protected executor synthetic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head for protected executor contract
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile protected executor planner and verifier without model runtime
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3b
          npx esbuild tests/hsme-foundation-benchmark-executor-plan.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3b/planner.test.mjs \
            --external:node:*
          npx esbuild scripts/hsme-foundation-benchmark-executor-verify.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3b/verify.mjs \
            --external:node:*

      - name: Run protected executor synthetic contracts
        run: |
          set -euo pipefail
          node --test .test-cache/hsme-2a-3-3b/planner.test.mjs
          node --test tests/hsme-foundation-benchmark-executor-workflow-policy.test.mjs
          python -m py_compile scripts/hsme-foundation-benchmark-executor.py
          python -m unittest tests/test-hsme-foundation-benchmark-executor.py

      - name: Prove protected executor ordinary CI remains model-free
        run: |
          set -euo pipefail
          ! grep -nE 'secrets\.HSME_FOUNDATION_BLIND_HMAC_KEY|hf_hub_download|from_pretrained|nvidia-smi' tests/hsme-foundation-benchmark-executor-plan.test.mjs
          ! grep -nE 'latencyMs|workingMemoryBytes|installedBytes|costMicrousd|selectedCandidateId' scripts/hsme-foundation-benchmark-executor-plan.mjs
          grep -F "ordinaryCiModelExecutionAllowed:false" scripts/hsme-foundation-benchmark-executor-plan.mjs
          grep -F "winnerSelectionAllowed:false" scripts/hsme-foundation-benchmark-executor-plan.mjs


  evidence-collector-contract:
    name: HSME-2a.3.3c evidence collector synthetic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head for evidence collector contract
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Compile and run evidence collector synthetic contracts
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3c-build
          npx esbuild tests/hsme-foundation-benchmark-evidence-collector.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3c-build/collector.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3c-build/collector.test.mjs

      - name: Prove collector ordinary CI cannot dispatch models or encode winner/efficiency authority
        run: |
          set -euo pipefail
          COLLECTOR=scripts/hsme-foundation-benchmark-evidence-collector.mjs
          MATRIX=src/platform/creative/local-ai/hsme/hsme-foundation-benchmark-dispatch-matrix.v1.json
          ! grep -nE 'hf_hub_download|from_pretrained|nvidia-smi|workflow_dispatch.*curl|gh workflow run|secrets\.' "${COLLECTOR}"
          ! grep -nE 'qualityScore|aggregateScore|selectedCandidateId|winnerCandidate|latencyMs|workingMemoryBytes|installedBytes|costMicrousd' "${COLLECTOR}"
          grep -F "ordinaryCiDispatchAllowed" "${MATRIX}"
          grep -F '"winnerSelectionAllowed": false' "${MATRIX}"
          grep -F "winnerSelectionAllowed:false" "${COLLECTOR}"


  quality-finalization-contract:
    name: HSME-2a.3.3d quality finalization synthetic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head for quality finalization contract
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Compile and run quality finalization synthetic contracts
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3d
          npx esbuild tests/creative-hsme-foundation-quality-finalization-v1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3d/finalization.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3d/finalization.test.mjs

      - name: Prove finalization CI remains model-free and quality-only
        run: |
          set -euo pipefail
          CONTRACT=src/platform/creative/local-ai/hsme/HsmeFoundationQualityFinalizationV1.ts
          ! grep -nE 'hf_hub_download|from_pretrained|nvidia-smi|secrets\.' "${CONTRACT}"
          ! grep -nE 'latencyMs|workingMemoryBytes|installedBytes|costMicrousd|selectedCandidateId|winnerCandidate|preferredCandidateIds' "${CONTRACT}"
          grep -F "efficiencyUsedInQualitySelection: false" "${CONTRACT}"
          grep -F "winnerSelectionAllowed: false" "${CONTRACT}"
          grep -F "MAX_NONCOMPENSABLE_CRITICAL_THEN_MEDIAN" "${CONTRACT}"
          grep -F "EVEN_ARITHMETIC_MEAN_HALF_UP" "${CONTRACT}"


  quality-frontier-contract:
    name: HSME-2a.3.3e quality frontier synthetic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head for quality frontier contract
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Compile and run capability-sliced quality frontier contracts
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3e
          npx esbuild tests/creative-hsme-foundation-quality-frontier-v1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3e/frontier.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3e/frontier.test.mjs

      - name: Prove frontier cannot import efficiency or grant final winner authority
        run: |
          set -euo pipefail
          CONTRACT=src/platform/creative/local-ai/hsme/HsmeFoundationQualityFrontierV1.ts
          ! grep -nE 'installedBytes|workingMemoryBytes|latencyMs|costMicrousd|checkpointBytes|qualityPerInstalledByte' "${CONTRACT}"
          ! grep -nE 'selectedCandidateId|winnerCandidateId|productionSelection' "${CONTRACT}"
          grep -F "efficiencyMayOnlyUseQualityPreferredSet: true" "${CONTRACT}"
          grep -F "efficiencyComparisonAllowed" "${CONTRACT}"
          grep -F "winnerSelectionAllowed: false" "${CONTRACT}"
          grep -F "PARTIAL_BLOCKED" "${CONTRACT}"


  resource-evidence-contract:
    name: HSME-2a.3.3f isolated resource evidence synthetic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head for resource evidence contract
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Compile and run isolated resource evidence contracts
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3f
          npx esbuild tests/creative-hsme-foundation-resource-evidence-v1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3f/resource.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3f/resource.test.mjs

      - name: Prove resource evidence remains measurement-only and model-free
        run: |
          set -euo pipefail
          CONTRACT=src/platform/creative/local-ai/hsme/HsmeFoundationResourceEvidenceV1.ts
          ! grep -nE 'hf_hub_download|from_pretrained|nvidia-smi|secrets\.' "${CONTRACT}"
          ! grep -nE 'aggregateScore|qualityLossVectorMicrounits|preferredCandidateIds|selectedCandidateId|winnerCandidateId|productionSelection' "${CONTRACT}"
          grep -F "qualityScoringAllowed:false" "${CONTRACT}"
          grep -F "qualityOrderingMutationAllowed:false" "${CONTRACT}"
          grep -F "aggregateEfficiencyScoreAllowed:false" "${CONTRACT}"
          grep -F "winnerSelectionAllowed:false" "${CONTRACT}"
          grep -F "mandatoryInstalledBytes" "${CONTRACT}"
          grep -F "workingMemoryKind" "${CONTRACT}"
          grep -F "CUDA_PEAK_RESERVED_BYTES" "${CONTRACT}"
          grep -F "peakWorkingMemoryBytes" "${CONTRACT}"
          grep -F "acceptedOutputCostMicrousd" "${CONTRACT}"


  pareto-efficiency-contract:
    name: HSME-2a.3.3g quality-gated Pareto efficiency synthetic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head for Pareto efficiency contract
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Compile and run quality-gated Pareto efficiency contracts
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3g
          npx esbuild tests/creative-hsme-foundation-pareto-efficiency-v1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3g/pareto.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3g/pareto.test.mjs

      - name: Prove Pareto comparison has no hidden weighting or production selection
        run: |
          set -euo pipefail
          CONTRACT=src/platform/creative/local-ai/hsme/HsmeFoundationParetoEfficiencyV1.ts
          ! grep -nE 'weightedScore|aggregateScore|scoreWeight|selectedCandidateId|winnerCandidateId|productionSelection|mobileInstalledBudgetBytes|mobileWorkingMemoryBudgetBytes' "${CONTRACT}"
          grep -F "QUALITY_GATED_PARETO_NO_WEIGHTS" "${CONTRACT}"
          grep -F "workingMemoryKind" "${CONTRACT}"
          grep -F "hardwareProfileSha256" "${CONTRACT}"
          grep -F "measurementMethodSha256" "${CONTRACT}"
          grep -F "costKind" "${CONTRACT}"
          grep -F "weightedAggregateScoreAllowed:false" "${CONTRACT}"
          grep -F "lowerQualityCandidateAdmissionAllowed:false" "${CONTRACT}"
          grep -F "deploymentTierAdmissionGranted:false" "${CONTRACT}"
          grep -F "winnerSelectionAllowed:false" "${CONTRACT}"


  resource-evidence-collector-contract:
    name: HSME-2a.3.3i resource evidence collector synthetic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head for resource evidence collector
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Compile and run resource evidence collector contracts
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3i
          npx esbuild tests/hsme-foundation-resource-evidence-collector.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3i/collector.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3i/collector.test.mjs

      - name: Prove resource collector remains evidence-only
        run: |
          set -euo pipefail
          CONTRACT=scripts/hsme-foundation-resource-evidence-collector.mjs
          ! grep -nE 'hf_hub_download|from_pretrained|nvidia-smi|secrets\.|HSME_FOUNDATION_BLIND_HMAC_KEY' "${CONTRACT}"
          ! grep -nE 'selectedCandidateId|winnerCandidateId|productionSelection|aggregateEfficiencyScore' "${CONTRACT}"
          grep -F "RESOURCE_EVIDENCE_INCOMPLETE" "${CONTRACT}"
          grep -F "RESOURCE_EVIDENCE_COMPLETE" "${CONTRACT}"
          grep -F "FAILED_EVIDENCE" "${CONTRACT}"
          grep -F "collectionManifestSha256" "${CONTRACT}"
          grep -F "artifactId" "${CONTRACT}"
          grep -F "artifactName" "${CONTRACT}"
          grep -F "bundlePath" "${CONTRACT}"
          grep -F "execution-plan.json" "${CONTRACT}"
          grep -F "resource-measurement-evidence.json" "${CONTRACT}"
          grep -F "proveHsmeFoundationResourceEvidenceV1" "${CONTRACT}"
          grep -F "winnerSelectionAllowed:false" "${CONTRACT}"


  tier-qualification-contract:
    name: HSME-2a.3.3j reference-to-target tier qualification synthetic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head for tier qualification contract
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Compile and run reference-to-target tier qualification contracts
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3j
          npx esbuild tests/creative-hsme-foundation-tier-qualification-v1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3j/tier.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3j/tier.test.mjs

      - name: Prove CUDA/Pareto evidence cannot masquerade as mobile qualification
        run: |
          set -euo pipefail
          CONTRACT=src/platform/creative/local-ai/hsme/HsmeFoundationTierQualificationV1.ts
          ! grep -nE 'selectedCandidateId:|DIRECT_FOUNDATION_ADVANCE|BOUNDED_ADAPTATION_ADVANCE|REUSE_PATH_INSUFFICIENT' "${CONTRACT}"
          ! grep -nE 'hf_hub_download|from_pretrained|nvidia-smi|secrets\.' "${CONTRACT}"
          grep -F "cudaReferenceEvidenceMaySatisfyMobileMemoryBudget:false" "${CONTRACT}"
          grep -F "paretoMayGrantDeploymentTier:false" "${CONTRACT}"
          grep -F "reuseAdvanceAllowed:false" "${CONTRACT}"
          grep -F "fullStudentEscalationAllowed:false" "${CONTRACT}"
          grep -F "TARGET_PEAK_WORKING_SET_BYTES" "${CONTRACT}"
          grep -F "IDENTICAL_REFERENCE_ARTIFACTS" "${CONTRACT}"
          grep -F "budgetPolicySha256" "${CONTRACT}"
          grep -F "winnerSelectionAllowed:false" "${CONTRACT}"


  target-device-benchmark-adapter-contract:
    name: HSME-2a.3.3k target-device BenchmarkEvidence adapter synthetic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head for target-device adapter
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Compile and run target-device BenchmarkEvidence adapter contracts
        run: |
          set -euo pipefail
          mkdir -p .test-cache/hsme-2a-3-3k
          npx esbuild tests/creative-hsme-foundation-target-device-adapter-v1.test.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=.test-cache/hsme-2a-3-3k/adapter.test.mjs \
            --external:node:*
          node --test .test-cache/hsme-2a-3-3k/adapter.test.mjs

      - name: Prove adapter reuses telemetry but owns no fleet or decision authority
        run: |
          set -euo pipefail
          CONTRACT=src/platform/creative/local-ai/hsme/HsmeFoundationTargetDeviceBenchmarkAdapterV1.ts
          ! grep -nE 'ModelFleetPromotionPolicy|PROMOTED|installRecommendedBundle|fetch\(|download|hf_hub_download|from_pretrained|selectedCandidateId:|DIRECT_FOUNDATION_ADVANCE|BOUNDED_ADAPTATION_ADVANCE|REUSE_PATH_INSUFFICIENT' "${CONTRACT}"
          grep -F "TARGET_MEASUREMENT_INSUFFICIENT" "${CONTRACT}"
          grep -F "benchmarkEvidenceSha256" "${CONTRACT}"
          grep -F "measurementCaptureSha256" "${CONTRACT}"
          grep -F "MEASUREMENT_ATTESTATION_EVIDENCE_DIGEST_MISMATCH" "${CONTRACT}"
          grep -F "MODEL_MANIFEST_PROVIDER_UNSUPPORTED" "${CONTRACT}"
